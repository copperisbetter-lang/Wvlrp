<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06130d"><title>WVLRP × 98.7</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#06130d}body{font-family:Arial,sans-serif}.wrap{position:relative;width:100%;max-width:430px;margin:auto;aspect-ratio:1080/2400;background:url('assets/Screenshot_20260928_142726_ChatGPT.jpg?v=e9fae7af') top center/100% 100% no-repeat;overflow:hidden}.hit{position:absolute;border:0;background:transparent;cursor:pointer}.play{left:36%;top:28.5%;width:22%;height:10%}.live{left:87%;top:25%;width:11%;height:6%}.music{left:87%;top:31.2%;width:11%;height:6%}.trophy{left:87%;top:37.4%;width:11%;height:6%}.events{left:87%;top:43.6%;width:11%;height:6%}.people{left:87%;top:49.8%;width:11%;height:6%}.contest{left:27%;top:67.2%;width:56%;height:6%}.tour{display:none;position:absolute;left:5.5%;top:23.2%;width:80.5%;height:31.7%;border-radius:16px;background:rgba(3,10,7,.94);color:#fff;align-items:center;justify-content:center;text-align:center;padding:22px;font-size:16px;line-height:1.42;z-index:5}.tour.show{display:flex}.tour .time{position:absolute;right:12px;top:10px;font-size:12px;color:#f2d274}.tour .close{position:absolute;left:12px;top:8px;border:0;background:transparent;color:#fff;font-size:20px}.tip{display:none;position:absolute;left:10%;right:10%;top:57%;z-index:6;padding:10px 12px;border-radius:10px;background:#03100de8;color:#fff;text-align:center;font-size:12px;line-height:1.35}.tip.show{display:block}
</style></head><body><div class="wrap">
<button class="hit play" aria-label="Play partnership preview"></button><button class="hit live" data-tip="98.7 LIVE: direct access to the station's live listening experience."></button><button class="hit music" data-tip="Music: a direct path to 98.7 listening and station content."></button><button class="hit trophy" data-tip="Contests: viewers can jump directly into 98.7 promotions and giveaways."></button><button class="hit events" data-tip="Events: feature 98.7 appearances and community events."></button><button class="hit people" data-tip="On-air: introduce viewers to 98.7 personalities and station content."></button><button class="hit contest" data-tip="A prominent route into current 98.7 contests without interrupting the wildlife feed."></button>
<div class="tour" id="tour"><button class="close" id="close">×</button><span class="time" id="time">0:00</span><div id="words"></div></div><div class="tip" id="tip"></div></div>
<script>
const slides=[["0:00","Welcome, 98.7 The Mountain. This private preview shows what a WVLRP partnership could look like on The Roost."],["0:09","98.7 becomes the natural soundtrack of The Roost. The changing voices and sound also have a practical role around the chickens by helping make the area less comfortable for predators."],["0:20","Your station gets visible, tasteful placement while wildlife stays first — no ads covering the animals and no interruption of the live experience."],["0:31","The 98.7 LIVE and music controls can send viewers directly into your listening experience and help turn WVLRP viewers into 98.7 listeners and app users."],["0:41","The trophy links to contests, the calendar can feature station events, and the people button can introduce viewers to 98.7 personalities and content."],["0:50","The featured contest button gives promotions a strong call to action, while the sponsor strip can provide added exposure for participating advertisers."],["0:58","Local, useful, interactive, and never in the way of the wildlife. That's the partnership we'd like to build with 98.7."]];
let i=0,timer;const tour=document.getElementById('tour'),words=document.getElementById('words'),time=document.getElementById('time'),tip=document.getElementById('tip');
function show(){time.textContent=slides[i][0];words.textContent=slides[i][1]}
document.querySelector('.play').onclick=()=>{i=0;show();tour.classList.add('show');clearInterval(timer);timer=setInterval(()=>{if(i>=slides.length-1){clearInterval(timer);return}i++;show()},8500)};
document.getElementById('close').onclick=()=>{clearInterval(timer);tour.classList.remove('show')};
document.querySelectorAll('[data-tip]').forEach(b=>b.onclick=()=>{tip.textContent=b.dataset.tip;tip.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>tip.classList.remove('show'),4000)});
</script></body></html>
