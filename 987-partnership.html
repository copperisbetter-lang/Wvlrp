const slides=[["0:00","Welcome, 98.7 The Mountain. This private preview shows what a partnership with WVLRP could actually look like."],["0:09","Our idea is to make 98.7 a natural part of The Roost. The radio also serves a practical purpose around the chickens: changing human voices and sound can help make the area less comfortable for predators."],["0:20","WVLRP gives 98.7 visible, tasteful placement while keeping the wildlife first — no pre-roll blocking the camera and no advertising covering the animals."],["0:31","The 98.7 LIVE and music controls can turn WVLRP viewers into direct station listeners and make it easy to continue listening through 98.7's own platforms."],["0:41","The trophy can open current contests, the calendar can feature station events, and the people button can introduce viewers to 98.7 personalities and station content."],["0:50","The contest feature gives promotions a strong call to action, while this sponsor area can add exposure for participating 98.7 advertisers."],["0:58","Local, useful, interactive, and never in the way of the wildlife. That's the partnership we'd like to build with 98.7."]];
let i=0,timer=null;const start=document.getElementById('start'),tour=document.getElementById('tour'),words=document.getElementById('words'),time=document.getElementById('time'),progress=document.getElementById('progress'),ctl=document.getElementById('ctl');
function show(n){i=n;time.textContent=slides[n][0];words.textContent=slides[n][1];progress.style.width=((n+1)/slides.length*100)+'%'}
function begin(){start.style.display='none';tour.classList.add('show');ctl.textContent='❚❚';show(0);clearInterval(timer);timer=setInterval(()=>{if(i===slides.length-1){clearInterval(timer);ctl.textContent='▶';return}show(i+1)},8500)}
