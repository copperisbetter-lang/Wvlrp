<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06130d"><title>WVLRP × 98.7</title><style>

ius:10px;background:#03100de8;color:#fff;text-align:center;font-size:12px;line-height:1.35}.tip.show{display:block}
</style></head><body><div class="wrap"><img class="approved-bg" src="assets/Screenshot_20260928_142726_ChatGPT.jpg?v=e9fae7af" alt="WVLRP 98.7 The Mountain partnership proposal">
<button class="hit play" aria-label="Play partnership preview"></button><button class="hit live" data-tip="98.7 LIVE: direct access to the station's live listening experience."></button><button class="hit music" data-tip="Music: a direct path to 98.7 listening and station content."></button><button class="hit trophy" data-tip="Contests: viewers can jump directly into 98.7 promotions and giveaways."></button><button class="hit events" data-tip="Events: feature 98.7 appearances and community events."></button><button class="hit people" data-tip="On-air: introduce viewers to 98.7 personalities and station content."></button><button class="hit contest" data-tip="A prominent route into current 98.7 contests without interrupting the wildlife feed."></button>
<div class="tour" id="tour"><button class="close" id="close">×</button><span class="time" id="time">0:00</span><div class="tour-card"><div class="eyebrow" id="eyebrow"></div><h2 id="headline"></h2><p id="words"></p><div class="deal" id="deal"></div></div><div class="tour-progress"><i id="tourProgress"></i></div></div><div class="tip" id="tip"></div></div>
<script>
const slides=[
["0:00","THE OPPORTUNITY","A LOCAL PARTNERSHIP THAT LIVES ON THE AIR AND ON THE LAND","WVLRP and 98.7 The Mountain can give each other something neither side gets from a normal ad buy: a useful, ongoing presence inside a live West Virginia experience.","This is a partnership — not simply an advertisement."],
["0:08","WHY 98.7 FITS THE ROOST","THE RADIO HAS A REAL JOB HERE","The Roost carries 98.7 continuously. Music and changing human voices become the soundtrack viewers hear with the chickens and outdoor sounds — and that human presence also helps make the coop area less comfortable for predators.","98.7 becomes part of the experience, not an ad pasted on top of it."],
["0:17","WHAT 98.7 RECEIVES","CONTINUOUS, TASTEFUL EXPOSURE","98.7 receives visible station branding, live-listening access and repeated exposure to WVLRP viewers. The station's normal commercials are heard naturally with the radio stream at no additional charge.","Wildlife remains first: promotion never blocks or interrupts the live view."],
["0:26","TURN VIEWERS INTO LISTENERS","WVLRP SENDS PEOPLE TO 98.7","The 98.7 LIVE and music controls can send viewers directly to the station. WVLRP can also promote and link the 98.7 app, helping turn wildlife viewers into direct station listeners and app users.","The value continues even after a viewer leaves WVLRP."],
["0:35","PROMOTIONS & PERSONALITIES","MORE THAN A LISTEN BUTTON","Contest links can drive entries and giveaways. Event space can feature station appearances. On-air personality links can introduce viewers to 98.7's people, shows and content. WVLRP can promote 98.7 wherever it fits naturally across the project.","Tickets, merchandise or prize packs can make station promotions interactive for the WVLRP audience."],
["0:45","VALUE FOR ADVERTISERS","THE STATION'S ECOSYSTEM BENEFITS TOO","98.7 advertisers already gain additional ears whenever their commercials play through The Roost. Where appropriate, WVLRP can also create tasteful sponsor visibility; any clickable advertiser placement would be a separate direct WVLRP arrangement that does not conflict with 98.7.","That protects both sides while creating room for additional local-business exposure."],
["0:55","WHAT WVLRP ASKS FROM 98.7","CROSS-PROMOTION THAT WORKS BOTH WAYS","In return, WVLRP is looking for 98.7 to help introduce the project to its audience through periodic on-air mentions, station involvement, contests and promotional support — including prizes, tickets or merchandise when available.","98.7 helps WVLRP grow; WVLRP helps 98.7 gain listeners, app users, contest engagement and digital reach."],
["1:06","THE PARTNERSHIP","TWO WEST VIRGINIA BRANDS HELPING EACH OTHER GROW","WVLRP provides a persistent digital home for 98.7 inside a distinctive live wildlife experience. 98.7 provides the soundtrack, promotion and community connection that help that experience grow. Neither side has to overpower the other for the partnership to work.","Local. Useful. Measurable. Interactive. And always respectful of the wildlife experience."]
];
let i=0,timer;const tour=document.getElementById('tour'),words=document.getElementById('words'),time=document.getElementById('time'),tip=document.getElementById('tip'),eyebrow=document.getElementById('eyebrow'),headline=document.getElementById('headline'),deal=document.getElementById('deal'),tourProgress=document.getElementById('tourProgress');
function show(){time.textContent=slides[i][0];eyebrow.textContent=slides[i][1];headline.textContent=slides[i][2];words.textContent=slides[i][3];deal.textContent=slides[i][4];tourProgress.style.width=((i+1)/slides.length*100)+'%'}
document.querySelector('.play').onclick=()=>{i=0;show();tour.classList.add('show');clearInterval(timer);timer=setInterval(()=>{if(i>=slides.length-1){clearInterval(timer);return}i++;show()},9500)};
document.getElementById('close').onclick=()=>{clearInterval(timer);tour.classList.remove('show')};
document.querySelectorAll('[data-tip]').forEach(b=>b.onclick=()=>{tip.textContent=b.dataset.tip;tip.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>tip.classList.remove('show'),4000)});
</script></body></html>
