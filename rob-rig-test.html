<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>WVLRP Rob Rig Lab</title><style>body{margin:0;background:#14231e;color:#eef7f1;font:14px system-ui}header,section{padding:10px}#stage{height:57dvh;touch-action:none;background:#283e35}button{background:#376b54;color:white;border:0;border-radius:6px;padding:9px;margin:3px}details{border-top:1px solid #557;padding:9px}input[type=range]{width:65%}label{display:block;padding:4px}#status{font-size:12px}summary{font-weight:bold}</style></head><body><header><b>WVLRP · ROB FULL RIG TEST</b><div id="status">Loading Rob…</div></header><div id="stage"></div><section><button id="front">Front</button><button id="side">Side</button><button id="back">Back</button><button id="reset">Reset</button><button id="wire">Wireframe</button><button id="clothes">Hide clothes</button><button id="all">Show all</button><details open><summary>Rig bones</summary><div id="bones"></div></details><details><summary>Shape keys / morphs</summary><div id="morphs"></div></details><details><summary>Mesh visibility</summary><div id="meshes"></div></details><details><summary>Lighting</summary><label>Brightness <input id="light" type="range" min="0" max="4" value="2" step=".1"></label></details></section><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">import * as T from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';const stage=document.querySelector('#stage'),status=document.querySelector('#status');const scene=new T.Scene();scene.background=new T.Color('#283e35');const camera=new T.PerspectiveCamera(40,1,.01,1000);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));stage.appendChild(renderer.domElement);const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;const light=new T.HemisphereLight(0xffffff,0x445566,2);scene.add(light);let model,meshes=[],bones=[],wire=false;function fit(){const box=new T.Box3().setFromObject(model),size=box.getSize(new T.Vector3()),center=box.getCenter(new T.Vector3()),dist=Math.max(size.x,size.y,size.z)*1.9;orbit.target.copy(center);camera.position.set(center.x,center.y,center.z+dist);camera.near=.01;camera.far=dist*20;camera.updateProjectionMatrix();orbit.update()}function row(parent,name,min,max,value,cb){const l=document.createElement('label');l.textContent=name+' ';const i=document.createElement('input');i.type='range';i.min=min;i.max=max;i.step='.01';i.value=value;i.oninput=()=>cb(+i.value);l.appendChild(i);parent.appendChild(l)}function setup(root){model=root;scene.add(root);root.traverse(o=>{if(o.isMesh){meshes.push(o);const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=o.visible;c.onchange=()=>o.visible=c.checked;l.append(c,document.createTextNode(' '+o.name));document.querySelector('#meshes').appendChild(l);if(o.morphTargetDictionary){for(const [name,index]of Object.entries(o.morphTargetDictionary))row(document.querySelector('#morphs'),o.name+' · '+name,0,1,o.morphTargetInfluences[index],v=>o.morphTargetInfluences[index]=v)}}if(o.isBone){bones.push(o);const d=document.createElement('details');const s=document.createElement('summary');s.textContent=o.name;d.appendChild(s);for(const axis of ['x','y','z'])row(d,'Rotate '+axis,-1.57,1.57,0,v=>o.rotation[axis]=v);document.querySelector('#bones').appendChild(d)}});fit();status.textContent='Loaded: '+meshes.length+' meshes, '+bones.length+' bones. Originals preserved.'}const src=new URLSearchParams(location.search).get('model')||'./models/Rob_viewer.glb';new GLTFLoader().load(src,g=>setup(g.scene),p=>{if(p.total)status.textContent='Loading Rob '+Math.round(p.loaded/p.total*100)+'%'},e=>status.textContent='Model not available at '+src+' — '+e.message);function view(a){if(!model)return;fit();const target=orbit.target;const r=camera.position.distanceTo(target);camera.position.set(target.x+Math.sin(a)*r,target.y,target.z+Math.cos(a)*r);orbit.update()}document.querySelector('#front').onclick=()=>view(0);document.querySelector('#side').onclick=()=>view(Math.PI/2);document.querySelector('#back').onclick=()=>view(Math.PI);document.querySelector('#reset').onclick=()=>model&&fit();document.querySelector('#wire').onclick=()=>{wire=!wire;meshes.forEach(m=>{for(const mat of(Array.isArray(m.material)?m.material:[m.material]))if(mat)mat.wireframe=wire})};document.querySelector('#clothes').onclick=()=>meshes.forEach(m=>{if(/shirt|pant|short|dress|shoe|sock|cloth|outfit|top|bottom|bra/i.test(m.name))m.visible=false});document.querySelector('#all').onclick=()=>meshes.forEach(m=>m.visible=true);document.querySelector('#light').oninput=e=>light.intensity=+e.target.value;function tick(){requestAnimationFrame(tick);orbit.update();renderer.render(scene,camera)}tick();function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();</script></body></html>
