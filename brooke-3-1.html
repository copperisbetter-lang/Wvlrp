<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brooke 3.1 — Head Fitting Lab</title><style>body{margin:0;background:#16231f;color:#eaf5ef;font:14px system-ui}header,section{padding:12px}h2{font-size:19px;margin:0}#stage{height:57dvh;min-height:310px}button,input{accent-color:#8dd9a7}button{padding:9px;border:0;border-radius:5px;margin:3px;background:#376d56;color:white}label{display:block;margin:9px 0}input[type=range]{width:70%}#log{white-space:pre-wrap;font-size:12px}details{border-top:1px solid #486;padding:8px}</style></head><body><header><h2>Brooke 3.1 — Head Fitting Lab</h2><div id="status">Loading body and 4105 head…</div></header><div id="stage"></div><section><button id="front">Front</button><button id="side">Side</button><button id="back">Back</button><button id="reset">Reset fitting</button><button id="save">Export fitting settings</button><details open><summary>Head alignment controls</summary><div id="sliders"></div></details><label><input type="checkbox" id="body" checked> Show body</label><label><input type="checkbox" id="head" checked> Show 4105 head</label><label><input type="checkbox" id="wire"> Head wireframe</label><p id="log"></p><p>Inspection prototype only. The body still has its original head; geometry is not merged or rigged. Neither source file is modified.</p></section><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';const stage=document.getElementById('stage'),status=document.getElementById('status'),log=document.getElementById('log');const scene=new THREE.Scene();scene.background=new THREE.Color(0x16231f);scene.add(new THREE.HemisphereLight(0xffffff,0x76867e,2.4));const light=new THREE.DirectionalLight(0xffffff,2.5);light.position.set(2,4,3);scene.add(light);const camera=new THREE.PerspectiveCamera(38,1,.001,1000),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));stage.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;const loader=new GLTFLoader();let body,head,baseSize=1;const cfg={x:0,y:0,z:0,scale:1,rx:0,ry:0,rz:0};const axes=[['x','Horizontal',-2,2,.005],['y','Vertical',-2,2,.005],['z','Depth',-2,2,.005],['scale','Size',.05,4,.005],['rx','Pitch',-180,180,1],['ry','Turn',-180,180,1],['rz','Tilt',-180,180,1]];function apply(){if(!head)return;head.position.set(cfg.x,cfg.y,cfg.z);head.scale.setScalar(cfg.scale);head.rotation.set(THREE.MathUtils.degToRad(cfg.rx),THREE.MathUtils.degToRad(cfg.ry),THREE.MathUtils.degToRad(cfg.rz));}for(const [key,label,min,max,step] of axes){const el=document.createElement('label');el.textContent=label+' ';const slider=document.createElement('input');slider.type='range';slider.min=min;slider.max=max;slider.step=step;slider.value=cfg[key];const val=document.createElement('span');val.textContent=cfg[key];slider.oninput=()=>{cfg[key]=+slider.value;val.textContent=slider.value;apply()};el.append(slider,val);document.getElementById('sliders').append(el)}function fit(){const box=new THREE.Box3().setFromObject(body);const c=box.getCenter(new THREE.Vector3()),s=box.getSize(new THREE.Vector3());baseSize=s.y||1;controls.target.copy(c);camera.position.set(c.x,c.y,c.z+baseSize*1.8);camera.near=baseSize*.0001;camera.far=baseSize*100;camera.updateProjectionMatrix();controls.update();const hb=new THREE.Box3().setFromObject(head),hs=hb.getSize(new THREE.Vector3()),hc=hb.getCenter(new THREE.Vector3());const factor=(baseSize*.16)/(hs.y||1);cfg.scale=factor;cfg.x=c.x-hc.x*factor;cfg.y=box.max.y-hs.y*factor*.52-hc.y*factor;cfg.z=c.z-hc.z*factor;for(const [key] of axes){const slider=[...document.querySelectorAll('#sliders label')].find(x=>x.textContent.startsWith(axes.find(a=>a[0]===key)[1]))?.querySelector('input');if(slider){if(['x','y','z'].includes(key)){slider.min=-baseSize*2;slider.max=baseSize*2;slider.step=baseSize/1000}if(key==='scale'){slider.min=.001;slider.max=Math.max(4,factor*3)}slider.value=cfg[key];slider.nextSibling.textContent=Number(cfg[key]).toFixed(3)}}apply();log.textContent='Both assets loaded. Initial placement is estimated; adjust before judging fit.\nBody height: '+baseSize.toFixed(3)+' units\nHead height: '+hs.y.toFixed(3)+' units';}Promise.all([loader.loadAsync('./world-creator/assets/sophie-1-native-fit.glb'),loader.loadAsync('./4105-3d.glb')]).then(([b,h])=>{body=b.scene;head=h.scene;scene.add(body,head);fit();status.textContent='Both models loaded — fitting prototype (not merged)'}).catch(e=>{status.textContent='Loading error: '+e.message;log.textContent='Check asset paths and browser console.'});function view(v){if(!body)return;const c=new THREE.Box3().setFromObject(body).getCenter(new THREE.Vector3());camera.position.set(c.x+(v==='side'?baseSize*1.8:0),c.y,c.z+(v==='front'?baseSize*1.8:v==='back'?-baseSize*1.8:0));controls.target.copy(c);controls.update()}document.getElementById('front').onclick=()=>view('front');document.getElementById('side').onclick=()=>view('side');document.getElementById('back').onclick=()=>view('back');document.getElementById('body').onchange=e=>{if(body)body.visible=e.target.checked};document.getElementById('head').onchange=e=>{if(head)head.visible=e.target.checked};document.getElementById('wire').onchange=e=>{head?.traverse(o=>{if(o.isMesh){const mats=Array.isArray(o.material)?o.material:[o.material];mats.forEach(m=>m.wireframe=e.target.checked)}})};document.getElementById('reset').onclick=()=>{if(body&&head)fit()};document.getElementById('save').onclick=()=>{const blob=new Blob([JSON.stringify({name:'Brooke 3.1 fitting',sourceBody:'world-creator/assets/sophie-1-native-fit.glb',sourceHead:'4105-3d.glb',transform:cfg},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='brooke-3-1-fitting.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)}loop();</script></body></html>
