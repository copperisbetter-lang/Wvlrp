name: Install CC0 Riley realistic 3D pose assets
on:
  push:
    paths:
      - .github/workflows/riley-real-model.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    if: github.repository == 'copperisbetter-lang/Wvlrp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch two licensed CC0 meshes of the same Riley character
        run: |
          set -euo pipefail
          mkdir -p world-creator/assets
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 240 \
            -H 'Accept: application/octet-stream' \
            -o world-creator/assets/riley-real.glb \
            'https://www.innerscene.com/api/library/riley-3d-person-woman-standing-8d40398f/download'
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 240 \
            -H 'Accept: application/octet-stream' \
            -o world-creator/assets/riley-kneeling.glb \
            'https://www.innerscene.com/api/library/kneeling-upright-3d-person-kneeling-reaching-b3db252b/download'
          python3 - <<'PY'
          from pathlib import Path
          for name in ('riley-real.glb', 'riley-kneeling.glb'):
              path = Path('world-creator/assets') / name
              data = path.read_bytes()
              assert len(data) > 1_000_000, f'{name} unexpectedly small: {len(data)} bytes'
              assert data[:4] == b'glTF', f'{name} does not have a valid GLB header'
              assert int.from_bytes(data[8:12], 'little') == len(data), f'{name} invalid GLB length'
              print(f'Validated {name}: {len(data):,} bytes')
          PY
      - name: Install model assets in world creator without touching other site pages
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add world-creator/assets/riley-real.glb world-creator/assets/riley-kneeling.glb
          if git diff --cached --quiet; then
            echo 'Both GLB assets already installed'
          else
            git commit -m "Install matching CC0 standing and kneeling Riley 3D meshes"
            git push origin HEAD:main
          fi
