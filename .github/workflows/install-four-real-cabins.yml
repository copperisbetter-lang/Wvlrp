name: Install four CC0 real 3D cabins
on:
  push:
    branches: [main]
    paths: [.github/workflows/install-four-real-cabins.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wvlrp-real-cabins
  cancel-in-progress: false
jobs:
  download:
    if: github.repository == 'copperisbetter-lang/Wvlrp'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download genuine CC0 textured GLB architecture, never replacements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,struct,urllib.request,urllib.error,time,hashlib
          from pathlib import Path
          root=Path('world-creator/assets/cabins')
          root.mkdir(parents=True,exist_ok=True)
          models=[
            ('historic-log-cabin','point-of-pines-slave-cabin-71703bdd',
             'Smithsonian Institution (NMAAHC)','3D scan of historic timber cabin'),
            ('a-frame-cabin','a-frame-cabin-73442f48',
             'Innerscene','A-frame cabin exterior'),
            ('pitched-roof-cottage','cottage-with-pitched-roof-bc88ab4f',
             'Innerscene','Pitched-roof wooden cottage exterior'),
            ('bungalow-cabin','bungalow-house-85d40048',
             'Innerscene','Bungalow cabin exterior')
          ]
          entries=[]
          for filename,slug,author,desc in models:
            url='https://www.innerscene.com/api/library/'+slug+'/download'
            dest=root/(filename+'.glb')
            if not dest.exists() or dest.stat().st_size<500000:
              print('Downloading actual 3D building',filename,url,flush=True)
              last=None
              for attempt in range(5):
                try:
                  req=urllib.request.Request(url,headers={
                    'User-Agent':'WVLRP-TheWild-CC0-Building-Installer/1.0',
                    'Accept':'application/octet-stream'})
                  with urllib.request.urlopen(req,timeout=160) as resp, dest.open('wb') as out:
                    while True:
                      chunk=resp.read(2*1024*1024)
                      if not chunk:break
                      out.write(chunk)
                  break
                except Exception as err:
                  last=err
                  dest.unlink(missing_ok=True)
                  if attempt==4:raise RuntimeError('Real building download failed '+filename) from last
                  time.sleep((attempt+1)*6)
            data=dest.read_bytes()
            assert len(data)>250000, f'{filename}: too small to be a genuine 3D asset'
            magic,version,declared=struct.unpack_from('<4sII',data)
            assert magic==b'glTF' and version==2 and declared==len(data), f'{filename}: corrupt GLB header'
            jsonlen,typ=struct.unpack_from('<I4s',data,12)
            assert typ==b'JSON' and jsonlen>150, f'{filename}: missing 3D scene metadata'
            gltf=json.loads(data[20:20+jsonlen])
            assert gltf.get('meshes') and gltf.get('scenes'), f'{filename}: no actual 3D building meshes'
            tris=sum(len(m.get('primitives',[])) for m in gltf['meshes'])
            assert tris>0, f'{filename}: empty geometry'
            images=len(gltf.get('images',[]))
            materials=len(gltf.get('materials',[]))
            assert materials>0, f'{filename}: no building materials'
            print('VALIDATED',filename,'bytes',len(data),'meshes',len(gltf['meshes']),
                  'materials',materials,'images',images,flush=True)
            entries.append({
              'id':filename,'file':dest.name,'bytes':len(data),'meshes':len(gltf['meshes']),
              'materials':materials,'textures':images,'license':'CC0',
              'source':'https://www.innerscene.com/tools/library/3d-parts/'+slug,
              'author':author,'description':desc,'sha256':hashlib.sha256(data).hexdigest()
            })
          assert len(entries)==4
          (root/'source-manifest.json').write_text(json.dumps(entries,indent=2)+'\n')
          print('Four actual binary GLB buildings verified and ready to commit',flush=True)
          PY
      - name: Commit and publish the FOUR downloaded binary 3D buildings
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add world-creator/assets/cabins
          if git diff --cached --quiet; then echo 'All 4 models already installed';exit 0; fi
          git commit -m 'Install four real CC0 GLB cabin models in The Wild'
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then echo 'ALL FOUR CABINS COMMITTED';exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep 3
          done
          exit 1
