name: Publish WVLRP

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out WVLRP
        uses: actions/checkout@v4
      - name: Prepare Roost assets
        run: |
          mkdir -p assets/roost
          if [ -f assets/roost/red.webp.b64 ]; then
            base64 --decode assets/roost/red.webp.b64 > assets/roost/red.webp
          fi
      - name: Prepare Lounge wallpaper
        run: |
          mkdir -p assets/lounge
          if compgen -G "assets/lounge/lounge-placeholder-tiny.webp.b64.part*" > /dev/null; then
            cat assets/lounge/lounge-placeholder-tiny.webp.b64.part* | base64 --decode > assets/lounge/lounge-placeholder.webp
          fi
      - name: Apply Lounge wallpaper placeholder
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('supporters.html')
          s = p.read_text()
          tag = '''<style id="lounge-wallpaper-placeholder">
          body{background-image:linear-gradient(rgba(2,10,7,.68),rgba(2,10,7,.90)),url('assets/lounge/lounge-placeholder.webp');background-size:cover;background-position:center top;background-attachment:fixed;background-repeat:no-repeat}
          .gate-card,.cam,.chat{backdrop-filter:blur(5px);background-color:rgba(6,19,14,.88)}
          </style>'''
          if 'lounge-wallpaper-placeholder' not in s:
              s = s.replace('</head>', tag + '</head>')
              p.write_text(s)
          PY
      - name: Add shared WVLRP sign in
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          tag = '<script src="site-auth.js?v=20260915-2" data-wvlrp-site-auth></script>'
          for p in Path('.').glob('*.html'):
              s = p.read_text()
              if 'site-auth.js' in s:
                  continue
              m = re.search(r'<body\b[^>]*>', s, re.I)
              if not m:
                  continue
              s = s[:m.end()] + tag + s[m.end():]
              p.write_text(s)
          PY
      - name: Add Lounge links to home page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          nav_link = '<a href="supporters.html">★ Lounge</a>'
          if nav_link not in s:
              s = s.replace('<a href="#mission">ⓘ About</a></nav>', '<a href="#mission">ⓘ About</a>' + nav_link + '</nav>')
          tile = '<a href="supporters.html">★<b>The Lounge</b><small>Donors & Sponsors</small></a>'
          if tile not in s:
              s = s.replace('<a href="#community">👥<b>Community</b><small>Chat & Share</small></a><a href="#mission">⛰<b>Projects</b>', '<a href="#community">👥<b>Community</b><small>Chat & Share</small></a>' + tile + '<a href="#mission">⛰<b>Projects</b>')
          s = s.replace('Community　|　Projects　|　About　|　Support', 'Community　|　Lounge　|　Projects　|　About　|　Support')
          p.write_text(s)
          PY
      - name: Add lifelike Roost behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('the-roost.html')
          s = p.read_text()
          tag = '<script src="roost-life.js?v=3"></script>'
          if tag not in s:
              s = s.replace('</body>', tag + '</body>')
              p.write_text(s)
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
