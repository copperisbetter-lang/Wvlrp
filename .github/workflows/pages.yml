name: Publish WVLRP

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out WVLRP
        uses: actions/checkout@v4
      - name: Prepare Roost assets
        run: |
          mkdir -p assets/roost
          if [ -f assets/roost/red.webp.b64 ]; then
            base64 --decode assets/roost/red.webp.b64 > assets/roost/red.webp
          fi
      - name: Add shared WVLRP sign in
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          tag = '<script src="site-auth.js?v=20260915-2" data-wvlrp-site-auth></script>'
          for p in Path('.').glob('*.html'):
              s = p.read_text()
              if 'site-auth.js' in s:
                  continue
              m = re.search(r'<body\b[^>]*>', s, re.I)
              if not m:
                  continue
              s = s[:m.end()] + tag + s[m.end():]
              p.write_text(s)
          PY
      - name: Add lifelike Roost behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('the-roost.html')
          s = p.read_text()
          tag = '<script src="roost-life.js?v=3"></script>'
          if tag not in s:
              s = s.replace('</body>', tag + '</body>')
              p.write_text(s)
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
