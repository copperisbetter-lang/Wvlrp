name: Brooke isolated MPFB fitting diagnostic
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/brooke-mpfb-fit.yml'
      - 'avatar-work/brooke/**'
  push:
    paths:
      - '.github/workflows/brooke-mpfb-fit.yml'
      - 'avatar-work/brooke/scripts/fit_mpfb_brooke_v1.py'
      - 'avatar-work/brooke/scripts/render_mpfb_fit_review.py'
      - 'avatar-work/brooke/brooke-photo-landmarks-front-profile-20261023.json'
permissions:
  contents: read
jobs:
  fit:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy xvfb
      - name: Inspect MPFB mesh and produce isolated Brooke fit
        run: blender -b -t 2 --python-exit-code 1 --python avatar-work/brooke/scripts/fit_mpfb_brooke_v1.py
      - name: Render five-angle head inspection sheets
        run: xvfb-run -a -s '-screen 0 1280x1024x24' blender -b -t 2 --python-exit-code 1 --python avatar-work/brooke/scripts/render_mpfb_fit_review.py -- avatar-work/brooke/build/brooke-mpfb-first-proportional-fit.glb avatar-work/brooke/build/review
      - name: Audit actual full-body extent
        run: blender -b -t 2 --python-exit-code 1 --python avatar-work/brooke/scripts/audit_body_extent.py
      - name: Upload candidate for inspection (not production)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brooke-mpfb-proportional-fit-candidate
          path: |
            avatar-work/brooke/build/brooke-mpfb-first-proportional-fit.glb
            avatar-work/brooke/build/review/*.png
            avatar-work/brooke/build/review/inspection.json
            avatar-work/brooke/build/review/body-audit.json
          if-no-files-found: warn
