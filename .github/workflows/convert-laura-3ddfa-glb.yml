name: Convert verified 3DDFA OBJ to GLB viewer asset
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/convert-laura-3ddfa-glb.yml
permissions:
  contents: write
  actions: read
jobs:
  convert:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install mesh conversion tools
        run: python -m pip install 'trimesh>=4,<5' 'numpy<3'
      - name: Download preserved run 10 OBJ
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/face
          gh run download 39670216797 -R "${{ github.repository }}" -n free-3ddfa-sample-obj -D /tmp/face
      - name: Validate and convert face mesh to GLB
        run: |
          mkdir -p /tmp/converted
          python - <<'PY'
          import pathlib, subprocess, trimesh
          objs=list(pathlib.Path('/tmp/face').rglob('*.obj'))
          assert objs, 'No OBJ in run 10 artifact'
          assert len(objs) == 1, f'Expected one OBJ, found {len(objs)}: {objs}'
          for i, obj in enumerate(objs):
              subprocess.run(['python','world-creator/validate_3ddfa_obj.py',str(obj)],check=True)
              scene=trimesh.load(str(obj),force='scene',process=False)
              assert len(scene.geometry)>0, 'Empty scene'
              # 3DDFA can export separate face components. Keep only the main
              # connected surface, not detached duplicate heads or fragments.
              import numpy as np
              parts=[]
              for mesh in scene.dump():
                  if not isinstance(mesh,trimesh.Trimesh): continue
                  parts.extend(mesh.split(only_watertight=False))
              assert parts, 'No mesh components found'
              parts.sort(key=lambda m: m.centroid[0])
              main=parts[0]  # leftmost head in the original OBJ coordinate system
              assert len(main.faces)>100, 'Main face component too small'
              assert len(parts) == 3, f'Expected three sample heads, got {len(parts)}'
              print('Component centroids:',[p.centroid.tolist() for p in parts])
              print('Components:',[(len(p.vertices),len(p.faces)) for p in parts], 'keeping largest')
              assert main.visual.kind in ('texture', 'vertex'), f'No valid face appearance data: {main.visual.kind}'
              if main.visual.kind == 'texture':
                  uv=main.visual.uv
                  assert uv is not None and len(uv)==len(main.vertices), 'Missing or mismatched UV coordinates'
                  assert np.isfinite(uv).all(), 'Nonfinite texture UVs'
                  print('UV bounds:',uv.min(axis=0),uv.max(axis=0))
              scene=trimesh.Scene(main)
              dest=pathlib.Path('/tmp/converted')/f'3ddfa-sample-{i}.glb'
              dest.write_bytes(scene.export(file_type='glb'))
              assert dest.stat().st_size>1024, 'GLB unexpectedly small'
              check=trimesh.load(str(dest),force='scene')
              assert len(check.geometry)>0, 'GLB reload failed'
              print('VALID GLB',dest, dest.stat().st_size)
          PY
      - name: Upload GLB for mobile inspection
        uses: actions/upload-artifact@v4
        with:
          name: free-3ddfa-sample-glb
          path: /tmp/converted/*.glb
          if-no-files-found: error

      - name: Publish model into mobile web viewer
        run: |
          mkdir -p world-creator/assets
          cp /tmp/converted/3ddfa-sample-0.glb world-creator/assets/3ddfa-build11-sample.glb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-creator/assets/3ddfa-build10.glb
          git commit -m "Publish isolated Emma sample head build 11" || exit 0
          git push
