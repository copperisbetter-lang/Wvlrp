name: Brooke build verification
on:
  push:
    branches: [brooke-2-0-fresh-start]
    paths:
      - '.github/actions/blender-runtime/**'
      - '.github/workflows/brooke-2-0.yml'
      - 'avatar-work/brooke-2.0/tests/**'
      - 'avatar-work/brooke/scripts/build_complete_head.py'
      - 'avatar-work/brooke/scripts/validate_photo_head_candidate.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brooke-build-verification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions/blender-runtime
            avatar-work/brooke-2.0
            avatar-work/brooke/scripts
      - uses: ./.github/actions/blender-runtime
      - name: Test source geometry and rejection of corrupt geometry
        run: python3 avatar-work/brooke-2.0/tests/check_blender_pipeline.py
      - name: Verify preserved full body and render head inspection
        run: |
          xvfb-run -a blender -b -t 2 --python-exit-code 1 --python avatar-work/brooke-2.0/tests/check_preserved_body.py -- avatar-work/brooke-2.0/brooke-2.0.glb avatar-work/brooke-2.0/build-check
      - name: Record exact source and passing checks
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('avatar-work/brooke-2.0/build-check')
          for name in ['regression-report.json', 'body-smoke-report.json']:
              assert json.loads((p/name).read_text())['status']=='PASS', name
          (p/'run.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],'scope':'Build verification only; no new facial likeness'},indent=2)+'\n')
          PY
      - name: Upload verified build evidence
        uses: actions/upload-artifact@v4
        with:
          name: brooke-build-evidence-${{ github.run_id }}
          path: |
            avatar-work/brooke-2.0/build-check/*.json
            avatar-work/brooke-2.0/build-check/*.png
          if-no-files-found: error
