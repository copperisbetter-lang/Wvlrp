name: Brooke 2.0 Isolated Face Pass
on:
  push:
    branches: [brooke-2-0-fresh-start]
    paths:
      - 'avatar-work/brooke-2.0/**'
      - '.github/workflows/brooke-2-0.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sculpt:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
      - name: Fit photo-derived face candidate onto existing full body
        run: |
          test -s public-models/brooke-2.0-photo-head-candidate.glb
          blender -b --python-exit-code 1 --python avatar-work/brooke-2.0/fit_photo_face_to_body.py -- avatar-work/brooke-2.0/brooke-2.0.glb public-models/brooke-2.0-photo-head-candidate.glb avatar-work/brooke-2.0/brooke-2.0-face-fit-candidate.glb
          test -s avatar-work/brooke-2.0/brooke-2.0-face-fit-candidate.glb
      - name: Upload full-body fit candidate
        uses: actions/upload-artifact@v4
        with:
          name: brooke-2-0-full-body-photo-face-fit-candidate
          path: avatar-work/brooke-2.0/brooke-2.0-face-fit-candidate.glb
          if-no-files-found: error
      - name: Verify fitted GLB preserves full body and distinct candidate face
        run: |
          blender -b --python-exit-code 1 --python avatar-work/brooke-2.0/verify_face_fit.py -- avatar-work/brooke-2.0/brooke-2.0.glb avatar-work/brooke-2.0/brooke-2.0-face-fit-candidate.glb
      - name: Create independent face pass
        run: blender -b --python-exit-code 1 --python avatar-work/brooke-2.0/build_face_pass1.py
      - name: Publish full-body face-pass model to isolated branch
        run: |
          set -e
          test -s avatar-work/brooke-2.0/brooke-2.0-face-pass1.glb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f avatar-work/brooke-2.0/brooke-2.0-face-pass1.glb
          git commit -m "Publish Brooke 2.0 full-body face pass [skip ci]" || exit 0
          git pull --rebase origin brooke-2-0-fresh-start
          git push origin HEAD:brooke-2-0-fresh-start
      - name: Upload isolated full-body result
        uses: actions/upload-artifact@v4
        with:
          name: brooke-2-0-face-pass1
          path: avatar-work/brooke-2.0/brooke-2.0-face-pass1.glb
          if-no-files-found: error
