name: Sculpt Lauren 3 eye-area fullness into real GLB
on:
  push:
    branches: [main]
    paths:
      - 'world-creator/scripts/sculpt_lauren3_eyes.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sculpt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Sculpt eye-region vertices and validate model
        run: python3 world-creator/scripts/sculpt_lauren3_eyes.py
      - name: Preserve result in GitHub repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-creator/assets/lauren-3-face/face.part*.b64 world-creator/LAUREN_3_EYE_AREA_MORPH_REPORT.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Sculpt subtle under-eye and upper-lid fullness onto Lauren 3 3D mesh"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 3
          done
          echo "Could not push after retries" >&2
          exit 1
