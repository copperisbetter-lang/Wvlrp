name: Brooke 3.0 Mouth Geometry Diagnostic
on:
  push:
    paths:
      - 'tests/brooke_head_3_0_mouth_diagnostic.py'
      - '.github/workflows/brooke-head-mouth-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and NumPy
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y blender python3-numpy
      - name: Inspect mouth geometry
        run: blender -b --python-exit-code 1 --python tests/brooke_head_3_0_mouth_diagnostic.py
