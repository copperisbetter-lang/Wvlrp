name: Test Beverly post-op mobile inspection controls
on:
  push:
    branches: [feature/beverly-surgery-room-20261104]
    paths:
      - .github/workflows/test-beverly-mobile-ui.yml
      - prototypes/beverly-surgery/test-mobile-controls.cjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/beverly-surgery-room-20261104
          filter: blob:none
          sparse-checkout: |
            prototypes/beverly-surgery/test-mobile-controls.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node prototypes/beverly-surgery/test-mobile-controls.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Beverly-postop-mobile-controls-QA
          path: /tmp/beverly-controls-fixed-dressed.png
          if-no-files-found: ignore
          retention-days: 7
