name: Stacey Lake Mason default-avatar isolated QA
on:
  push:
    branches: [gater/mason-console-third-person-20261028]
    paths:
      - world-creator/base-camp/stacey-mason-player.js
      - world-creator/base-camp/stacey-dive.html
      - index.html
      - adventure-portal.html
      - .github/workflows/stacey-mason-default-entry-qa.yml
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            world-creator/base-camp/stacey-mason-player.js
            world-creator/base-camp/stacey-dive.html
            world-creator/base-camp/stacey-bass.js
            world-creator/base-camp/stacey-flatheads-restored.js
            world-creator/assets/mason-mpfb-trial.glb
            index.html
            adventure-portal.html
          sparse-checkout-cone-mode: false
      - name: Verify JavaScript entry and Mason module syntax
        run: |
          node --check --input-type=module < world-creator/base-camp/stacey-mason-player.js
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          game=Path('world-creator/base-camp/stacey-dive.html').read_text()
          home=Path('index.html').read_text()
          portal=Path('adventure-portal.html').read_text()
          module=Path('world-creator/base-camp/stacey-mason-player.js').read_text()
          inline=game.split('<script type="module">',1)[1].split('</script>',1)[0]
          Path('/tmp/stacey-inline.mjs').write_text(inline)
          assert "import {installMasonPlayer} from './stacey-mason-player.js'" in inline
          assert "const playerAvatar='Mason';let chaseCamera=true;" in inline
          assert "masonPlayer.update({eye:pos,yaw,dt" in inline
          assert '<button id="viewMode"' in game and game.index('id="viewMode"') > game.index('id="actionConsole"')
          assert game.count('id="viewMode"')==1
          assert "viewButton.textContent=chaseCamera?'3RD" in inline
          assert "window.staceyMason.model.visible=chaseCamera" in inline
          assert "if(new URLSearchParams(location.search).get('spawn')==='lake')" in inline
          assert 'const masonPlayer=installMasonPlayer' in inline
          assert 'installBass(' in inline and 'installStaceyFlatheads(' in inline
          assert "const waist=bb.min.y+h*.661,hem=bb.min.y+h*.388" in module
          assert "new T.SkinnedMesh(geo,mat)" in module
          assert "shorts.bind(body.skeleton,body.bindMatrix.clone())" in module
          assert Path('world-creator/assets/mason-mpfb-trial.glb').stat().st_size>9_000_000
          assert 'Play Game · Mason at Stacey Lake' in home
          assert 'href="world-creator/base-camp/stacey-dive.html?spawn=lake"' in home
          assert 'href="world-creator/base-camp/stacey-dive.html?spawn=lake"' in portal
          assert 'href="adventures.html"' in home and 'href="adventures.html"' in portal
          class Links(HTMLParser):
            def __init__(self):super().__init__();self.links=[]
            def handle_starttag(self,tag,attrs):
              if tag=='a':self.links.append(dict(attrs).get('href',''))
          for name,doc in [('home',home),('portal',portal)]:
            parser=Links();parser.feed(doc)
            assert 'world-creator/base-camp/stacey-dive.html?spawn=lake' in parser.links,name
            assert 'adventures.html' in parser.links,name
          print('MASON_ENTRY_LINK_AND_SCENE_TESTS PASS')
          PY
          node --check /tmp/stacey-inline.mjs
          echo "MASON_SCENE_MODULE_SYNTAX PASS"
