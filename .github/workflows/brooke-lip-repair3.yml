name: Brooke lip profile repair 3
on:
  push:
    branches: [brooke-original-refine-20261024]
    paths:
      - 'avatar-work/brooke/one-point-one/repair_profile.py'
      - '.github/workflows/brooke-lip-repair3.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy pillow
      - name: Build lip profile repair and inspection renders
        run: |
          python avatar-work/brooke/one-point-one/repair_profile.py world-creator/assets/brooke-original-correction2.glb world-creator/assets/brooke-lip-repair3.glb
          mkdir -p world-creator/brooke-lip-repair3-review
          python avatar-work/brooke/one-point-one/render.py world-creator/assets/brooke-lip-repair3.glb world-creator/brooke-lip-repair3-review/front.png
          python avatar-work/brooke/one-point-one/render.py world-creator/assets/brooke-lip-repair3.glb world-creator/brooke-lip-repair3-review/profile.png 90
          python avatar-work/brooke/one-point-one/render.py world-creator/assets/brooke-lip-repair3.glb world-creator/brooke-lip-repair3-review/quarter.png 35
          python avatar-work/brooke/one-point-one/render_lip_close.py world-creator/assets/brooke-lip-repair3.glb world-creator/brooke-lip-repair3-review/lips-close.png
      - name: Save isolated review outputs
        run: |
          git config user.name "Brooke build"
          git config user.email "brooke-build@users.noreply.github.com"
          git add world-creator/assets/brooke-lip-repair3.glb world-creator/assets/brooke-lip-repair3.json world-creator/brooke-lip-repair3-review
          git commit -m "Build Brooke lip profile repair 3 review candidate"
          git push origin HEAD:brooke-original-refine-20261024
