name: MakeHuman isolated install check
on:
  push:
    branches: [test/makehuman-beach-character-v1]
    paths: ['.github/workflows/makehuman-isolated-install.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install application dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs python3-numpy python3-opengl python3-pyqt5 python3-pyqt5.qtopengl python3-pyqt5.qtsvg xvfb xauth libgl1 libgl1-mesa-dri
      - name: Install official MakeHuman source and assets on runner
        run: |
          git clone --depth 1 https://github.com/makehumancommunity/makehuman.git "$RUNNER_TEMP/makehuman"
          cd "$RUNNER_TEMP/makehuman/makehuman"
          /usr/bin/python3 download_assets_git.py
          test -s data/3dobjs/base.obj
          /usr/bin/python3 -c 'import numpy, OpenGL, PyQt5.QtOpenGL; print("Core dependencies import successfully")'
      - name: Launch smoke test
        run: |
          cd "$RUNNER_TEMP/makehuman/makehuman"
          set +e
          timeout 90s xvfb-run -a /usr/bin/python3 makehuman.py > "$RUNNER_TEMP/makehuman-launch.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/makehuman-launch.log"
          if [ "$rc" -ne 124 ] && [ "$rc" -ne 0 ]; then exit "$rc"; fi
          echo "Launch process exited or reached the smoke-test timeout; inspect log for UI readiness."
