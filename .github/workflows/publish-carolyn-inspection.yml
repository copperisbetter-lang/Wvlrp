name: Publish Carolyn inspection model
on:
  workflow_run:
    workflows: ["Build Caroline adult foundation"]
    types: [completed]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-carolyn-model
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Find and download completed Carolyn model
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ -n "${RUN_ID:-}" ]; then
            run_id="$RUN_ID"
          else
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-caroline-mpfb.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id')"
          fi
          test -n "$run_id" && test "$run_id" != "null"
          mkdir -p /tmp/carolyn-artifact
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name caroline-adult-foundation --dir /tmp/carolyn-artifact
          model="$(find /tmp/carolyn-artifact -name caroline-inspection.glb -type f -print -quit)"
          test -n "$model" && test -s "$model"
          mkdir -p world-creator/assets
          cp "$model" world-creator/assets/caroline-inspection.glb
          test -s world-creator/assets/caroline-inspection.glb
      - name: Publish current model to website repository
        env:
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # This job begins from the workflow_run's last checkout. A newer
          # character edit can land between that checkout and the final push.
          # Never overwrite it with an older exported avatar.
          git fetch origin main
          source_paths=(
            world-creator/scripts/build_caroline_mpfb.py
            world-creator/scripts/export_caroline_glb.py
            world-creator/scripts/caroline_appearance.py
            world-creator/scripts/caroline_face_morph.py
            world-creator/scripts/caroline_wardrobe.py
            world-creator/scripts/caroline_eyes.py
            world-creator/scripts/caroline_motions.py
          )
          if [ -n "${BUILD_SHA:-}" ] && ! git diff --quiet "$BUILD_SHA" origin/main -- "${source_paths[@]}"; then
            echo "Newer Carol source edits exist. Skipping stale model publication."
            exit 0
          fi
          git rebase origin/main
          git add -f world-creator/assets/caroline-inspection.glb
          if git diff --cached --quiet; then
            echo "Carol model already current"
            exit 0
          fi
          git commit -m "Publish current Carol inspection GLB for web viewer"
          # Retry if unrelated site changes raced the push. Abort if Carol's
          # own source advanced, since this exported binary would be stale.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if [ -n "${BUILD_SHA:-}" ] && ! git diff --quiet "$BUILD_SHA" origin/main -- "${source_paths[@]}"; then
              echo "Newer Carol source detected after push race; dropping stale GLB."
              exit 0
            fi
            git rebase origin/main || {
              echo "Concurrent model binary change prevents safe rebase."
              exit 1
            }
          done
          exit 1
