name: Publish Carolyn inspection model
on:
  workflow_run:
    workflows: ["Build Caroline adult foundation"]
    types: [completed]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-carolyn-model
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Find and download completed Carolyn model
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ -n "${RUN_ID:-}" ]; then
            run_id="$RUN_ID"
          else
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-caroline-mpfb.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id')"
          fi
          test -n "$run_id" && test "$run_id" != "null"
          mkdir -p /tmp/carolyn-artifact
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name caroline-adult-foundation --dir /tmp/carolyn-artifact
          model="$(find /tmp/carolyn-artifact -name caroline-inspection.glb -type f -print -quit)"
          test -n "$model" && test -s "$model"
          mkdir -p world-creator/assets
          cp "$model" world-creator/assets/caroline-inspection.glb
          test -s world-creator/assets/caroline-inspection.glb
      - name: Publish model to website repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f world-creator/assets/caroline-inspection.glb
          if git diff --cached --quiet; then
            echo "Carolyn model already current"
            exit 0
          fi
          git commit -m "Publish Carolyn inspection GLB for web viewer"
          git push
