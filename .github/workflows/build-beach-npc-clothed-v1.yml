name: Build isolated clothed beach NPC
on:
  push:
    branches: [test/makehuman-beach-character-v1]
    paths: ['.github/workflows/build-beach-npc-clothed-v1.yml','world-creator/scripts/build_beach_npc_clothed_v1.py']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Blender 4.2 and system libraries
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libxkbcommon0 libxi6 libxxf86vm1 libxfixes3 libsm6 libice6 xvfb zip unzip
          curl -fL --retry 4 --retry-delay 5 --connect-timeout 25 'https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz' -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Install official CC0 MakeHuman Blender extension
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch v2.0.18 https://github.com/makehumancommunity/mpfb2.git /tmp/mpfb2
          ( cd /tmp/mpfb2/src/mpfb && zip -qr /tmp/wvlrp-mpfb-ext.zip . )
          mkdir -p /tmp/wvlrp_blender_ext
          /tmp/blender-4.2.0-linux-x64/blender --command extension repo-add wvlrp_local --name WVLRP --directory /tmp/wvlrp_blender_ext
          /tmp/blender-4.2.0-linux-x64/blender --command extension install-file -r wvlrp_local -e /tmp/wvlrp-mpfb-ext.zip
      - name: Restore previously downloaded MakeHuman assets
        id: mh_cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/mh-system.zip
          key: wvlrp-makehuman-system-assets-cc0-v1
      - name: Download MakeHuman assets only when not cached
        if: steps.mh_cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # The primary host has repeatedly stalled; try the official independent mirror.
          # Keep the successful ZIP in Actions cache for future characters.
          for url in \
            'https://files.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip' \
            'https://files2.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip'; do
            rm -f /tmp/mh-system.zip
            if curl -fL --retry 1 --retry-delay 3 --connect-timeout 15 --max-time 420 \
                "$url" -o /tmp/mh-system.zip && unzip -tq /tmp/mh-system.zip >/dev/null; then
              echo "MakeHuman assets downloaded and verified from $url"
              break
            fi
            echo "::warning::MakeHuman asset download failed from $url; trying alternate host"
          done
          test -s /tmp/mh-system.zip
          unzip -tq /tmp/mh-system.zip
      - name: Verify MakeHuman asset archive
        run: |
          set -euo pipefail
          test -s /tmp/mh-system.zip
          unzip -t /tmp/mh-system.zip | tail -n 2
      - name: Cache validated MakeHuman assets for subsequent builds
        if: steps.mh_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/mh-system.zip
          key: wvlrp-makehuman-system-assets-cc0-v1
      - name: Export permanently clothed NPC
        run: |
          set -euo pipefail
          xvfb-run -a /tmp/blender-4.2.0-linux-x64/blender --background --python-exit-code 1 --python world-creator/scripts/build_beach_npc_clothed_v1.py | tee /tmp/beach-npc-build.log
          grep CLOTHED_BEACH_NPC_EXPORTED /tmp/beach-npc-build.log
      - name: Save result only to isolated test branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add world-creator/assets/beach-npc-clothed-v1.glb
          git commit -m 'Save isolated clothed NPC test export'
          git push origin HEAD:test/makehuman-beach-character-v1
