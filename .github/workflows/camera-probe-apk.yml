name: Build Camera Probe APK
on:
  workflow_dispatch:
  push:
    branches: [ camera-probe-v02 ]
    paths: [ 'camera-probe/**', '.github/workflows/camera-probe-apk.yml' ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: camera-probe
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WVLRP-Camera-Probe-v0.2
          path: camera-probe/app/build/outputs/apk/debug/app-debug.apk
