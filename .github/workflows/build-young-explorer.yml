name: Build Young Explorer child avatar
on:
  push:
    paths:
      - 'world-creator/scripts/build_young_explorer.py'
      - '.github/workflows/build-young-explorer.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: young-explorer-child-avatar
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'copperisbetter-lang/Wvlrp'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download Blender 4.2
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libxkbcommon0 libxi6 libxxf86vm1 libxfixes3 libsm6 libice6 xvfb
          curl -fL --retry 3 --retry-delay 5 'https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz' -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Build actual rigged and clothed GLB
        run: |
          set -euo pipefail
          xvfb-run -a /tmp/blender-4.2.0-linux-x64/blender --background --python world-creator/scripts/build_young_explorer.py 2>&1 | tee /tmp/young-explorer-build.log
          grep 'WVLRP_YOUNG_EXPLORER_SUCCESS' /tmp/young-explorer-build.log
      - name: Verify child model and unified skin
        run: |
          python3 - <<'PY'
          import json,struct,pathlib
          f=pathlib.Path('world-creator/assets/young-explorer-olive-plaid.glb')
          blob=f.read_bytes()
          assert blob[:4]==b'glTF' and struct.unpack_from('<I',blob,8)[0]==len(blob)
          l,k=struct.unpack_from('<II',blob,12)
          assert k==0x4e4f534a
          doc=json.loads(blob[20:20+l])
          assert doc.get('skins') and len(doc['skins'][0]['joints'])>=15
          assert len(doc.get('animations',[]))>=3
          mats=[m['name'] for m in doc.get('materials',[])]
          assert len([m for m in mats if m.startswith('Olive child skin')])==1
          assert any('plaid' in m.lower() for m in mats)
          assert doc.get('textures') and doc.get('images')
          print('WVLRP_CHILD_GLB_VERIFIED',f.stat().st_size,'joints',len(doc['skins'][0]['joints']),'animations',[a.get('name') for a in doc['animations']])
          PY
      - name: Commit the finished GLB to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add world-creator/assets/young-explorer-olive-plaid.glb
          if ! git diff --cached --quiet; then
            git commit -m "Publish rigged plaid-dress child explorer GLB"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: young-explorer-build-report
          path: |
            /tmp/young-explorer-build.log
            world-creator/assets/young-explorer-olive-plaid.glb
          if-no-files-found: ignore
          retention-days: 7
