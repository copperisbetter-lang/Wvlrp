name: Brooke photo reconstruction candidate (manual, no publication)
on:
  workflow_dispatch:
    inputs:
      photo_url:
        description: 'Direct HTTPS URL of authorized Brooke front-face reference photograph'
        required: true
        type: string
      photo_sha256:
        description: 'SHA256 of the exact selected user reference photo'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: brooke-photo-reconstruction-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reconstruct:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Validate exact reference before reconstruction setup
        env:
          PHOTO_URL: ${{ inputs.photo_url }}
          PHOTO_SHA256: ${{ inputs.photo_sha256 }}
        run: |
          python -m pip install Pillow
          python avatar-work/brooke/scripts/stage_reference.py --output /tmp/brooke-reference/brooke-reference.jpg
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential libgl1 libglib2.0-0
      - name: Get 3DDFA_V2 and dependencies
        run: |
          git clone --depth 1 https://github.com/cleardusk/3DDFA_V2.git /tmp/3DDFA_V2
          git -C /tmp/3DDFA_V2 rev-parse HEAD
          mkdir -p /tmp/3DDFA_V2/examples/inputs
          cp /tmp/brooke-reference/brooke-reference.jpg /tmp/3DDFA_V2/examples/inputs/brooke-reference.jpg
          python -m pip install --upgrade pip 'setuptools<70' wheel
          python -m pip install 'numpy<2' 'Cython<3' 'opencv-python-headless<5' pyyaml scipy matplotlib onnx onnxruntime
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          (cd /tmp/3DDFA_V2 && sh ./build.sh)
      - name: Reconstruct one face from Brooke photograph
        working-directory: /tmp/3DDFA_V2
        run: |
          sed -i 's/astype(np.long)/astype(np.int64)/g' bfm/bfm.py
          sed -i 's/np.int\b/np.int64/g' FaceBoxes/utils/nms/cpu_nms.pyx
          (cd FaceBoxes && sh ./build_cpu_nms.sh)
          python "${{ github.workspace }}/world-creator/scripts/patch_3ddfa_single_face.py" demo.py
          python demo.py -f examples/inputs/brooke-reference.jpg -o obj --onnx --show_flag false
          find examples/results -maxdepth 1 -name '*_obj.obj' -size +1k -print | tee /tmp/brooke-objs.txt
          test -s /tmp/brooke-objs.txt
          python - <<'PY'
          import glob
          paths=glob.glob('examples/results/*_obj.obj')
          assert len(paths)==1, f'Expected one reconstructed OBJ, got {paths}'
          s=open(paths[0]).readlines()
          v=sum(x.startswith('v ') for x in s)
          f=sum(x.startswith('f ') for x in s)
          assert v>100 and f>100, (v,f)
          print('Photo reconstruction OBJ:',v,'vertices',f,'faces')
          PY
      - uses: ./.github/actions/blender-runtime
      - name: Build closed cranium candidate GLB (neck not yet fitted)
        run: |
          OBJ=$(find /tmp/3DDFA_V2/examples/results -maxdepth 1 -name '*_obj.obj' -print -quit)
          test -n "$OBJ"
          mkdir -p avatar-work/brooke/build
          blender -b -t 2 --python-exit-code 1 --python avatar-work/brooke/scripts/build_complete_head.py -- "$OBJ" avatar-work/brooke/build/brooke-photo-head-candidate.glb /tmp/3DDFA_V2/examples/inputs/brooke-reference.jpg
          test -s avatar-work/brooke/build/brooke-photo-head-candidate.glb
      - name: Validate photo-derived face preservation and manifold topology
        run: |
          OBJ=$(find /tmp/3DDFA_V2/examples/results -maxdepth 1 -name '*_obj.obj' -print -quit)
          blender -b -t 2 --python-exit-code 1 --python avatar-work/brooke/scripts/validate_photo_head_candidate.py -- "$OBJ" avatar-work/brooke/build/brooke-photo-head-candidate.glb
      - name: Upload cranium candidate GLB
        uses: actions/upload-artifact@v4
        with:
          name: brooke-photo-head-candidate-glb
          path: avatar-work/brooke/build/brooke-photo-head-candidate.glb
          if-no-files-found: error
      - name: Upload photo-reconstructed OBJ
        uses: actions/upload-artifact@v4
        with:
          name: brooke-photo-reconstruction-obj
          path: /tmp/3DDFA_V2/examples/results/*_obj.obj
          if-no-files-found: error
      - name: Preserve verified source identity
        uses: actions/upload-artifact@v4
        with:
          name: brooke-reference-identity-${{ github.run_id }}
          path: /tmp/brooke-reference/brooke-reference.json
          if-no-files-found: error
