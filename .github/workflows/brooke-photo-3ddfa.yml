name: Brooke photo-based 3DDFA reconstruction
on:
  push:
    paths:
      - .github/workflows/brooke-photo-3ddfa.yml
      - avatar-work/brooke/scripts/build_complete_head.py
      - avatar-work/brooke/scripts/render_mpfb_fit_review.py
  workflow_dispatch:
    inputs:
      photo_url:
        description: 'Direct HTTPS URL of authorized Brooke front-face reference photograph'
        required: false
        type: string
permissions:
  contents: write
  actions: write
jobs:
  reconstruct:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential libgl1 libglib2.0-0
      - name: Get 3DDFA_V2 and dependencies
        run: |
          git clone --depth 1 https://github.com/cleardusk/3DDFA_V2.git /tmp/3DDFA_V2
          git -C /tmp/3DDFA_V2 rev-parse HEAD
          python -m pip install --upgrade pip 'setuptools<70' wheel
          python -m pip install 'numpy<2' 'Cython<3' 'opencv-python-headless<5' pyyaml scipy matplotlib onnx onnxruntime
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          (cd /tmp/3DDFA_V2 && sh ./build.sh)
      - name: Fetch and validate reference photograph
        env:
          PHOTO_URL: ${{ inputs.photo_url || 'https://austin.culturemap.com/media-library/brooklyn-decker.jpg?coordinates=134%2C0%2C116%2C0&height=1200&id=31517422&width=1200' }}
        run: |
          python - <<'PY'
          import os,urllib.parse,urllib.request,cv2
          u=os.environ['PHOTO_URL']
          assert urllib.parse.urlparse(u).scheme=='https', 'HTTPS photo URL required'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=35) as response:
              data=response.read(12_000_001)
          assert len(data)<12_000_001, 'Photo exceeds 12 MB'
          os.makedirs('/tmp/3DDFA_V2/examples/inputs',exist_ok=True)
          path='/tmp/3DDFA_V2/examples/inputs/brooke-reference.jpg'
          open(path,'wb').write(data)
          img=cv2.imread(path)
          assert img is not None and min(img.shape[:2])>=256, 'Reference is not a valid >=256px photograph'
          print('Validated image dimensions:',img.shape[:2])
          PY
      - name: Reconstruct one face from Brooke photograph
        working-directory: /tmp/3DDFA_V2
        run: |
          sed -i 's/astype(np.long)/astype(np.int64)/g' bfm/bfm.py
          sed -i 's/np.int\b/np.int64/g' FaceBoxes/utils/nms/cpu_nms.pyx
          (cd FaceBoxes && sh ./build_cpu_nms.sh)
          python "${{ github.workspace }}/world-creator/scripts/patch_3ddfa_single_face.py" demo.py
          python demo.py -f examples/inputs/brooke-reference.jpg -o obj --onnx --show_flag false
          find examples/results -maxdepth 1 -name '*_obj.obj' -size +1k -print | tee /tmp/brooke-objs.txt
          test -s /tmp/brooke-objs.txt
          python - <<'PY'
          import glob
          paths=glob.glob('examples/results/*_obj.obj')
          assert len(paths)==1, f'Expected one reconstructed OBJ, got {paths}'
          s=open(paths[0]).readlines()
          v=sum(x.startswith('v ') for x in s)
          f=sum(x.startswith('f ') for x in s)
          assert v>100 and f>100, (v,f)
          print('Photo reconstruction OBJ:',v,'vertices',f,'faces')
          PY
      - name: Install Blender and Blender Python NumPy
        run: |
          sudo apt-get install -y blender python3-numpy xvfb
          blender -b --python-exit-code 1 --python-expr "import numpy; print('Blender NumPy:', numpy.__version__)"
      - name: Build closed cranium candidate GLB (neck not yet fitted)
        run: |
          OBJ=$(find /tmp/3DDFA_V2/examples/results -maxdepth 1 -name '*_obj.obj' -print -quit)
          test -n "$OBJ"
          mkdir -p avatar-work/brooke/build
          blender -b -t 2 --python avatar-work/brooke/scripts/build_complete_head.py -- "$OBJ" avatar-work/brooke/build/brooke-photo-head-candidate.glb
          test -s avatar-work/brooke/build/brooke-photo-head-candidate.glb
      - name: Render photo-derived shell for comparison
        run: |
          mkdir -p avatar-work/brooke/build/photo-review
          xvfb-run -a -s '-screen 0 1280x1024x24' blender -b -t 2 --python-exit-code 1 --python avatar-work/brooke/scripts/render_mpfb_fit_review.py -- avatar-work/brooke/build/brooke-photo-head-candidate.glb avatar-work/brooke/build/photo-review
      - name: Upload photo-derived inspection renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brooke-photo-head-seven-view-review
          path: avatar-work/brooke/build/photo-review/
          if-no-files-found: warn
      - name: Upload cranium candidate GLB
        uses: actions/upload-artifact@v4
        with:
          name: brooke-photo-head-candidate-glb
          path: avatar-work/brooke/build/brooke-photo-head-candidate.glb
          if-no-files-found: error
      - name: Upload photo-reconstructed OBJ
        uses: actions/upload-artifact@v4
        with:
          name: brooke-photo-reconstruction-obj
          path: /tmp/3DDFA_V2/examples/results/*_obj.obj
          if-no-files-found: error
      - name: Publish photo-reconstructed Brooke GLB to repository
        if: ${{ false }} # Disabled until neck, ears, round-trip topology and likeness are approved
        run: |
          set -euo pipefail
          mkdir -p public-models
          cp avatar-work/brooke/build/brooke-photo-head-candidate.glb public-models/brooke-photo-head-neck.glb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-models/brooke-photo-head-neck.glb
          git commit -m "Publish photo-reconstructed Brooke head and neck [skip ci]" || exit 0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            if git push origin HEAD:main; then
              gh workflow run pages.yml --ref main
              exit 0
            fi
            sleep 3
          done
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
