name: Stacey Lake second grass texture QA
on:
  push:
    branches:
      - feature/stacey-grass-texture2-20261111
    paths:
      - 'assets/stacey-rugged-meadow-grass-v1.webp'
      - 'world-creator/base-camp/stacey-dive.html'
      - 'world-creator/tests/stacey-grass-texture-v2.test.mjs'
      - '.github/workflows/stacey-grass-v2-qa.yml'
  workflow_dispatch:

jobs:
  grass-qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Stacey grass tests syntax
        run: node --check world-creator/tests/stacey-grass-texture-v2.test.mjs
      - name: Check applied grass, sand preservation, and mobile asset
        run: node --test world-creator/tests/stacey-grass-texture-v2.test.mjs
