name: Birthday Girl 18 native MPFB face stage 1

on:
  push:
    branches:
      - feature/birthday-girl-18-mpfb-face-20261031
    paths:
      - world-creator/scripts/build_birthday_girl_18_mpfb.py
      - .github/workflows/birthday-girl-18-face.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Restore Blender MPFB caches
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blender-4.2.0-linux-x64
            /tmp/mpfb2
            /tmp/mh-system.zip
          key: wvlrp-character-tools-blender420-mpfb2018-assets-v1
      - name: Install Blender 4.2
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libxkbcommon0 libxi6 libxxf86vm1 libxfixes3 libsm6 libice6 xvfb zip unzip
          if [ ! -x /tmp/blender-4.2.0-linux-x64/blender ]; then
            curl -fL --retry 4 --connect-timeout 30 --speed-time 120 --speed-limit 1024 https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz -o /tmp/blender.tar.xz
            tar -xf /tmp/blender.tar.xz -C /tmp/
          fi
      - name: Install official MakeHuman MPFB 2.0.18
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d /tmp/mpfb2/src/mpfb ]; then
            git clone -q --depth 1 --branch v2.0.18 https://github.com/makehumancommunity/mpfb2.git /tmp/mpfb2
          fi
          (cd /tmp/mpfb2/src/mpfb && zip -qr /tmp/birthday-mpfb-ext.zip .)
          mkdir -p /tmp/wvlrp_blender_ext
          /tmp/blender-4.2.0-linux-x64/blender --command extension repo-add wvlrp_local --name WVLRP --directory /tmp/wvlrp_blender_ext
          /tmp/blender-4.2.0-linux-x64/blender --command extension install-file -r wvlrp_local -e /tmp/birthday-mpfb-ext.zip
      - name: Download official MakeHuman CC0 assets
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s /tmp/mh-system.zip ]; then
            curl -fL --retry 4 --connect-timeout 30 --speed-time 120 --speed-limit 1024 https://files2.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip -o /tmp/mh-system.zip
          fi
          unzip -t /tmp/mh-system.zip | tail -n 2
      - name: Build editable head and GLB + three quality-control views
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x1024x24" /tmp/blender-4.2.0-linux-x64/blender --background --python world-creator/scripts/build_birthday_girl_18_mpfb.py 2>&1 | tee /tmp/birthday-girl-build.log
          grep 'BIRTHDAY_GIRL_MPFB_STAGE1_SUCCESS' /tmp/birthday-girl-build.log
      - name: Check exports
        shell: bash
        run: |
          python3 - <<'PY'
          import json,struct
          from pathlib import Path
          folder=Path('world-creator/assets/birthday-girl-18-face-stage1')
          glb=folder/'Birthday_Girl_18_STAGE1.glb'
          blend=folder/'Birthday_Girl_18_EDITABLE_MPFB_STAGE1.blend'
          assert blend.exists() and blend.stat().st_size > 200000, 'Editable .blend missing'
          data=glb.read_bytes()
          assert data[:4] == b'glTF' and len(data) == struct.unpack_from('<I',data,8)[0]
          chunklen,kind=struct.unpack_from('<II',data,12)
          assert kind==0x4E4F534A
          doc=json.loads(data[20:20+chunklen])
          assert len(doc.get('meshes',[])) >= 1
          assert len(doc.get('skins',[])) >= 1
          report=json.loads((folder/'birthday_stage1_report.json').read_text())
          assert report['age_years']==18
          assert len(report['facial_targets'])==34
          for name in ['front','left','right']:
            f=folder/('birthday_'+name+'.png')
            assert f.exists() and f.stat().st_size>20000
          print('BIRTHDAY_GIRL_EXPORT_QA_OK',glb.stat().st_size,len(doc['skins']))
          PY
      - name: Save isolated trial artifacts; never publish photo or main avatars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: birthday-girl-18-mpfb-face-stage1
          path: |
            /tmp/birthday-girl-build.log
            world-creator/assets/birthday-girl-18-face-stage1/
          if-no-files-found: ignore
          retention-days: 7
