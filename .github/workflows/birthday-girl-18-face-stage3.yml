name: Birthday Girl 18 native MakeHuman face stage 3
on:
  push:
    branches:
      - feature/birthday-girl-18-mpfb-face-20261031
    paths:
      - world-creator/scripts/build_birthday_girl_18_stage3.py
      - .github/workflows/birthday-girl-18-face-stage3.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Download verified Stage 2 corrected-eyebrows original
        uses: actions/download-artifact@v4
        with:
          name: birthday-girl-18-mpfb-face-stage2
          repository: copperisbetter-lang/Wvlrp
          run-id: 41223456507
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/birthday-stage2
      - name: Confirm previous editable MakeHuman source is present
        run: |
          find /tmp/birthday-stage2 -name Birthday_Girl_18_EDITABLE_MPFB_STAGE2.blend -type f
          test "$(find /tmp/birthday-stage2 -name Birthday_Girl_18_EDITABLE_MPFB_STAGE2.blend -type f | wc -l)" -eq 1
      - name: Restore cached Blender and official MPFB tools
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blender-4.2.0-linux-x64
            /tmp/mpfb2
            /tmp/mh-system.zip
          key: wvlrp-character-tools-blender420-mpfb2018-assets-v1
      - name: Install Blender and headless graphics dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libxkbcommon0 libxi6 libxxf86vm1 libxfixes3 libsm6 libice6 xvfb zip unzip
          if [ ! -x /tmp/blender-4.2.0-linux-x64/blender ]; then
            curl -fL --retry 4 --connect-timeout 30 'https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz' -o /tmp/blender.tar.xz
            tar -xf /tmp/blender.tar.xz -C /tmp/
          fi
      - name: Install MakeHuman MPFB 2.0.18 extension
        run: |
          set -euo pipefail
          if [ ! -d /tmp/mpfb2/src/mpfb ]; then
            git clone --quiet --depth 1 --branch v2.0.18 https://github.com/makehumancommunity/mpfb2.git /tmp/mpfb2
          fi
          (cd /tmp/mpfb2/src/mpfb && zip -qr /tmp/wvlrp-birthday2-mpfb.zip .)
          mkdir -p /tmp/wvlrp_blender_ext
          /tmp/blender-4.2.0-linux-x64/blender --command extension repo-add wvlrp_local --name WVLRP --directory /tmp/wvlrp_blender_ext
          /tmp/blender-4.2.0-linux-x64/blender --command extension install-file -r wvlrp_local -e /tmp/wvlrp-birthday2-mpfb.zip
      - name: Restore MakeHuman original textures and hair assets
        run: |
          set -euo pipefail
          if [ ! -s /tmp/mh-system.zip ]; then
            curl -fL --retry 4 --connect-timeout 30 'https://files2.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip' -o /tmp/mh-system.zip
          fi
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,shutil
          root=Path('/home/runner/.config/blender/4.2/extensions/.user/wvlrp_local/mpfb/data')
          with zipfile.ZipFile('/tmp/mh-system.zip') as z:
              for member in z.infolist():
                  parts=Path(member.filename).parts
                  match=next((i for i,p in enumerate(parts) if p in {'skins','hair','eyes','eyebrows','eyelashes','teeth'}),None)
                  if match is None or member.is_dir():continue
                  p=Path(*parts[match:])
                  if '..' in p.parts:continue
                  dst=root/p
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  with z.open(member) as src,dst.open('wb') as target:
                      shutil.copyfileobj(src,target)
          PY
      - name: Run actual editable character third facial likeness pass, keep all original versions
        run: |
          set -euo pipefail
          BIRTHDAY_STAGE2_DIR=/tmp/birthday-stage2 xvfb-run -a -s "-screen 0 1280x1024x24" /tmp/blender-4.2.0-linux-x64/blender --background --python world-creator/scripts/build_birthday_girl_18_stage3.py 2>&1 | tee /tmp/birthday-girl-stage3.log
          grep BIRTHDAY_STAGE3_SUCCESS /tmp/birthday-girl-stage3.log
      - name: Verify actual exported 3D model, source and previews
        run: |
          python3 - <<'PY'
          import json,struct
          from pathlib import Path
          d=Path('world-creator/assets/birthday-girl-18-face-stage3')
          blend=d/'Birthday_Girl_18_EDITABLE_MPFB_STAGE3.blend'
          glb=d/'Birthday_Girl_18_STAGE3.glb'
          assert blend.stat().st_size>1000000
          data=glb.read_bytes()
          assert data[:4]==b'glTF' and len(data)==struct.unpack_from('<I',data,8)[0]
          n,t=struct.unpack_from('<II',data,12)
          assert t==0x4E4F534A
          doc=json.loads(data[20:20+n])
          assert len(doc.get('skins',[]))>=1 and len(doc.get('meshes',[]))>=4
          meta=json.loads((d/'birthday_stage3_report.json').read_text())
          assert len(meta['additional_adjustments'])>=30
          assert meta['native_morph_count_before']>=51
          assert meta['original_skin_maps_refined']>=1
          assert all(v>0 for v in meta['preserved_texture_assets'].values()), meta['preserved_texture_assets']
          assert meta['reference_library'].endswith('Blonde Character Study Montage.png')
          assert meta['stage1_and_stage2_untouched'] is True
          print('BIRTHDAY_STAGE3_TEXTURES_OK',meta['preserved_texture_assets'])
          # These maps were missing from the original GLB, which caused hot-pink previews.
          names=' '.join(i.get('name','').lower() for i in doc.get('images',[]))
          assert 'eyebrow001' in names and 'eyelashes01' in names, names
          for side in ('front','left','right','threequarter'):
              assert (d/('birthday_stage3_'+side+'.png')).stat().st_size>20000
          print('BIRTHDAY_STAGE3_3D_VERIFIED',blend.stat().st_size,glb.stat().st_size,
                'meshes',len(doc['meshes']),'joints',len(doc['skins'][0]['joints']))
          PY
      - name: Save isolated real Blender stage-three result and quality-control renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: birthday-girl-18-mpfb-face-stage3
          path: |
            /tmp/birthday-girl-stage3.log
            world-creator/assets/birthday-girl-18-face-stage3/
          if-no-files-found: ignore
          retention-days: 7
