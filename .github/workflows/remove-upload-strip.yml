name: Remove homepage upload strip

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/remove-upload-strip.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crop only the baked-in night upload strip
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          css_anchor = "#wvlrp-time-logo{width:100%;aspect-ratio:1/1;background-image:url('a_single_image_collage_poster_grid_of_four_high_re.png');background-repeat:no-repeat;background-size:200% 200%;background-position:0 0;border-radius:8px;transition:opacity .7s ease;will-change:background-position,opacity}"
          css_rule = "\n#wvlrp-time-logo.strip-crop{clip-path:inset(0 0 29% 0);margin-bottom:-29%}"
          if css_rule.strip() not in s:
              if css_anchor not in s:
                  raise SystemExit('Logo CSS anchor not found; refusing to change anything')
              s = s.replace(css_anchor, css_anchor + css_rule, 1)

          old_js = "setTimeout(()=>{logo.style.backgroundPosition=positions[next];logo.style.opacity='1';current=next},260)"
          new_js = "setTimeout(()=>{logo.classList.toggle('strip-crop',next==='night');logo.style.backgroundPosition=positions[next];logo.style.opacity='1';current=next},260)"
          if new_js not in s:
              if old_js not in s:
                  raise SystemExit('Logo JS anchor not found; refusing to change anything')
              s = s.replace(old_js, new_js, 1)

          p.write_text(s)
          PY
      - name: Commit surgical homepage fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Hide baked-in Upload to GitHub strip without changing WVLRP logo'
            git push
          fi
