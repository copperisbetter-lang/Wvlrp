name: WVLRP Match Last Frame Audition
on:
  push:
    branches: [research/free-video-workflow]
    paths: ['.github/workflows/wvlrp-frame-audition.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  frame:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare matched first and final film frames
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          python -m pip install --disable-pip-version-check -q pillow requests
          python - <<'PY'
          from PIL import Image,ImageOps,ImageDraw
          import requests
          from io import BytesIO
          from pathlib import Path
          root='https://raw.githubusercontent.com/copperisbetter-lang/Wvlrp/main/assets/woodland-trail-hd.webp'
          r=requests.get(root,timeout=30);r.raise_for_status()
          im=Image.open(BytesIO(r.content)).convert('RGB');print('WOODLAND',im.size,flush=True)
          im.save('woodland-full.jpg',quality=95)
          im=ImageOps.fit(im,(960,540),method=Image.Resampling.LANCZOS)
          im.save('woodland-16x9.jpg',quality=95)
          url='https://huggingface.co/datasets/FastVideo/Mixkit-Src/resolve/main/forest/mixkit-a-drone-flights-above-the-mountains-in-the-forest-50585_clip_1.mp4?download=true'
          r=requests.get(url,timeout=55);r.raise_for_status()
          Path('aerial.mp4').write_bytes(r.content)
          PY
          ffmpeg -loglevel error -y -ss 2 -i aerial.mp4 -frames:v 1 first.jpg
          ffmpeg -loglevel error -y -ss 5 -i aerial.mp4 -frames:v 1 last-aerial.jpg
      - name: Save visual match source frames
        uses: actions/upload-artifact@v4
        with:
          name: WVLRP-FRAME-AUDITION
          path: |
            woodland-full.jpg
            woodland-16x9.jpg
            first.jpg
            last-aerial.jpg
          retention-days: 3
