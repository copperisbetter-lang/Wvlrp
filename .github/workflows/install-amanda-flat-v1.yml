name: Detach prior Flat V1 from Amanda 1.0
on:
  push:
    paths:
      - world-creator/scripts/detach_amanda_flat_v1.py
      - .github/workflows/install-amanda-flat-v1.yml
permissions:
  contents: write
concurrency:
  group: amanda-1-0-flat-v1-detach
  cancel-in-progress: false
jobs:
  install:
    if: startsWith(github.ref, 'refs/heads/g1/amanda-1-0-clone-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libxkbcommon0 libxi6 libxxf86vm1 libxfixes3 libsm6 libice6 xvfb
          curl -fL --retry 4 'https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz' -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Remove Amanda previous attachment and verify rig
        run: |
          /tmp/blender-4.2.0-linux-x64/blender -b -t 2 --python world-creator/scripts/detach_amanda_flat_v1.py
          test -s world-creator/assets/amanda-1-0-base.glb
          test -s world-creator/assets/amanda-1-0-with-flat-v1-backup.glb
          test -s world-creator/assets/amanda-1-0-detach-report.json
      - name: Commit Amanda output on this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add world-creator/assets/amanda-1-0-base.glb world-creator/assets/amanda-1-0-with-flat-v1-backup.glb world-creator/assets/amanda-1-0-detach-report.json
          git commit -m 'Detach Flat V1 from Amanda 1.0 after preserving backup'
          git push origin "HEAD:${GITHUB_REF_NAME}"
