name: Genesis 3 beach NPC source inventory
on:
  push:
    branches: [g3-beach-npc-source-check]
    paths: ['.github/workflows/g3-beach-npc-source-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download owned source archive on runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download Daz --repo copperisbetter-lang/Wvlrp --pattern 'IM00021630-01_Genesis3StarterEssentialsFemale.1.zip' --pattern 'IM00037205-01_NalaforGenesis3Female.zip' --pattern 'IM00044227-01_AndreaforGenesis3Female.zip' --dir "$RUNNER_TEMP"
      - name: Inspect installed character and morph metadata
        run: |
          python3 - <<'PY'
          import os, pathlib, zipfile, re, json, gzip
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          def load(z,n):
              raw=z.read(n)
              if raw.startswith(b'\x1f\x8b'): raw=gzip.decompress(raw)
              return json.loads(raw)
          for p in sorted(root.glob('IM*.zip')):
              print('PACKAGE:',p.name,p.stat().st_size)
              with zipfile.ZipFile(p) as z:
                  names=z.namelist()
                  for n in names:
                      if n.lower().endswith('.duf') and re.search(r'/characters/[^/]+\.duf$|/people/genesis 3 female/[^/]+\.duf$',n,re.I):
                          print('CHARACTER PRESET:',n)
                      if n.lower().endswith('.dsf') and '/morphs/' in n.lower() and re.search(r'/genesis 3/female/morphs/',n,re.I):
                          try:
                              d=load(z,n)
                              for m in d.get('modifier_library',[]):
                                  ch=m.get('channel',{})
                                  label=ch.get('label') or m.get('name') or m.get('id')
                                  if label: print('MORPH:',str(label), 'GROUP:',m.get('group',''))
                          except Exception as e: print('PARSE ERROR:',n,str(e)[:100])
              print('PACKAGE DONE')
          PY
