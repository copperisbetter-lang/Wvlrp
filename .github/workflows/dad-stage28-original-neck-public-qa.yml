name: Dad Stage28 genuine G9 neck recovery QA (public)
on:
  push:
    branches: [feature/dad-stage28-native-neck-restore-20261116]
    paths:
      - dad-stage24-viewer/stage28-recover-original-g9-neck.js
      - dad-stage24-viewer/stage28-real-g9-neck-touch-viewer.html
      - dad-stage24-viewer/stage26-two-piece-fit.js
      - dad-stage24-viewer/stage28-native-neck-fixture.mjs
      - .github/workflows/dad-stage28-original-neck-public-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript module syntax and safe public assets
        run: |
          set -euo pipefail
          node --check dad-stage24-viewer/stage28-recover-original-g9-neck.js
          node --check dad-stage24-viewer/stage26-two-piece-fit.js
          python3 - <<'PY'
          import pathlib,re,json
          root=pathlib.Path('dad-stage24-viewer')
          html=(root/'stage28-real-g9-neck-touch-viewer.html').read_text()
          assert 'fit=prepareTwoPieceFit(gltf,THREE,raw)' in html, 'Must pass locally decrypted model to recovery'
          assert 'stage28' in html.lower()
          for label in ('move-head','rotate-head','move-body','rotate-body','head-smaller','head-larger','body-smaller','body-larger','copy-fit','save-fit','load-fit','head-coords','body-coords'):
            assert label in html,label
          root_src=(root/'stage26-two-piece-fit.js').read_text()
          assert 'recoverActualOriginalG9ShortNeck(protectedModelRaw' in root_src
          assert 'makeShortNativeNeckStump(' not in root_src
          assert 'defaultHeadOffsetY' in root_src
          assert 'originalNativeNeckFaces' in html
          assert not list(root.glob('*.glb'))
          d=json.loads((root/'manifest.json').read_text())
          assert d['model_protected_with_AES_256_GCM'] and d['count']==len(list(root.glob('chunk-*.txt')))==23
          checksum=d['original_model_sha256']
          assert not re.search(r'\b[a-f0-9]{64}\b',html.replace(checksum,'')), 'Viewer key leaked in public source'
          scripts=re.findall(r'<script type="module">([\s\S]*?)</script>',html)
          assert len(scripts)==1
          pathlib.Path('/tmp/dad28-viewer.mjs').write_text(scripts[0])
          print('PASS: user touch controls, source-neck recovery, encryption and no private key')
          PY
          node --check /tmp/dad28-viewer.mjs
      - name: Synthetic GLB regression test — recovered genuine original native 972 faces
        run: |
          cp dad-stage24-viewer/stage28-recover-original-g9-neck.js /tmp/g9restore.mjs
          node dad-stage24-viewer/stage28-native-neck-fixture.mjs
      - name: Verify actual external HTTPS viewer and JS files
        run: |
          set -euo pipefail
          BASE='https://raw.githack.com/copperisbetter-lang/Wvlrp/72dbc30061f8357e355b1807e7cd1ee3a6a81c8d/dad-stage24-viewer'
          curl -fLsS --retry 3 --retry-delay 2 --max-time 60 "$BASE/stage28-real-g9-neck-touch-viewer.html" -o /tmp/dad28-remote.html
          curl -fLsS --retry 3 --retry-delay 2 --max-time 60 "$BASE/stage28-recover-original-g9-neck.js" -o /tmp/dad28-neck.js
          curl -fLsS --retry 3 --retry-delay 2 --max-time 60 "$BASE/stage26-two-piece-fit.js" -o /tmp/dad28-fitter.js
          grep -q 'Dad Stage28' /tmp/dad28-remote.html
          grep -q 'locateOriginalNeckIndices' /tmp/dad28-neck.js
          grep -q 'defaultHeadOffsetY' /tmp/dad28-fitter.js
          node --check /tmp/dad28-neck.js
          node --check /tmp/dad28-fitter.js
          echo 'PASS: genuine neck restoration viewer and scripts accessible on public HTTPS.'
