name: QA Beverly bent-pose mesh isolation (visual)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/qa-beverly-bent-surface-isolation.yml
      - world-creator/character-previews/beverly-postop/test-bent-mesh-isolation.cjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bent-surface-forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            world-creator/character-previews/beverly-postop
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mobile Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Compare bent model with skin layer visibility A/B
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/beverly-layer-server.log 2>&1 &
          sleep 2
          node world-creator/character-previews/beverly-postop/test-bent-mesh-isolation.cjs
      - name: Archive original and isolated screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Beverly-bent-body-patch-attachment-visual
          path: /tmp/beverly-bent-*.png
          if-no-files-found: ignore
          retention-days: 7
