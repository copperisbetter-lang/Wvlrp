name: Brooke 1.1 eyelid and skin review
on:
  push:
    branches: [brooke-1.1]
    paths:
      - 'avatar-work/brooke/one-point-one/**'
      - '.github/workflows/brooke-1-1-refine.yml'
permissions:
  contents: write
concurrency:
  group: brooke-1-1-refine
  cancel-in-progress: false
jobs:
  refine:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical and image dependencies
        run: python -m pip install numpy scipy Pillow
      - name: Build and verify candidate from preserved 1.0 checkpoint
        run: |
          mkdir -p world-creator/brooke-1.1-review
          python avatar-work/brooke/one-point-one/refine_1_1.py world-creator/assets/brooke-1.0-detail-head-candidate.glb world-creator/assets/brooke-1.1-detail-head-candidate.glb
          cp world-creator/assets/brooke-1.1-detail-head-candidate.json world-creator/brooke-1.1-review/pass1-report.json
          python avatar-work/brooke/one-point-one/render.py world-creator/assets/brooke-1.0-detail-head-candidate.glb world-creator/brooke-1.1-review/before.png
          python avatar-work/brooke/one-point-one/render.py world-creator/assets/brooke-1.1-detail-head-candidate.glb world-creator/brooke-1.1-review/front.png
          python avatar-work/brooke/one-point-one/render.py world-creator/assets/brooke-1.1-detail-head-candidate.glb world-creator/brooke-1.1-review/quarter.png 30
          python avatar-work/brooke/one-point-one/render.py world-creator/assets/brooke-1.1-detail-head-candidate.glb world-creator/brooke-1.1-review/profile.png 75
          git diff --exit-code -- world-creator/assets/brooke-1.0-detail-head-candidate.glb
      - uses: actions/upload-artifact@v4
        with:
          name: brooke-1.1-eyelid-skin-review
          path: |
            world-creator/assets/brooke-1.1-detail-head-candidate.glb
            world-creator/brooke-1.1-review/
      - name: Save candidate and review images to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-creator/assets/brooke-1.1-detail-head-candidate.glb world-creator/assets/brooke-1.1-detail-head-candidate.json world-creator/brooke-1.1-review/
          git commit -m "Save Brooke 1.1 relaxed eyelids and feathered jaw review [skip ci]"
          git push origin HEAD:brooke-1.1
