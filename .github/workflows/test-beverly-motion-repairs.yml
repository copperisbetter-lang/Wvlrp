name: QA Beverly post-op motion repairs (preview only)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/test-beverly-motion-repairs.yml
      - world-creator/character-previews/beverly-postop/motion-repairs.js
      - world-creator/character-previews/beverly-postop/test-motion-repairs.cjs
      - world-creator/character-previews/beverly-postop/test-surface.cjs
      - world-creator/character-previews/beverly-postop/viewer.html
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-motion-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            world-creator/character-previews/beverly-postop
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser and actual 3D skeletal model
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local viewer server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/wvlrp-beverly-http.log 2>&1 &
          sleep 2
      - name: Test 69-bone clone using local patched viewer and native 77 animations
        run: node world-creator/character-previews/beverly-postop/test-motion-repairs.cjs
      - name: Inspect Beverly pelvis/inner-thigh mesh overlap and materials (manual forensic run only)
        if: github.event_name == 'workflow_dispatch'
        run: node world-creator/character-previews/beverly-postop/test-surface.cjs
      - name: Store Android-sized visual snapshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Beverly-nonapproved-motion-repairs-QA
          path: |
            /tmp/beverly-motion-repairs-mobile.png
            /tmp/beverly-surface-*.png
            /tmp/beverly-patch-bias-*.png
            /tmp/beverly-kneel-patch-*.png
            /tmp/beverly-patchtrim-*.png
            /tmp/beverly-cleanjoin-*.png
            /tmp/beverly-surface-meshes.json
            /tmp/beverly-three-layer-geometry.json
            /tmp/beverly-texture-*.png
            /tmp/beverly-fixed-elbows-knees-visual.png
            /tmp/beverly-kneeling-before-assert.png
            /tmp/beverly-fixed-elbows-knees-rear.png
            /tmp/beverly-fixed-sit-legs-open-visual.png
          if-no-files-found: ignore
          retention-days: 7
