name: Build realistic Blonde Explorer Age Five (complete human body)
on:
  push:
    paths:
      - 'world-creator/scripts/build_blonde_explorer_age_five.py'
      - 'world-creator/scripts/face_materials.py'
      - '.github/workflows/build-blonde-explorer-age-five.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: blonde-explorer-age-five
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'copperisbetter-lang/Wvlrp'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Blender 4.2 and system libraries
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libxkbcommon0 libxi6 libxxf86vm1 libxfixes3 libsm6 libice6 xvfb zip unzip
          curl -fL --retry 4 --retry-delay 5 --connect-timeout 25 'https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz' -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Install official CC0 MakeHuman Blender extension
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch v2.0.18 https://github.com/makehumancommunity/mpfb2.git /tmp/mpfb2
          ( cd /tmp/mpfb2/src/mpfb && zip -qr /tmp/wvlrp-mpfb-ext.zip . )
          mkdir -p /tmp/wvlrp_blender_ext
          /tmp/blender-4.2.0-linux-x64/blender --command extension repo-add wvlrp_local --name WVLRP --directory /tmp/wvlrp_blender_ext
          /tmp/blender-4.2.0-linux-x64/blender --command extension install-file -r wvlrp_local -e /tmp/wvlrp-mpfb-ext.zip
      - name: Install official MakeHuman realistic model assets
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 6 --connect-timeout 40 \
            'https://files2.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip' -o /tmp/mh-system.zip
          unzip -t /tmp/mh-system.zip | tail -n 2
      - name: Build complete human character and clothing
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            /tmp/blender-4.2.0-linux-x64/blender --background --python world-creator/scripts/build_blonde_explorer_age_five.py \
            2>&1 | tee /tmp/blonde-explorer-build.log
          grep 'WVLRP_YOUNG_EXPLORER_REAL_SUCCESS' /tmp/blonde-explorer-build.log
      - name: QA body mesh, fabric, texture and animation in GLB
        run: |
          python3 - <<'PY'
          import json,struct,pathlib
          f=pathlib.Path('world-creator/assets/blonde-explorer-age-five.glb')
          raw=f.read_bytes();assert raw[:4]==b'glTF'
          assert struct.unpack_from('<I',raw,8)[0]==len(raw)
          n,_=struct.unpack_from('<II',raw,12)
          doc=json.loads(raw[20:20+n])
          assert len(doc.get('skins',[{}])[0].get('joints',[]))==56, 'exactly 56 joints required'
          assert len(doc.get('animations',[]))>=3, 'stand, wave, walk missing'
          assert doc.get('textures') and doc.get('images'), 'real skin and plaid required'
          mats=doc.get('materials',[])
          assert any('Blonde Explorer Age Five real CC0 face and body skin UV' in m.get('name','') and m.get('pbrMetallicRoughness',{}).get('baseColorTexture') for m in mats), 'real photographic UV skin lost'
          assert any('opaque plaid sundress' in m.get('name','') for m in mats), 'dress lost'
          assert f.stat().st_size>200000, 'real human body not exported'
          print('WVLRP_REAL_CHILD_GLB_VERIFIED',f.stat().st_size,'joints',len(doc['skins'][0]['joints']))
          PY
      - name: Publish realistic Blonde Explorer Age Five GLB to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add world-creator/assets/blonde-explorer-age-five.glb
          if [ -f world-creator/assets/blonde-explorer-age-five-preview.png ]; then
            git add world-creator/assets/blonde-explorer-age-five-preview.png
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Publish realistic full-body Blonde Explorer Age Five (MakeHuman)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Save builder output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blonde-explorer-age-five-build
          path: |
            /tmp/blonde-explorer-build.log
            world-creator/assets/blonde-explorer-age-five.glb
            world-creator/assets/blonde-explorer-age-five-preview.png
          if-no-files-found: ignore
          retention-days: 7
