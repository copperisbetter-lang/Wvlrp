name: Build Laura standalone head
on:
  workflow_dispatch:
  push:
    paths:
      - 'world-creator/scripts/build_laura_head.py'
      - '.github/workflows/build-laura-head.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: sudo apt-get update && sudo apt-get install -y blender
      - name: Export Laura head GLB
        run: blender -b -t 2 --python world-creator/scripts/build_laura_head.py
      - name: Check GLB output
        run: test -s world-creator/assets/laura-head-inspection.glb
      - name: Upload head for inspection
        uses: actions/upload-artifact@v4
        with:
          name: laura-head-inspection
          path: world-creator/assets/laura-head-inspection.glb
          if-no-files-found: error

      - name: Publish generated GLB for the live viewer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f world-creator/assets/laura-head-inspection.glb
          if ! git diff --cached --quiet; then
            git commit -m "Publish Laura head inspection model"
            git push
          fi
