name: Extract existing public MakeHuman tied bikini for isolated test
on:
  push:
    branches: [assets/bev-makehuman-bikini-20261101]
    paths:
      - .github/workflows/extract-makehuman-tied-bikini.yml
      - world-creator/scripts/extract_tied_bikini_assets.py
permissions:
  contents: write
jobs:
  extract-ccby:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assets/bev-makehuman-bikini-20261101
      - run: python3 world-creator/scripts/extract_tied_bikini_assets.py
      - name: Archive extracted source for review, never character data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-creator/assets/third-party/makehuman/underwear03/tied-bikini-source
          git diff --cached --quiet && exit 0
          git commit -m "Extract upstream CC-BY tied bikini references only"
          git push origin HEAD:assets/bev-makehuman-bikini-20261101
