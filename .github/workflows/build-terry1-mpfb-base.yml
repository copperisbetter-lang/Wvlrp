name: Build Terry 1 editable MakeHuman male base
on:
  push:
    branches:
      - feature/terry1-makehuman-base-20261122
    paths:
      - .github/workflows/build-terry1-mpfb-base.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  terry:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore official MakeHuman and Blender tool cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blender-4.2.0-linux-x64
            /tmp/mpfb2
            /tmp/mh-system.zip
          key: wvlrp-character-tools-blender420-mpfb2018-assets-v1
      - name: Prepare Blender 4.2
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libxkbcommon0 libxi6 libxxf86vm1 libxfixes3 libsm6 libice6 xvfb zip unzip
          if [ ! -x /tmp/blender-4.2.0-linux-x64/blender ]; then
            curl -fL --retry 4 --connect-timeout 30 'https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz' -o /tmp/blender.tar.xz
            tar -xf /tmp/blender.tar.xz -C /tmp/
          fi
          /tmp/blender-4.2.0-linux-x64/blender --background --version | head -n 4
      - name: Install MPFB 2.0.18
        run: |
          set -euo pipefail
          if [ ! -d /tmp/mpfb2/src/mpfb ]; then
            git clone --quiet --depth 1 --branch v2.0.18 https://github.com/makehumancommunity/mpfb2.git /tmp/mpfb2
          fi
          ( cd /tmp/mpfb2/src/mpfb && zip -qr /tmp/wvlrp-mpfb-ext.zip . )
          mkdir -p /tmp/wvlrp_blender_ext
          /tmp/blender-4.2.0-linux-x64/blender --command extension repo-add wvlrp_local --name WVLRP --directory /tmp/wvlrp_blender_ext
          /tmp/blender-4.2.0-linux-x64/blender --command extension install-file -r wvlrp_local -e /tmp/wvlrp-mpfb-ext.zip
      - name: Restore official CC0 MakeHuman data
        run: |
          set -euo pipefail
          if [ ! -s /tmp/mh-system.zip ]; then
            curl -fL --retry 4 --connect-timeout 30 'https://files2.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip' -o /tmp/mh-system.zip
          fi
          unzip -t /tmp/mh-system.zip | tail -n 2
      - name: Make Terry 1 neutral adult-male base and save editable blend
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x1024x24' /tmp/blender-4.2.0-linux-x64/blender --background --python-exit-code 1 --python avatar-work/terry-1/scripts/build_terry1_mpfb_base.py 2>&1 | tee /tmp/terry1-base-build.log
          grep 'TERRY1_BASE_SUCCESS' /tmp/terry1-base-build.log
      - name: Validate editable and portable output
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, struct, hashlib
          p=Path('avatar-work/terry-1/base')
          blend=p/'Terry1_MakeHuman_Editable_Base.blend'
          glb=p/'Terry1_MakeHuman_Rigged_Base.glb'
          qa=json.loads((p/'Terry1_MakeHuman_Base_QA.json').read_text())
          assert blend.stat().st_size>100000 and blend.read_bytes()[:7]==b'BLENDER'
          blob=glb.read_bytes()
          assert blob[:4]==b'glTF' and struct.unpack_from('<I',blob,8)[0]==len(blob)
          n=struct.unpack_from('<I',blob,12)[0]; scene=json.loads(blob[20:20+n])
          assert len(scene['skins'][0]['joints'])>=25 and scene['meshes']
          assert qa['glb_sha256']==hashlib.sha256(blob).hexdigest()
          assert qa['blend_sha256']==hashlib.sha256(blend.read_bytes()).hexdigest()
          print('TERRY1_BASE_QA_VERIFIED',qa['rig_joints'],qa['meshes'],len(blob),blend.stat().st_size)
          PY
      - name: Save Terry 1 base on isolated project branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add avatar-work/terry-1/base/Terry1_MakeHuman_Editable_Base.blend avatar-work/terry-1/base/Terry1_MakeHuman_Rigged_Base.glb avatar-work/terry-1/base/Terry1_MakeHuman_Base_QA.json
          git commit -m 'Save isolated Terry 1 MakeHuman rigged body and editable MPFB base'
          git push origin HEAD:feature/terry1-makehuman-base-20261122
