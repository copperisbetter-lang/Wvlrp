name: Build Carrie Ingalls child and download Season 3 clothing candidates
on:
  workflow_dispatch:
  push:
    paths:
      - 'world-creator/ingalls/build_carrie_ingalls.py'
      - 'world-creator/ingalls/download_makehuman_wardrobe.py'
      - 'world-creator/ingalls/age-fit-wardrobe.json'
      - '.github/workflows/build-carrie-ingalls.yml'
permissions:
  contents: write
concurrency:
  group: build-carrie-ingalls-s3
  cancel-in-progress: true
jobs:
  download-wardrobe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Restore official MakeHuman wardrobe ZIP cache
        uses: actions/cache@v4
        with:
          path: /tmp/wvlrp-wardrobe-packs
          key: wvlrp-season3-official-clothing-packs-v1
      - name: Download and validate official MakeHuman pack mirrors
        run: |
          set -euo pipefail
          python3 world-creator/ingalls/download_makehuman_wardrobe.py 2>&1 | tee /tmp/wvlrp-wardrobe.log
          grep 'WVLRP_WARDROBE_DOWNLOAD_SUCCESS 3' /tmp/wvlrp-wardrobe.log
      - name: Keep source asset manifest for attribution and inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wvlrp-official-wardrobe-candidates
          path: |
            /tmp/wvlrp-wardrobe-assets
            /tmp/wvlrp-wardrobe.log
          retention-days: 14
          if-no-files-found: ignore
  build-carrie:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore cached Blender, MPFB and verified MakeHuman photo-skin assets
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blender-4.2.0-linux-x64
            /tmp/mpfb2
            /tmp/mh-system.zip
            /tmp/mh-faceunits.zip
          key: wvlrp-character-tools-blender420-mpfb2018-assets-v1
      - name: Prepare Blender and official MPFB2
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libxkbcommon0 libxi6 libxxf86vm1 libxfixes3 libsm6 libice6 xvfb zip unzip
          if [ ! -x /tmp/blender-4.2.0-linux-x64/blender ]; then
            curl -fL --retry 3 --connect-timeout 30 --max-time 480 https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz -o /tmp/blender.tar.xz
            tar -xf /tmp/blender.tar.xz -C /tmp
          fi
          if [ ! -d /tmp/mpfb2/src/mpfb ]; then
            git clone --quiet --depth 1 --branch v2.0.18 https://github.com/makehumancommunity/mpfb2.git /tmp/mpfb2
          fi
          (cd /tmp/mpfb2/src/mpfb && zip -qr /tmp/wvlrp-mpfb-ext.zip .)
          mkdir -p /tmp/wvlrp_blender_ext
          /tmp/blender-4.2.0-linux-x64/blender --command extension repo-add wvlrp_local --name WVLRP --directory /tmp/wvlrp_blender_ext
          /tmp/blender-4.2.0-linux-x64/blender --command extension install-file -r wvlrp_local -e /tmp/wvlrp-mpfb-ext.zip
          if [ ! -s /tmp/mh-system.zip ]; then
            curl -fL --retry 4 --connect-timeout 30 --max-time 480 https://files2.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip -o /tmp/mh-system.zip
          fi
          unzip -tq /tmp/mh-system.zip
      - name: Build actual child body, fitted prairie clothes and UV photographic skin
        run: |
          set -euo pipefail
          xvfb-run -a /tmp/blender-4.2.0-linux-x64/blender --background --python world-creator/ingalls/build_carrie_ingalls.py 2>&1 | tee /tmp/carrie-build.log
          grep WVLRP_CARRIE_GLB_BUILT /tmp/carrie-build.log
      - name: Validate exported Carrie GLB rather than trusting script output
        run: |
          python3 - <<'PY'
          import json,struct,pathlib
          asset=pathlib.Path("world-creator/assets/carrie-ingalls-s3.glb")
          data=asset.read_bytes()
          assert data[:4]==b"glTF"
          assert struct.unpack_from("<I",data,8)[0]==len(data)
          n,_=struct.unpack_from("<II",data,12)
          doc=json.loads(data[20:20+n])
          assert len(doc.get("skins",[]))==1
          joints=len(doc["skins"][0]["joints"])
          assert joints>=50, "Nonfunctional/primitive rig rejected"
          assert len(doc.get("animations",[]))>=5
          mats=doc.get("materials",[])
          assert doc.get("textures") and doc.get("images")
          assert any("Carrie Ingalls real CC0 face and body skin UV" in m.get("name","") and "baseColorTexture" in m.get("pbrMetallicRoughness",{}) for m in mats), "Real skin was not exported"
          assert any("Carrie woven faded floral calico fabric" in m.get("name","") for m in mats)
          assert asset.stat().st_size>200000
          print("WVLRP_CARRIE_EXPORT_VALID",asset.stat().st_size,"joints",joints)
          if joints!=56:
            print("::warning::Carrie export has",joints,"deform joints, not the approved 56-joint production master. Experimental preview only.")
          PY
      - name: Publish Carrie asset on main only after GLB verification
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add world-creator/assets/carrie-ingalls-s3.glb
          if [ -s world-creator/assets/carrie-ingalls-s3-preview.png ]; then
            git add world-creator/assets/carrie-ingalls-s3-preview.png
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Publish Carrie child prototype after mesh and texture checks"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Preserve build output and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carrie-ingalls-s3-build
          path: |
            /tmp/carrie-build.log
            world-creator/assets/carrie-ingalls-s3.glb
            world-creator/assets/carrie-ingalls-s3-preview.png
          retention-days: 14
          if-no-files-found: ignore
