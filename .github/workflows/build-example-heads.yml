name: Create MPFB original and morph clone heads
on:
  push:
    paths:
      - world-creator/scripts/extract_example_head.py
      - .github/workflows/build-example-heads.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
      - name: Extract original and clone
        run: |
          set -euo pipefail
          blender --version
          blender --background --python-exit-code 1 --python world-creator/scripts/extract_example_head.py
          test -s world-creator/assets/original-head-example.glb
          test -s world-creator/assets/morph-head-clone.glb
          cmp world-creator/assets/original-head-example.glb world-creator/assets/morph-head-clone.glb
      - name: Publish example assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add world-creator/assets/original-head-example.glb world-creator/assets/morph-head-clone.glb
          if ! git diff --cached --quiet; then
            git commit -m "Publish original MPFB head example and identical morph clone"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
