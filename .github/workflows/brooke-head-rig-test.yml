name: Brooke Head 3.0 Rig Feasibility
on:
  push:
    paths:
      - 'tests/brooke_head_3_0_rig_test.py'
      - '.github/workflows/brooke-head-rig-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo apt-get -o Acquire::Retries=2 install -y blender
      - name: Test bone deformation on Brooke Head 3.0
        run: blender -b --python-exit-code 1 --python tests/brooke_head_3_0_rig_test.py
