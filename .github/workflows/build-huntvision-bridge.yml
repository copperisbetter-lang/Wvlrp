name: Build Huntvision Bridge

on:
  push:
    branches:
      - huntvision-bridge-prototype
    paths:
      - 'huntvision-bridge/**'
      - '.github/workflows/build-huntvision-bridge.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: huntvision-bridge
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WVLRP-Huntvision-Bridge-debug
          path: huntvision-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
