name: Cecil 1 facial reference frame study
on:
  push:
    branches: [analysis/cecil1-video-faces-20261122]
    paths: [.github/workflows/cecil-video-facial-reference.yml]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download original video references from private Dad release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/cecil-video-input
          gh release download Dadsfiles --repo "$GITHUB_REPOSITORY" --pattern '*.mp4' --dir /tmp/cecil-video-input
          ls -lh /tmp/cecil-video-input
      - name: Generate non-destructive frame references
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageOps,ImageDraw
          import json, subprocess, math, re
          inp=Path('/tmp/cecil-video-input')
          out=Path('research/cecil1-reference-videos-20261122')
          out.mkdir(parents=True, exist_ok=True)
          data=[]
          for index,video in enumerate(sorted(inp.glob('*.mp4')),1):
              duration=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',str(video)]).decode().strip())
              count=20
              target=out / f'video_{index}'
              target.mkdir(exist_ok=True)
              frames=[]
              for i in range(count):
                  t=max(0.0,(i+.35)*duration/count)
                  f=target/f'frame_{i:02d}.jpg'
                  subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-ss',f'{t:.3f}','-i',str(video),'-frames:v','1','-vf','scale=960:-2','-q:v','5',str(f)],check=True)
                  frames.append((f,t))
              canvas=Image.new('RGB',(4*350,5*230),(25,25,25))
              draw=ImageDraw.Draw(canvas)
              for i,(f,t) in enumerate(frames):
                  im=Image.open(f).convert('RGB')
                  im.thumbnail((342,198))
                  x=(i%4)*350+(350-im.width)//2
                  y=(i//4)*230+2
                  canvas.paste(im,(x,y))
                  draw.text(((i%4)*350+8,(i//4)*230+205),f'Frame {i:02d} / {t:.2f}s',fill='white')
              canvas.save(out/f'video_{index}_overview.jpg',quality=82,optimize=True)
              data.append({'video':video.name,'duration_seconds':round(duration,3),'samples':count,'timestamps_seconds':[round(t,3) for _,t in frames]})
          (out/'index.json').write_text(json.dumps(data,indent=2))
          print(json.dumps(data,indent=2))
          PY

      - name: Create short high-frequency mouth and expression motion strips
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          import subprocess,tempfile
          inp=Path('/tmp/cecil-video-input')
          out=Path('research/cecil1-reference-videos-20261122')
          windows={1:[54.0,126.0,368.0],2:[110.0,370.0,497.0]}
          for idx,vid in enumerate(sorted(inp.glob('*.mp4')),1):
              for j,start in enumerate(windows[idx],1):
                  with tempfile.TemporaryDirectory() as td:
                      target=Path(td)
                      pattern=str(target/'f_%03d.jpg')
                      subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-ss',str(start),'-i',str(vid),'-t','3.0','-vf','fps=8,scale=800:-2','-q:v','6',pattern],check=True)
                      frames=list(sorted(target.glob('*.jpg')))[:24]
                      sheet=Image.new('RGB',(4*340,6*290),(24,24,24))
                      draw=ImageDraw.Draw(sheet)
                      for k,frame in enumerate(frames):
                          im=Image.open(frame).convert('RGB')
                          im.thumbnail((332,258))
                          x=(k%4)*340+(340-im.width)//2
                          y=(k//4)*290
                          sheet.paste(im,(x,y))
                          draw.text(((k%4)*340+7,(k//4)*290+260),f'{start+k/8:.3f}s',fill='white')
                      sheet.save(out/f'video_{idx}_motion_{j}.jpg',quality=82,optimize=True)
                      print(f'video {idx} strip {j} sampled frames:',len(frames))
          PY
      - name: Save frames only to isolated analysis branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cecil1-reference-videos-20261122
          git commit -m "Generate Cecil 1 private reference video frame study (source videos untouched)"
          git push
