name: WVLRP Promo 09A - Real Aerial Movement
on:
  push:
    branches: [research/free-video-workflow]
    paths: ['.github/workflows/wvlrp-promo-09a-aerial.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-aerial-09a:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - name: Install open source video client
        run: python -m pip install --disable-pip-version-check -q gradio_client pillow opencv-python-headless
      - name: Get licensed West Virginia source photograph
        run: |
          python - <<'PY'
          from PIL import Image,ImageOps
          from urllib.request import Request,urlopen
          from io import BytesIO
          url='https://images.pexels.com/photos/4595661/pexels-photo-4595661.jpeg?auto=compress&cs=tinysrgb&w=1600'
          req=Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urlopen(req,timeout=40) as response:
            data=response.read()
          image=Image.open(BytesIO(data)).convert('RGB')
          image=ImageOps.fit(image,(832,480),method=Image.Resampling.LANCZOS)
          image.save('09A-source-WV.jpg',quality=95)
          print('WV_PHOTO_READY',len(data),image.size,flush=True)
          PY
      - name: Render actual 4-second cinematic flying motion (NOT stills)
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python - <<'PY'
          import shutil,cv2
          from pathlib import Path
          from gradio_client import Client,handle_file
          client=Client('zerogpu-aoti/wan2-2-fp8da-aoti-faster')
          print('WAN22_CONNECTED',flush=True)
          result=client.predict(
             handle_file('09A-source-WV.jpg'),
             'LIVE ACTION PHOTOREALISTIC CINEMATIC FIRST PERSON BIRDS EYE FLIGHT high above the forested Appalachian mountains of West Virginia, starting with a wide panorama and physically FLYING FORWARD and ACCELERATING toward the valley. Real spatial 3D parallax: many distinct ridges and hardwood treetops move at independent speeds as camera passes them; slight smooth bank and tilt downward for next descent. Warm late afternoon golden light, lush mixed green and golden hardwood foliage, crisp documentary quality and natural dynamic camera. No cuts, no static photo pan, no zoom effect, no looping or duplicated scenery, no birds visible.',
             8,
             'still photograph, ken burns, static image, only zoom, timelapse, sideways slow pan, still mountains, plastic trees, hallucinated roads, buildings, cars, people, distorted terrain, hallucination, flicker, screen artifacts, watermarks, logos, words, subtitles, cartoon, animation',
             4.0,1.0,1.0,9,False,
             api_name='/generate_video'
          )
          p=result[0] if isinstance(result,(tuple,list)) else result
          if isinstance(p,dict): p=p.get('video') or p.get('path') or p.get('name')
          if isinstance(p,dict): p=p.get('path') or p.get('name')
          src=Path(str(p))
          if not src.is_file():raise RuntimeError('Wan generated no accessible MP4: '+str(result)[:500])
          shutil.copyfile(src,'09A.mp4')
          cap=cv2.VideoCapture('09A.mp4')
          count=int(cap.get(cv2.CAP_PROP_FRAME_COUNT));fps=cap.get(cv2.CAP_PROP_FPS)
          w=int(cap.get(cv2.CAP_PROP_FRAME_WIDTH));h=int(cap.get(cv2.CAP_PROP_FRAME_HEIGHT))
          print('REAL_MOTION_FILE',str(src),src.stat().st_size,'frames',count,'fps',fps,'width',w,'height',h,flush=True)
          if count<40:raise RuntimeError('Too few frames for 09A')
          for idx,sec in enumerate([0.0,1.8,3.6]):
            cap.set(cv2.CAP_PROP_POS_MSEC,sec*1000)
            good,frame=cap.read()
            if good: cv2.imwrite(f'09A-review-{idx}.jpg',frame)
          cap.release()
          PY
      - name: Save cinematic MP4 and review frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WVLRP-09A-REAL-AERIAL
          path: |
            09A-source-WV.jpg
            09A.mp4
            09A-review-*.jpg
          if-no-files-found: ignore
          retention-days: 10
