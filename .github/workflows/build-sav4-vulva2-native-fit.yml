name: Fit SAV4 Vulva2 with native MPFB mapping
on:
  push:
    paths:
      - world-creator/sav4-motion.js
      - world-creator/scripts/bake_sav4_motion.mjs
      - world-creator/scripts/build_sav4_vulva2_native_fit.py
      - world-creator/scripts/caroline_eyes.py
      - world-creator/scripts/sav4_face_calibration.py
      - world-creator/scripts/sav4_reference_ratios.py
      - world-creator/characters/sav4/**
      - .github/workflows/build-sav4-vulva2-native-fit.yml
  workflow_call:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sav4-vulva2-native-fit
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      # Rebuild production SAV4 after this workflow update; experimental branches never publish.
      - name: Check character source
        run: |
          test -s world-creator/scripts/build_sav4_vulva2_native_fit.py
          python3 -m py_compile world-creator/scripts/build_sav4_vulva2_native_fit.py world-creator/scripts/caroline_eyes.py
      - name: Measure two-view reference ratios
        run: |
          python3 world-creator/scripts/sav4_reference_ratios.py
          test -s world-creator/characters/sav4/laura-projected-ratios.json
      - name: Check facial calibration mode
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("world-creator/characters/sav4")
          ratios=root/"marybeth-ratios.json"
          mapping=root/"face-region-map.json"
          if not (ratios.is_file() and mapping.is_file()):
              print("SAV4: verified calibration missing; build conservative uncalibrated model, NOT a full photographic morph")
          else:
              regions=json.loads(mapping.read_text()).get("regions",{})
              required=("nose_bridge","nose_tip","mouth_corners","upper_lip","lower_lip")
              if any(not regions.get(k) for k in required):
                  raise SystemExit("SAV4 calibration incomplete: facial vertex region assignments missing")
              report=json.loads(ratios.read_text())
              if report.get("method")!="MediaPipe 2D image landmark ratios":
                  raise SystemExit("SAV4 ratios are not verified photo measurements")
          PY
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libxkbcommon0 libxi6 libxxf86vm1 libxfixes3 libsm6 libice6 xvfb zip unzip
          curl -fL --retry 4 'https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz' -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Install MPFB
        run: |
          git clone --quiet --depth 1 --branch v2.0.18 https://github.com/makehumancommunity/mpfb2.git /tmp/mpfb2
          (cd /tmp/mpfb2/src/mpfb && zip -qr /tmp/wvlrp-mpfb-ext.zip .)
          mkdir -p /tmp/wvlrp_blender_ext
          /tmp/blender-4.2.0-linux-x64/blender --command extension repo-add wvlrp_local --name WVLRP --directory /tmp/wvlrp_blender_ext
          /tmp/blender-4.2.0-linux-x64/blender --command extension install-file -r wvlrp_local -e /tmp/wvlrp-mpfb-ext.zip
      - name: Restore cached CC0 human assets
        id: human-assets-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/mh-system.zip
          key: makehuman-system-assets-cc0-validated-v2
      - name: Download CC0 human assets
        if: steps.human-assets-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 2 --retry-delay 5 --connect-timeout 20 --max-time 300 'https://files2.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip' -o /tmp/mh-system.zip.part
          unzip -tq /tmp/mh-system.zip.part >/dev/null
          mv /tmp/mh-system.zip.part /tmp/mh-system.zip
      - name: Validate CC0 human assets
        run: |
          test -s /tmp/mh-system.zip
          unzip -tq /tmp/mh-system.zip >/dev/null
          echo "MakeHuman CC0 assets validated"
      - name: Cache validated CC0 assets
        if: steps.human-assets-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/mh-system.zip
          key: makehuman-system-assets-cc0-validated-v2
      - name: Build SAV 4
        run: |
          set -o pipefail
          xvfb-run -a /tmp/blender-4.2.0-linux-x64/blender --background --python-exit-code 1 --python world-creator/scripts/build_sav4_vulva2_native_fit.py 2>&1 | tee /tmp/sav4-build.log
          grep SAV4_DISPLAYED_BODY_FIT_VERIFIED /tmp/sav4-build.log
          grep SAV4_NATIVE_APERTURE_VERIFIED /tmp/sav4-build.log
      - name: Bake and verify all movements
        run: |
          mkdir -p /tmp/sav4-motion-audit
          printf '{"type":"module"}' > /tmp/sav4-motion-audit/package.json
          npm install --prefix /tmp/sav4-motion-audit --no-save --ignore-scripts three@0.160.1
          cp world-creator/scripts/bake_sav4_motion.mjs /tmp/sav4-motion-audit/
          cp world-creator/sav4-motion.js /tmp/sav4-motion-audit/
          node /tmp/sav4-motion-audit/bake_sav4_motion.mjs "$GITHUB_WORKSPACE/world-creator/assets/sav4-vulva2-native-fit.glb"
      - name: Verify GLB
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct,json
          p=Path("world-creator/assets/sav4-vulva2-native-fit.glb")
          b=p.read_bytes()
          assert b[:4]==b"glTF"
          assert struct.unpack_from("<I",b,8)[0]==len(b)
          size,kind=struct.unpack_from("<II",b,12)
          doc=json.loads(b[20:20+size])
          assert doc.get("skins") and doc.get("meshes")
          assert doc.get("images"), "SAV4 missing embedded eye/hair textures"
          assert any("eye" in (m.get("name","").lower()) or "iris" in (m.get("name","").lower()) for m in doc.get("materials",[])), "SAV4 missing eye material"
          assert len(doc.get("animations",[]))==9, "Missing embedded movements"
          assert doc["asset"]["extras"]["wvlrpPermanentAnatomy"]
          print("SAV4_GLB_VERIFIED",len(b))
          PY
      - name: Publish permanent SAV4 model and studio
        if: github.ref == 'refs/heads/main'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,shutil
          model=Path("world-creator/assets/sav4-vulva2-native-fit.glb")
          viewer=Path("world-creator/sav4-vulva2-native-fit.html")
          revision=hashlib.sha256(model.read_bytes()).hexdigest()[:12]
          html=viewer.read_text()
          html,count=re.subn(r"const sav4AssetUrl=.*?;", "const sav4AssetUrl='./assets/sav4-vulva2-native-fit.glb?v="+revision+"';",html,count=1)
          assert count==1
          viewer.write_text(html)
          assets=model.parent
          primary=assets/"sav4-realistic.glb"
          backup=assets/"sav4-before-permanent-anatomy.glb"
          if primary.exists() and not backup.exists(): shutil.copy2(primary,backup)
          primary_view=viewer.parent/"sav4.html"
          legacy=viewer.parent/"sav4-legacy-studio.html"
          if primary_view.exists() and not legacy.exists():
              old=primary_view.read_text().replace("sav4-realistic.glb","sav4-before-permanent-anatomy.glb")
              legacy.write_text(old)
          shutil.copy2(model,primary)
          primary_view.write_text('<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=sav4-vulva2-native-fit.html"><title>SAV4 Permanent Studio</title><script>location.replace("sav4-vulva2-native-fit.html"+location.search+location.hash)</script></head><body><a href="sav4-vulva2-native-fit.html">Open SAV4 Permanent Studio</a></body></html>')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add world-creator/assets/sav4-vulva2-native-fit* world-creator/assets/sav4-realistic.glb world-creator/assets/sav4-before-permanent-anatomy.glb world-creator/sav4.html world-creator/sav4-legacy-studio.html world-creator/sav4-vulva2-native-fit.html
          if ! git diff --cached --quiet; then
            git commit -m "Save permanent SAV4 anatomy with skin match, shape controls, and nine movements"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Build summary
        if: always()
        run: |
          echo '## SAV 4 build' >> "$GITHUB_STEP_SUMMARY"
          if test -s world-creator/assets/sav4-vulva2-native-fit.glb; then echo 'GLB file generated' >> "$GITHUB_STEP_SUMMARY"; else echo 'GLB missing — inspect sav4-build-report logs' >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Save logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sav4-vulva2-native-fit-report
          path: |
            /tmp/sav4-build.log
            world-creator/assets/sav4-vulva2-native-fit-report.json
            world-creator/assets/sav4-vulva2-native-fit-movement-report.json
            world-creator/assets/sav4-vulva2-native-fit.glb
            world-creator/characters/sav4/laura-projected-ratios.json
            world-creator/assets/sav4-calibration/face-vertices.csv
            world-creator/assets/sav4-calibration/face-region-map.template.json
            world-creator/assets/sav4-calibration/face-region-candidates.json
          if-no-files-found: ignore
