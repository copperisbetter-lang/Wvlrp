name: Brooke forehead and lips correction 2
on:
  push:
    branches: [brooke-original-refine-20261024]
    paths:
      - 'avatar-work/brooke/one-point-one/refine_forehead_lips.py'
      - '.github/workflows/brooke-forehead-lips.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy pillow
      - name: Build and render forehead and lip candidate
        run: |
          python avatar-work/brooke/one-point-one/refine_forehead_lips.py world-creator/assets/brooke-original-correction1.glb world-creator/assets/brooke-original-correction2.glb
          mkdir -p world-creator/brooke-original-correction2-review
          python avatar-work/brooke/one-point-one/render.py world-creator/assets/brooke-original-correction2.glb world-creator/brooke-original-correction2-review/front.png
          python avatar-work/brooke/one-point-one/render.py world-creator/assets/brooke-original-correction2.glb world-creator/brooke-original-correction2-review/profile.png 90
          python avatar-work/brooke/one-point-one/render.py world-creator/assets/brooke-original-correction2.glb world-creator/brooke-original-correction2-review/quarter.png 35
      - name: Save isolated review outputs
        run: |
          git config user.name "Brooke build"
          git config user.email "brooke-build@users.noreply.github.com"
          git add world-creator/assets/brooke-original-correction2.glb world-creator/assets/brooke-original-correction2.json world-creator/brooke-original-correction2-review
          git commit -m "Build Brooke forehead and lips correction 2 candidate"
          git push origin HEAD:brooke-original-refine-20261024
