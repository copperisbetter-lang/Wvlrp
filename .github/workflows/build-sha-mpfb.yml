name: Build Sha MPFB platinum-blonde rigged test

on:
  push:
    paths:
      - world-creator/scripts/build_sha_mpfb.py
      - world-creator/scripts/face_materials.py
      - .github/workflows/build-sha-mpfb.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sha-mpfb-trial
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'copperisbetter-lang/Wvlrp'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Blender 4.2 and dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libxkbcommon0 libxi6 libxxf86vm1 libxfixes3 libsm6 libice6 xvfb zip unzip
          curl -fL --retry 4 --retry-delay 5 --connect-timeout 25 \
            'https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz' -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp/
          /tmp/blender-4.2.0-linux-x64/blender --background --version | head -n 4
      - name: Install official MPFB 2.0.18 extension
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch v2.0.18 https://github.com/makehumancommunity/mpfb2.git /tmp/mpfb2
          ( cd /tmp/mpfb2/src/mpfb && zip -qr /tmp/wvlrp-mpfb-ext.zip . )
          mkdir -p /tmp/wvlrp_blender_ext
          /tmp/blender-4.2.0-linux-x64/blender --command extension repo-add wvlrp_local --name WVLRP --directory /tmp/wvlrp_blender_ext
          /tmp/blender-4.2.0-linux-x64/blender --command extension install-file -r wvlrp_local -e /tmp/wvlrp-mpfb-ext.zip
          /tmp/blender-4.2.0-linux-x64/blender --command extension list
      - name: Download official CC0 MakeHuman system assets
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 6 --connect-timeout 40 \
            'https://files2.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip' \
            -o /tmp/mh-system.zip
          unzip -t /tmp/mh-system.zip | tail -n 2
          # CC0 ARKit facial shape keys: Sha's real mouth-corner smile.
          curl -fL --retry 4 --retry-delay 6 --connect-timeout 40 \
            'https://files2.makehumancommunity.org/functional/faceunits01.zip' \
            -o /tmp/mh-faceunits.zip
          unzip -t /tmp/mh-faceunits.zip | tail -n 2
      - name: Generate MPFB character GLB and preview
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            /tmp/blender-4.2.0-linux-x64/blender --background --python \
            world-creator/scripts/build_sha_mpfb.py 2>&1 | tee /tmp/sha-mpfb-build.log
          grep WVLRP_SHA_MPFB_SUCCESS /tmp/sha-mpfb-build.log
          grep 'WVLRP_SHA_GROUNDED_POSE Sha HandsAndKnees' /tmp/sha-mpfb-build.log
          grep 'WVLRP_SHA_GROUNDED_POSE Sha ElbowsAndKnees' /tmp/sha-mpfb-build.log
      - name: Check GLB structure (bones, glTF skin)
        run: |
          python3 - <<'PY'
          import struct,json
          from pathlib import Path
          p=Path('world-creator/assets/sha-mpfb-trial.glb')
          data=p.read_bytes()
          assert data[:4]==b'glTF' and len(data)==struct.unpack_from('<I',data,8)[0]
          length,kind=struct.unpack_from('<II',data,12)
          assert kind==0x4E4F534A
          doc=json.loads(data[20:20+length])
          assert len(doc.get('skins',[]))>=1
          assert len(doc['skins'][0]['joints'])>=25
          assert len(doc.get('meshes',[]))>=2
          assert any('Sha real CC0 face and body skin UV' in m.get('name','') and m.get('pbrMetallicRoughness',{}).get('baseColorTexture') for m in doc.get('materials',[])), 'Female face image texture was not exported'
          names=[a.get('name','') for a in doc.get('animations',[])]
          assert len(names)>=5, 'No five named Sha skeletal clips: '+str(names)
          assert any('HandsAndKnees' in name for name in names), 'Missing hands-and-knees animation'
          assert any('ElbowsAndKnees' in name for name in names), 'Missing elbows-and-knees animation'
          assert any(any('targets' in p for p in m.get('primitives',[]))
                     for m in doc.get('meshes',[])), 'Missing Sha smile morph'
          print('WVLRP_SHA_MPFB_GLB_VERIFIED',p.stat().st_size,len(doc['skins'][0]['joints']))
          print('ANIMATIONS',[x.get('name') for x in doc.get('animations',[])])
          PY
      - name: Publish isolated Sha test; leave Riley and Chrissy unchanged
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add world-creator/assets/sha-mpfb-trial.glb
          if [ -f world-creator/assets/sha-mpfb-trial-preview.png ]; then
            git add world-creator/assets/sha-mpfb-trial-preview.png
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Publish isolated CC0 MPFB Sha reference trial and preview"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      # Always commit machine-readable build outcome. A passing Python solver
      # alone does not prove phone-side visual fit; the report is for diagnosis.
      - name: Save Sha QA status to repository
        if: always()
        run: |
          set -euo pipefail
          mkdir -p world-creator
          {
            echo "# Sha latest automated builder result"
            echo ""
            echo "Source GitHub SHA: \`${{ github.sha }}\`"
            echo ""
            echo "Workflow status before QA report: **${{ job.status }}**"
            echo ""
            echo "These are Blender geometry checks, NOT approval of the appearance on Android."
            echo ""
            echo "\`\`\`text"
            if [ -f /tmp/sha-mpfb-build.log ]; then
              grep -E 'WVLRP_SHA_(HAIR_SCALP_ANCHOR|SCALP_SURFACE_FIT|SUNDRESS_BUILT|SUPPORT_ALIGNMENT|SUPPORT_QA|POSTURE_QA|GROUNDED_POSE|MPFB_SUCCESS)|RuntimeError|Traceback' /tmp/sha-mpfb-build.log | tail -n 35 || true
              echo "LAST BUILDER OUTPUT:"
              tail -n 25 /tmp/sha-mpfb-build.log
            else
              echo "Blender build log not generated."
            fi
            echo "\`\`\`"
          } > world-creator/SHA-BUILD-RESULT.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add world-creator/SHA-BUILD-RESULT.md
          git commit -m "Record Sha Blender pose QA result" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Save build troubleshooting log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sha-mpfb-trial-report
          path: |
            /tmp/sha-mpfb-build.log
            world-creator/assets/sha-mpfb-trial.glb
            world-creator/assets/sha-mpfb-trial-preview.png
          if-no-files-found: ignore
          retention-days: 7
