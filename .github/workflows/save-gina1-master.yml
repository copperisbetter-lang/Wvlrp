name: Preserve approved Gina 1 exact GLB master
on:
  push:
    branches: [characters/gina-1-approved-20261102]
    paths:
      - '.github/workflows/save-gina1-master.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: characters/gina-1-approved-20261102
          sparse-checkout: |
            characters/Gina_1
            prototypes/free-redhead-20261101
          persist-credentials: true
      - name: Save exact approved binary under Gina 1
        shell: bash
        run: |
          set -euo pipefail
          original=prototypes/free-redhead-20261101/Redhead18_Ara_V2_Neutral.glb
          named=characters/Gina_1/Gina_1.glb
          cp "$original" "$named"
          check=$(sha256sum "$named" | cut -d' ' -f1)
          test "$check" = "65d47a4e24ebdb77e07dd359a30d03809dc0ec63b8e9537cde39f3c2535df295"
          cp prototypes/free-redhead-20261101/Redhead18_AraV2_Neutral.params.json characters/Gina_1/Gina_1_original_build.params.json
          echo "Approved Gina1 master verified: $check"
      - name: Commit named, pinned master on approval branch only
        run: |
          git config user.name 'Gator Character Master Snapshot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add characters/Gina_1/Gina_1.glb characters/Gina_1/Gina_1_original_build.params.json
          git commit -m "Save approved Gina 1 GLB master [skip ci]"
          git pull --rebase origin characters/gina-1-approved-20261102
          git push origin HEAD:characters/gina-1-approved-20261102
