name: Build SAV 4 adult character GLB
on:
  push:
    paths:
      - world-creator/scripts/build_sav4_mpfb.py
      - world-creator/scripts/caroline_eyes.py
      - world-creator/scripts/sav4_face_calibration.py
      - world-creator/scripts/sav4_reference_ratios.py
      - world-creator/characters/sav4/**
      - .github/workflows/build-sav4.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sav4-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check character source
        run: |
          test -s world-creator/scripts/build_sav4_mpfb.py
          python3 -m py_compile world-creator/scripts/build_sav4_mpfb.py world-creator/scripts/caroline_eyes.py
      - name: Measure two-view reference ratios
        run: |
          python3 world-creator/scripts/sav4_reference_ratios.py
          test -s world-creator/characters/sav4/laura-projected-ratios.json
      - name: Check facial calibration mode
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("world-creator/characters/sav4")
          ratios=root/"marybeth-ratios.json"
          mapping=root/"face-region-map.json"
          if not (ratios.is_file() and mapping.is_file()):
              print("SAV4: verified calibration missing; build conservative uncalibrated model, NOT a full photographic morph")
          else:
              regions=json.loads(mapping.read_text()).get("regions",{})
              required=("nose_bridge","nose_tip","mouth_corners","upper_lip","lower_lip")
              if any(not regions.get(k) for k in required):
                  raise SystemExit("SAV4 calibration incomplete: facial vertex region assignments missing")
              report=json.loads(ratios.read_text())
              if report.get("method")!="MediaPipe 2D image landmark ratios":
                  raise SystemExit("SAV4 ratios are not verified photo measurements")
          PY
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libxkbcommon0 libxi6 libxxf86vm1 libxfixes3 libsm6 libice6 xvfb zip unzip
          curl -fL --retry 4 'https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz' -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Install MPFB
        run: |
          git clone --quiet --depth 1 --branch v2.0.18 https://github.com/makehumancommunity/mpfb2.git /tmp/mpfb2
          (cd /tmp/mpfb2/src/mpfb && zip -qr /tmp/wvlrp-mpfb-ext.zip .)
          mkdir -p /tmp/wvlrp_blender_ext
          /tmp/blender-4.2.0-linux-x64/blender --command extension repo-add wvlrp_local --name WVLRP --directory /tmp/wvlrp_blender_ext
          /tmp/blender-4.2.0-linux-x64/blender --command extension install-file -r wvlrp_local -e /tmp/wvlrp-mpfb-ext.zip
      - name: Download CC0 human assets
        run: |
          curl -fL --retry 4 'https://files2.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip' -o /tmp/mh-system.zip
      - name: Build SAV 4
        run: |
          set -o pipefail
          xvfb-run -a /tmp/blender-4.2.0-linux-x64/blender --background --python world-creator/scripts/build_sav4_mpfb.py 2>&1 | tee /tmp/sav4-build.log
          grep SAV4_BUILD_SUCCESS /tmp/sav4-build.log
      - name: Verify GLB
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct,json
          p=Path("world-creator/assets/sav4-realistic.glb")
          b=p.read_bytes()
          assert b[:4]==b"glTF"
          assert struct.unpack_from("<I",b,8)[0]==len(b)
          size,kind=struct.unpack_from("<II",b,12)
          doc=json.loads(b[20:20+size])
          assert doc.get("skins") and doc.get("meshes")
          assert doc.get("images"), "SAV4 missing embedded eye/hair textures"
          assert any("blue" in (m.get("name","").lower()) for m in doc.get("materials",[])), "SAV4 missing blue eye material"
          print("SAV4_GLB_VERIFIED",len(b))
          PY
      - name: Refresh SAV 4 viewer asset revision
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          model=Path("world-creator/assets/sav4-realistic.glb")
          viewer=Path("world-creator/sav4.html")
          revision=hashlib.sha256(model.read_bytes()).hexdigest()[:12]
          html=viewer.read_text()
          # Replace the single viewer declaration, regardless of its existing revision.
          lines=html.splitlines(keepends=True)
          matches=[i for i,line in enumerate(lines) if line.lstrip().startswith("const sav4AssetUrl=")]
          if len(matches)!=1:
            raise RuntimeError(f"SAV4 viewer GLB declaration count {len(matches)}; expected 1")
          i=matches[0]
          indent=lines[i][:len(lines[i])-len(lines[i].lstrip())]
          newline="\n" if lines[i].endswith("\n") else ""
          lines[i]=indent+f"const sav4AssetUrl='./assets/sav4-realistic.glb?v={revision}';"+newline
          updated="".join(lines)
          viewer.write_text(updated)
          print("SAV4_VIEWER_ASSET_REVISION",revision)
          PY
      - name: Publish SAV 4 asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add world-creator/assets/sav4-realistic.glb world-creator/sav4.html
          if ! git diff --cached --quiet; then
            git commit -m "Publish SAV 4 game-ready GLB"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Build summary
        if: always()
        run: |
          echo '## SAV 4 build' >> "$GITHUB_STEP_SUMMARY"
          if test -s world-creator/assets/sav4-realistic.glb; then echo 'GLB file generated' >> "$GITHUB_STEP_SUMMARY"; else echo 'GLB missing — inspect sav4-build-report logs' >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Save logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sav4-build-report
          path: |
            /tmp/sav4-build.log
            world-creator/assets/sav4-realistic.glb
            world-creator/characters/sav4/laura-projected-ratios.json
            world-creator/assets/sav4-calibration/face-vertices.csv
            world-creator/assets/sav4-calibration/face-region-map.template.json
          if-no-files-found: ignore
