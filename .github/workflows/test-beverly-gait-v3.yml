name: Real phone browser QA Beverly gait V3 and two poses
on:
  push:
    branches: [feature/beverly-surgery-room-20261104]
    paths:
      - .github/workflows/test-beverly-gait-v3.yml
      - prototypes/beverly-surgery/verify-gait-v3.cjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/beverly-surgery-room-20261104
          filter: blob:none
          sparse-checkout: |
            prototypes/beverly-surgery/verify-gait-v3.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check actual walk, run and added poses in Android-size Chrome
        run: node prototypes/beverly-surgery/verify-gait-v3.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Beverly-79-movements-gait-qa-screenshots
          path: |
            /tmp/beverly-elbows-knees.png
            /tmp/beverly-sit-open.png
          retention-days: 7
          if-no-files-found: ignore
