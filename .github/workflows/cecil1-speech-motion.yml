name: Cecil 1 speech-to-facial-motion study
on:
  push:
    branches:
      - analysis/cecil1-video-faces-20261122
    paths:
      - .github/workflows/cecil1-speech-motion.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio/video and face-analysis packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet "numpy<2" "faster-whisper==1.2.1" "mediapipe==0.10.21" "pronouncing==0.2.0"
      - name: Download private original Dad speech videos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/cecil-video-input
          gh release download Dadsfiles --repo "$GITHUB_REPOSITORY" --pattern '*.mp4' --dir /tmp/cecil-video-input
          test "$(find /tmp/cecil-video-input -name '*.mp4' | wc -l)" -eq 2
          ls -lh /tmp/cecil-video-input
      - name: Transcribe, measure facial movement, and link words to video times
        run: |
          python tools/cecil1_speech_motion_study.py
      - name: Save private study in isolated analysis branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cecil1-speech-motion-20261122/
          git commit -m "Save Cecil 1 aligned speech and facial reference data"
          git push
