name: Test free 3DDFA V2 OBJ reconstruction

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/test-laura-free-3ddfa.yml

permissions:
  contents: read

jobs:
  sample-obj:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential libgl1 libglib2.0-0
      - name: Download MIT licensed 3DDFA V2 source
        run: |
          git clone --depth 1 https://github.com/cleardusk/3DDFA_V2.git /tmp/3DDFA_V2
          git -C /tmp/3DDFA_V2 rev-parse HEAD
      - name: Install CPU dependencies and build
        working-directory: /tmp/3DDFA_V2
        run: |
          python -m pip install --upgrade pip 'setuptools<70' wheel
          python -m pip install 'numpy<2' 'Cython<3' 'opencv-python-headless<5' pyyaml scipy matplotlib onnx onnxruntime
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          sh ./build.sh
      - name: Reconstruct included public sample as OBJ
        working-directory: /tmp/3DDFA_V2
        run: |
          mkdir -p examples/results
          python demo.py -f examples/inputs/emma.jpg -o obj --onnx --show_flag false
          find examples/results -maxdepth 1 -name '*_obj.obj' -size +1k -print | tee /tmp/obj-files.txt
          ls -lah examples/results
          test -s /tmp/obj-files.txt
      - name: Upload test OBJ artifact
        uses: actions/upload-artifact@v4
        with:
          name: free-3ddfa-sample-obj
          path: /tmp/3DDFA_V2/examples/results/*_obj.obj
          if-no-files-found: error
