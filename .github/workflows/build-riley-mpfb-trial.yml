name: Build Chrissy MPFB reference trial

on:
  push:
    paths:
      - world-creator/scripts/build_riley_mpfb_trial.py
      - world-creator/scripts/face_materials.py
      - .github/workflows/build-riley-mpfb-trial.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chrissy-mpfb-trial
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'copperisbetter-lang/Wvlrp'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore shared character builder tools and assets
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blender-4.2.0-linux-x64
            /tmp/mpfb2
            /tmp/mh-system.zip
            /tmp/mh-faceunits.zip
          key: wvlrp-character-tools-blender420-mpfb2018-assets-v1
      - name: Set up Blender 4.2 and dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libxkbcommon0 libxi6 libxxf86vm1 libxfixes3 libsm6 libice6 xvfb zip unzip
          if [ ! -x /tmp/blender-4.2.0-linux-x64/blender ]; then
            curl -fL --retry 4 --connect-timeout 30 --speed-time 120 --speed-limit 1024 'https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz' -o /tmp/blender.tar.xz
            tar -xf /tmp/blender.tar.xz -C /tmp/
          fi
          /tmp/blender-4.2.0-linux-x64/blender --background --version | head -n 4
      - name: Install official MPFB 2.0.18 extension
        run: |
          set -euo pipefail
          if [ ! -d /tmp/mpfb2/src/mpfb ]; then
            git clone --quiet --depth 1 --branch v2.0.18 https://github.com/makehumancommunity/mpfb2.git /tmp/mpfb2
          fi
          ( cd /tmp/mpfb2/src/mpfb && zip -qr /tmp/wvlrp-mpfb-ext.zip . )
          mkdir -p /tmp/wvlrp_blender_ext
          /tmp/blender-4.2.0-linux-x64/blender --command extension repo-add wvlrp_local --name WVLRP --directory /tmp/wvlrp_blender_ext
          /tmp/blender-4.2.0-linux-x64/blender --command extension install-file -r wvlrp_local -e /tmp/wvlrp-mpfb-ext.zip
          /tmp/blender-4.2.0-linux-x64/blender --command extension list
      - name: Download official CC0 MakeHuman system assets
        run: |
          set -euo pipefail
          if [ ! -s /tmp/mh-system.zip ]; then
            curl -fL --retry 4 --connect-timeout 30 --speed-time 120 --speed-limit 1024 'https://files2.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip' -o /tmp/mh-system.zip
          fi
          unzip -t /tmp/mh-system.zip | tail -n 2
      - name: Generate MPFB character GLB and preview
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            /tmp/blender-4.2.0-linux-x64/blender --background --python \
            world-creator/scripts/build_riley_mpfb_trial.py 2>&1 | tee /tmp/chrissy-mpfb-build.log
          grep WVLRP_MPFB_SUCCESS /tmp/chrissy-mpfb-build.log
      - name: Check GLB structure (bones, glTF skin)
        run: |
          python3 - <<'PY'
          import struct,json
          from pathlib import Path
          p=Path('world-creator/assets/chrissy-mpfb-trial.glb')
          data=p.read_bytes()
          assert data[:4]==b'glTF' and len(data)==struct.unpack_from('<I',data,8)[0]
          length,kind=struct.unpack_from('<II',data,12)
          assert kind==0x4E4F534A
          doc=json.loads(data[20:20+length])
          assert len(doc.get('skins',[]))>=1
          assert len(doc['skins'][0]['joints'])>=25
          assert len(doc.get('meshes',[]))>=2
          assert any('Chrissy real CC0 face and body skin UV' in m.get('name','') and m.get('pbrMetallicRoughness',{}).get('baseColorTexture') for m in doc.get('materials',[])), 'Female face image texture was not exported'
          print('WVLRP_CHRISSY_MPFB_GLB_VERIFIED',p.stat().st_size,len(doc['skins'][0]['joints']))
          print('ANIMATIONS',[x.get('name') for x in doc.get('animations',[])])
          PY
      - name: Publish isolated trial file without touching current Chrissy
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add world-creator/assets/chrissy-mpfb-trial.glb
          if [ -f world-creator/assets/chrissy-mpfb-trial-preview.png ]; then
            git add world-creator/assets/chrissy-mpfb-trial-preview.png
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Publish isolated CC0 MPFB Chrissy reference trial and preview"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Save build troubleshooting log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrissy-mpfb-trial-report
          path: |
            /tmp/chrissy-mpfb-build.log
            world-creator/assets/chrissy-mpfb-trial.glb
            world-creator/assets/chrissy-mpfb-trial-preview.png
          if-no-files-found: ignore
          retention-days: 7
