name: Brooke profile and cavity repair 6
on:
  push:
    branches: [brooke-original-refine-20261024]
    paths:
      - 'avatar-work/brooke/one-point-one/line_cavities6.py'
      - '.github/workflows/brooke-profile-cavity6.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy pillow
      - name: Build rigged linings and inspection renders
        run: |
          python avatar-work/brooke/one-point-one/line_cavities6.py world-creator/assets/brooke-profile-fit5.glb world-creator/assets/brooke-profile-cavity6.glb
          mkdir -p world-creator/brooke-profile-cavity6-review
          python avatar-work/brooke/one-point-one/render.py world-creator/assets/brooke-profile-cavity6.glb world-creator/brooke-profile-cavity6-review/front.png
          python avatar-work/brooke/one-point-one/render.py world-creator/assets/brooke-profile-cavity6.glb world-creator/brooke-profile-cavity6-review/profile.png 90
          python avatar-work/brooke/one-point-one/render.py world-creator/assets/brooke-profile-cavity6.glb world-creator/brooke-profile-cavity6-review/quarter.png 35
          python avatar-work/brooke/one-point-one/render_face_close.py world-creator/assets/brooke-profile-cavity6.glb world-creator/brooke-profile-cavity6-review/close-front.png 0
          python avatar-work/brooke/one-point-one/render_face_close.py world-creator/assets/brooke-profile-cavity6.glb world-creator/brooke-profile-cavity6-review/close-side.png 90
      - name: Save isolated review outputs
        run: |
          git config user.name "Brooke build"
          git config user.email "brooke-build@users.noreply.github.com"
          git add world-creator/assets/brooke-profile-cavity6.glb world-creator/assets/brooke-profile-cavity6.json world-creator/brooke-profile-cavity6-review
          git commit -m "Build Brooke combined profile and cavity repair 6 candidate"
          git push origin HEAD:brooke-original-refine-20261024
