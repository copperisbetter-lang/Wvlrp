name: Build Skeleton Key APK
on:
  workflow_dispatch:
  push:
    branches: [ camera-probe-build ]
    paths: [ 'skeleton-key/**', '.github/workflows/skeleton-key-apk.yml' ]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: skeleton-key } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: SkeletonKey-APK, path: skeleton-key/app/build/outputs/apk/debug/app-debug.apk }
