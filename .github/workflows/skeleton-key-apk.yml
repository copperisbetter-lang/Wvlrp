name: Build Skeleton Key APK
# retrigger after all Kotlin string fixes
on:
  push:
    branches: [main, master]
    paths:
      - 'skeleton-key/**'
      - '.github/workflows/skeleton-key-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: skeleton-key
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Skeleton-Key-APK
          path: skeleton-key/app/build/outputs/apk/debug/app-debug.apk
