name: WVLRP First Last Video Bridge API Audit
on:
  push:
    branches: [research/free-video-workflow]
    paths: ['.github/workflows/wvlrp-flf-bridge-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check public first and last frame video model API
        run: |
          python -m pip install --disable-pip-version-check -q gradio_client
          python - <<'PY'
          from gradio_client import Client
          spaces=['multimodalart/wan-2-2-first-last-frame','dream2589632147/Dream-wan2-2-fp8da-aoti-preview-2']
          for space in spaces:
           print('CONNECT',space,flush=True)
           try:
            c=Client(space)
            print('API',c.view_api(all_endpoints=True,print_info=True),flush=True)
           except Exception as e:print('ERROR',str(e)[:2000],flush=True)
          PY
