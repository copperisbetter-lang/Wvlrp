name: Gina5 - Android mobile GLB from actual scan fit (PUBLIC)
on:
  push:
    branches:
      - experiment/gina5-new-attachment-public-20261121
    paths:
      - .github/workflows/gina5-public-mobile-export.yml
      - experiments/gina5-new-attachment/export_cc0_mobile.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mobile-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/gina5-new-attachment-public-20261121
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            experiments/gina5-new-attachment
          sparse-checkout-cone-mode: true
      - name: Install Blender public Linux runner
        run: |
          set -euo pipefail
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=45 update
          timeout 900s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=45 install -y blender python3-numpy libegl1 libgl1 libgles2 libopengl0 libx11-6 libxext6 libxrender1 libxi6 libxkbcommon0 libsm6 libice6
      - name: Open REAL saved Blender scene and export a lightweight phone preview
        run: |
          set -euo pipefail
          blender -b -t 2 --python-exit-code 1 \
            --python experiments/gina5-new-attachment/export_cc0_mobile.py -- \
            experiments/gina5-new-attachment/qa/Gina5_CC0_Real_Scan_Attachment_UNAPPROVED.blend \
            experiments/gina5-new-attachment/qa
          python3 - <<'PY'
          import json,pathlib
          qa=pathlib.Path('experiments/gina5-new-attachment/qa')
          r=json.loads((qa/'gina5_cc0_mobile_report.json').read_text())
          assert r['full_blender_preserved'] and r['skinning_retained']
          assert r['mobile_attachment_faces']<r['original_attachment_faces']*.24
          assert r['skin_count']>=1 and r['candidate_glb_bytes']<55000000
          assert not r['owner_approved'] and not r['production_ready']
          print('PASS actual scanned mobile Gina5 preview',r['candidate_glb_bytes'])
          PY
      - name: Save mobile GLB and QA directly on public experimental branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/gina5-new-attachment/qa/Gina5_CC0_Real_Scan_Attachment_MOBILE.glb
          git add experiments/gina5-new-attachment/qa/gina5_cc0_mobile_report.json
          git commit -m "Save actual Gina5 CC0 scan low-poly skinned mobile inspection [skip ci]" || exit 0
          git push origin HEAD:experiment/gina5-new-attachment-public-20261121
