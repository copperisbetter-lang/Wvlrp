name: Brooke single-head reconstruction smoke test

on:
  push:
    branches: [brooke-single-head-build]
    paths:
      - .github/workflows/brooke-single-head-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brooke-head-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install native libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential libgl1 libglib2.0-0
      - name: Fetch 3DDFA V2
        run: git clone --depth 1 https://github.com/cleardusk/3DDFA_V2.git /tmp/3DDFA_V2
      - name: Install CPU dependencies
        working-directory: /tmp/3DDFA_V2
        run: |
          python -m pip install --upgrade pip 'setuptools<70' wheel
          python -m pip install 'numpy<2' 'Cython<3' 'opencv-python-headless<5' pyyaml scipy matplotlib onnx onnxruntime
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          sh ./build.sh
      - name: Generate single head from bundled public sample
        working-directory: /tmp/3DDFA_V2
        run: |
          mkdir -p examples/results
          sed -i 's/astype(np.long)/astype(np.int64)/g' bfm/bfm.py
          sed -i 's/np.int\b/np.int64/g' FaceBoxes/utils/nms/cpu_nms.pyx
          (cd FaceBoxes && sh ./build_cpu_nms.sh)
          python "$GITHUB_WORKSPACE/world-creator/scripts/patch_3ddfa_single_face.py" demo.py
          python demo.py -f examples/inputs/emma.jpg -o obj --onnx --show_flag false
          find examples/results -maxdepth 1 -name '*_obj.obj' -size +1k -print | tee /tmp/obj-files.txt
          test "$(wc -l < /tmp/obj-files.txt)" -eq 1
      - name: Verify exactly one substantial facial mesh
        working-directory: /tmp/3DDFA_V2
        run: |
          python "$GITHUB_WORKSPACE/world-creator/scripts/check_brooke_single_head.py" "$(head -n 1 /tmp/obj-files.txt)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brooke-pipeline-sample-head-obj
          path: /tmp/3DDFA_V2/examples/results/*_obj.obj
          if-no-files-found: warn
