name: Build Gina 4 — distinctly golden blonde hair + fuller bust
on:
  push:
    branches: [feature/gina4-golden-blonde-20261102]
    paths:
      - '.github/workflows/gina4-golden-blonde.yml'
      - 'prototypes/gina4-20261102/Gina_4_Ara_V1_GoldenBlonde.params.json'
      - 'prototypes/gina4-20261102/recolor_glb_hair.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-gina4:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout isolated Gina 4 prototype
        uses: actions/checkout@v4
        with:
          ref: feature/gina4-golden-blonde-20261102
          sparse-checkout: |
            prototypes/gina4-20261102
          persist-credentials: true
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Clone free Ara generator
        run: git clone --depth 1 https://github.com/olatunde85/3d-gen.git /tmp/ara3dgen
      - name: Install Ara dependencies
        working-directory: /tmp/ara3dgen
        run: npm ci
      - name: Download CC0 MakeHuman assets
        working-directory: /tmp/ara3dgen
        run: npm run setup-assets
      - name: Verify slider names, adult age and fuller bust
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('prototypes/gina4-20261102/Gina_4_Ara_V1_GoldenBlonde.params.json','utf8'));
          const c=JSON.parse(fs.readFileSync('/tmp/ara3dgen/public/assets/catalog.json','utf8'));
          const sliders=new Set(c.sliders.flatMap(g=>g.sliders.map(s=>s.id)));
          const invalid=Object.keys(p.modifiers).filter(k=>!sliders.has(k));
          if(invalid.length)throw Error('Unknown sliders: '+invalid.join(','));
          if(p.age<.4||p.age>.5||p.breastSize<.9||p.top!=='none'||p.bottom!=='none'||p.underwear!==false)throw Error('Invalid neutral adult build parameters');
          if(p.hair!=='long01')throw Error('Wrong hair mesh');
          console.log('Bust slider',p.breastSize,'hair metadata',p.hairColor,p.hairTint);
          NODE
      - name: Export new high-detail rigged character
        working-directory: /tmp/ara3dgen
        run: npm run export -- --params "$GITHUB_WORKSPACE/prototypes/gina4-20261102/Gina_4_Ara_V1_GoldenBlonde.params.json" --detail high --formats glb --out "$GITHUB_WORKSPACE/prototypes/gina4-20261102/out"
      - name: Paint actual Hair mesh texture golden blonde & verify rig
        shell: bash
        run: |
          set -euo pipefail
          BASE=prototypes/gina4-20261102
          MODEL=$(find "$BASE/out" -name '*.glb' -type f | head -n 1)
          test -n "$MODEL"
          python "$BASE/recolor_glb_hair.py" "$MODEL" "$BASE/Gina_4_Ara_V1_GoldenBlonde.glb" "$BASE/Gina_4_Ara_V1_GoldenBlonde_QA.json"
          test -s "$BASE/Gina_4_Ara_V1_GoldenBlonde.glb"
          python - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path('prototypes/gina4-20261102/Gina_4_Ara_V1_GoldenBlonde_QA.json').read_text())
          assert r['animations']>=70 and r['skins']>=1 and r['morph_primitives']>=1
          assert r['forced_blonde_base_rgb']==[246,217,119]
          print('PASS: true golden-blonde material &',r['animations'],'animation clips preserved')
          PY
      - name: Save actual Gina 4 GLB on this feature branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Gator Character Preview'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototypes/gina4-20261102/Gina_4_Ara_V1_GoldenBlonde.glb prototypes/gina4-20261102/Gina_4_Ara_V1_GoldenBlonde_QA.json
          git commit -m 'Save actual Gina 4 blonde model + material QA [skip ci]'
          git pull --rebase origin feature/gina4-golden-blonde-20261102
          git push origin HEAD:feature/gina4-golden-blonde-20261102
      - name: Back up Gina 4 3D review
        uses: actions/upload-artifact@v4
        with:
          name: Gina_4_GoldenBlonde_Review
          path: |
            prototypes/gina4-20261102/Gina_4_Ara_V1_GoldenBlonde.glb
            prototypes/gina4-20261102/Gina_4_Ara_V1_GoldenBlonde_QA.json
            prototypes/gina4-20261102/Gina_4_Ara_V1_GoldenBlonde.params.json
            prototypes/gina4-20261102/viewer.html
          retention-days: 30
