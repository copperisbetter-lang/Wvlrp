name: Convert uploaded Blender character
on:
  push:
    branches: [infrastructure/public-blender-runtime-20261124]
    paths: [.github/workflows/public-character-convert.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SOURCE_NAME: 3dexport_blender_file_1732195031.zip
    steps:
      - uses: actions/checkout@v4
      - name: Obtain exact public source archive
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 240 "https://github.com/copperisbetter-lang/Wvlrp/releases/download/Vlender-asseys/$SOURCE_NAME" -o "$RUNNER_TEMP/source.zip"
          echo "40b8111b76c9107ad456a8dc9db908a2ee7ab4840fe111e52f432478c49b9518  $RUNNER_TEMP/source.zip" | sha256sum -c -
      - name: Install tested Blender
        run: |
          set -euo pipefail
          curl -fL --retry 2 --max-time 180 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          mkdir "$RUNNER_TEMP/blender"
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" --strip-components=1 -C "$RUNNER_TEMP/blender"
      - name: Extract and convert actual source
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/source"
          python - "$RUNNER_TEMP/source.zip" "$RUNNER_TEMP/source" <<'PY'
          import pathlib,sys,zipfile
          root=pathlib.Path(sys.argv[2]).resolve()
          with zipfile.ZipFile(sys.argv[1]) as z:
              for i in z.infolist():
                  p=(root/i.filename).resolve()
                  if not p.is_relative_to(root): raise ValueError("Unsafe archive path")
              z.extractall(root)
          PY
          mapfile -d '' models < <(find "$RUNNER_TEMP/source" -type f -iname '*.blend' -print0)
          if [ "${#models[@]}" -ne 1 ]; then echo "Expected one actual blend file"; exit 1; fi
          export OUT_GLB="$GITHUB_WORKSPACE/runtime-viewers/character/character.glb"
          cat > "$RUNNER_TEMP/export_character.py" <<'PY'
          import bpy, os, pathlib, struct, json
          p=pathlib.Path(os.environ["OUT_GLB"])
          assert any(o.type=="MESH" and len(o.data.polygons)>0 for o in bpy.context.scene.objects)
          def export():
              bpy.ops.export_scene.gltf(filepath=str(p),export_format="GLB")
              assert p.stat().st_size>100 and p.read_bytes()[:4]==b"glTF"
              print("GLB_EXPORT_PASS",p.stat().st_size,flush=True)
          for cap in (2048,1024,512):
              for im in bpy.data.images:
                  w,h=im.size
                  if min(w,h)>0 and max(w,h)>cap:
                      scale=cap/max(w,h)
                      try:
                          im.scale(max(1,round(w*scale)),max(1,round(h*scale)))
                          im.pack()
                          print("PREVIEW_TEXTURE",im.name,w,h,tuple(im.size),flush=True)
                      except Exception as e:
                          print("IMAGE_SCALE_WARNING",im.name,str(e),flush=True)
              export()
              if p.stat().st_size<95000000: break
          assert p.stat().st_size<100000000, "Preview exceeds git file limit even after resizing textures"
          with p.open("rb") as fp:
              header=fp.read(12)
              n,t=struct.unpack("<II",fp.read(8))
              d=json.loads(fp.read(n))
          assert d.get("meshes") and d.get("scenes")
          print("PREVIEW_VALIDATED",p.stat().st_size,"meshes",len(d["meshes"]),"skins",len(d.get("skins",[])),"animations",len(d.get("animations",[])),flush=True)
          PY
          "$RUNNER_TEMP/blender/blender" -b --disable-autoexec "${models[0]}" --python-exit-code 1 --python "$RUNNER_TEMP/export_character.py"
          test -s "$OUT_GLB"
          test "$(stat -c%s "$OUT_GLB")" -lt 100000000
      - name: Publish separate GLB to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-viewers/character/character.glb
          git commit -m "Export actual uploaded character for automatic Pass 4 viewer"
          git push origin HEAD:infrastructure/public-blender-runtime-20261124
