name: Caroline adult avatar validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'world-creator/scripts/build_caroline_mpfb.py'
      - 'world-creator/scripts/validate_caroline_source.py'
      - '.github/workflows/build-caroline-mpfb.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block publication until builder and anatomical source validator exist
        run: |
          set -euo pipefail
          test -s world-creator/scripts/build_caroline_mpfb.py || { echo "::error::Missing Caroline source builder; no viewer publication permitted"; exit 1; }
          test -s world-creator/scripts/validate_caroline_source.py || { echo "::error::Missing Caroline anatomical mesh validator; no viewer publication permitted"; exit 1; }
      - name: Require independent source validation
        run: |
          set -euo pipefail
          python3 world-creator/scripts/validate_caroline_source.py
      - name: Confirm source and validation before any public export
        run: |
          echo "Source validator passed. Export and publication are deliberately NOT enabled until an actual Caroline builder, asset provenance, and clothed output QA are implemented."
