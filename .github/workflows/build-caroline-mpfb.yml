name: Build Caroline adult foundation
on:
  workflow_dispatch:
  push:
    paths:
      - 'world-creator/scripts/build_caroline_mpfb.py'
      - '.github/workflows/build-caroline-mpfb.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Set up Blender and MPFB
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libxkbcommon0 libxi6 libxxf86vm1 libxfixes3 libsm6 libice6 xvfb zip unzip
          curl -fL --retry 4 'https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz' -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
          git clone --quiet --depth 1 --branch v2.0.18 https://github.com/makehumancommunity/mpfb2.git /tmp/mpfb2
          (cd /tmp/mpfb2/src/mpfb && zip -qr /tmp/mpfb.zip .)
          mkdir -p /tmp/wvlrp_blender_ext
          /tmp/blender-4.2.0-linux-x64/blender --command extension repo-add wvlrp_local --name WVLRP --directory /tmp/wvlrp_blender_ext
          /tmp/blender-4.2.0-linux-x64/blender --command extension install-file -r wvlrp_local -e /tmp/mpfb.zip
          curl -fL --retry 4 'https://files2.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip' -o /tmp/mh-system.zip
      - name: Build Caroline foundation
        run: |
          set -euo pipefail
          xvfb-run -a /tmp/blender-4.2.0-linux-x64/blender --background --python world-creator/scripts/build_caroline_mpfb.py 2>&1 | tee /tmp/caroline.log
          grep WVLRP_CAROLINE_SOURCE_SUCCESS /tmp/caroline.log
      - name: Verify Caroline source for finish pass
        run: |
          set -euo pipefail
          test -s world-creator/assets/caroline-source-validation.blend
          echo "Caroline finished model pass is unblocked; source foundation verified."
      - name: Save private build artifact
        uses: actions/upload-artifact@v4
        with:
          name: caroline-adult-foundation
          path: world-creator/assets/caroline-source-validation.blend
          retention-days: 7
