name: Brooke v8 isolated repair build
on:
  push:
    branches: [brooke-reference-refine8]
    paths:
      - 'world-creator/tools/build_brooke_v8.py'
      - '.github/workflows/brooke-v8-build.yml'
  workflow_dispatch:
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pygltflib
      - name: Build and validate isolated mouth geometry candidate
        run: python world-creator/tools/build_brooke_v8.py
      - name: Upload repair report and candidate for inspection
        uses: actions/upload-artifact@v4
        with:
          name: brooke-v8-repair-candidate
          path: |
            brooke-v8-repair-report.json
            world-creator/assets/brooke-mouth-repair8.glb
      - name: Commit isolated candidate only after checks pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add world-creator/assets/brooke-mouth-repair8.glb
          git diff --cached --quiet || (git commit -m 'Build isolated Brooke v8 repaired mouth candidate' && git push)
