name: Build Laura native MPFB head

on:
  push:
    paths:
      - world-creator/scripts/build_laura_native_mpfb.py
      - .github/workflows/build-laura-native-mpfb.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: laura-native-mpfb
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'copperisbetter-lang/Wvlrp'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore shared character builder tools and assets
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blender-4.2.0-linux-x64
            /tmp/mpfb2
            /tmp/mh-system.zip
            /tmp/mh-faceunits.zip
          key: wvlrp-character-tools-blender420-mpfb2018-assets-v1
      - name: Set up Blender 4.2 and dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libxkbcommon0 libxi6 libxxf86vm1 libxfixes3 libsm6 libice6 xvfb zip unzip
          if [ ! -x /tmp/blender-4.2.0-linux-x64/blender ]; then
            curl -fL --retry 4 --connect-timeout 30 --speed-time 120 --speed-limit 1024 'https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz' -o /tmp/blender.tar.xz
            tar -xf /tmp/blender.tar.xz -C /tmp/
          fi
          /tmp/blender-4.2.0-linux-x64/blender --background --version | head -n 4
      - name: Install official MPFB 2.0.18 extension
        run: |
          set -euo pipefail
          if [ ! -d /tmp/mpfb2/src/mpfb ]; then
            git clone --quiet --depth 1 --branch v2.0.18 https://github.com/makehumancommunity/mpfb2.git /tmp/mpfb2
          fi
          ( cd /tmp/mpfb2/src/mpfb && zip -qr /tmp/wvlrp-mpfb-ext.zip . )
          mkdir -p /tmp/wvlrp_blender_ext
          /tmp/blender-4.2.0-linux-x64/blender --command extension repo-add wvlrp_local --name WVLRP --directory /tmp/wvlrp_blender_ext
          /tmp/blender-4.2.0-linux-x64/blender --command extension install-file -r wvlrp_local -e /tmp/wvlrp-mpfb-ext.zip
          /tmp/blender-4.2.0-linux-x64/blender --command extension list
      - name: Download official CC0 MakeHuman system assets
        run: |
          set -euo pipefail
          if [ ! -s /tmp/mh-system.zip ]; then
            curl -fL --retry 4 --connect-timeout 30 --speed-time 120 --speed-limit 1024 'https://files2.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip' -o /tmp/mh-system.zip
          fi
          unzip -t /tmp/mh-system.zip | tail -n 2
          # CC0 ARKit facial shape keys: Sha's real mouth-corner smile.
          if [ ! -s /tmp/mh-faceunits.zip ]; then
            curl -fL --retry 4 --connect-timeout 30 --speed-time 120 --speed-limit 1024 'https://files2.makehumancommunity.org/functional/faceunits01.zip' -o /tmp/mh-faceunits.zip
          fi
          unzip -t /tmp/mh-faceunits.zip | tail -n 2
      - name: Generate native MPFB Laura head
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x1024x24" /tmp/blender-4.2.0-linux-x64/blender --background --python-exit-code 1 --python world-creator/scripts/build_laura_native_mpfb.py 2>&1 | tee /tmp/laura-native-build.log
          grep LAURA_NATIVE_MPFB_SUCCESS /tmp/laura-native-build.log
          test -s world-creator/assets/laura-head-combined.glb
      - name: Publish verified Laura head only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add world-creator/assets/laura-head-combined.glb
          git diff --cached --quiet || (git commit -m "Publish Laura native MPFB head" && git pull --rebase origin main && git push origin HEAD:main)
      - name: Upload diagnostic build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laura-native-mpfb-diagnostics
          path: /tmp/laura-native-build.log
          if-no-files-found: ignore
