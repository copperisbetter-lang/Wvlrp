name: Build Gator Game Ready APK
on:
  workflow_dispatch:
  push:
    branches: [gator/game-ready-android-app-20261029]
    paths:
      - 'tools/GatorGameReady/**'
      - '.github/workflows/build-game-ready.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/GatorGameReady
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android 35 with runner SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GatorGameReady-debug-APK
          path: tools/GatorGameReady/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
