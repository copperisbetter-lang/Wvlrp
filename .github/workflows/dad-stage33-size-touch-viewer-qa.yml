name: Dad Stage33 original head visible and full G9 body viewer QA
on:
  push:
    branches:
      - feature/dad-stage33-head-visible-touch-20261116
    paths:
      - 'dad-stage24-viewer/stage33-head-body-size-touch-viewer.html'
      - '.github/workflows/dad-stage33-size-touch-viewer-qa.yml'
  workflow_dispatch:
jobs:
  public-only-head-body-control-qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            dad-stage24-viewer/stage33-head-body-size-touch-viewer.html
            dad-stage24-viewer/stage26-two-piece-fit.js
            dad-stage24-viewer/stage28-recover-original-g9-neck.js
            dad-stage24-viewer/stage31-neck-guard-fixture.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check viewer syntax and verify owner touch controls and default visibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          page=Path('dad-stage24-viewer/stage33-head-body-size-touch-viewer.html').read_text()
          for x in [
            'fit=prepareTwoPieceFit(gltf,THREE,raw);',
            'fit.headPivot.position.x+=.62;',
            'fit.defaults.head.position=fit.headPivot.position.toArray();',
            'setHeadVisible(true); // Owner requested',
            'setHeadVisible(true);cameraPreset(\'full\')',
            'setHeadVisible(true);updateReadout();say(\'Saved head/body coordinates',
            'function setHeadVisible(on){if(!fit)return;fit.headPivot.visible=on;',
            'id="head-toggle" class="active"',
            'data-mode="move-head"','data-mode="rotate-head"',
            'data-mode="move-body"','data-mode="rotate-body"',
            'data-mode="orbit"',
            'data-mode="size-head"','data-mode="size-body"',
            'function touchSize(target,dy,isFine)',
            "mode.startsWith('size')",
            'id="head-smaller"','id="head-larger"','id="body-smaller"','id="body-larger"',
            'id="head-back"','id="head-front"','id="body-back"','id="body-front"',
            'id="fine"','id="front"','id="right"','id="back"','id="left"','id="full"',
            'id="head-coords"','id="body-coords"',
            'id="copy-fit"','id="save-fit"','id="load-fit"','id="reset-parts"',
            'window.__DAD_STAGE33_READY=true;',
          ]:
            assert x in page, f'Missing required UI/behavior: {x}'
          assert 'headInitiallyOffset' not in page
          match=re.search(r'<script type="module">([\s\S]*?)</script>',page)
          assert match,'Missing live viewer JS module'
          Path('/tmp/stage33-viewer.mjs').write_text(match.group(1))
          print('PASS: Dad head visible by default; complete independent user controls, reset and restore retained.')
          PY
          node --check /tmp/stage33-viewer.mjs
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const html=readFileSync('dad-stage24-viewer/stage33-head-body-size-touch-viewer.html','utf8');
          const code=html.match(/function touchSize\(target,dy,isFine\)\{[^}]*\}/)?.[0];
          assert(code,'touchSize implementation must exist');
          const sizeFn=new Function('target','dy','isFine','clamp',code+'; touchSize(target,dy,isFine);');
          const clamp=(v,lo,hi)=>Math.min(hi,Math.max(lo,v));
          const mk=()=>({scale:{x:1,setScalar(v){this.x=v;}}});
          const head=mk(),body=mk();
          sizeFn(head,-100,false,clamp);
          assert(head.scale.x>1,'Dragging upwards enlarges selected head');
          assert.equal(body.scale.x,1,'Changing head leaves body unchanged');
          const large=head.scale.x;
          sizeFn(head,100,false,clamp);
          assert(head.scale.x<large,'Dragging downwards reduces selected head');
          sizeFn(body,-100,true,clamp);
          assert(body.scale.x>1,'Size Body independently changes only body');
          assert(Math.abs(head.scale.x-1)<1e-9,'Changing body leaves head unchanged');
          sizeFn(body,-30000,false,clamp);
          assert.equal(body.scale.x,2.5,'Upper size bound enforced');
          sizeFn(body,30000,false,clamp);
          assert.equal(body.scale.x,0.3,'Lower size bound enforced');
          console.log('PASS: touch sizing independent, correct drag directions, fine mode and safe min/max.');
          JS
          node --check dad-stage24-viewer/stage26-two-piece-fit.js
          node --check dad-stage24-viewer/stage28-recover-original-g9-neck.js
          node dad-stage24-viewer/stage31-neck-guard-fixture.mjs
      - name: Verify exact external Stage33 page and JS modules served
        run: |
          URL="https://raw.githack.com/copperisbetter-lang/Wvlrp/${GITHUB_SHA}/dad-stage24-viewer"
          curl --retry 3 --retry-delay 2 -fsSL "$URL/stage33-head-body-size-touch-viewer.html" -o /tmp/stage33-hosted.html
          grep -q 'Stage33' /tmp/stage33-hosted.html
          grep -q 'setHeadVisible(true)' /tmp/stage33-hosted.html
          grep -q 'data-mode="size-head"' /tmp/stage33-hosted.html
          grep -q 'data-mode="size-body"' /tmp/stage33-hosted.html
          curl --retry 3 --retry-delay 2 -fsSL "$URL/stage26-two-piece-fit.js" -o /tmp/stage33-fit.js
          curl --retry 3 --retry-delay 2 -fsSL "$URL/stage28-recover-original-g9-neck.js" -o /tmp/stage33-native-neck.js
          grep -q 'prepareTwoPieceFit' /tmp/stage33-fit.js
          grep -q 'originalFaceCount\*2' /tmp/stage33-native-neck.js
          echo "PASS: Stage33 hosted page and original G9 fitter/cutter accessible over HTTPS."
