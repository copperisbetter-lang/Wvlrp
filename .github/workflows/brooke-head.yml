name: Brooke Head Prototype
on:
  workflow_dispatch:
  push:
    paths:
      - 'avatar-work/brooke/**'
      - '.github/workflows/brooke-head.yml'
jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version
      - name: Build Brooke head GLB
        run: blender -b --python avatar-work/brooke/build_head.py
      - name: Validate exported head
        run: blender -b --python avatar-work/brooke/validate_build.py -- avatar-work/brooke/brooke-head-prototype.glb
      - name: Render preview PNG
        run: blender -b --python avatar-work/brooke/render_preview.py
      - name: Upload model and preview
        uses: actions/upload-artifact@v4
        with:
          name: brooke-head-prototype
          path: |
            avatar-work/brooke/brooke-head-prototype.glb
            avatar-work/brooke/brooke-preview.png
          if-no-files-found: error
