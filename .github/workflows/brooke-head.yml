name: Brooke Head Prototype
on:
  workflow_dispatch:
  push:
    paths:
      - 'avatar-work/brooke/**'
      - '.github/workflows/brooke-head.yml'
permissions:
  contents: write
jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=45 update
          timeout 900s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=45 install -y blender python3-numpy libegl1 libgl1 libgles2 libopengl0 libx11-6 libxext6 libxrender1 libxi6 libxkbcommon0 libsm6 libice6
          blender --version
          blender -b --python-exit-code 1 --python-expr "import numpy; print('NumPy available:', numpy.__version__)"
      - name: Build Brooke head GLB
        run: blender -b --python-exit-code 1 --python avatar-work/brooke/build_head.py
      - name: Validate exported head
        run: blender -b --python-exit-code 1 --python avatar-work/brooke/validate_build.py -- avatar-work/brooke/brooke-head-prototype.glb
      - name: Render preview PNG
        run: blender -b --python-exit-code 1 --python avatar-work/brooke/render_preview.py
      - name: Verify generated GLB and PNG files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          glb=Path('avatar-work/brooke/brooke-head-prototype.glb')
          png=Path('avatar-work/brooke/brooke-preview.png')
          assert glb.is_file() and glb.stat().st_size>1024, 'Missing or empty GLB'
          raw=glb.read_bytes()
          assert raw[:4]==b'glTF', 'Invalid GLB magic'
          assert struct.unpack_from('<I',raw,8)[0]==len(raw), 'GLB byte length mismatch'
          assert png.is_file() and png.stat().st_size>1024, 'Missing or empty preview'
          assert png.read_bytes()[:8]==bytes.fromhex('89504e470d0a1a0a'), 'Invalid PNG signature'
          print('PASS: GLB and PNG generated with valid headers and nonzero sizes')
          PY
      - name: Upload model and preview
        uses: actions/upload-artifact@v4
        with:
          name: brooke-head-prototype
          path: |
            avatar-work/brooke/brooke-head-prototype.glb
            avatar-work/brooke/brooke-preview.png
          if-no-files-found: error
      - name: Publish verified Brooke model for 3D viewer
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p public-models
          cp avatar-work/brooke/brooke-head-prototype.glb public-models/brooke-head.glb
          cp avatar-work/brooke/brooke-preview.png public-models/brooke-preview.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-models/brooke-head.glb public-models/brooke-preview.png
          git commit -m "Publish verified Brooke viewer model [skip ci]" || exit 0
          git push
