name: Laura 2 - repair forehead vertex colors
on:
  push:
    branches: [main]
    paths:
      - 'world-creator/scripts/repair_laura2_forehead.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch Laura 2 vertex colors (leave approved original unchanged)
        run: python3 world-creator/scripts/repair_laura2_forehead.py
      - name: Commit tested working-model patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-creator/assets/laura-2-face/face.part*.b64 world-creator/LAURA_2_FOREHEAD_CLEANUP_2026-10-21.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Clean Laura 2 forehead hair artifact in real GLB vertex colors"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 3
          done
          echo "Could not push after retries" >&2
          exit 1
