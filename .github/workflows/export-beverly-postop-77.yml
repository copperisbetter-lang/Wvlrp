name: Export Beverly postoperative 77 animation viewer model

on:
  push:
    branches: [feature/beverly-surgery-room-20261104]
    paths:
      - .github/workflows/export-beverly-postop-77.yml
      - prototypes/beverly-surgery/export_postop_77.py
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  export-viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout export script
        uses: actions/checkout@v4
        with:
          ref: feature/beverly-surgery-room-20261104
          filter: blob:none
          sparse-checkout: |
            prototypes/beverly-surgery
          persist-credentials: false

      - name: Restore previously verified Beverly 69-joint surgery clone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/beverly-postop
          gh run download 41750701862 -R copperisbetter-lang/Wvlrp \
            -n Beverly-TestBone1-Graft-Trial-PRIVATE -D /tmp/beverly-postop
          test -s /tmp/beverly-postop/Beverly_TestBone1_GRAFT_TRIAL.blend
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/beverly-postop/Beverly_TestBone1_GRAFT_QA.json').read_text())
          assert d['clone_69_joint_skeleton']==69
          assert d['beverly_mesh_count']==31
          assert d['max_evaluated_rest_pose_position_change_m']<0.001
          print('CERTIFIED_GRAFT_RESTORED')
          PY

      - uses: actions/cache/restore@v4
        with:
          key: wvlrp-character-tools-blender420-mpfb2018-assets-v1
          path: /tmp/blender-4.2.0-linux-x64

      - name: Ensure Blender
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libxkbcommon0 libxi6 libxxf86vm1 libxfixes3 libsm6 libice6 xvfb
          if [ ! -x /tmp/blender-4.2.0-linux-x64/blender ]; then
            curl -fL --retry 4 https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz -o /tmp/blender-surgery.tar.xz
            tar -xf /tmp/blender-surgery.tar.xz -C /tmp
          fi
          /tmp/blender-4.2.0-linux-x64/blender --version | head -3

      - name: Generate Beverly-only rigged GLB with all 77 motion clips
        env:
          SURGERY_OUT: /tmp/beverly-postop
        run: |
          set -euo pipefail
          xvfb-run -a /tmp/blender-4.2.0-linux-x64/blender --background \
            --factory-startup --python prototypes/beverly-surgery/export_postop_77.py \
            2>&1 | tee /tmp/beverly-export.log
          grep -F BEVERLY_77_EXPORT_QA_PASS /tmp/beverly-export.log
          test -s /tmp/beverly-postop/Beverly_Postop_77.glb
          test -s /tmp/beverly-postop/Beverly_Postop_77_QA.json

      - name: Save validated GLB and motion catalog for publishing
        uses: actions/upload-artifact@v4
        with:
          name: Beverly-Postop-77-Verified-Viewer-GLB
          path: |
            /tmp/beverly-postop/Beverly_Postop_77.glb
            /tmp/beverly-postop/Beverly_Postop_77_QA.json
          if-no-files-found: error
          retention-days: 21
