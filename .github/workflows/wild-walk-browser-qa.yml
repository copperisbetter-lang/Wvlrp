name: First-Person Wild Browser QA
on:
  push:
    paths:
      - "world-creator/walk.js"
      - "world-creator/walk.html"
      - "world-creator/wild-material-yard.js"
      - "world-creator/wild-modular-cabin-kit.js"
      - "world-creator/wild-nature.js"
      - "world-creator/wild-landscape-renderer.js"
      - "world-creator/wild-reference-layout.js"
      - "world-creator/wild-mountain-backdrop.js"
      - "world-creator/wild-visible-mountain-stage.js"
      - "world-creator/tests/wild-village-layout.test.mjs"
      - "world-creator/tests/wild-browser-smoke.mjs"
      - ".github/workflows/wild-walk-browser-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium smoke test runtime
        run: npm install --no-save --ignore-scripts playwright-core@1.57.0
        working-directory: world-creator
      - name: Serve World Creator locally
        run: |
          cd world-creator
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/wild-serve.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8765/walk.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wild-serve.log
          exit 1
      - name: Test first-person WebGL walk and touchscreen joystick
        run: node tests/wild-browser-smoke.mjs
        working-directory: world-creator
      - name: Save visual test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wild-first-step-mobile-visual-qa
          path: |
            world-creator/wild-walk-qa.png
            world-creator/wild-village-qa.png
            world-creator/wild-photo-ranger-qa.png
            world-creator/wild-photo-ranger-directlink-qa.png
            world-creator/wild-materials-qa.png
          if-no-files-found: ignore
