name: FaceFit test - package official MPFB extension
on:
  push:
    branches:
      - feature/facefit-mpfb-installer-20261104
    paths:
      - .github/workflows/facefit-package-mpfb.yml
      - .github/workflows/facefit-package-dependencies.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-mpfb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get official MPFB v2.0.18 source
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch v2.0.18 https://github.com/makehumancommunity/mpfb2.git /tmp/facefit-mpfb-src
          test -f /tmp/facefit-mpfb-src/src/mpfb/blender_manifest.toml
          grep -E '^(id|version)\s*=' /tmp/facefit-mpfb-src/src/mpfb/blender_manifest.toml
      - name: Package Blender extension and verify archive
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/facefit-mpfb-src/src/mpfb && zip -qr "$GITHUB_WORKSPACE/mpfb-v2.0.18-official.zip" .)
          test -s mpfb-v2.0.18-official.zip
          unzip -tq mpfb-v2.0.18-official.zip
          unzip -Z1 mpfb-v2.0.18-official.zip | grep -qx 'blender_manifest.toml'
          sha256sum mpfb-v2.0.18-official.zip | tee MPFB_PACKAGE_SHA256.txt
          du -h mpfb-v2.0.18-official.zip
      - name: Save installer package (temporary, isolated)
        uses: actions/upload-artifact@v4
        with:
          name: MPFB-v2.0.18-official-zip
          path: |
            mpfb-v2.0.18-official.zip
            MPFB_PACKAGE_SHA256.txt
          retention-days: 7

  package-facefit-python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Prepare Python 3.13 for local ChatGPT runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch FaceFit source, validated MediaPipe wheels and face model
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          mkdir -p bundle/wheels bundle/models
          git clone --depth 1 https://github.com/VGCLUB/facefit-mpfb.git /tmp/facefit-upstream
          (cd /tmp/facefit-upstream && git rev-parse HEAD) | tee bundle/facefit-upstream-commit.txt
          tar -czf bundle/facefit-source.tar.gz -C /tmp/facefit-upstream .
          python -m pip download --only-binary=:all: -d bundle/wheels \
            'mediapipe==0.10.35' 'mcp>=1.2,<2' 'numpy' 'scipy' 'pillow' \
            'opencv-python-headless' 'onnxruntime'
          curl --fail --location --retry 3 --connect-timeout 30 \
            'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task' \
            -o bundle/models/face_landmarker.task
          test -s bundle/models/face_landmarker.task
          python - <<'PY'
          import hashlib, pathlib
          with open('bundle/SHA256SUMS','w') as f:
              for p in sorted(pathlib.Path('bundle').rglob('*')):
                  if p.is_file() and p.name != 'SHA256SUMS':
                      f.write(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to("bundle")}\n')
          print('WHEELS',len(list(pathlib.Path('bundle/wheels').glob('*.whl'))))
          print('MODEL_BYTES',pathlib.Path('bundle/models/face_landmarker.task').stat().st_size)
          PY
          du -sh bundle
      - name: Save temporary FaceFit dependency artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaceFit-Python313-wheelhouse-source-face-landmarker
          path: bundle/
          retention-days: 7
          compression-level: 6
