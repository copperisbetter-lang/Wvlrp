name: Build Sav 3 private adult inspection GLB
on:
  push:
    paths:
      - .github/workflows/build-sav3.yml
      - world-creator/scripts/build_sav3.py
      - world-creator/scripts/build_vulva2_female18.py
      - world-creator/scripts/vulva2_clean_hair.py
      - world-creator/scripts/face_materials.py
      - world-creator/scripts/vulva2_preview_animations.py
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build-sav3.yml
      - world-creator/scripts/build_sav3.py
      - world-creator/scripts/build_vulva2_female18.py
      - world-creator/scripts/vulva2_clean_hair.py
      - world-creator/scripts/face_materials.py
      - world-creator/scripts/vulva2_preview_animations.py
permissions:
  contents: write
concurrency:
  group: build-sav3
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'copperisbetter-lang/Wvlrp'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/cache@v4
        with:
          path: |
            /tmp/blender-4.2.0-linux-x64
            /tmp/mpfb2
            /tmp/mh-system.zip
          key: wvlrp-character-tools-blender420-mpfb2018-assets-v1
      - name: Prepare Blender and MakeHuman
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libxkbcommon0 libxi6 libxxf86vm1 libxfixes3 libsm6 libice6 xvfb zip unzip
          if [ ! -x /tmp/blender-4.2.0-linux-x64/blender ]; then
            curl -fL --retry 4 'https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz' -o /tmp/blender.tar.xz
            tar -xf /tmp/blender.tar.xz -C /tmp
          fi
          if [ ! -d /tmp/mpfb2/src/mpfb ]; then
            git clone --quiet --depth 1 --branch v2.0.18 https://github.com/makehumancommunity/mpfb2.git /tmp/mpfb2
          fi
          (cd /tmp/mpfb2/src/mpfb && zip -qr /tmp/mpfb.zip .)
          mkdir -p /tmp/wvlrp_sav3_ext
          /tmp/blender-4.2.0-linux-x64/blender --command extension repo-add wvlrp_local --name WVLRP --directory /tmp/wvlrp_sav3_ext
          /tmp/blender-4.2.0-linux-x64/blender --command extension install-file -r wvlrp_local -e /tmp/mpfb.zip
          if [ ! -s /tmp/mh-system.zip ]; then
            curl -fL --retry 4 'https://files2.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip' -o /tmp/mh-system.zip
          fi
          unzip -tq /tmp/mh-system.zip >/dev/null
      - name: Build and validate Sav 3
        run: |
          set -euo pipefail
          python3 -m py_compile world-creator/scripts/build_sav3.py world-creator/scripts/build_vulva2_female18.py world-creator/scripts/vulva2_preview_animations.py
          xvfb-run -a /tmp/blender-4.2.0-linux-x64/blender --background --python world-creator/scripts/build_sav3.py 2>&1 | tee /tmp/sav3-build.log
          python3 - <<'PY'
          from pathlib import Path
          log=Path("/tmp/sav3-build.log").read_text(errors="replace")
          markers=(
              "SAV3_VISIBLE_MESH_SANITY_PASS",
              "SAV3_NO_GARMENT_SHELL_VERIFIED",
              "VULVA2_TRUE_AUTOFIT_SUCCESS",
              "SAV3_56_JOINTS_VERIFIED",
              "SAV3_ADULT_BUILD_SUCCESS",
          )
          missing=[m for m in markers if m not in log]
          print("SAV3_BUILD_MARKER_REPORT", {m:m in log for m in markers}, flush=True)
          if missing:
              print("SAV3_BUILD_DIAGNOSTIC: missing", missing, flush=True)
              print("SAV3_BUILD_LOG_TAIL_BEGIN", flush=True)
              print("\\n".join(log.splitlines()[-90:]), flush=True)
              print("SAV3_BUILD_LOG_TAIL_END", flush=True)
              raise SystemExit(1)
          artifact=Path("world-creator/assets/sav3-adult-inspection.glb")
          if not artifact.is_file() or artifact.stat().st_size<500000:
              raise SystemExit("SAV3_BUILD_DIAGNOSTIC: GLB missing or too small")
          print("SAV3_BUILD_VALIDATED",artifact.stat().st_size,flush=True)
          PY
      - name: Save inspection GLB as private build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sav3-adult-inspection-glb
          path: world-creator/assets/sav3-adult-inspection.glb
          retention-days: 14
      - name: Save logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sav3-build-logs
          path: /tmp/sav3-build.log
          if-no-files-found: ignore
          retention-days: 14
