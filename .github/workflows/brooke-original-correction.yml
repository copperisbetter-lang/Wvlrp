name: Brooke original correction 1
on:
  push:
    branches: [brooke-original-refine-20261024]
    paths:
      - 'avatar-work/brooke/one-point-one/refine_original.py'
      - '.github/workflows/brooke-original-correction.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy pillow
      - name: Build isolated candidate and inspection images
        run: |
          python avatar-work/brooke/one-point-one/refine_original.py world-creator/assets/brooke-recovery-original.glb world-creator/assets/brooke-original-correction1.glb
          mkdir -p world-creator/brooke-original-correction1-review
          python avatar-work/brooke/one-point-one/render.py world-creator/assets/brooke-original-correction1.glb world-creator/brooke-original-correction1-review/front.png
          python avatar-work/brooke/one-point-one/render.py world-creator/assets/brooke-original-correction1.glb world-creator/brooke-original-correction1-review/profile.png 90
          python avatar-work/brooke/one-point-one/render.py world-creator/assets/brooke-original-correction1.glb world-creator/brooke-original-correction1-review/quarter.png 35
      - name: Save candidate to isolated review branch
        run: |
          git config user.name "Brooke build"
          git config user.email "brooke-build@users.noreply.github.com"
          git add world-creator/assets/brooke-original-correction1.glb world-creator/assets/brooke-original-correction1.json world-creator/brooke-original-correction1-review
          git commit -m "Build Brooke original correction 1 review candidate"
          git push origin HEAD:brooke-original-refine-20261024
