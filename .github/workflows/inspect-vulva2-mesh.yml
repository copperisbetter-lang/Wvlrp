name: Inspect unwanted Vulva2 mesh geometry
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/inspect-vulva2-mesh.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exported GLB nodes and primitive bounds
        run: |
          python3 - <<'PY'
          import json,struct,pathlib
          file=pathlib.Path('world-creator/assets/vulva2-female18-inspection.glb')
          raw=file.read_bytes()
          n,typ=struct.unpack_from('<II',raw,12)
          data=json.loads(raw[20:20+n])
          nodes=data.get('nodes',[]);meshes=data.get('meshes',[]);mats=data.get('materials',[]);acc=data.get('accessors',[])
          print('VULVA2_BINARY_BYTES',len(raw),'NODES',len(nodes),'MESHES',len(meshes),'MATERIALS',len(mats))
          for i,m in enumerate(mats): print('MATERIAL',i,repr(m.get('name')))
          for i,node in enumerate(nodes):
            if 'mesh' not in node:continue
            mesh=meshes[node['mesh']]
            print('MESH_NODE',i,repr(node.get('name')),'MESH',node['mesh'],repr(mesh.get('name')),
                  'SCALE',node.get('scale'),'TRANSLATION',node.get('translation'),'SKIN',node.get('skin'))
            for k,prim in enumerate(mesh.get('primitives',[])):
              a=acc[prim['attributes']['POSITION']]
              mat=prim.get('material',-1)
              print('  PRIMITIVE',k,'VERTICES',a['count'],'BOUNDS',a.get('min'),a.get('max'),
                    'MATERIAL',mat,repr(mats[mat].get('name')) if mat>=0 else None)
          # Sample vertex distributions around the original body's central pelvis.
          import collections
          offset=12
          binchunk=None
          while offset+8<=len(raw):
            length,kind=struct.unpack_from('<II',raw,offset);offset+=8
            if kind==0x004E4942:binchunk=memoryview(raw)[offset:offset+length];break
            offset+=length
          if binchunk is None:raise RuntimeError('Missing GLB binary buffer')
          node=next(n for n in nodes if n.get('name','').startswith('Vulva2 Test Adult Female 18_vulva2_adult18'))
          prim=meshes[node['mesh']]['primitives'][0]
          accessor=acc[prim['attributes']['POSITION']]
          view=data['bufferViews'][accessor['bufferView']]
          beg=view.get('byteOffset',0)+accessor.get('byteOffset',0)
          stride=view.get('byteStride',12)
          verts=[struct.unpack_from('<fff',binchunk,beg+i*stride) for i in range(accessor['count'])]
          print('VULVA2_BODY_CROTCH_REGION_SUMMARY')
          for lo,hi in [(.60,.66),(.66,.72),(.72,.78),(.78,.84),(.84,.90),(.90,.96),(.96,1.02)]:
            for w in [.05,.10,.16]:
              pts=[(x,y,z) for x,y,z in verts if lo<=y<hi and abs(x)<w]
              if not pts:continue
              points=sorted(pts,key=lambda p:p[2])
              print('HEIGHT',lo,hi,'HALFWIDTH',w,'COUNT',len(pts),
                    'MAX_FORWARD_Z',round(points[-1][2],4),
                    'Z_PERCENTILE_95',round(points[int(.95*(len(points)-1))][2],4),
                    'MAX_BACK_Z',round(points[0][2],4),
                    'FURTHEST_FORWARD_POINTS',[[round(q,4) for q in p] for p in points[-3:]])
          # Connected-component audit of body geometry, including embedded extra parts.
          import collections
          idx_accessor=acc[prim['indices']]
          idx_view=data['bufferViews'][idx_accessor['bufferView']]
          idx_beg=idx_view.get('byteOffset',0)+idx_accessor.get('byteOffset',0)
          fmt={5121:'B',5123:'H',5125:'I'}[idx_accessor['componentType']]
          fmtlen=struct.calcsize('<'+fmt)
          ixstride=idx_view.get('byteStride',fmtlen)
          indices=[struct.unpack_from('<'+fmt,binchunk,idx_beg+i*ixstride)[0] for i in range(idx_accessor['count'])]
          print('BODY_TRIANGLES',len(indices)//3,'INDEX_RANGE',min(indices),max(indices))
          parent=list(range(len(verts)))
          def find(x):
            while parent[x]!=x:
              parent[x]=parent[parent[x]]
              x=parent[x]
            return x
          def union(a,b):
            a=find(a);b=find(b)
            if a!=b:parent[b]=a
          for j in range(0,len(indices),3):
            a,b,c=indices[j:j+3];union(a,b);union(b,c)
          groups=collections.defaultdict(list)
          for v in set(indices):groups[find(v)].append(v)
          for _,ids in sorted(groups.items(),key=lambda q:-len(q[1]))[:30]:
            points=[verts[i] for i in ids]
            mins=[min(p[i] for p in points) for i in range(3)]
            maxs=[max(p[i] for p in points) for i in range(3)]
            print('BODY_COMPONENT',len(ids),'BBOX',tuple(round(x,4) for x in mins),tuple(round(x,4) for x in maxs))
          print('BODY_COMPONENT_TOTAL',len(groups))
          PY
