name: Test Bone 1 first skeleton graft surgery

on:
  push:
    branches: [feature/beverly-surgery-room-20261104]
    paths:
      - .github/workflows/graft-beverly-test-bone-1.yml
      - prototypes/beverly-surgery/graft_donor_rig.py
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  surgery-graft-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated Graft Script ONLY
        uses: actions/checkout@v4
        with:
          ref: feature/beverly-surgery-room-20261104
          filter: blob:none
          sparse-checkout: |
            prototypes/beverly-surgery
          persist-credentials: false

      - name: Restore CERTIFIED surgery clone and donor from passed preparatory artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/beverly-surgery-room
          gh run download 41748964511 -R copperisbetter-lang/Wvlrp \
            -n Beverly-TestBone1-SurgeryRoom-WORKING -D /tmp/beverly-surgery-room
          test -s /tmp/beverly-surgery-room/Beverly_SURGERY_ROOM.blend
          test -s /tmp/beverly-surgery-room/Beverly_SURGERY_CLONE.glb
          test -s /tmp/beverly-surgery-room/Test_Bone_1_SOURCE_DONOR.glb
          sha256sum /tmp/beverly-surgery-room/Beverly_SURGERY_CLONE.glb
          grep -Fx 'fc55a17bb9c228ecc1a2a3f24ccd5e3a4ec26a987cb2ffe123ce00d12530a7fc  /tmp/beverly-surgery-room/Beverly_SURGERY_CLONE.glb' <(sha256sum /tmp/beverly-surgery-room/Beverly_SURGERY_CLONE.glb)

      - name: Restore verified Blender 4.2 tool cache
        uses: actions/cache/restore@v4
        with:
          key: wvlrp-character-tools-blender420-mpfb2018-assets-v1
          path: /tmp/blender-4.2.0-linux-x64

      - name: Prepare Blender headless runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libxkbcommon0 libxi6 libxxf86vm1 libxfixes3 libsm6 libice6 xvfb
          if [ ! -x /tmp/blender-4.2.0-linux-x64/blender ]; then
            curl -fL --retry 4 --connect-timeout 30 \
              https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz \
              -o /tmp/blender-surgery.tar.xz
            tar -xf /tmp/blender-surgery.tar.xz -C /tmp
          fi
          /tmp/blender-4.2.0-linux-x64/blender --version | head -3

      - name: Graft 69-donor skeleton compatibility onto protected clone and QA mesh
        env:
          SURGERY_OUT: /tmp/beverly-surgery-room
        run: |
          set -euo pipefail
          xvfb-run -a /tmp/blender-4.2.0-linux-x64/blender \
            --background --factory-startup --python \
            prototypes/beverly-surgery/graft_donor_rig.py 2>&1 | tee /tmp/graft-trial.log
          grep -F BEVERLY_GRAFT_TRIAL_QA_PASS /tmp/graft-trial.log
          test -s /tmp/beverly-surgery-room/Beverly_TestBone1_GRAFT_TRIAL.blend
          test -s /tmp/beverly-surgery-room/Beverly_TestBone1_GRAFT_QA.json
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('/tmp/beverly-surgery-room')
          j=json.loads((p/'Beverly_TestBone1_GRAFT_QA.json').read_text())
          assert j['clone_69_joint_skeleton']==69
          assert j['max_evaluated_rest_pose_position_change_m']<0.001
          assert j['beverly_mesh_count']==31
          assert hashlib.sha256((p/'Beverly_SURGERY_CLONE.glb').read_bytes()).hexdigest()=='fc55a17bb9c228ecc1a2a3f24ccd5e3a4ec26a987cb2ffe123ce00d12530a7fc'
          print('GRAFT_SURGERY_FINAL_PASS',j['clone_69_joint_skeleton'],
                j['max_evaluated_rest_pose_position_change_m'])
          PY

      - name: Preserve stage-one experimental graft without touching live Beverly
        uses: actions/upload-artifact@v4
        with:
          name: Beverly-TestBone1-Graft-Trial-PRIVATE
          path: |
            /tmp/beverly-surgery-room/Beverly_TestBone1_GRAFT_TRIAL.blend
            /tmp/beverly-surgery-room/Beverly_TestBone1_GRAFT_QA.json
          if-no-files-found: error
          retention-days: 21
