name: Gina 5 — isolated genuine-source audit (no model changes)
on:
  push:
    branches:
      - experiment/gina5-nondestructive-audit-20261121
    paths:
      - .github/workflows/gina5-nondestructive-audit.yml
      - experiments/gina5-autonomous/inspect_gina5.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  read-only-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch only the isolated experiment and original Gina 5 file
        uses: actions/checkout@v4
        with:
          ref: experiment/gina5-nondestructive-audit-20261121
          persist-credentials: true
          sparse-checkout: |
            prototypes/gina5-20261102/Gina_5_NATURAL_BLONDE_V3.glb
            experiments/gina5-autonomous
          sparse-checkout-cone-mode: false
      - name: Validate original real bytes and inspect glTF structure
        run: |
          python3 experiments/gina5-autonomous/inspect_gina5.py \
            prototypes/gina5-20261102/Gina_5_NATURAL_BLONDE_V3.glb \
            experiments/gina5-autonomous/qa/source_inspection.json
      - name: Save only a metadata report on the experimental branch
        run: |
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/gina5-autonomous/qa/source_inspection.json
          if ! git diff --cached --quiet; then
            git commit -m "Save inspected Gina5 source metadata on experimental branch [skip ci]"
            git push origin HEAD:experiment/gina5-nondestructive-audit-20261121
          fi
