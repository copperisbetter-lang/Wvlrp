name: QA Beverly full pose diagnostics, saved JSON and one-paste report
on:
  push:
    branches: [feature/beverly-surgery-room-20261104]
    paths:
      - .github/workflows/test-beverly-pose-diagnostics.yml
      - prototypes/beverly-surgery/test-pose-diagnostics.cjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/beverly-surgery-room-20261104
          filter: blob:none
          sparse-checkout: |
            prototypes/beverly-surgery/test-pose-diagnostics.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install actual mobile-size Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify all 69 joints, transition timeline, one-paste clipboard, downloaded JSON, and IndexedDB persistence
        run: node prototypes/beverly-surgery/test-pose-diagnostics.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Beverly-pose-diagnostics-mobile-preview
          path: /tmp/beverly-diagnostics-panel.png
          if-no-files-found: ignore
          retention-days: 7
