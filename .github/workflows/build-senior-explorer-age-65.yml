name: Build Senior Explorer Age 65 (56-bone rig)
on:
  workflow_dispatch:
  push:
    paths:
      - 'world-creator/scripts/build_senior_explorer_age_65.py'
      - '.github/workflows/build-senior-explorer-age-65.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Validate senior explorer generator exists
        run: |
          test -f world-creator/scripts/build_senior_explorer_age_65.py || { echo 'Senior explorer generator not implemented yet; build blocked.'; exit 1; }
      - name: Prevent false success before character pipeline is implemented
        run: |
          echo 'Senior explorer Blender pipeline, GLB validation and pose tests must be added before this workflow can pass.'
          exit 1
