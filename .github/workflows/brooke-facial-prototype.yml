name: Brooke Facial Prototype
on:
  push:
    paths:
      - 'tests/build_brooke_facial_prototype.py'
      - '.github/workflows/brooke-facial-prototype.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and NumPy
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y blender python3-numpy
      - name: Create independent facial prototype
        run: blender -b --python-exit-code 1 --python tests/build_brooke_facial_prototype.py
      - name: Upload experimental head
        uses: actions/upload-artifact@v4
        with:
          name: brooke-head-3-0-facial-prototype
          path: avatar-work/brooke/second-chance/brooke-head-3-0-facial-prototype.glb
          if-no-files-found: error

      - name: Publish prototype for inspection
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p public-models
          cp avatar-work/brooke/second-chance/brooke-head-3-0-facial-prototype.glb public-models/brooke-head-3-0-facial-prototype.glb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-models/brooke-head-3-0-facial-prototype.glb
          git commit -m "Publish Brooke prototype for review" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
