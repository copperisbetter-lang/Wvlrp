name: Birthday Girl Stage 4 facial refinement
on:
  push:
    branches: [feature/birthday-girl-18-mpfb-face-20261031]
    paths:
      - world-creator/scripts/build_birthday_girl_18_stage4.py
      - .github/workflows/birthday-girl-18-face-stage4.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified Stage 3 source
        uses: actions/download-artifact@v4
        with:
          name: birthday-girl-18-mpfb-face-stage3
          repository: copperisbetter-lang/Wvlrp
          run-id: 41225002227
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/birthday-stage3
      - name: Compile-check Stage 4 script before starting Blender
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          script=Path('world-creator/scripts/build_birthday_girl_18_stage4.py')
          ast.parse(script.read_text(), filename=str(script))
          print('STAGE4_PYTHON_SYNTAX_OK')
          PY
      - name: Preflight Stage 3 editable project and embedded textures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,struct
          root=Path('/tmp/birthday-stage3')
          blend=list(root.rglob('Birthday_Girl_18_EDITABLE_MPFB_STAGE3.blend'))
          glb=list(root.rglob('Birthday_Girl_18_STAGE3.glb'))
          assert len(blend)==1 and blend[0].stat().st_size>1000000
          assert len(glb)==1 and glb[0].stat().st_size>1000000
          b=glb[0].read_bytes()
          assert b[:4]==b'glTF'
          n=struct.unpack_from('<I',b,12)[0]
          j=json.loads(b[20:20+n])
          names=' '.join(i.get('name','').lower() for i in j['images'])
          for key in ('stage3_warm_skin','brown_eye','long01','eyebrow001','eyelashes01'):
              assert key in names, 'Missing embedded texture: '+key
          print('STAGE4_SOURCE_PREFLIGHT_OK')
          PY
      - uses: actions/cache@v4
        with:
          path: |
            /tmp/blender-4.2.0-linux-x64
            /tmp/mpfb2
            /tmp/mh-system.zip
          key: wvlrp-character-tools-blender420-mpfb2018-assets-v1
      - name: Set up Blender and MPFB
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libxkbcommon0 libxi6 libxxf86vm1 libxfixes3 libsm6 libice6 xvfb zip
          if [ ! -x /tmp/blender-4.2.0-linux-x64/blender ]; then
            curl -fL --retry 4 https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz -o /tmp/blender.tar.xz
            tar -xf /tmp/blender.tar.xz -C /tmp/
          fi
          if [ ! -d /tmp/mpfb2/src/mpfb ]; then
            git clone --quiet --depth 1 --branch v2.0.18 https://github.com/makehumancommunity/mpfb2.git /tmp/mpfb2
          fi
          (cd /tmp/mpfb2/src/mpfb && zip -qr /tmp/stage4-mpfb.zip .)
          mkdir -p /tmp/stage4-blender-ext
          /tmp/blender-4.2.0-linux-x64/blender --command extension repo-add wvlrp_local --name WVLRP --directory /tmp/stage4-blender-ext
          /tmp/blender-4.2.0-linux-x64/blender --command extension install-file -r wvlrp_local -e /tmp/stage4-mpfb.zip
          python3 - <<'PY'
          import zipfile,shutil
          from pathlib import Path
          root=Path.home()/'.config/blender/4.2/extensions/.user/wvlrp_local/mpfb/data'
          with zipfile.ZipFile('/tmp/mh-system.zip') as z:
              for info in z.infolist():
                  parts=Path(info.filename).parts
                  idx=next((i for i,p in enumerate(parts) if p in {'skins','hair','eyes','eyebrows','eyelashes','teeth'}),None)
                  if idx is None or info.is_dir():continue
                  rel=Path(*parts[idx:])
                  if '..' in rel.parts:continue
                  dst=root/rel
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  with z.open(info) as inp,dst.open('wb') as out:shutil.copyfileobj(inp,out)
          PY
      - name: Build isolated editable Stage 4
        run: |
          set -euo pipefail
          BIRTHDAY_STAGE3_DIR=/tmp/birthday-stage3 xvfb-run -a -s "-screen 0 1280x1024x24" /tmp/blender-4.2.0-linux-x64/blender --background --python world-creator/scripts/build_birthday_girl_18_stage4.py 2>&1 | tee /tmp/birthday-stage4.log
          grep BIRTHDAY_STAGE4_SUCCESS /tmp/birthday-stage4.log
      - name: Verify real 3D source, rig, and images
        run: |
          python3 - <<'PY'
          import json,struct
          from pathlib import Path
          p=Path('world-creator/assets/birthday-girl-18-face-stage4')
          assert (p/'Birthday_Girl_18_EDITABLE_MPFB_STAGE4.blend').stat().st_size>1000000
          b=(p/'Birthday_Girl_18_STAGE4.glb').read_bytes()
          assert b[:4]==b'glTF' and len(b)==struct.unpack_from('<I',b,8)[0]
          n=struct.unpack_from('<I',b,12)[0]
          j=json.loads(b[20:20+n])
          assert len(j.get('skins',[]))>=1 and len(j['skins'][0]['joints'])>=50
          names=' '.join(i.get('name','').lower() for i in j.get('images',[]))
          for key in ('eyebrow001','eyelashes01','brown_eye','long01','warm_skin'):assert key in names,key
          for side in ('front','left','right','threequarter'):assert (p/f'birthday_stage4_{side}.png').stat().st_size>20000
          report=json.loads((p/'birthday_stage4_report.json').read_text())
          assert report['earlier_stages_untouched'] and len(report['additional_adjustments'])>=30
          print('STAGE4_VERIFIED',len(b),len(j['skins'][0]['joints']))
          PY
      - name: Archive Stage 4 trial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: birthday-girl-18-mpfb-face-stage4
          path: |
            /tmp/birthday-stage4.log
            world-creator/assets/birthday-girl-18-face-stage4/
          retention-days: 7
          if-no-files-found: ignore
