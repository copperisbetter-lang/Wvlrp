name: WVLRP True Drone Forest Descent Sample
on:
  push:
    branches: [research/free-video-workflow]
    paths: ['.github/workflows/wvlrp-pixabay-descend-check.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download actual one-piece drone descent footage
        run: |
          python - <<'PY'
          import requests
          u='https://cdn.pixabay.com/video/2025/05/27/282000_large.mp4'
          r=requests.get(u,timeout=55,headers={'User-Agent':'Mozilla/5.0','Referer':'https://pixabay.com/'})
          print('HTTP',r.status_code,'MIME',r.headers.get('content-type'),'SIZE',len(r.content),flush=True)
          r.raise_for_status()
          if len(r.content)<100000:raise RuntimeError('Video not present')
          open('native_drone_descend.mp4','wb').write(r.content)
          PY
      - name: Upload original uninterrupted video
        uses: actions/upload-artifact@v4
        with:
          name: WVLRP-NATIVE-DRONE-DESCEND-SOURCE
          path: native_drone_descend.mp4
          retention-days: 4
