name: Publish Brooke 3D Viewer (full-site safe)
on:
  workflow_dispatch:
permissions:
  actions: write
jobs:
  delegate-to-full-site:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger complete WVLRP Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main
