name: Gina 5 actual pelvic central sagittal scan
on:
  push:
    branches: [feature/gina5-natural-blonde-v3-20261102]
    paths: ['.github/workflows/gina5-sagittal.yml', 'prototypes/gina5-20261102/sagittal_scan.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sagittal:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: feature/gina5-natural-blonde-v3-20261102
        sparse-checkout: |
          prototypes/gina5-20261102
    - name: Measure front-to-underbody body geometry
      run: python prototypes/gina5-20261102/sagittal_scan.py prototypes/gina5-20261102/Gina_5_PELVIS_PATCH.b85 prototypes/gina5-20261102/Gina_5_Pelvis_Sagittal_Scan.txt
    - name: Save measurement
      run: |
        git config user.name "Gator character diagnostics"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add prototypes/gina5-20261102/Gina_5_Pelvis_Sagittal_Scan.txt
        git commit -m "Save exact Gina5 pelvis sagittal geometry for private anatomical fit [skip ci]"
        git pull --rebase origin feature/gina5-natural-blonde-v3-20261102
        git push origin HEAD:feature/gina5-natural-blonde-v3-20261102
