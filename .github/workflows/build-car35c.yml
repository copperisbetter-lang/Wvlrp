name: Build CAR 3.5C Vulva2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - world-creator/scripts/build_car35c_vulva2.py
      - .github/workflows/build-car35c.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libxkbcommon0 libxi6 libxxf86vm1 libxfixes3 libsm6 libice6 xvfb
          curl -fL --retry 4 --retry-delay 5 https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Build CAR 3.5C
        run: xvfb-run -a /tmp/blender-4.2.0-linux-x64/blender -b --factory-startup --python world-creator/scripts/build_car35c_vulva2.py
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f world-creator/assets/car35c-vulva2-integrated.glb
          if ! git diff --cached --quiet; then
            git commit -m 'Publish CAR 3.5C Vulva2 test'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
