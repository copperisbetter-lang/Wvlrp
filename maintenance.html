<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07130d"><title>Maintenance | WVLRP</title><style>*{box-sizing:border-box}body{margin:0;background:#06110d;color:#fff;font-family:Arial,sans-serif}.top{padding:15px;border-bottom:1px solid #ffffff22;display:flex;justify-content:space-between}.top a{color:#fff;text-decoration:none;font-weight:900}.wrap{max-width:1100px;margin:auto;padding:24px 14px 80px}.card{background:#0a1912;border:1px solid #ffffff22;border-radius:16px;padding:16px;margin:12px 0}button{background:#183725;color:#fff;border:1px solid #ffffff30;border-radius:10px;padding:10px 14px;font-weight:900}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:8px;border-bottom:1px solid #ffffff18}.muted{color:#aebbb3}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{padding:12px;border-radius:12px;background:#ffffff09}.stat b{display:block;font-size:22px}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.scroll{overflow:auto}}</style></head><body><header class="top"><a href="index.html">← WVLRP</a><b>MAINTENANCE</b></header><main class="wrap"><h1>Maintenance</h1><p class="muted" id="msg">Checking administrator access…</p><section class="card"><h2>30-Day Activity</h2><div class="stats" id="stats"></div></section><section class="card"><h2>Members & Support</h2><div class="scroll"><table><thead><tr><th>User</th><th>Role</th><th>Level</th><th>Support</th><th>Status</th></tr></thead><tbody id="users"></tbody></table></div></section><section class="card"><h2>Top Pages</h2><div class="scroll"><table><thead><tr><th>Page</th><th>Opens</th><th>Visitors</th><th>Time</th></tr></thead><tbody id="pages"></tbody></table></div></section><section class="card"><h2>Video Views</h2><div class="scroll"><table><thead><tr><th>Video</th><th>Views</th><th>Watch Time</th></tr></thead><tbody id="videos"></tbody></table></div></section></main><script>(()=>{const API='https://wvlrp-chat-production.up.railway.app',token=localStorage.getItem('wvlrpChatToken')||'',msg=document.getElementById('msg');const fmt=s=>{s=Number(s)||0;return s<60?s+'s':s<3600?Math.round(s/60)+'m':(s/3600).toFixed(1)+'h'};async function get(p){const r=await fetch(API+p,{headers:{Authorization:'Bearer '+token}}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.detail||'Request failed');return j}async function start(){try{const [u,a]=await Promise.all([get('/api/admin/users'),get('/api/admin/analytics?days=30')]);msg.textContent='Administrator dashboard';const t=a.totals||{};document.getElementById('stats').innerHTML=[['Page opens',t.page_opens],['Visitors',t.unique_visitors],['Sessions',t.sessions],['Time on site',fmt(t.page_seconds)]].map(x=>'<div class="stat"><span>'+x[0]+'</span><b>'+String(x[1]??0)+'</b></div>').join('');document.getElementById('users').innerHTML=(u.users||[]).map(x=>'<tr><td>'+x.username+'</td><td>'+x.role+'</td><td>'+x.support_level+'</td><td>$'+((x.support_amount_cents||0)/100).toFixed(2)+'</td><td>'+(x.disabled?'Disabled':'Active')+'</td></tr>').join('');document.getElementById('pages').innerHTML=(a.pages||[]).map(x=>'<tr><td>'+x.path+'</td><td>'+x.opens+'</td><td>'+x.visitors+'</td><td>'+fmt(x.seconds)+'</td></tr>').join('');document.getElementById('videos').innerHTML=(a.videos||[]).map(x=>'<tr><td>'+x.video_key+'</td><td>'+x.views+'</td><td>'+fmt(x.watch_seconds)+'</td></tr>').join('')}catch(e){msg.textContent=e.message}}start()})();</script></body></html>
