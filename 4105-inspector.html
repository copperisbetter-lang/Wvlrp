<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>WVLRP | 4105 Model Inspector</title><style>body{margin:0;background:#101820;color:#f1f4f7;font:15px system-ui}header{padding:10px 14px;background:#203240}h3{margin:0}small{color:#c4d4df}#stage{height:65dvh;min-height:330px;touch-action:none}#status{padding:9px 12px;background:#263c47}#panel{padding:12px;display:flex;flex-wrap:wrap;gap:8px}button{background:#305a70;border:1px solid #6792a4;border-radius:7px;padding:11px;color:white;font-size:14px}#stats{padding:12px;white-space:pre-wrap;color:#b9d9e4}label{display:flex;align-items:center;gap:5px}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><header><h3>WVLRP • 4105 3D Inspection</h3><small>Drag to rotate • pinch to zoom • model loaded from our GitHub repository</small></header><div id="stage"></div><div id="status">Loading 4105-3d.glb…</div><div id="panel"><button id="reset">Reset view</button><button id="front">Front</button><button id="back">Back</button><button id="side">Side</button><button id="wire">Wireframe: off</button><button id="grid">Grid: off</button><button id="light">Lighting: normal</button></div><div id="stats">Reading model information…</div><script type="module">import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';const stage=document.getElementById('stage'),status=document.getElementById('status'),stats=document.getElementById('stats');try{const scene=new THREE.Scene();scene.background=new THREE.Color('#1d2933');const camera=new THREE.PerspectiveCamera(42,1,.001,100000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));stage.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;const ambient=new THREE.HemisphereLight(0xffffff,0x526575,2.1);scene.add(ambient);const sun=new THREE.DirectionalLight(0xffffff,2.3);sun.position.set(3,5,8);scene.add(sun);const grid=new THREE.GridHelper(10,20);grid.visible=false;scene.add(grid);let model,dist=3,center=new THREE.Vector3(),wire=false,lit=true;function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();function view(x,y,z){camera.position.copy(center).add(new THREE.Vector3(x,y,z).normalize().multiplyScalar(dist));controls.target.copy(center);controls.update()}function fit(){const b=new THREE.Box3().setFromObject(model),s=b.getSize(new THREE.Vector3());b.getCenter(center);dist=Math.max(s.length()*1.35,.01);camera.near=Math.max(dist/10000,.000001);camera.far=dist*1000;camera.updateProjectionMatrix();grid.position.y=b.min.y;grid.scale.setScalar(Math.max(s.length()/10,.01));view(0,.1,1)}document.getElementById('reset').onclick=()=>fit();document.getElementById('front').onclick=()=>view(0,0,1);document.getElementById('back').onclick=()=>view(0,0,-1);document.getElementById('side').onclick=()=>view(1,0,0);document.getElementById('grid').onclick=e=>{grid.visible=!grid.visible;e.target.textContent='Grid: '+(grid.visible?'on':'off')};document.getElementById('wire').onclick=e=>{wire=!wire;model?.traverse(o=>{if(o.isMesh){const mats=Array.isArray(o.material)?o.material:[o.material];mats.forEach(m=>m.wireframe=wire)}});e.target.textContent='Wireframe: '+(wire?'on':'off')};document.getElementById('light').onclick=e=>{lit=!lit;ambient.intensity=lit?2.1:.7;sun.intensity=lit?2.3:.3;e.target.textContent='Lighting: '+(lit?'normal':'dim')};const url='./4105-3d.glb';new GLTFLoader().load(url,g=>{model=g.scene;scene.add(model);fit();let meshes=0,vertices=0,triangles=0,materials=new Set(),bones=0;model.traverse(o=>{if(o.isMesh){meshes++;const geo=o.geometry,p=geo.attributes.position;if(p){vertices+=p.count;triangles+=geo.index?geo.index.count/3:p.count/3}const a=Array.isArray(o.material)?o.material:[o.material];a.forEach(m=>materials.add(m.uuid))}if(o.isBone)bones++});status.textContent='Loaded successfully: 4105-3d.glb';stats.textContent='Meshes: '+meshes+' | Vertices: '+vertices.toLocaleString()+' | Triangles: '+Math.round(triangles).toLocaleString()+' | Materials: '+materials.size+' | Bones: '+bones+' | Animations: '+g.animations.length;},e=>{if(e.total)status.textContent='Loading model: '+Math.round(e.loaded/e.total*100)+'%'},err=>{status.textContent='Model load failed: '+err.message;stats.textContent='Check model upload and GitHub Pages deployment.'});renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)})}catch(e){status.textContent='Viewer error: '+e.message}</script></body></html>
