<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07110d"><title>WVLRP Super Control</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:radial-gradient(circle at 50% -10%,#392a13,#09140d 40%,#020806 76%) fixed;color:#fff}a{color:inherit;text-decoration:none}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#06100deb;border-bottom:1px solid #ffffff20}.top b{font-size:10px;letter-spacing:.2em;color:#e8cb76}.gate{min-height:calc(100vh - 58px);display:grid;place-items:center;padding:20px}.panel{display:none;max-width:1150px;margin:auto;padding:22px 12px 70px}.panel.show{display:block}.card{background:#07120eeb;border:1px solid #ffffff1e;border-radius:18px;padding:16px;box-shadow:0 20px 55px #0008}.hero{text-align:center}.hero small{color:#e8cb76;font-weight:900;letter-spacing:.22em}.hero h1{font:900 clamp(34px,7vw,58px) Georgia,serif;margin:7px 0}.hero p{color:#aab9b0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:17px 0}.stat{text-align:center;padding:15px 8px}.stat b{display:block;font:900 27px Georgia,serif;color:#ead184}.stat span{font-size:10px;color:#a9b7af;letter-spacing:.08em}.toolbar{display:flex;gap:8px;margin:14px 0}.toolbar input,.toolbar select{padding:11px;border:1px solid #ffffff20;border-radius:10px;background:#020806;color:#fff}.toolbar input{flex:1}.toolbar button{border:1px solid #ffffff20;border-radius:10px;background:#634a1e;color:#fff;font-weight:900;padding:0 15px}.users{display:grid;gap:9px}.user{display:grid;grid-template-columns:1.4fr .8fr .8fr .7fr;gap:10px;align-items:center}.name b{display:block}.name small{color:#8fa097}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#ffffff0b;border:1px solid #ffffff16;font-size:10px;font-weight:900}.money{font-weight:900;color:#e4cc80}.empty{text-align:center;color:#9daca3;padding:25px}.msg{color:#b7c5bd;font-size:11px;margin-top:8px}@media(max-width:720px){.stats{grid-template-columns:1fr 1fr}.user{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.toolbar input{flex-basis:100%}}
</style></head><body><header class="top"><a href="index.html">← WVLRP Home</a><b>SUPER CONTROL</b></header><section class="gate" id="gate"><div class="card" style="max-width:520px;text-align:center"><div style="color:#e8cb76;font-weight:900">WVLRP SUPER</div><h1 id="gt">Checking access…</h1><p id="gx">Kyresearcher Super access required.</p></div></section><main class="panel" id="panel"><header class="hero"><small>WVLRP SUPER CONTROL</small><h1>Members & Support</h1><p>Private overview of WVLRP accounts, account status, donors, sponsors and recorded support.</p></header><section class="stats"><div class="card stat"><b id="total">0</b><span>TOTAL ACCOUNTS</span></div><div class="card stat"><b id="active">0</b><span>ACTIVE</span></div><div class="card stat"><b id="inactive">0</b><span>INACTIVE</span></div><div class="card stat"><b id="support">$0</b><span>RECORDED SUPPORT</span></div></section><div class="toolbar"><input id="search" placeholder="Search members"><select id="filter"><option value="all">All accounts</option><option value="active">Active</option><option value="inactive">Inactive</option><option value="donor">Donors</option><option value="sponsor">Sponsors</option><option value="admin">Admins</option></select><button id="refresh">REFRESH</button></div><section class="users" id="users"></section><div class="msg" id="msg"></div></main><script>
(()=>{const API='https://wvlrp-chat-production.up.railway.app',KEY='wvlrpChatToken',token=()=>localStorage.getItem(KEY)||'',H=()=>({'Authorization':'Bearer '+token()}),gate=document.getElementById('gate'),panel=document.getElementById('panel'),users=document.getElementById('users'),search=document.getElementById('search'),filter=document.getElementById('filter'),msg=document.getElementById('msg');let all=[];const safe=s=>(s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function req(p){const r=await fetch(API+p,{headers:H()});let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.detail||'Request failed');return j}function render(){let q=search.value.trim().toLowerCase(),f=filter.value,rows=all.filter(u=>(!q||u.username.toLowerCase().includes(q))&&(f==='all'||(f==='active'&&!u.disabled)||(f==='inactive'&&u.disabled)||(f==='donor'&&u.support_level==='donor')||(f==='sponsor'&&u.support_level==='sponsor')||(f==='admin'&&(u.role==='admin'||u.role==='super'))));users.innerHTML=rows.length?'':'<div class="card empty">No matching accounts.</div>';rows.forEach(u=>{let d=document.createElement('div');d.className='card user';d.innerHTML=`<div class="name"><b>${safe(u.username)} ${u.role==='super'?'<span class="pill">SUPER</span>':u.role==='admin'?'<span class="pill">ADMIN</span>':''}</b><small>Account #${u.id} • joined ${new Date(u.created_at).toLocaleDateString()}</small></div><div><span class="pill">${u.disabled?'INACTIVE':'ACTIVE'}</span></div><div><span class="pill">${safe((u.support_level||'member').toUpperCase())}</span></div><div class="money">$${((u.support_amount_cents||0)/100).toFixed(2)}</div>`;users.appendChild(d)})}async function load(){msg.textContent='';try{const j=await req('/api/admin/users');all=j.users||[];document.getElementById('total').textContent=all.length;document.getElementById('active').textContent=all.filter(x=>!x.disabled).length;document.getElementById('inactive').textContent=all.filter(x=>x.disabled).length;document.getElementById('support').textContent='$'+(all.reduce((n,x)=>n+(x.support_amount_cents||0),0)/100).toFixed(2);render()}catch(e){msg.textContent=e.message}}async function start(){if(!token()){document.getElementById('gt').textContent='Sign in required';return}try{const me=await req('/api/me');if(me.role!=='super')throw new Error('Super access required');gate.style.display='none';panel.classList.add('show');load()}catch(e){document.getElementById('gt').textContent='Super access required';document.getElementById('gx').textContent=e.message}}search.oninput=render;filter.onchange=render;document.getElementById('refresh').onclick=load;start()})();
</script></body></html>
