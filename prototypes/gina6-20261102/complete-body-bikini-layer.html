<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gina 6 | Bikini layer on complete body</title><style>*{box-sizing:border-box}body{margin:0;background:#101c28;color:#f4f7fb;font:14px system-ui}header{padding:10px 14px}h1{font-size:19px;margin:0 0 5px}p{margin:4px 0;color:#bcd0da;line-height:1.35}#screen{height:calc(100dvh - 192px);min-height:320px;touch-action:none}footer{padding:9px;display:flex;flex-wrap:wrap;gap:7px}button,select{padding:10px;border:1px solid #7194a8;border-radius:8px;background:#29495d;color:white;font:inherit}#status{padding:0 13px 10px;color:#c8d9e6}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script></head><body><header><h1>Gina 6 — full body + removable bikini</h1><p>One complete Gina 6 body stays visible. The factory bikini is layered separately. This test uses matched rigged source exports; final single-file garment extraction is not yet complete.</p></header><div id="screen"></div><footer><button id="off">Take bikini off</button><button id="on">Put bikini on</button><select id="view"><option value="front">Front</option><option value="back">Back</option><option value="side">Side</option></select><select id="anim"><option value="">Standing</option></select></footer><div id="status">Loading Gina 6 body and bikini…</div><script type="module">import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';const el=document.getElementById('screen'),status=document.getElementById('status'),scene=new THREE.Scene();scene.background=new THREE.Color(0x152334);const camera=new THREE.PerspectiveCamera(40,1,.01,100),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputColorSpace=THREE.SRGBColorSpace;el.appendChild(renderer.domElement);const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;scene.add(new THREE.HemisphereLight(0xe5efff,0x34465c,2.6));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(2,5,4);scene.add(light);const loader=new GLTFLoader(),load=p=>new Promise((resolve,reject)=>loader.load(p,resolve,undefined,reject));let body,garment,mixers=[];const clock=new THREE.Clock();function resize(){const w=el.clientWidth,h=el.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(el);function view(){if(!body)return;let b=new THREE.Box3().setFromObject(body.scene),center=b.getCenter(new THREE.Vector3()),h=b.getSize(new THREE.Vector3()).y||1.7,v=document.getElementById('view').value;orbit.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(v==='side'?h*1.5:0,h*.12,v==='back'?-h*1.5:v==='side'?0:h*1.5));orbit.update()}Promise.all([load('./Gina_6_UNCLOTHED_NATIVE.glb'),load('./Gina_6_FITTED_GOLD_BIKINI.glb')]).then(([base,clothed])=>{body=base;garment=clothed;scene.add(base.scene,clothed.scene);let count=0;clothed.scene.traverse(o=>{if(o.isMesh){const mats=Array.isArray(o.material)?o.material:[o.material];for(const m of mats){if(m){const isGarment=/bikini/i.test(m.name);m.visible=isGarment;if(isGarment){count++;m.side=THREE.DoubleSide}}}}});mixers=[new THREE.AnimationMixer(base.scene),new THREE.AnimationMixer(clothed.scene)];const select=document.getElementById('anim');base.animations.forEach(a=>{const op=document.createElement('option');op.value=a.name;op.textContent=a.name;select.appendChild(op)});select.onchange=()=>{mixers.forEach((m,i)=>{m.stopAllAction();const clip=[base,clothed][i].animations.find(a=>a.name===select.value);if(clip)m.clipAction(clip).reset().play()})};document.getElementById('off').onclick=()=>{clothed.scene.visible=false;status.textContent='Bikini OFF — complete original Gina 6 body remains visible.'};document.getElementById('on').onclick=()=>{clothed.scene.visible=true;status.textContent='Bikini ON — factory bikini over complete body; check for skin clipping.'};document.getElementById('view').onchange=view;view();status.textContent='Loaded complete body and '+count+' bikini materials. Test ON/OFF and animations.'}).catch(e=>status.textContent='Model load failed: '+e.message);function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.07);mixers.forEach(m=>m.update(dt));orbit.update();renderer.render(scene,camera)}resize();frame();</script></body></html>
