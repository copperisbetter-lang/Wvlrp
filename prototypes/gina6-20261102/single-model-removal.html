<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gina 6 — single-model bikini removal test</title><style>*{box-sizing:border-box}body{margin:0;background:#111c29;color:#f5f7fb;font:14px system-ui}header{padding:12px 15px}h1{font-size:19px;margin:0 0 5px}p{margin:5px 0;color:#b9cbd8}#screen{height:calc(100dvh - 190px);min-height:320px;touch-action:none}footer{display:flex;gap:7px;flex-wrap:wrap;padding:9px}button,select{border:1px solid #7c9eac;border-radius:7px;padding:10px;background:#2a485e;color:white;font:inherit}#status{padding:0 12px 12px;color:#d2dfe8}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script></head><body><header><h1>Gina 6 — ONE model, removable bikini test</h1><p>This test hides the original bikini material on the same model. It does not swap bodies. Check whether missing skin appears.</p></header><div id="screen"></div><footer><button id="remove">Remove bikini</button><button id="replace">Put bikini back</button><select id="view"><option value="front">Front</option><option value="back">Back</option><option value="side">Side</option></select><select id="animations"><option value="">Standing</option></select></footer><div id="status">Loading one Gina 6…</div><script type="module">import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';const el=document.getElementById('screen'),status=document.getElementById('status'),scene=new THREE.Scene();scene.background=new THREE.Color(0x182536);const camera=new THREE.PerspectiveCamera(40,1,.01,100),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputColorSpace=THREE.SRGBColorSpace;el.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xeaf2ff,0x334455,2.7));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(2,4,3);scene.add(light);const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;const clock=new THREE.Clock();let model,mixer,bikini=[];function resize(){let w=el.clientWidth,h=el.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(el);function view(){if(!model)return;let b=new THREE.Box3().setFromObject(model),center=b.getCenter(new THREE.Vector3()),h=b.getSize(new THREE.Vector3()).y||1.7,v=document.getElementById('view').value;orbit.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(v==='side'?h*1.5:0,h*.12,v==='back'?-h*1.5:v==='side'?0:h*1.5));orbit.update()}new GLTFLoader().load('./Gina_6_FITTED_GOLD_BIKINI.glb',g=>{model=g.scene;scene.add(model);model.traverse(o=>{if(o.isMesh){let materials=Array.isArray(o.material)?o.material:[o.material];for(let m of materials)if(m&&/bikini/i.test(m.name))bikini.push(m)}});mixer=new THREE.AnimationMixer(model);for(let a of g.animations){let option=document.createElement('option');option.value=a.name;option.textContent=a.name;document.getElementById('animations').appendChild(option)}document.getElementById('animations').onchange=e=>{mixer.stopAllAction();let clip=g.animations.find(a=>a.name===e.target.value);if(clip)mixer.clipAction(clip).reset().play()};document.getElementById('remove').onclick=()=>{bikini.forEach(m=>m.visible=false);status.textContent='Bikini material hidden on SAME Gina 6 mesh. Inspect for holes in underlying skin.'};document.getElementById('replace').onclick=()=>{bikini.forEach(m=>m.visible=true);status.textContent='Bikini material restored on SAME Gina 6 mesh.'};document.getElementById('view').onchange=view;view();status.textContent='Loaded one Gina 6; '+bikini.length+' bikini materials detected. Tap Remove bikini.'},undefined,e=>status.textContent='Load error: '+e.message);function frame(){requestAnimationFrame(frame);let dt=Math.min(clock.getDelta(),.07);if(mixer)mixer.update(dt);orbit.update();renderer.render(scene,camera)}resize();frame();</script></body></html>
