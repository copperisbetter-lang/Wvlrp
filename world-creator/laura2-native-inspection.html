<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laura 2 — Native MPFB Inspection</title><style>body{margin:0;background:#17221f;color:#f1f5f3;font:15px system-ui}header{padding:12px}h1{font-size:19px;margin:0}#stage{height:75dvh;touch-action:none}nav{display:flex;gap:8px;padding:10px;flex-wrap:wrap}button{padding:12px;background:#345b4c;color:white;border:0;border-radius:8px}#status{padding:8px 12px}</style></head><body><header><h1>Laura 2 — MakeHuman Face Inspection</h1></header><div id="status">Loading Laura 2 native full-body GLB…</div><div id="stage"></div><nav><button id="front">Front</button><button id="side">Side</button><button id="other">Other side</button><button id="body">Full body</button><button id="hair">Show hair</button></nav><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
const stage=document.getElementById('stage'),status=document.getElementById('status');const scene=new THREE.Scene();scene.background=new THREE.Color(0x263b34);scene.add(new THREE.HemisphereLight(0xffffff,0x667f75,2.6));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(3,5,5);scene.add(light);const camera=new THREE.PerspectiveCamera(38,1,.001,100);const renderer=new THREE.WebGLRenderer({antialias:true});stage.append(renderer.domElement);const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.minDistance=.04;orbit.maxDistance=12;function resize(){renderer.setSize(stage.clientWidth,stage.clientHeight,false);camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(stage);resize();renderer.setAnimationLoop(()=>{orbit.update();renderer.render(scene,camera)});
try{const gltf=await new GLTFLoader().loadAsync('https://raw.githubusercontent.com/copperisbetter-lang/Wvlrp/fix/laura2-fullbody-mpfb/world-creator/assets/laura-2-native-fullbody.glb');const model=gltf.scene;scene.add(model);
// Hair-only inspection override: keep native body, face, rig and exported GLB untouched.
const hairMeshes=[];model.traverse(o=>{if(!o.isMesh)return;const names=[o.name,o.parent?.name,...(Array.isArray(o.material)?o.material:[o.material]).map(m=>m?.name)].join(' ').toLowerCase();if(/hair|eyebrow|eyelash|scalp|fringe|bangs|ponytail/.test(names)&&!/eyebrow|eyelash/.test(names)){hairMeshes.push(o);o.visible=false;}});
let hairVisible=false;const hairButton=document.getElementById('hair');hairButton.textContent=hairMeshes.length?'Show hair ('+hairMeshes.length+')':'Hair not identified';hairButton.disabled=!hairMeshes.length;hairButton.onclick=()=>{hairVisible=!hairVisible;hairMeshes.forEach(o=>o.visible=hairVisible);hairButton.textContent=hairVisible?'Hide hair':'Show hair';};
const bounds=new THREE.Box3().setFromObject(model);const center=bounds.getCenter(new THREE.Vector3()),size=bounds.getSize(new THREE.Vector3());const head=new THREE.Vector3(center.x,bounds.max.y-size.y*.115,center.z);function view(which){const full=which==='body';const target=full?center:head;const distance=full?size.y*1.65:Math.max(.22,size.y*.22);orbit.target.copy(target);let offset=new THREE.Vector3(0,0,distance);if(which==='side')offset.set(distance,0,0);if(which==='other')offset.set(-distance,0,0);camera.position.copy(target).add(offset);orbit.update()}document.getElementById('front').onclick=()=>view('front');document.getElementById('side').onclick=()=>view('side');document.getElementById('other').onclick=()=>view('other');document.getElementById('body').onclick=()=>view('body');view('front');status.textContent='Loaded. Drag to rotate; pinch to zoom. Native MPFB full-body GLB. Hair meshes isolated: '+hairMeshes.length+'.'}catch(e){status.textContent='Model unavailable: '+e.message;}
</script></body></html>
