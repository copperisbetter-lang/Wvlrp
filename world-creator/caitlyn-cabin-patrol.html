<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Caitlyn · Cabin Movement Test</title><style>html,body{margin:0;overflow:hidden;background:#172b22;color:white;font:14px system-ui}canvas{width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;top:12px;left:12px;background:#10271ddc;padding:10px;border-radius:10px;pointer-events:none}#pad{position:fixed;bottom:25px;left:20px;width:115px;height:115px;border-radius:60px;background:#234b3e99;border:2px solid #c4d8bb;touch-action:none}#nub{position:absolute;left:39px;top:39px;width:37px;height:37px;border-radius:50%;background:#bed7c2}</style></head><body><canvas id="game"></canvas><div id="hud">Caitlyn · Cabin test<br><span id="state">Loading model…</span><br>Drag right side to look · left pad to walk</div><div id="pad"><div id="nub"></div></div><script src="https://cdn.babylonjs.com/babylon.js"></script><script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script><script type="module">
import {buildHearthsideCabin} from './cabin-builder.js';
const B=window.BABYLON,canvas=document.getElementById('game'),engine=new B.Engine(canvas,true,{antialias:false}),scene=new B.Scene(engine);scene.clearColor=new B.Color4(.68,.83,.94,1);
const light=new B.HemisphericLight('sky',new B.Vector3(0,1,0),scene);light.intensity=1.4;const sun=new B.DirectionalLight('sun',new B.Vector3(-.5,-1,.3),scene);sun.intensity=1.4;
const ground=B.MeshBuilder.CreateGround('ground',{width:160,height:160},scene);const grass=new B.StandardMaterial('grass',scene);grass.diffuseColor=new B.Color3(.23,.39,.2);ground.material=grass;
buildHearthsideCabin(B,scene,x=>x,0,0,0);
const camera=new B.UniversalCamera('male first person',new B.Vector3(0,1.72,24),scene);camera.minZ=.07;camera.fov=1.12;camera.rotation.y=Math.PI;scene.activeCamera=camera;
const keys=new Set();window.addEventListener('keydown',e=>keys.add(e.key.toLowerCase()));window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
let stickX=0,stickY=0,looking=false,lastX=0,lastY=0;const pad=document.getElementById('pad'),nub=document.getElementById('nub');pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);padMove(e)});pad.addEventListener('pointermove',e=>{if(e.buttons)padMove(e)});pad.addEventListener('pointerup',()=>{stickX=stickY=0;nub.style.transform='';});function padMove(e){const r=pad.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;stickX=Math.max(-1,Math.min(1,x/44));stickY=Math.max(-1,Math.min(1,y/44));nub.style.transform=`translate(${stickX*39}px,${stickY*39}px)`;}
canvas.addEventListener('pointerdown',e=>{looking=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointerup',()=>looking=false);canvas.addEventListener('pointermove',e=>{if(!looking)return;camera.rotation.y+=(e.clientX-lastX)*.004;camera.rotation.x=Math.max(-1.25,Math.min(1.25,camera.rotation.x+(e.clientY-lastY)*.003));lastX=e.clientX;lastY=e.clientY});
let root=null,groups=[],active=null,phase=0,elapsed=0;const steps=[['Walk',7],['Stand',2],['HandsAndKnees',4],['ElbowsAndKnees',4],['Stand',2],['Walk',7],['Stand',1.5]];const state=document.getElementById('state');
try{const result=await B.SceneLoader.ImportMeshAsync('','./assets/','caitlyn-mpfb-trial.glb',scene);root=new B.TransformNode('Caitlyn patrol',scene);for(const m of result.meshes){if(!m.parent)m.parent=root;}root.position.set(0,0,17);groups=result.animationGroups;state.textContent='Caitlyn loaded';}catch(e){state.textContent='Model failed to load: '+e.message;}
function pose(name){if(!groups.length)return;const find=groups.find(g=>g.name.toLowerCase().includes(name.toLowerCase()))||groups.find(g=>g.name.toLowerCase().includes(name==='Walk'?'stand':name==='Stand'?'stand':'kneel'));if(find!==active){for(const g of groups)g.stop();active=find;if(find)find.start(false,1,find.from,find.to,false);}}
let angle=0;engine.runRenderLoop(()=>{const dt=Math.min(engine.getDeltaTime()/1000,.05);let forward=(keys.has('w')?1:0)-(keys.has('s')?1:0)-stickY,side=(keys.has('d')?1:0)-(keys.has('a')?1:0)+stickX;const len=Math.hypot(forward,side);if(len>.05){forward/=len;side/=len;const yaw=camera.rotation.y;camera.position.x+=(Math.sin(yaw)*forward+Math.cos(yaw)*side)*dt*4;camera.position.z+=(Math.cos(yaw)*forward-Math.sin(yaw)*side)*dt*4;}camera.position.y=1.72;
if(root){elapsed+=dt;const [name,duration]=steps[phase];state.textContent=name.replace(/([a-z])([A-Z])/g,'$1 $2');pose(name);if(name==='Walk'){angle+=dt*.29;root.position.set(Math.sin(angle)*15,0,Math.cos(angle)*15);root.rotation.y=angle+Math.PI/2;}if(elapsed>=duration){elapsed=0;phase=(phase+1)%steps.length;}}scene.render();});window.addEventListener('resize',()=>engine.resize());
</script></body></html>
