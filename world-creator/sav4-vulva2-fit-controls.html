<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAV4 Vulva 2 Fit Controls</title><style>body{margin:0;background:#17251f;color:#eee;font:14px system-ui}header{padding:12px;background:#284237}main{display:grid;grid-template-columns:minmax(280px,1fr) minmax(280px,360px);height:calc(100dvh - 64px)}#viewer{background:#263830;position:relative;min-height:260px;overflow:hidden}#viewer canvas{display:block;width:100%;height:100%;touch-action:none}aside{overflow:auto;padding:12px}label{display:block;margin:12px 0}input[type=range]{width:100%}button{padding:9px;margin:3px;background:#416b57;color:white;border:0;border-radius:5px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px}small{color:#e7d6a7}@media(max-width:700px){main{display:block;height:auto}#viewer{height:40dvh;position:sticky;top:0;z-index:2}aside{height:55dvh}}</style><header><strong>SAV4 — Vulva 2 Fitting Controls</strong></header><main><section id="viewer"><div><strong>Character preview loading</strong><p>Loading SAV4 model for visual reference.</p><small>Sliders deform the preview mesh; saves are coordinate presets, not GLB exports.</small></div></section><aside><div id="sliders"></div><button id="lockAll">Lock all</button><button id="unlockAll">Unlock all</button><button id="save">Save placement</button><button id="load">Load placement</button><button id="reset">Reset</button><button id="undo">Undo</button><button id="redo">Redo</button><button id="copy">Copy JSON</button><pre id="json"></pre><p id="status" role="status"></p></aside></main><script>
const schema=[['x','X Position','m',-1,1,.001],['y','Y Position','m',-1,1,.001],['z','Z Position','m',-1,1,.001],['pitch','Pitch','deg',-180,180,.1],['yaw','Yaw','deg',-180,180,.1],['roll','Roll','deg',-180,180,.1],['width','Width','ratio',.1,3,.01],['height','Height','ratio',.1,3,.01],['frontBend','Front Bend','ratio',-1,1,.01],['rearBend','Rear Bend','ratio',-1,1,.01],['innerLength','Inner Lip Length','ratio',.1,3,.01],['innerFullness','Inner Lip Fullness','ratio',.1,3,.01],['outerLength','Outer Lip Length','ratio',.1,3,.01],['outerFullness','Outer Lip Fullness','ratio',.1,3,.01],['hinge1','Hinge 1 · Front','deg',-45,45,.5],['hinge2','Hinge 2 · Front middle','deg',-45,45,.5],['hinge3','Hinge 3 · Rear middle','deg',-45,45,.5],['hinge4','Hinge 4 · Rear','deg',-45,45,.5],['rearDepth','Rear Depth','mm',-40,10,.5],['rearTaper','Rear Taper','ratio',0,1,.01]];
const defaults=Object.fromEntries(schema.map(([id],i)=>[id,i===6||i===7||i>=10?1:0]));let values={...defaults},locks=Object.fromEntries(schema.map(([id])=>[id,false])),history=[{values:{...values},locks:{...locks}}],cursor=0;const $=id=>document.getElementById(id);
function render(){for(const [id] of schema){$(id).value=values[id];$(id+'Value').value=values[id];$(id).disabled=locks[id];$(id+'Value').disabled=locks[id];$(id+'Lock').textContent=locks[id]?'🔒':'🔓';$(id+'Lock').setAttribute('aria-pressed',String(locks[id]))}$('json').textContent=JSON.stringify({schemaVersion:2,locks,hingeFractions:[.16,.38,.63,.88],sourceMesh:'vulva2-unverified',coordinateSystem:'SAV4 local XYZ; units meters; rotations degrees',parameters:values},null,2);window.dispatchEvent(new Event('fit-change'))}
function record(){history=history.slice(0,cursor+1);history.push({values:{...values},locks:{...locks}});cursor++;render()}
for(const [id,name,unit,min,max,step] of schema){const label=document.createElement('label');label.textContent=name+' ('+unit+')';const slider=document.createElement('input');slider.type='range';slider.id=id;slider.min=min;slider.max=max;slider.step=step;const lock=document.createElement('button');lock.type='button';lock.id=id+'Lock';lock.setAttribute('aria-label','Toggle lock for '+name);lock.onclick=()=>{locks[id]=!locks[id];record()};const numeric=document.createElement('input');numeric.type='number';numeric.id=id+'Value';numeric.min=min;numeric.max=max;numeric.step=step;numeric.style.width='85px';for(const el of [slider,numeric])el.addEventListener('change',()=>{const n=Number(el.value);if(locks[id]||!Number.isFinite(n)||n<min||n>max)return;values[id]=n;record()});slider.addEventListener('input',()=>{if(locks[id])return;numeric.value=slider.value;values[id]=Number(slider.value);render()});label.append(slider,numeric,lock);$('sliders').append(label)}
$('lockAll').onclick=()=>{for(const id of Object.keys(locks))locks[id]=true;record()};$('unlockAll').onclick=()=>{for(const id of Object.keys(locks))locks[id]=false;record()};$('save').onclick=()=>{localStorage.setItem('wvlrp.sav4.vulva2.fit.v2',JSON.stringify({values,locks}));$('status').textContent='Preset saved in this browser; no mesh export performed.'};$('load').onclick=()=>{try{const raw=localStorage.getItem('wvlrp.sav4.vulva2.fit.v2')||localStorage.getItem('wvlrp.sav4.vulva2.fit.v1');const saved=JSON.parse(raw);const incoming=saved.values||saved;if(!incoming)throw Error('No saved preset');for(const [id,,,min,max] of schema){const n=incoming[id];if(n!==undefined&&(!Number.isFinite(n)||n<min||n>max))throw Error('Invalid '+id);if(!locks[id]&&n!==undefined)values[id]=n;}if(saved.locks)for(const id of Object.keys(locks))if(!locks[id])locks[id]=!!saved.locks[id];record();$('status').textContent='Preset loaded; existing locks respected'}catch(e){$('status').textContent=e.message}};$('reset').onclick=()=>{for(const id of Object.keys(values))if(!locks[id])values[id]=defaults[id];record()};$('undo').onclick=()=>{if(cursor>0){const h=history[--cursor];values={...h.values};locks={...h.locks};render()}};$('redo').onclick=()=>{if(cursor<history.length-1){const h=history[++cursor];values={...h.values};locks={...h.locks};render()}};$('copy').onclick=()=>navigator.clipboard.writeText($('json').textContent).then(()=>$('status').textContent='Coordinates copied').catch(()=>$('status').textContent='Copy unavailable');render();
</script><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const stage=document.getElementById('viewer');
const info=document.createElement('div');info.style.cssText='position:absolute;top:8px;left:8px;z-index:4;padding:7px;background:#17251fe0;border-radius:6px;font-size:12px';info.textContent='Loading mesh…';stage.append(info);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x263830);
scene.add(new THREE.HemisphereLight(0xffffff,0x66766d,2));
const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(2,4,3);scene.add(light);
const camera=new THREE.PerspectiveCamera(40,1,.01,100);camera.position.set(0,1,3);
const renderer=new THREE.WebGLRenderer({antialias:true});
stage.append(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage);resize();
new GLTFLoader().load('assets/sav4-realistic.glb',g=>{
 scene.add(g.scene);const bounds=new THREE.Box3().setFromObject(g.scene);
 const center=bounds.getCenter(new THREE.Vector3()),size=bounds.getSize(new THREE.Vector3());
 controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(0,0,Math.max(2,size.y*1.5)));
},undefined,e=>{const label=document.createElement('p');label.textContent='Character preview failed to load: '+e.message;stage.append(label);});

const partGroup=new THREE.Group();scene.add(partGroup);
let partGeometry=null,partOriginal=null,partMin=0,partSpan=1;
function applyFit(){
 if(!partGeometry)return;
 const data=JSON.parse(document.getElementById('json').textContent||'{}').parameters;
 if(!data)return;
 partGroup.position.set(data.x,0.82+data.y,0.10+data.z);
 partGroup.rotation.set(THREE.MathUtils.degToRad(data.pitch),THREE.MathUtils.degToRad(data.yaw),THREE.MathUtils.degToRad(data.roll));
 const attr=partGeometry.attributes.position;
 for(let i=0;i<attr.count;i++){
  const x=partOriginal[i*3],y=partOriginal[i*3+1],z=partOriginal[i*3+2];
  const t=Math.max(0,Math.min(1,(y-partMin)/partSpan));
  const center=Math.exp(-Math.pow(x/.018,2)),edge=1-center;
  const hinges=[data.hinge1,data.hinge2,data.hinge3,data.hinge4];const pivots=[.16,.38,.63,.88];let bend=0;for(let h=0;h<4;h++){const dist=Math.abs(t-pivots[h]);const weight=Math.max(0,1-dist/.24);bend+=THREE.MathUtils.degToRad(hinges[h])*weight*weight*(3-2*weight)*(t-pivots[h])*partSpan;}const posterior=Math.pow(1-t,2);const rearShift=(data.rearDepth/1000)*posterior*(1-data.rearTaper*t);const length=1+.30*(center*(data.innerLength-1)+edge*(data.outerLength-1));
  const fullness=1+.30*(center*(data.innerFullness-1)+edge*(data.outerFullness-1));
  attr.setXYZ(i,x*data.width,y*data.height*length,z*fullness+.025*(data.frontBend*t*t+data.rearBend*(1-t)*(1-t))+bend+rearShift);
 }
 attr.needsUpdate=true;partGeometry.computeVertexNormals();partGeometry.computeBoundingSphere();
}
window.addEventListener('fit-change',applyFit);
fetch('assets/vulva2-mhx2-source.json').then(r=>{if(!r.ok)throw Error('source HTTP '+r.status);return r.json()}).then(d=>{
 const vs=d.mesh.vertices,fs=d.mesh.faces;
 if(!vs.length||!fs.length)throw Error('empty geometry');
 const xs=vs.map(v=>v[0]),ys=vs.map(v=>v[1]),zs=vs.map(v=>v[2]);
 const mid=[(Math.min(...xs)+Math.max(...xs))/2,(Math.min(...ys)+Math.max(...ys))/2,(Math.min(...zs)+Math.max(...zs))/2];
 const pts=[];for(const v of vs)pts.push((v[0]-mid[0])*.1,(v[1]-mid[1])*.1,(v[2]-mid[2])*.1);
 const triangles=[];for(const face of fs)for(let i=1;i<face.length-1;i++)triangles.push(face[0],face[i],face[i+1]);
 partGeometry=new THREE.BufferGeometry();partGeometry.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));partGeometry.setIndex(triangles);partGeometry.computeVertexNormals();
 partOriginal=Float32Array.from(pts);partMin=Math.min(...pts.filter((_,i)=>i%3===1));partSpan=Math.max(...pts.filter((_,i)=>i%3===1))-partMin||1;
 const part=new THREE.Mesh(partGeometry,new THREE.MeshStandardMaterial({color:0xc48b91,roughness:.8,side:THREE.DoubleSide}));
 partGroup.add(part);applyFit();info.textContent='SAV4 + fitting mesh loaded • preview only; save coordinates';
}).catch(e=>info.textContent='Fitting mesh load failed: '+e.message);
function frame(){requestAnimationFrame(frame);controls.update();renderer.render(scene,camera);}frame();
</script></html>
