<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAV4 Vulva 2 Fit Controls</title><style>body{margin:0;background:#17251f;color:#eee;font:14px system-ui}header{padding:12px;background:#284237}main{display:grid;grid-template-columns:minmax(280px,1fr) minmax(280px,360px);height:calc(100dvh - 64px)}#viewer{background:#263830;position:relative;min-height:260px;overflow:hidden}#viewer canvas{display:block;width:100%;height:100%;touch-action:none}aside{overflow:auto;padding:12px}label{display:block;margin:12px 0}input[type=range]{width:100%}button{padding:9px;margin:3px;background:#416b57;color:white;border:0;border-radius:5px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px}small{color:#e7d6a7}@media(max-width:700px){main{display:block;height:auto}#viewer{height:40dvh;position:sticky;top:0;z-index:2}aside{height:55dvh}}</style><header><strong>SAV4 — Vulva 2 Fitting Controls</strong></header><main><section id="viewer"><div><strong>Character preview loading</strong><p>Loading SAV4 model for visual reference.</p><small>Sliders currently edit a reversible coordinate preset, not mesh vertices.</small></div></section><aside><div id="sliders"></div><button id="save">Save placement</button><button id="load">Load placement</button><button id="reset">Reset</button><button id="undo">Undo</button><button id="redo">Redo</button><button id="copy">Copy JSON</button><pre id="json"></pre><p id="status" role="status"></p></aside></main><script>
const schema=[['x','X Position','m',-1,1,.001],['y','Y Position','m',-1,1,.001],['z','Z Position','m',-1,1,.001],['pitch','Pitch','deg',-180,180,.1],['yaw','Yaw','deg',-180,180,.1],['roll','Roll','deg',-180,180,.1],['width','Width','ratio',.1,3,.01],['height','Height','ratio',.1,3,.01],['frontBend','Front Bend','ratio',-1,1,.01],['rearBend','Rear Bend','ratio',-1,1,.01],['innerLength','Inner Lip Length','ratio',.1,3,.01],['innerFullness','Inner Lip Fullness','ratio',.1,3,.01],['outerLength','Outer Lip Length','ratio',.1,3,.01],['outerFullness','Outer Lip Fullness','ratio',.1,3,.01]];
const defaults=Object.fromEntries(schema.map(([id],i)=>[id,i===6||i===7||i>=10?1:0]));let values={...defaults},history=[{...values}],cursor=0;const $=id=>document.getElementById(id);
function render(){for(const [id] of schema){$(id).value=values[id];$(id+'Value').value=values[id]}$('json').textContent=JSON.stringify({schemaVersion:1,sourceMesh:'vulva2-unverified',coordinateSystem:'SAV4 local XYZ; units meters; rotations degrees',parameters:values},null,2)}
function record(){history=history.slice(0,cursor+1);history.push({...values});cursor++;render()}
for(const [id,name,unit,min,max,step] of schema){const label=document.createElement('label');label.textContent=name+' ('+unit+')';const slider=document.createElement('input');slider.type='range';slider.id=id;slider.min=min;slider.max=max;slider.step=step;const numeric=document.createElement('input');numeric.type='number';numeric.id=id+'Value';numeric.min=min;numeric.max=max;numeric.step=step;numeric.style.width='85px';for(const el of [slider,numeric])el.addEventListener('change',()=>{const n=Number(el.value);if(!Number.isFinite(n)||n<min||n>max)return;values[id]=n;record()});slider.addEventListener('input',()=>{numeric.value=slider.value});label.append(slider,numeric);$('sliders').append(label)}
$('save').onclick=()=>{localStorage.setItem('wvlrp.sav4.vulva2.fit.v1',JSON.stringify(values));$('status').textContent='Preset saved in this browser; no mesh export performed.'};$('load').onclick=()=>{try{const v=JSON.parse(localStorage.getItem('wvlrp.sav4.vulva2.fit.v1'));if(!v||!schema.every(([id,, ,min,max])=>Number.isFinite(v[id])&&v[id]>=min&&v[id]<=max))throw Error('Invalid preset');values=v;record();$('status').textContent='Preset loaded'}catch(e){$('status').textContent=e.message}};$('reset').onclick=()=>{values={...defaults};record()};$('undo').onclick=()=>{if(cursor>0){values={...history[--cursor]};render()}};$('redo').onclick=()=>{if(cursor<history.length-1){values={...history[++cursor]};render()}};$('copy').onclick=()=>navigator.clipboard.writeText($('json').textContent).then(()=>$('status').textContent='Coordinates copied').catch(()=>$('status').textContent='Copy unavailable');render();
</script><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const stage=document.getElementById('viewer');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x263830);
scene.add(new THREE.HemisphereLight(0xffffff,0x66766d,2));
const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(2,4,3);scene.add(light);
const camera=new THREE.PerspectiveCamera(40,1,.01,100);camera.position.set(0,1,3);
const renderer=new THREE.WebGLRenderer({antialias:true});
stage.replaceChildren(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage);resize();
new GLTFLoader().load('assets/sav4-realistic.glb',g=>{
 scene.add(g.scene);const bounds=new THREE.Box3().setFromObject(g.scene);
 const center=bounds.getCenter(new THREE.Vector3()),size=bounds.getSize(new THREE.Vector3());
 controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(0,0,Math.max(2,size.y*1.5)));
},undefined,e=>{const label=document.createElement('p');label.textContent='Character preview failed to load: '+e.message;stage.append(label);});
function frame(){requestAnimationFrame(frame);controls.update();renderer.render(scene,camera);}frame();
</script></html>
