<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laura — Standalone Head Inspection</title>
<style>html,body{margin:0;height:100%;background:#151a20;color:#f5f5f5;font:15px system-ui}main{height:100%;display:flex;flex-direction:column}header{padding:10px 14px;background:#222a33;display:flex;flex-wrap:wrap;align-items:center;gap:12px}h1{font-size:17px;margin:0}button,input{font:inherit}button{padding:8px 12px;border:1px solid #677584;border-radius:7px;background:#344252;color:white}input{max-width:230px}#view{flex:1;min-height:200px;touch-action:none}#status{padding:8px 14px;background:#222a33;font-size:13px}small{color:#b7c6d3}</style></head>
<body><main><header><h1>Laura · Repaired Head Inspection v2</h1><label>Load head GLB <input id="file" type="file" accept=".glb,.gltf"></label><button id="front">Front</button><button id="left">Left</button><button id="right">Right</button><button id="back">Back</button><button id="reset">Reset zoom</button><button id="neutral">Neutral</button><button id="mouth">Open mouth</button><button id="smile">Smile</button><button id="blink">Blink</button><button id="winkL">Wink left</button><button id="winkR">Wink right</button><button id="brows">Raise brows</button><small>Drag to rotate · pinch/scroll to zoom · MakeHuman morph clone · SAV4/CAR5 untouched</small></header><div id="view"></div><div id="status" role="status">Loading MakeHuman head…</div></main>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const view=document.querySelector('#view'),status=document.querySelector('#status');
const scene=new THREE.Scene();scene.background=new THREE.Color('#151a20');
const camera=new THREE.PerspectiveCamera(40,1,.01,1000);camera.position.set(0,0,4);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));view.append(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x647080,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(-2,4,5);scene.add(light);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=.25;controls.maxDistance=30;
let model=null,dist=4,center=new THREE.Vector3();let parts={};function named(prefix){return Object.values(parts).filter(o=>o.name.startsWith(prefix))}function neutral(){for(const ob of Object.values(parts)){if(ob.userData.base){ob.position.copy(ob.userData.base.position);ob.scale.copy(ob.userData.base.scale)}}}function move(prefix,dy=0,dz=0,sx=1,sy=1,sz=1){for(const ob of named(prefix)){ob.position.y+=dy;ob.position.z+=dz;ob.scale.multiply(new THREE.Vector3(sx,sy,sz))}}
function fit(){if(!model)return;const box=new THREE.Box3().setFromObject(model);box.getCenter(center);const size=box.getSize(new THREE.Vector3());const radius=Math.max(size.x,size.y,size.z);dist=Math.max(radius*1.65,.5);controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(0,0,dist));controls.update();}

function sculptLauraHead(root){
 const candidates=[];
 root.traverse(o=>{if(o.isMesh&&o.geometry?.attributes?.position&&o.geometry.attributes.position.count>1500)candidates.push(o)});
 if(!candidates.length)return 0;
 const face=candidates.sort((a,b)=>b.geometry.attributes.position.count-a.geometry.attributes.position.count)[0];
 face.geometry=face.geometry.clone();
 const a=face.geometry.attributes.position,box=new THREE.Box3().setFromBufferAttribute(a);
 const center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());
 // Geometry-space proportional sculpt, strongest on facial front; preserve neck and rear scalp.
 const nx=Math.max(size.x/2,0.001),ny=Math.max(size.y/2,0.001),nz=Math.max(size.z/2,0.001);
 for(let i=0;i<a.count;i++){
  const x=a.getX(i),y=a.getY(i),z=a.getZ(i);
  const u=(x-center.x)/nx,v=(y-center.y)/ny,w=(z-center.z)/nz;
  const front=THREE.MathUtils.smoothstep(w,-0.05,0.60);
  const cheek=Math.exp(-Math.pow((Math.abs(u)-.43)/.30,2)-Math.pow((v+.02)/.34,2));
  const jaw=THREE.MathUtils.smoothstep(-v,.22,.83);
  const temple=Math.exp(-Math.pow((v-.48)/.27,2));
  let xx=x-center.x;
  xx*=1+front*(.075*cheek-.13*jaw-.055*temple);
  const chin=Math.exp(-Math.pow(u/.31,2)-Math.pow((v+.78)/.19,2));
  const nose=Math.exp(-Math.pow(u/.14,2)-Math.pow((v-.01)/.24,2));
  const lip=Math.exp(-Math.pow(u/.28,2)-Math.pow((v+.36)/.13,2));
  a.setXYZ(i,center.x+xx,y-.035*ny*chin,z+front*nz*(.10*nose+.035*lip+.018*cheek));
 }
 a.needsUpdate=true;face.geometry.computeVertexNormals();face.geometry.computeBoundingSphere();
 return a.count;
}

function repairPresentation(root){
 const meshes=[];root.traverse(o=>{if(o.isMesh)meshes.push(o)});
 const skin=meshes.sort((a,b)=>(b.geometry?.attributes?.position?.count||0)-(a.geometry?.attributes?.position?.count||0))[0];
 if(!skin)return;
 root.updateMatrixWorld(true);
 const bb=new THREE.Box3().setFromObject(skin),size=bb.getSize(new THREE.Vector3()),ctr=bb.getCenter(new THREE.Vector3());
 const H=size.y,W=size.x,D=size.z;
 // Remove defective hair cards, which were exported as blocky lateral panels.
 for(const o of meshes){if(/hair|scalp|fringe|strand/i.test(o.name))o.visible=false;}
 const blonde=new THREE.MeshStandardMaterial({color:0xb39a73,roughness:.91,side:THREE.DoubleSide});
 const darkBlonde=new THREE.MeshStandardMaterial({color:0x897455,roughness:.95});
 const scalp=new THREE.Mesh(new THREE.SphereGeometry(1,48,32,0,Math.PI*2,0,Math.PI*.52),blonde);
 scalp.name='Laura replacement scalp';scalp.position.set(ctr.x,bb.max.y-H*.13,ctr.z-D*.08);scalp.scale.set(W*.49,H*.31,D*.53);root.add(scalp);
 // Natural flowing hair silhouette built from tapered curves, rather than sideways hair cards.
 for(const side of [-1,1])for(let i=0;i<34;i++){
  const t=i/33, x=side*W*(.20+.29*t);
  const curve=new THREE.CatmullRomCurve3([
   new THREE.Vector3(ctr.x+x*.68,bb.max.y-H*.07,ctr.z+D*.22),
   new THREE.Vector3(ctr.x+x,bb.max.y-H*.24,ctr.z+D*.32),
   new THREE.Vector3(ctr.x+x*1.10,ctr.y-H*.10,ctr.z+D*.16),
   new THREE.Vector3(ctr.x+x*.98,ctr.y-H*.51,ctr.z+D*.03)
  ]);
  const strand=new THREE.Mesh(new THREE.TubeGeometry(curve,20,W*(.004+.003*(i%3)),4,false),i%5===0?darkBlonde:blonde);
  strand.name='Laura flowing blonde hair';root.add(strand);
 }
 // Suppress red emissive eye materials while preserving the imported geometry.
 root.traverse(o=>{if(!o.isMesh||!o.material)return;
  const materials=Array.isArray(o.material)?o.material:[o.material];
  for(const m of materials){if(m.emissive&&m.emissive.r>m.emissive.g*1.4){m.emissive.setRGB(0,0,0);m.emissiveIntensity=0;}}
 });
 const iris=new THREE.MeshStandardMaterial({color:0x718c99,roughness:.34});
 const pupil=new THREE.MeshStandardMaterial({color:0x171b20,roughness:.22});
 const white=new THREE.MeshStandardMaterial({color:0xe8ded4,roughness:.4});
 // Eye covers are intentionally subtle and do not modify the source GLB.
 for(const side of [-1,1]){
  const ex=ctr.x+side*W*.205,ey=ctr.y+H*.135,ez=bb.max.z+D*.008;
  for(const [rad,depth,mat] of [[W*.090,0,white],[W*.045,D*.012,iris],[W*.020,D*.018,pupil]]){
   const eye=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),mat);
   eye.name='Laura repaired eye';eye.position.set(ex,ey,ez+depth);eye.scale.set(rad,rad*.55,D*.028);root.add(eye);
  }
 }
}
function load(url){status.textContent='Loading genuine MPFB mesh: '+url;new GLTFLoader().load(url,g=>{if(model)scene.remove(model);model=g.scene;const sculpted=sculptLauraHead(model);repairPresentation(model);parts={};model.traverse(o=>{if(o.isMesh){parts[o.name]=o;o.userData.base={position:o.position.clone(),scale:o.scale.clone()}}});scene.add(model);fit();status.textContent='Laura v2 hair/eye repair + sculpt applied to '+sculpted+' mesh vertices · Loaded '+url+' · '+Object.keys(parts).length+' meshes. Drag to rotate or pinch to zoom. Expression buttons require matching morph targets.'},undefined,e=>{status.textContent='Could not load GLB: '+e.message;});}
document.querySelector('#file').addEventListener('change',e=>{const f=e.target.files[0];if(f)load(URL.createObjectURL(f));});
for(const [id,dir] of Object.entries({front:[0,0,1],left:[-1,0,0],right:[1,0,0],back:[0,0,-1]}))document.querySelector('#'+id).onclick=()=>{camera.position.copy(center).add(new THREE.Vector3(...dir).multiplyScalar(dist));controls.update();};
document.querySelector('#reset').onclick=fit;document.querySelector('#neutral').onclick=neutral;document.querySelector('#mouth').onclick=()=>{neutral();move('Lower lip',0,-.14);move('Upper lip',0,.05)};document.querySelector('#smile').onclick=()=>{neutral();move('Upper lip',0,.035,1.2,.9,.85);move('Lower lip',0,.035,1.2,.9,.85)};document.querySelector('#blink').onclick=()=>{neutral();move('Upper eyelid',0,-.105,1,1,2.6)};document.querySelector('#winkL').onclick=()=>{neutral();move('Upper eyelid -1',0,-.105,1,1,2.6)};document.querySelector('#winkR').onclick=()=>{neutral();move('Upper eyelid 1',0,-.105,1,1,2.6)};document.querySelector('#brows').onclick=()=>{neutral();move('Eyebrow',0,.12)};
function resize(){const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(view);function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
const remote=new URLSearchParams(location.search).get('model');load(remote || './assets/morph-head-clone.glb?v=laura-sculpt-20261021');
</script></body></html>
