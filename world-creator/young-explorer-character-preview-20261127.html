<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Wild — Young Explorer character preview</title>
<style>*{box-sizing:border-box}body{margin:0;background:#13232c;color:white;font:14px system-ui}main{height:100dvh;display:flex;flex-direction:column}header,footer{padding:6px 9px;background:#172b36}header{display:flex;justify-content:space-between;gap:8px;align-items:center}#stage{width:100%;flex:1;min-height:0;display:block;touch-action:none}nav{display:flex;gap:5px;overflow-x:auto;align-items:center;padding:4px 0}button{flex:none;min-height:36px;padding:5px 11px;border:1px solid #738e9b;border-radius:7px;color:#fff;background:#2c4857;font:inherit}button:disabled{opacity:.45}button[aria-pressed=true]{background:#466c7c;border-color:#fff}#status{font-size:12px;color:#d3e2e7}#err{color:#ffb6a7}#fps{font-variant-numeric:tabular-nums}label{white-space:nowrap}input{width:80px}small{color:#c2d0d8}</style></head><body>
<main><header><b>Young Explorer • R3 touch camera</b><span id="fps">-- FPS</span></header>
<nav aria-label="Camera controls"><button data-view="reset">Reset</button><button data-view="face">Face</button><span id="zoomLabel">100%</span><small>Drag to orbit • pinch to zoom</small></nav>
<canvas id="stage" aria-label="Fully clothed character in a neutral game preview"></canvas>
<footer><nav aria-label="Gameplay animation"><button data-clip="idle" disabled>Stand</button><button data-clip="walk" disabled>Walk</button><button data-clip="run" disabled>Run</button><button data-clip="sit" disabled>Sit</button><button data-clip="wave" disabled>Wave</button><button id="knees" disabled>Knee movement</button><button id="elbows" disabled>Elbow movement</button><button id="pause" disabled>Pause</button><label>Speed <input id="speed" type="range" min=".25" max="1" step=".25" value="1"></label></nav>
<nav aria-label="Skin texture options"><button aria-pressed="true">Native</button><button disabled>G9 1</button><button disabled>G9 2</button><button disabled>G9 3</button><button disabled>G9 4</button><small>G9 materials not installed</small></nav><div id="status" role="status">Loading saved model…</div><span id="err" role="alert"></span></footer></main>
<script src="https://cdn.jsdelivr.net/npm/babylonjs@9.27.0/babylon.js"></script><script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@9.27.0/babylonjs.loaders.min.js"></script>
<script>
(async()=>{const status=document.getElementById('status'),fps=document.getElementById('fps');try{
const B=BABYLON,canvas=document.getElementById('stage'),engine=new B.Engine(canvas,true,{preserveDrawingBuffer:false,stencil:true});engine.setHardwareScalingLevel(Math.max(1,devicePixelRatio/1.5));
const scene=new B.Scene(engine);scene.clearColor=new B.Color4(.13,.20,.24,1);
const camera=new B.ArcRotateCamera('orbit',-Math.PI/2,Math.PI/2,2.7,new B.Vector3(0,.56,0),scene);camera.lowerBetaLimit=.04;camera.upperBetaLimit=Math.PI/2;camera.lowerRadiusLimit=.32;camera.upperRadiusLimit=6;camera.lowerAlphaLimit=null;camera.upperAlphaLimit=null;camera.inertia=0;camera.minZ=.02;
const sky=new B.HemisphericLight('sky',new B.Vector3(0,1,0),scene);sky.intensity=1.15;const sun=new B.DirectionalLight('key',new B.Vector3(-.6,-1,.5),scene);sun.intensity=1.3;
const ground=B.MeshBuilder.CreateGround('floor',{width:20,height:20},scene);ground.position.y=-.012;const floor=new B.StandardMaterial('floor',scene);floor.diffuseColor=new B.Color3(.30,.35,.35);floor.specularColor=B.Color3.Black();ground.material=floor;
const result=await B.SceneLoader.ImportMeshAsync(null,'https://raw.githubusercontent.com/copperisbetter-lang/Wvlrp/c854a29aa2264d5354eea72ba5cbc2badff17546/world-creator/assets/','beach-npc-clothed-v1.glb',scene,undefined,'.glb');
const meshes=result.meshes.filter(m=>m.getTotalVertices()>0);if(!meshes.length)throw Error('Empty model');for(const m of meshes)m.computeWorldMatrix(true);let min=new B.Vector3(Infinity,Infinity,Infinity),max=new B.Vector3(-Infinity,-Infinity,-Infinity);for(const m of meshes){const b=m.getBoundingInfo().boundingBox;min=B.Vector3.Minimize(min,b.minimumWorld);max=B.Vector3.Maximize(max,b.maximumWorld)}const h=max.y-min.y;if(!(h>.05&&isFinite(h)))throw Error('Invalid character bounds');
const root=new B.TransformNode('preview placement',scene);for(const m of result.meshes)if(!m.parent)m.parent=root;const s=1.08/h;root.scaling.setAll(s);root.position.set(-(min.x+max.x)*s/2,-min.y*s,-(min.z+max.z)*s/2);
const zoomLabel=document.getElementById('zoomLabel');
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function view(k){camera.target.set(0,k==='face'?.93:.56,0);camera.radius=k==='face'?.79:2.5;camera.beta=1.45;camera.alpha=-Math.PI/2}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));view('reset');
const pointers=new Map();let lastPinch=0;
function distance(){const p=[...pointers.values()];return p.length>=2?Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y):0}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});lastPinch=distance()},{passive:false});
canvas.addEventListener('pointermove',e=>{const old=pointers.get(e.pointerId);if(!old)return;e.preventDefault();pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){const gain=2*Math.PI/Math.max(160,canvas.clientWidth);camera.alpha-=(e.clientX-old.x)*gain;camera.beta=clamp(camera.beta-(e.clientY-old.y)*Math.PI/Math.max(120,canvas.clientHeight),camera.lowerBetaLimit,camera.upperBetaLimit)}else if(pointers.size===2){const d=distance();if(lastPinch>3&&d>3)camera.radius=clamp(camera.radius*lastPinch/d,camera.lowerRadiusLimit,camera.upperRadiusLimit);lastPinch=d}},{passive:false});
function release(e){pointers.delete(e.pointerId);lastPinch=distance()}for(const ev of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(ev,release);
canvas.addEventListener('wheel',e=>{e.preventDefault();camera.radius=clamp(camera.radius*Math.exp(e.deltaY*.0015),camera.lowerRadiusLimit,camera.upperRadiusLimit)},{passive:false});
const groups=result.animationGroups;const patterns={idle:/idle|stand/i,walk:/walk/i,run:/run|jog/i,sit:/sit on bench|seated|sit/i,wave:/wave/i};const clips={};let active=null,paused=false;const pause=document.getElementById('pause'),speed=document.getElementById('speed');
for(const [k,p] of Object.entries(patterns)){clips[k]=groups.find(g=>p.test(g.name));const b=document.querySelector('[data-clip="'+k+'"]');b.disabled=!clips[k];b.onclick=()=>play(k)}
function play(k){if(!clips[k])return;groups.forEach(g=>g.stop());active=clips[k];active.start(k!=='sit',Number(speed.value));paused=false;pause.textContent='Pause';pause.disabled=false;document.querySelectorAll('[data-clip]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.clip===k)));status.textContent='Playing '+active.name+' • native skin • '+(clips.run?'run available':'run not installed')}
const knees=document.getElementById('knees'),elbows=document.getElementById('elbows');knees.disabled=!clips.walk;elbows.disabled=!(clips.wave||clips.walk);function jointReview(k,label){view('reset');speed.value='.25';play(k);status.textContent=label+' • slow-motion gameplay animation (whole character)'}knees.onclick=()=>jointReview('walk','Knee movement during walk');elbows.onclick=()=>jointReview(clips.wave?'wave':'walk','Elbow movement during gameplay');pause.onclick=()=>{if(!active)return;if(paused){active.play(active.loopAnimation);pause.textContent='Pause'}else{active.pause();pause.textContent='Resume'}paused=!paused};speed.oninput=()=>{if(active)active.speedRatio=Number(speed.value)};
if(clips.idle)play('idle');else status.textContent='Model loaded; select an available action.';engine.runRenderLoop(()=>{scene.render();fps.textContent=Math.round(engine.getFps())+' FPS';zoomLabel.textContent=Math.round(250/camera.radius)+'%'});window.addEventListener('resize',()=>engine.resize());
}catch(e){status.textContent='Unable to load preview';document.getElementById('err').textContent=e.message;console.error(e)}})();
</script></body></html>
