<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Wild • Young Explorer gameplay review</title><style>*{box-sizing:border-box}body{margin:0;background:#182832;color:white;font:14px system-ui}main{height:100dvh;display:flex;flex-direction:column}header,footer{padding:6px 10px;flex:none}header{display:flex;justify-content:space-between}#stage{flex:1;min-height:0;position:relative;touch-action:none;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}nav{display:flex;align-items:center;gap:5px;overflow-x:auto;padding:3px 0}button{flex:none;padding:8px 13px;background:#2e4d60;color:white;border:1px solid #7892a0;border-radius:7px;font:inherit}button:disabled{opacity:.45}button[aria-pressed=true]{background:#55788c;border-color:white}#status,small{font-size:12px;color:#c5d6e0}#fps{font-variant-numeric:tabular-nums}input{width:75px}label{white-space:nowrap}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><main><header><b>Young Explorer • Three.js gameplay review</b><span id="fps">-- FPS</span></header><div id="stage" aria-label="Fully clothed NPC gameplay review"></div><footer><nav><button id="reset">Reset camera</button><button id="face">Face</button><small>Drag to orbit and tilt • pinch to zoom</small></nav><nav aria-label="Gameplay actions"><button data-action="idle" disabled>Stand</button><button data-action="walk" disabled>Walk</button><button data-action="sit" disabled>Sit</button><button data-action="wave" disabled>Wave</button><button id="pause" disabled>Pause</button><label>Speed <input id="speed" type="range" min=".25" max="1" step=".25" value="1"></label></nav><nav><small>Native skin • Genesis 9 maps and run clip not in this export</small></nav><div id="status" role="status">Loading character…</div></footer></main><script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const stage=document.getElementById('stage'),status=document.getElementById('status'),fps=document.getElementById('fps'),pause=document.getElementById('pause'),speed=document.getElementById('speed');
window.addEventListener('error',e=>{status.textContent='Viewer error: '+e.message});window.addEventListener('unhandledrejection',e=>{status.textContent='Viewer error: '+String(e.reason)});
const scene=new THREE.Scene();scene.background=new THREE.Color('#344650');const camera=new THREE.PerspectiveCamera(39,1,.015,40);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;stage.append(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.12;controls.enablePan=false;controls.minDistance=.32;controls.maxDistance=7;controls.minPolarAngle=.06;controls.maxPolarAngle=Math.PI/2;controls.rotateSpeed=1;controls.zoomSpeed=1;controls.touches.ONE=THREE.TOUCH.ROTATE;controls.touches.TWO=THREE.TOUCH.DOLLY_PAN;
scene.add(new THREE.HemisphereLight(0xffffff,0x8193a5,2));const key=new THREE.DirectionalLight(0xffffff,2);key.position.set(3,5,7);scene.add(key);const fill=new THREE.DirectionalLight(0xffffff,.7);fill.position.set(-3,2,-5);scene.add(fill);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:0x667778,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.012;scene.add(floor);
let mixer=null,active=null,root=null,paused=false;const actions={};const clock=new THREE.Clock();
function resize(){const w=Math.max(1,stage.clientWidth),h=Math.max(1,stage.clientHeight);renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(stage);resize();
function reset(face=false){const y=face?.94:.55;controls.target.set(0,y,0);camera.position.set(0,y+(face?.035:.15),face?.7:Math.max(2.1,1.9/Math.min(1,camera.aspect)));controls.update()}
document.getElementById('reset').onclick=()=>reset();document.getElementById('face').onclick=()=>reset(true);reset();
const clipNames={idle:'Young Explorer Idle',walk:'Young Explorer Walk',sit:'Beach NPC Sit on Bench',wave:'Young Explorer Wave'};
function play(k){if(!actions[k])return;if(active)active.stop();active=actions[k];active.reset();active.enabled=true;active.paused=false;active.setEffectiveWeight(1);active.setEffectiveTimeScale(Number(speed.value));active.setLoop(k==='sit'?THREE.LoopOnce:THREE.LoopRepeat,k==='sit'?1:Infinity);active.clampWhenFinished=k==='sit';active.play();paused=false;pause.disabled=false;pause.textContent='Pause';document.querySelectorAll('[data-action]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.action===k)));status.textContent='Playing '+clipNames[k]}
pause.onclick=()=>{if(!active)return;paused=!paused;active.paused=paused;pause.textContent=paused?'Resume':'Pause'};speed.oninput=()=>{if(active)active.setEffectiveTimeScale(Number(speed.value))};
const url='https://raw.githubusercontent.com/copperisbetter-lang/Wvlrp/c854a29aa2264d5354eea72ba5cbc2badff17546/world-creator/assets/beach-npc-gameplay-preview.glb';
new GLTFLoader().load(url,g=>{try{root=g.scene;const bounds=new THREE.Box3().setFromObject(root),size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3());if(!(size.y>.01&&Number.isFinite(size.y)))throw Error('Invalid character bounds');const scale=1.08/size.y;const placement=new THREE.Group();placement.scale.setScalar(scale);placement.position.set(-center.x*scale,-bounds.min.y*scale,-center.z*scale);placement.add(root);scene.add(placement);mixer=new THREE.AnimationMixer(root);for(const [k,name] of Object.entries(clipNames)){const clip=THREE.AnimationClip.findByName(g.animations,name),button=document.querySelector('[data-action="'+k+'"]');if(clip&&clip.tracks.length){actions[k]=mixer.clipAction(clip);button.disabled=false;button.onclick=()=>play(k)}}reset();if(actions.idle)play('idle');else status.textContent='Loaded model; idle clip missing. Select available animation.'}catch(e){status.textContent='Model setup failed: '+e.message}},undefined,e=>{status.textContent='Model load failed: '+(e.message||'network or asset error')});
let frames=0,elapsed=0;renderer.setAnimationLoop(()=>{const d=Math.min(clock.getDelta(),.1);if(mixer)mixer.update(d);controls.update();renderer.render(scene,camera);frames++;elapsed+=d;if(elapsed>.65){fps.textContent=Math.round(frames/elapsed)+' FPS';frames=0;elapsed=0}});
</script></body></html>
