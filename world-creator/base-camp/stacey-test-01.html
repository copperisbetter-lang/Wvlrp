<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>STACEY-TEST-01</title><style>body{margin:0;background:#151d21;color:white;font:15px Arial}#panel{position:absolute;top:12px;left:12px;background:#17242bdc;padding:12px;border-radius:10px;max-width:240px}button{margin:4px;padding:9px;border:0;border-radius:6px}</style></head><body><div id="panel"><b>G3 · STACEY-TEST-01</b><p>Isolated animation / placement prototype. Placeholder figure; photographic likeness not yet reconstructed.</p><button onclick="mode='walk'">Walk</button><button onclick="mode='idle'">Stand</button><button onclick="mode='sit'">Sit</button><button onclick="mode='swim'">Swim</button><p id="status">Stand</p></div><script type="module">import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';const s=new T.Scene();s.background=new T.Color('#a5c9dd');const c=new T.PerspectiveCamera(55,innerWidth/innerHeight,.1,300);c.position.set(0,2.8,9);const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(r.domElement);s.add(new T.HemisphereLight(0xffffff,0x708096,2));const sun=new T.DirectionalLight(0xfff0ce,2);sun.position.set(-5,9,6);s.add(sun);function plane(w,h,color,x,y,z){const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshStandardMaterial({color,side:T.DoubleSide}));m.rotation.x=-Math.PI/2;m.position.set(x,y,z);s.add(m)}plane(300,300,'#d5b987',0,-.02,60);plane(300,300,'#3e9db5',0,-.03,-140);const skin=new T.MeshStandardMaterial({color:'#d7a17f'}),yellow=new T.MeshStandardMaterial({color:'#f7e52b'}),hair=new T.MeshStandardMaterial({color:'#cbb276'});function part(parent,r1,r2,len,mat,x,y,z){let mesh=new T.Mesh(new T.CylinderGeometry(r1,r2,len,12),mat);mesh.position.set(x,y,z);parent.add(mesh);return mesh}const figure=new T.Group();s.add(figure);figure.position.z=0;part(figure,.22,.28,.73,skin,0,1.45,0);part(figure,.27,.19,.4,skin,0,.93,0);const head=new T.Mesh(new T.SphereGeometry(.23,20,16),skin);head.position.y=2.14;figure.add(head);const cap=new T.Mesh(new T.SphereGeometry(.245,20,16,0,Math.PI*2,0,Math.PI*.55),hair);cap.position.y=2.22;figure.add(cap);for(let i=-1;i<=1;i+=2){part(figure,.075,.06,.58,hair,i*.21,1.92,-.04);part(figure,.17,.17,.24,yellow,i*.16,1.58,.23)}part(figure,.28,.29,.19,yellow,0,.91,.01);const limbs=[];for(let side of [-1,1]){for(let arm of [false,true]){let pivot=new T.Group();pivot.position.set(side*(arm?.29:.16),arm?1.83:.86,0);figure.add(pivot);part(pivot,arm?.075:.12,arm?.06:.095,arm?.62:.79,skin,0,arm?-.29:-.37,0);limbs.push({pivot,side,arm})}}window.mode='idle';const clock=new T.Clock();function tick(){requestAnimationFrame(tick);let t=clock.getElapsedTime();for(let l of limbs){l.pivot.rotation.x=mode==='walk'?Math.sin(t*5+(l.side>0?Math.PI:0))*(l.arm?-.45:.55):mode==='swim'?Math.sin(t*4+(l.side>0?Math.PI:0))*.65:mode==='sit'&&!l.arm?-1.4:0}figure.position.y=mode==='walk'?Math.abs(Math.sin(t*5))*.045:mode==='sit'?-.38:0;figure.rotation.x=mode==='swim'?-Math.PI/2:0;document.getElementById('status').textContent=mode.toUpperCase();r.render(s,c)}tick();addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)})</script></body></html>
