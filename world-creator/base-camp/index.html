<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>The Wild | Base Camp Orientation</title><style>body{margin:0;background:#141d20;color:white;font:14px system-ui;overflow:hidden}#hud{position:fixed;top:12px;left:12px;background:#071217c9;padding:12px;border-radius:12px;max-width:280px}#pad{position:fixed;bottom:30px;left:30px;width:120px;height:120px;border:2px solid #ffffff88;border-radius:50%;touch-action:none;background:#ffffff19}#nub{position:absolute;width:48px;height:48px;left:36px;top:36px;border-radius:50%;background:#ffffff9c}#look{position:fixed;right:0;top:0;width:55vw;height:100vh;touch-action:none}#clock{width:100%}button{background:#d9e9db;border:0;border-radius:8px;padding:7px}small{display:block;color:#f9d38b}</style></head><body><div id="look"></div><div id="hud"><b>THE WILD · BASE CAMP</b><small>FOUNDATION VIEWER — photographic ground-material test; vegetation and buildings are not installed yet.</small><p id="info">Loading world…</p><small id="assetStatus">Loading photographic ground material…</small><label>Time of day <input id="clock" type="range" min="6" max="20" step=".1" value="12"></label><button id="reset">Return to center</button></div><div id="pad"><div id="nub"></div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"}}</script><script type="module">
import * as THREE from 'three';import {BASE_CAMP_RADIUS_M,perimeterClearings,sunDirection} from './orientation-config.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bb9c8);scene.fog=new THREE.FogExp2(0xa1b8b6,.0014);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,1700);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
const hemi=new THREE.HemisphereLight(0xe7f5ff,0x43503d,1.7);scene.add(hemi);const sun=new THREE.DirectionalLight(0xfff1d8,2.4);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-100;sun.shadow.camera.right=100;sun.shadow.camera.top=100;sun.shadow.camera.bottom=-100;scene.add(sun,sun.target);
const terrainY=(x,z)=>7*Math.sin(x/92)*Math.cos(z/78)+3*Math.sin(z/34)+2*Math.cos(x/43);
const N=160,verts=[],idx=[];for(let z=0;z<=N;z++)for(let x=0;x<=N;x++){let xx=(x/N*2-1)*BASE_CAMP_RADIUS_M,zz=(z/N*2-1)*BASE_CAMP_RADIUS_M;verts.push(xx,terrainY(xx,zz),zz)}for(let z=0;z<N;z++)for(let x=0;x<N;x++){let a=z*(N+1)+x,b=a+1,c=a+N+1,d=c+1;{const mx=(x+.5)/N*2-1,mz=(z+.5)/N*2-1;if(Math.hypot(mx,mz)<=1.002)idx.push(a,c,b,b,c,d)}}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));geo.setIndex(idx);const uvs=[];for(let z=0;z<=N;z++)for(let x=0;x<=N;x++)uvs.push(x/N,z/N);geo.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));geo.computeVertexNormals();const groundMaterial=new THREE.MeshStandardMaterial({color:0xffffff,roughness:1,side:THREE.DoubleSide});const ground=new THREE.Mesh(geo,groundMaterial);const textureLoader=new THREE.TextureLoader();textureLoader.setCrossOrigin('anonymous');textureLoader.load('https://dl.polyhaven.org/file/ph-assets/Textures/png/1k/forest_floor/forest_floor_diff_1k.png',tex=>{tex.colorSpace=THREE.SRGBColorSpace;tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(95,95);groundMaterial.map=tex;groundMaterial.needsUpdate=true;document.getElementById('assetStatus').textContent='Forest-floor photo texture loaded';textureLoader.load('https://dl.polyhaven.org/file/ph-assets/Textures/png/1k/forest_floor/forest_floor_nor_gl_1k.png',normal=>{normal.wrapS=normal.wrapT=THREE.RepeatWrapping;normal.repeat.set(95,95);groundMaterial.normalMap=normal;groundMaterial.normalScale.set(.6,.6);groundMaterial.needsUpdate=true;document.getElementById('assetStatus').textContent='Forest-floor color + normal maps loaded';});},undefined,()=>{groundMaterial.color.set(0x536c43);document.getElementById('assetStatus').textContent='Texture unavailable — diagnostic fallback active';});ground.receiveShadow=true;scene.add(ground);
// The terrain mesh itself is circular; no painted boundary ring is shown.
const clearGeo=new THREE.CircleGeometry(4.8,32),clearMat=new THREE.MeshStandardMaterial({color:0x75674c,roughness:1,side:THREE.DoubleSide});for(const p of perimeterClearings){const inward=.985;const x=p.x*inward,z=p.z*inward;const m=new THREE.Mesh(clearGeo,clearMat);m.rotation.x=-Math.PI/2;m.position.set(x,terrainY(x,z)+.32,z);scene.add(m)}
// Base Camp building meshes intentionally not fabricated from generic geometry. Approved models pending.
const pos=new THREE.Vector3(0,terrainY(0,0)+2,15);let yaw=0,pitch=0;const pad=document.getElementById('pad'),nub=document.getElementById('nub');let moveX=0,moveY=0,drag=null;
pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);drag=e.pointerId;updatePad(e)});pad.addEventListener('pointermove',e=>{if(drag===e.pointerId)updatePad(e)});function updatePad(e){const r=pad.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,len=Math.max(1,Math.hypot(dx,dy)),s=Math.min(43,len)/len;moveX=dx*s/43;moveY=dy*s/43;nub.style.transform=`translate(${dx*s}px,${dy*s}px)`}function stop(){drag=null;moveX=moveY=0;nub.style.transform=''}pad.addEventListener('pointerup',stop);pad.addEventListener('pointercancel',stop);
const look=document.getElementById('look');let last=null;look.addEventListener('pointerdown',e=>{look.setPointerCapture(e.pointerId);last=[e.clientX,e.clientY]});look.addEventListener('pointermove',e=>{if(!last)return;yaw-=(e.clientX-last[0])*.004;pitch=Math.max(-1.25,Math.min(1.25,pitch-(e.clientY-last[1])*.004));last=[e.clientX,e.clientY]});look.addEventListener('pointerup',()=>last=null);
document.getElementById('reset').onclick=()=>{pos.set(0,terrainY(0,0)+2,15);yaw=0;pitch=0};
const clock=document.getElementById('clock');let previous=performance.now();function tick(now){requestAnimationFrame(tick);let dt=Math.min(.05,(now-previous)/1000);previous=now;const f=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),r=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));pos.addScaledVector(f,-moveY*dt*8);pos.addScaledVector(r,moveX*dt*8);if(Math.hypot(pos.x,pos.z)>BASE_CAMP_RADIUS_M-5){const k=(BASE_CAMP_RADIUS_M-5)/Math.hypot(pos.x,pos.z);pos.x*=k;pos.z*=k}pos.y=terrainY(pos.x,pos.z)+2;camera.position.copy(pos);camera.rotation.order='YXZ';camera.rotation.set(pitch,yaw,0);const d=sunDirection(+clock.value);sun.position.set(pos.x+d.x*180,d.y*180,pos.z+d.z*180);sun.target.position.set(pos.x,0,pos.z);sun.target.updateMatrixWorld();sun.intensity=Math.max(.08,d.y*3);document.getElementById('info').textContent=`${perimeterClearings.length} empty perimeter clearings · ${Math.round(Math.hypot(pos.x,pos.z))}m from center · ${clock.value}:00`;renderer.render(scene,camera)}requestAnimationFrame(tick);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
