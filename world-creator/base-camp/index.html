<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>The Wild | Base Camp Orientation</title><style>body{margin:0;background:#141d20;color:white;font:14px system-ui;overflow:hidden}#hud{position:fixed;top:12px;left:12px;background:#071217c9;padding:12px;border-radius:12px;max-width:280px;z-index:3}#hud.compact{padding:8px 10px;max-width:245px}#hud.compact small,#hud.compact label,#hud.compact #reset{display:none}#hud.compact #info{font-size:12px;margin:5px 0}#hudToggle{margin-top:4px;cursor:pointer}#pad{position:fixed;bottom:30px;left:30px;width:120px;height:120px;border:2px solid #ffffff88;border-radius:50%;touch-action:none;background:#ffffff19}#nub{position:absolute;width:48px;height:48px;left:36px;top:36px;border-radius:50%;background:#ffffff9c}#look{position:fixed;right:0;top:0;width:55vw;height:100vh;touch-action:none}#clock{width:100%}button{background:#d9e9db;border:0;border-radius:8px;padding:7px}small{display:block;color:#f9d38b}</style></head><body><div id="look"></div><div id="hud" class="compact"><b>THE WILD · BASE CAMP</b><small>Mobile-optimized photographic forest streams nearby; approved buildings are still pending.</small><p id="info">Loading world…</p><small id="assetStatus">Loading photographic ground material…</small><small id="forestStatus">Preparing photo-textured tree models…</small><small id="perfStatus">Measuring GPU load…</small><small id="understoryStatus">Ground-level foliage not yet loaded…</small><label>Time of day <input id="clock" type="range" min="6" max="20" step=".1" value="12"></label><label>Tree density <input id="treeDensity" type="range" min="8" max="128" step="4" value="96"></label><button id="reset">Return to center</button><button id="hudToggle" aria-expanded="false">Show details</button></div><div id="pad"><div id="nub"></div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/thr const waterShape=new THREE.Shape();for(let i=0;i<=192;i++){const a=i/192*Math.PI*2,w=shorelineWave(a),x=LAKE.rx*Math.cos(a)*w,z=LAKE.rz*Math.sin(a)*w;if(i===0)waterShape.moveTo(x,z);else waterShape.lineTo(x,z)}

 interiorClearings.push({id:'interior-'+String(interiorClearings.length+1).padStart(2,'0'),x,z,type:'natural-unfurnished-clearing'});
  // No floating brown discs: vegetation setbacks reveal a genuine natural clearing.
}

// Base Camp building meshes intentionally not fabricated from generic geometry. Approved models pending.

   treeDensity.max=mobileProfile?'128':'320';
   activeForest?.setDensity?.(+treeDensity.value,pos.x,pos.z,yaw);

const pos=new THREE.Vector3(0,terrainY(0,0)+2,15);let yaw=0,pitch=0;const pad=document.getElementById('pad'),nub=document.getElementById('nub');let moveX=0,moveY=0,drag=null;
pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);drag=e.pointerId;updatePad(e)});pad.addEventListener('pointermove',e=>{if(drag===e.pointerId)updatePad(e)});function updatePad(e){const r=pad.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,len=Math.max(1,Math.hypot(dx,dy)),s=Math.min(43,len)/len;moveX=dx*s/43;moveY=dy*s/43;nub.style.transform=`translate(${dx*s}px,${dy*s}px)`}function stop(){drag=null;moveX=moveY=0;nub.style.transform=''}pad.addEventListener('pointerup',stop);pad.addEventListener('pointercancel',stop);

const clock=document.getElementById('clock'),treeDensity=document.getElementById('treeDensity');treeDensity.oninput=()=>activeForest?.setDensity?.(+treeDensity.value,pos.x,pos.z,yaw);const moveForward=new THREE.Vector3(),moveRight=new THREE.Vector3();let previous=performance.now(),lastHudUpdate=0;

   if(struggling){
     if(renderScale>.58){
