async function forest(){try{const g=(await gltf.loadAsync(ASSET+'maple_trees_planting_clean.glb')).scene;const types=g.children.filter(c=>/large_3|medium_2|medium_3/i.test(c.name));if(!types.length)throw Error('No named tree models');const all=types.map(()=>[]);const TREE_SHORE_CLEARANCE_M=60;for(let i=0;i<155;i++){const a=rand()*Math.PI*2,d=TREE_SHORE_CLEARANCE_M+rand()*124,r=outer(a)+d,x=CX+Math.cos(a)*r,z=CZ+Math.sin(a)*r;all[i%types.length].push({x,z,y:ground(x,z),h:12+rand()*13,w:.85+rand()*.3,a:rand()*6.28})}/* Keep the lake island clear of trees as well. */types.forEach((tree,i)=>instances(tree,all[i]));forestBackdrop(types[2]||types[0]);diag.trees+=all.reduce((n,a)=>n+a.length,0);diag.assets.maples='ready';}catch(e){diag.assets.maples='FAILED';diag.errors.push(String(e))}}
function forestBackdrop(source){const clone=source.clone(true);clone.updateMatrixWorld(true);clone.traverse(m=>{if(m.isMesh){m.material=m.material.clone();m.material.alphaTest=.08;m.material.transparent=false;m.material.depthWrite=true;m.material.side=T.DoubleSide}});const b=new T.Box3().setFromObject(clone),sz=b.getSize(new T.Vector3()),center=b.getCenter(new T.Vector3());clone.position.sub(center);const sc=new T.Scene();sc.add(clone);sc.add(new T.HemisphereLight(0xe5f2ff,0x62753e,2));const dl=new T.DirectionalLight(0xfff1d0,2.5);dl.position.set(-10,20,20);sc.add(dl);const h=sz.y*1.08,w=Math.max(sz.x,sz.z)*1.2,cam=new T.OrthographicCamera(-w/2,w/2,h/2,-h/2,.1,h*5);cam.position.set(0,0,h*2);cam.lookAt(0,0,0);const target=new T.WebGLRenderTarget(256,512);const old=renderer.getRenderTarget(),clear=renderer.getClearColor(new T.Color()),alpha=renderer.getClearAlpha();renderer.setRenderTarget(target);renderer.setClearColor(0x000000,0);renderer.render(sc,cam);renderer.setRenderTarget(old);renderer.setClearColor(clear,alpha);const material=new T.MeshBasicMaterial({map:target.texture,alphaTest:.08,side:T.DoubleSide,fog:true});const mesh=new T.InstancedMesh(new T.PlaneGeometry(w/h,1),material,650);const d=new T.Object3D();for(let i=0;i<650;i++){const a=rand()*Math.PI*2,r=outer(a)+60+rand()*125,x=CX+Math.cos(a)*r,z=CZ+Math.sin(a)*r,height=16+rand()*15;d.position.set(x,ground(x,z)+height/2,z);d.scale.set(height,height,height);d.rotation.y=Math.atan2(CX-x,CZ-z);d.updateMatrix();mesh.setMatrixAt(i,d.matrix)}mesh.computeBoundingSphere();scene.add(mesh);diag.assets['forest backdrop']='ready';diag.trees+=650;}
async function stones(){try{const root=(await gltf.loadAsync(ASSET+'village-floor-rock_moss_set_01.glb')).scene;root.updateMatrixWorld(true);let m,big=0;root.traverse(c=>{if(c.isMesh){const s=new T.Box3().setFromObject(c).getSize(new T.Vector3()),v=s.x*s.y*s.z;if(v>big){big=v;m=c}}});if(!m)throw Error('No rock mesh');m=m.clone();m.geometry=compactRock(m.geometry);const p=[];for(let i=0;i<510;i++){const a=rand()*6.283,ins=i<130;const r=(ins?inner(a):outer(a))+(rand()-.5)*2.6,x=CX+Math.cos(a)*r,z=CZ+Math.sin(a)*r;if(!ins&&Math.hypot(x-140,z+117.2)<69*.3048)continue;if(Math.sin(a*9+1)<-.2)continue;const h=rand()<.15?.9+rand()*1.0:.27+rand()*.34;p.push({x,z,y:ground(x,z)-.12,h,w:1.1+rand()*.65,a:rand()*6.283})}instances(rootSubset(m),p);diag.rocks=p.length;diag.assets.rocks='ready'}catch(e){diag.assets.rocks='FAILED';diag.errors.push(String(e))}}
function compactRock(g){const a=g.attributes.position,u=g.attributes.uv;g.computeBoundingBox();const box=g.boundingBox,size=box.getSize(new T.Vector3()),map=new Map(),remap=[],v=[],uv=[];for(let i=0;i<a.count;i++){const x=a.getX(i),y=a.getY(i),z=a.getZ(i),key=[Math.round((x-box.min.x)/size.x*10),Math.round((y-box.min.y)/size.y*10),Math.round((z-box.min.z)/size.z*10)].join(',');if(!map.has(key)){map.set(key,v.length/3);v.push(x,y,z);if(u)uv.push(u.getX(i),u.getY(i))}remap.push(map.get(key))}const idx=g.index?g.index.array:Array.from({length:a.count},(_,i)=>i),out=[];for(let i=0;i<idx.length;i+=3){const x=remap[idx[i]],y=remap[idx[i+1]],z=remap[idx[i+2]];if(x!==y&&y!==z&&x!==z)out.push(x,y,z)}const h=new T.BufferGeometry();h.setAttribute('position',new T.Float32BufferAttribute(v,3));if(u)h.setAttribute('uv',new T.Float32BufferAttribute(uv,2));h.setIndex(out);h.computeVertexNormals();diag.rockTriangles=out.length/3;return h}
function rootSubset(m){const g=new T.Group(),c=m.clone();c.matrix.copy(m.matrixWorld);c.matrixAutoUpdate=false;g.add(c);return g}
async function understory(){for(const [file,label,count] of [['village-pbr-pine_sapling_small.glb','pines',54],['village-floor-fern_02.glb','ferns',95]]){try{const g=(await gltf.loadAsync(ASSET+file)).scene;const p=[];for(let i=0;i<count;i++){const a=rand()*6.283,r=outer(a)+(label==='pines'?60+rand()*63:5+rand()*19),x=CX+Math.cos(a)*r,z=CZ+Math.sin(a)*r;if(Math.hypot(x-140,z+117.2)<21.0312)continue;p.push({x,z,y:ground(x,z),h:label==='pines'?9+rand()*8:.4+rand()*.45,w:1,a:rand()*6.283})}instances(g,p);diag.assets[label]='ready';if(label==='pines')diag.trees+=p.length;}catch(e){diag.assets[label]='FAILED';diag.errors.push(label+': '+String(e))}}}
forest();stones();understory();
let aerial=false,yaw=0,pitch=-.04,depthMode="surface";const pos=new T.Vector3(CX,CY+2.1,CZ+outer(Math.PI/2)+8);let mx=0,my=0;const keys=new Set();addEventListener('keydown',e=>keys.add(e.code));addEventListener('keyup',e=>keys.delete(e.code));
function beach(){depthMode="surface";aerial=false;pos.set(CX,ground(CX,CZ+outer(Math.PI/2)+8)+1.7,CZ+outer(Math.PI/2)+8);yaw=0;pitch=-.04}beach();document.querySelector('#shore').onclick=beach;document.querySelector('#air').onclick=()=>{aerial=!aerial;if(aerial){pos.set(CX+165,CY+145,CZ+195);camera.position.copy(pos);camera.rotation.order='YXZ';camera.lookAt(CX,CY,CZ);yaw=camera.rotation.y;pitch=camera.rotation.x}else beach()};let high=false;document.querySelector('#quality').onclick=()=>{high=!high;renderer.setPixelRatio(high?Math.min(devicePixelRatio,1.8):1);document.querySelector('#quality').textContent=high?'Quality: high':'Quality: normal'};
document.querySelector('#dive').onclick=()=>{aerial=false;depthMode='dive'};document.querySelector('#surface').onclick=()=>{aerial=false;depthMode='surface'};const look=document.querySelector('#look');let looking=null,lx=0,ly=0;look.onpointerdown=e=>{if(looking!==null)return;looking=e.pointerId;lx=e.clientX;ly=e.clientY;look.setPointerCapture(e.pointerId)};look.onpointermove=e=>{if(e.pointerId!==looking)return;yaw-=(e.clientX-lx)*.003;pitch=T.MathUtils.clamp(pitch-(e.clientY-ly)*.003,-1.4,1.4);lx=e.clientX;ly=e.clientY};look.onpointerup=look.onpointercancel=()=>looking=null;
const pad=document.querySelector('#pad'),nub=document.querySelector('#nub');let moving=null;function padMove(e){const r=pad.getBoundingClientRect(),x=e.clientX-r.left-55,y=e.clientY-r.top-55,k=38/Math.max(38,Math.hypot(x,y));mx=x*k/38;my=y*k/38;nub.style.transform=`translate(${mx*38}px,${my*38}px)`}pad.onpointerdown=e=>{moving=e.pointerId;pad.setPointerCapture(e.pointerId);padMove(e)};pad.onpointermove=e=>{if(e.pointerId===moving)padMove(e)};pad.onpointerup=pad.onpointercancel=()=>{moving=null;mx=my=0;nub.style.transform=''};addEventListener('blur',()=>{keys.clear();mx=my=0;looking=moving=null});
let last=performance.now(),count=0,frames=0,fps=0;const start=last;function frame(now){if(!window.staceyPause)requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;window.staceyWaterfall?.update(now*.001);water.material.uniforms.time.value=(now-start)/1000*.26;const xx=mx+(keys.has('KeyD')?1:0)-(keys.has('KeyA')?1:0),yy=my+(keys.has('KeyS')?1:0)-(keys.has('KeyW')?1:0),spd=dt*(aerial?28:4.2);pos.x+=(Math.cos(yaw)*xx+Math.sin(yaw)*yy)*spd;pos.z+=(-Math.sin(yaw)*xx+Math.cos(yaw)*yy)*spd;const r=Math.hypot(pos.x-CX,pos.z-CZ);if(r>305){pos.x=CX+(pos.x-CX)*305/r;pos.z=CZ+(pos.z-CZ)*305/r}const bed=ground(pos.x,pos.z),swim=bed<CY-.55;if(!aerial){if(swim&&depthMode==='dive'){pos.y=Math.min(CY-1.1,bed+1.7)}else{pos.y=swim?CY+.65:bed+1.7}}camera.position.copy(pos);camera.rotation.order='YXZ';camera.rotation.set(pitch,yaw,0);renderer.render(scene,camera);count+=dt;frames++;if(count>1){fps=Math.round(frames/count);count=frames=0;diag.fps=fps;status.textContent=(aerial?'Aerial':swim?(depthMode==='dive'?'Underwater':'Swimming'):'Shore')+' · '+fps+' FPS · '+diag.trees+' trees · '+diag.rocks+' rocks'+(diag.errors.length?' · '+diag.errors.join('; '):' · '+(diag.trees?'Ready':'Loading trees…'));diag.draws=renderer.info.render.calls;diag.triangles=renderer.info.render.triangles;diag.frame=true}}
window.staceyDebug={scene,camera,renderer};requestAnimationFrame(frame);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
