 // Recover the exact owner-approved V6 GLB from nine byte-for-byte GitHub blobs.
 // The waterfalls, shared pond, creek, quest cave, lake water and fish are separate game objects.
 async function installCanyonV6(){
  diag.assets['Canyon V6']='loading';
  try{
   const urls=Array.from({length:9},(_,i)=>'./canyon-v6/chunk-'+String(i).padStart(2,'0')+'.bin');
   const chunks=await Promise.all(urls.map(async u=>{
    const r=await fetch(u);if(!r.ok)throw Error('Canyon chunk HTTP '+r.status+' '+u);
    return new Uint8Array(await r.arrayBuffer());
   }));
   const size=chunks.reduce((a,c)=>a+c.length,0);
   if(size!==6468040)throw Error('Canyon asset length '+size);
   const bytes=new Uint8Array(size);let offset=0;
   for(const chunk of chunks){bytes.set(chunk,offset);offset+=chunk.length;}
   if(new DataView(bytes.buffer).getUint32(0,true)!==0x46546c67)throw Error('Invalid GLB header');
   if(crypto?.subtle){
    const check=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(v=>v.toString(16).padStart(2,'0')).join('');
    if(check!=='69d79d22169cdf1f7fc7082e28a6521ad47e98ab397531eb4e6784b6d0b06f22')throw Error('Canyon V6 hash mismatch');
   }
   const glb=new GLTFLoader(manager).setMeshoptDecoder(MeshoptDecoder);
   const root=await new Promise((resolve,reject)=>glb.parse(bytes.buffer,'',r=>resolve(r.scene),reject));
   root.scale.setScalar(.3048); // original canyon geometry is measured in feet; game uses meters
   root.rotation.y=Math.PI/2; // open mouth faces the lake on the west/left bank
   root.position.set(wallX+23,pondY-.5,CZ);
   root.name='Stacey Canyon V6 approved photo-rock';

   // dry-rock atlas near the skyline; the scene's Sky then shows through.

    const materials=Array.isArray(o.material)?o.material:[o.material];

     m.side=T.DoubleSide;
     if(/OriginalPhotos|SeamBlended|Dry/i.test(m.name||'')){

        // The embedded rock color texture must remain sampled before masking blue photo-sky pixels.
