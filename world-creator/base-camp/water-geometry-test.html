const lakeParams=new URLSearchParams(location.search);

// Diagnostic state is always visible, even when the compact HUD hides details.
const lakeModeBadge=document.createElement('div');
lakeModeBadge.id='lakeModeBadge';lakeModeBadge.style.cssText='position:fixed;top:8px;right:8px;z-index:5;background:#09252cdd;color:#fff;padding:7px 10px;border-radius:8px;font:12px system-ui;pointer-events:none';

const cleanLakeIndices=[];
