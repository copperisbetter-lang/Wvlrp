  original.scale.setScalar(fishLength/Math.max(dims.x,dims.y,dims.z,.001));
  for(let i=0;i<30;i++){
   const a=rand()*Math.PI*2, r=inner(a)+16+rand()*Math.max(1,outer(a)-inner(a)-33);

}
