<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gator 2 | Purple Ring Excavation Lab</title><style>html,body{margin:0;background:#15221a;color:#e9efdb;font:14px system-ui}#view{height:75vh}#panel{padding:12px}button{font-size:16px;margin:5px;padding:8px}small{display:block;color:#c6d7b8}</style></head><body><div id="panel"><strong>GATOR 2 — ISOLATED 3D CUT PROTOTYPE</strong><small>300°–344° / 2.6m tread / ±9m shoulders. Lab only: NOT live game terrain. Drag to orbit, pinch/scroll to zoom.</small><button id="toggle">Show natural ground</button><span id="info">Loading geometry…</span></div><div id="view"></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';

document.getElementById('info').textContent='Loading profile…';const R=268.224,base=(x,z)=>7*Math.sin(x/92)*Math.cos(z/78)+3*Math.sin(z/34)+2*Math.cos(x/43);
const response=await fetch('./purple-ring-smoothed-transition-profile-20261023.json');if(!response.ok)throw Error('Profile fetch '+response.status);
const stations=(await response.json()).stations,offs=[-9,-8,-7,-6,-5,-4,-3,-2,-1.3,-1,-.5,0,.5,1,1.3,2,3,4,5,6,7,8,9];
const root=document.getElementById('view'),scene=new THREE.Scene();scene.background=new THREE.Color(0xa7b9b2);
const camera=new THREE.PerspectiveCamera(55,root.clientWidth/root.clientHeight,.1,700);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(root.clientWidth,root.clientHeight);root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x354536,2));const sun=new THREE.DirectionalLight(0xffe7b2,2.2);sun.position.set(-40,70,50);scene.add(sun);
const group=new THREE.Group();scene.add(group);const midpoint=322*Math.PI/180;const cx=R*Math.cos(midpoint),cz=R*Math.sin(midpoint);
function build(naturalOnly){const verts=[],colors=[],indices=[],width=offs.length;let maxLong=0,maxCross=0;for(let i=0;i<stations.length;i++){const s=stations[i],a=s.angle_deg*Math.PI/180;let ys=[];for(let j=0;j<width;j++){const off=offs[j],x=(R+off)*Math.cos(a),z=(R+off)*Math.sin(a),natural=base(x,z),t=Math.max(0,Math.min(1,(Math.abs(off)-1.3)/7.7)),fade=t*t*(3-2*t),y=naturalOnly?natural:s.target_height_m*(1-fade)+natural*fade;ys.push(y);verts.push(x-cx,y,z-cz);const color=new THREE.Color(Math.abs(off)<=1.3?0x67533a:Math.abs(off)<4?0x746c56:0x4b6045);colors.push(color.r,color.g,color.b);if(i&&j){const k=i*width+j;indices.push(k,k-1,k-width,k-1,k-width-1,k-width)}}if(!naturalOnly){const left=ys[offs.indexOf(-1.3)],right=ys[offs.indexOf(1.3)];maxCross=Math.max(maxCross,Math.abs(right-left)/2.6*100);if(i){const prior=stations[i-1];maxLong=Math.max(maxLong,Math.abs((s.target_height_m-prior.target_height_m)/(R*(s.angle_deg-prior.angle_deg)*Math.PI/180)*100))}}}
const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));geo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));geo.setIndex(indices);geo.computeVertexNormals();const mesh=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,side:THREE.DoubleSide,roughness:1}));group.add(mesh);document.getElementById('info').textContent=naturalOnly?'Natural ground comparison':('Mesh: '+(verts.length/3)+' vertices / '+(indices.length/3)+' triangles | centerline '+maxLong.toFixed(2)+'% | cross '+maxCross.toFixed(2)+'% (vertex check)');}

// Visual context only: untouched original hillside beyond the graded +/-9m corridor.
// Separate geometry avoids pretending that the isolated prototype is production excavation.
const context=new THREE.Group();scene.add(context);
function surroundingHill(){
 const geometry=new THREE.BufferGeometry(),v=[],colors=[],indices=[];
 const radials=[-45,-38,-31,-24,-17,-10,10,17,24,31,38,45],columns=radials.length;
 for(let i=0;i<stations.length;i++){
  const a=stations[i].angle_deg*Math.PI/180;
  for(let j=0;j<columns;j++){
   const off=radials[j],x=(R+off)*Math.cos(a),z=(R+off)*Math.sin(a);
   v.push(x-cx,base(x,z)-.035,z-cz);
   const c=new THREE.Color(off<0?0x485e40:0x536848);
   colors.push(c.r,c.g,c.b);
   if(i&&j){const k=i*columns+j;indices.push(k,k-1,k-columns,k-1,k-columns-1,k-columns)}
  }
 }
 geometry.setAttribute('position',new THREE.Float32BufferAttribute(v,3));
 geometry.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));
 geometry.setIndex(indices);geometry.computeVertexNormals();
 context.add(new THREE.Mesh(geometry,new THREE.MeshStandardMaterial({vertexColors:true,side:THREE.DoubleSide,roughness:1})));
}
surroundingHill();
 // Procedural exposed-rock cut-face lab geometry; local prototype, not production terrain.
 // Build vertical strata wherever original hillside rises >0.45m above the graded shoulder.
const rockFaces=new THREE.Group();scene.add(rockFaces);
function buildRockFaces(){
 const mats=[
  new THREE.MeshStandardMaterial({color:0x67665d,roughness:1,flatShading:true,side:THREE.DoubleSide}),
  new THREE.MeshStandardMaterial({color:0x777468,roughness:1,flatShading:true,side:THREE.DoubleSide}),
  new THREE.MeshStandardMaterial({color:0x555c51,roughness:1,flatShading:true,side:THREE.DoubleSide})
 ];
 let count=0;
 for(let i=2;i<stations.length-2;i+=3){
  const a=stations[i].angle_deg*Math.PI/180;
  for(const side of [-1,1]){
   const off=side*3.5,x=(R+off)*Math.cos(a),z=(R+off)*Math.sin(a);
   const natural=base(x,z),t=(Math.abs(off)-1.3)/7.7,f=t*t*(3-2*t);
   const grade=stations[i].target_height_m*(1-f)+natural*f,exposure=natural-grade;
   if(exposure<.45)continue;
   const next=stations[Math.min(i+3,stations.length-1)],b=next.angle_deg*Math.PI/180;
   const x2=(R+off)*Math.cos(b),z2=(R+off)*Math.sin(b);
   const natural2=base(x2,z2),grade2=next.target_height_m*(1-f)+natural2*f;
   if(natural2-grade2<.35)continue;
   const verts=[x-cx,grade-.03,z-cz,x2-cx,grade2-.03,z2-cz,x2-cx,natural2+.12,z2-cz,x-cx,natural+.12,z-cz];
   const g=new THREE.BufferGeometry();
   g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
   g.setIndex([0,1,2,0,2,3]);g.computeVertexNormals();
   const mesh=new THREE.Mesh(g,mats[(Math.floor(i/3)+Math.round((side+1)/2))%mats.length]);
   rockFaces.add(mesh);count++;
  }
 }
 document.getElementById('info').textContent+=' | '+count+' exposed-rock panels';
}
buildRockFaces();

 // Narrow drainage swales beyond tread edges; 3D visual test only.
 const drainage=new THREE.Group();scene.add(drainage);
 function addDrainage(){
  const material=new THREE.MeshStandardMaterial({color:0x383f37,roughness:1,side:THREE.DoubleSide});
  for(const side of [-1,1]){
   const vertices=[],indices=[],offsets=[side*2.15,side*2.65,side*3.15];
   for(let i=0;i<stations.length;i++){
    const p=stations[i],a=p.angle_deg*Math.PI/180;
    for(let j=0;j<offsets.length;j++){
     const off=offsets[j],x=(R+off)*Math.cos(a),z=(R+off)*Math.sin(a);
     const t=Math.max(0,Math.min(1,(Math.abs(off)-1.3)/7.7)),fade=t*t*(3-2*t);
     const y=p.target_height_m*(1-fade)+base(x,z)*fade-(j===1?.14:.025);
     vertices.push(x-cx,y+.04,z-cz);
     if(i&&j){const k=i*3+j;indices.push(k,k-1,k-3,k-1,k-4,k-3)}
    }
   }
   const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));g.setIndex(indices);g.computeVertexNormals();
   drainage.add(new THREE.Mesh(g,material));
  }
 }
 addDrainage();


let natural=false;build(false);document.getElementById('toggle').onclick=()=>{natural=!natural;while(group.children.length){let c=group.children[0];group.remove(c);c.geometry.dispose();c.material.dispose()}build(natural);document.getElementById('toggle').textContent=natural?'Show graded prototype':'Show natural ground'};
const target=new THREE.Vector3(0,-3,0);let theta=.4,phi=1.18,dist=100;const updateCamera=()=>{camera.position.set(target.x+dist*Math.sin(phi)*Math.sin(theta),target.y+dist*Math.cos(phi),target.z+dist*Math.sin(phi)*Math.cos(theta));camera.lookAt(target)};updateCamera();let pointer=null;renderer.domElement.style.touchAction='none';renderer.domElement.addEventListener('pointerdown',e=>{pointer={x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!pointer)return;theta-=(e.clientX-pointer.x)*.008;phi=Math.max(.15,Math.min(Math.PI-.15,phi+(e.clientY-pointer.y)*.008));pointer={x:e.clientX,y:e.clientY};updateCamera()});renderer.domElement.addEventListener('pointerup',()=>pointer=null);renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(15,Math.min(350,dist*Math.exp(e.deltaY*.001)));updateCamera()},{passive:false});
addEventListener('resize',()=>{camera.aspect=root.clientWidth/root.clientHeight;camera.updateProjectionMatrix();renderer.setSize(root.clientWidth,root.clientHeight)});
renderer.setAnimationLoop(()=>renderer.render(scene,camera));
</script><script>window.addEventListener('error',e=>{document.getElementById('info').textContent='Error: '+e.message});window.addEventListener('unhandledrejection',e=>{document.getElementById('info').textContent='Load failed: '+e.reason});</script></body></html>
