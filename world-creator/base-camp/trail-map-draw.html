<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Base Camp — Draw on Map</title><style>*{box-sizing:border-box}body{margin:0;background:#15221c;color:white;font:15px system-ui}header{position:sticky;top:0;z-index:5;background:#15221c;padding:8px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}button,select{font:inherit;border:0;border-radius:7px;padding:10px;background:#d9e6da;color:#122317}button.active{background:#ffce68}#viewport{height:calc(100dvh - 108px);overflow:auto;touch-action:pan-x pan-y;background:#e9eee7}#stage{position:relative;width:1000px;height:1080px;transform-origin:top left}#map{width:1000px;height:1080px;display:block}#ink{position:absolute;inset:0;width:1000px;height:1080px;touch-action:none;cursor:crosshair}small{opacity:.8}label{display:flex;align-items:center;gap:4px}</style><header><strong>🐊 Trail Map Markup</strong><button id="draw" class="active">✏️ Draw</button><button id="pan">✋ Pan</button><button id="undo">↶ Undo</button><button id="clear">Clear</button><button id="save">📷 Save marked map</button><label>Color <input id="color" type="color" value="#e63232"></label><label>Width <input id="width" type="range" min="2" max="18" value="6"></label><small>Draw with finger; save to share screenshot</small></header><div id="viewport"><div id="stage"><img id="map" src="./campsite-route-markers-map.svg" alt="Current Base Camp trail map"><canvas id="ink" width="1000" height="1080"></canvas></div></div><script>const c=document.querySelector('#ink'),ctx=c.getContext('2d'),v=document.querySelector('#viewport'),map=document.querySelector('#map');let strokes=[],current=null,mode='draw';function repaint(){ctx.clearRect(0,0,1000,1080);for(const s of [...strokes,...(current?[current]:[])]){ctx.beginPath();ctx.lineWidth=s.width;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=s.color;s.points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));if(s.points.length===1){let p=s.points[0];ctx.lineTo(p.x+.1,p.y+.1)}ctx.stroke()}}function point(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*1000/r.width,y:(e.clientY-r.top)*1080/r.height}}c.addEventListener('pointerdown',e=>{if(mode!=='draw')return;c.setPointerCapture(e.pointerId);current={color:document.querySelector('#color').value,width:+document.querySelector('#width').value,points:[point(e)]};repaint()});c.addEventListener('pointermove',e=>{if(!current)return;current.points.push(point(e));repaint()});function end(){if(current){strokes.push(current);current=null;repaint()}}c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);function setMode(m){mode=m;c.style.pointerEvents=m==='draw'?'auto':'none';document.querySelector('#draw').classList.toggle('active',m==='draw');document.querySelector('#pan').classList.toggle('active',m==='pan')}document.querySelector('#draw').onclick=()=>setMode('draw');document.querySelector('#pan').onclick=()=>setMode('pan');document.querySelector('#undo').onclick=()=>{strokes.pop();repaint()};document.querySelector('#clear').onclick=()=>{if(confirm('Clear all your drawn lines?')){strokes=[];repaint()}};document.querySelector('#save').onclick=()=>{let out=document.createElement('canvas');out.width=1000;out.height=1080;let x=out.getContext('2d');try{x.drawImage(map,0,0,1000,1080);x.drawImage(c,0,0);let a=document.createElement('a');a.download='base-camp-marked-map.png';a.href=out.toDataURL('image/png');a.click()}catch(err){alert('Map image cannot be exported here. Take a screenshot of your drawing instead.')}};window.addEventListener('load',()=>{let scale=Math.min(1,window.innerWidth/1000);document.querySelector('#stage').style.transform='scale('+scale+')';document.querySelector('#viewport').style.width='100%';document.querySelector('#stage').parentElement.style.overflow='auto';document.querySelector('#stage').style.marginBottom=-(1080*(1-scale))+'px';document.querySelector('#stage').style.marginRight=-(1000*(1-scale))+'px'});</script></html>
