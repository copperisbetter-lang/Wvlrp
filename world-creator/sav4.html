<button type="button" onclick="window.resetSkirtOrientation?.()">Reset skirt rotation</button></div><div id="note">Rotate with one finger; pinch to zoom. Loading SAV 4 real GLB; wardrobe fitting pending.</div></footer><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">import * as T from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';const noteEarly=document.getElementById('note');window.addEventListener('error',e=>{if(noteEarly)noteEarly.textContent='Viewer error: '+e.message;});window.addEventListener('unhandledrejection',e=>{if(noteEarly)noteEarly.textContent='Viewer module error: '+(e.reason?.message||String(e.reason));});const scene=new T.Scene();scene.background=new T.Color(0x24352f);scene.add(new T.HemisphereLight(0xffffff,0x66746e,2));const sun=new T.DirectionalLight(0xffffff,2);sun.position.set(2,4,5);scene.add(sun);const camera=new T.PerspectiveCamera(38,1,.01,50);camera.position.set(0,1.25,3.8);const renderer=new T.WebGLRenderer({antialias:true});document.getElementById('stage').append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.9,0);controls.enableDamping=true;const skin=new T.MeshStandardMaterial({color:0xecc6b2,roughness:.84}),hair=new T.MeshStandardMaterial({color:0xbca481,roughness:.88}),eye=new T.MeshStandardMaterial({color:0x9dc6db}),dressMat=new T.MeshStandardMaterial({color:0x9c6468}),blue=new T.MeshStandardMaterial({color:0x53768c}),white=new T.MeshStandardMaterial({color:0xe2ddd3}),pink=new T.MeshStandardMaterial({color:0xb46c86});const body=new T.Group();scene.add(body);
const clothes=new T.Group();scene.add(clothes);clothes.renderOrder=10;
const fabric=(color)=>new T.MeshStandardMaterial({color,roughness:.88,side:T.DoubleSide});
function cylinder(rt,rb,h,y,mat,x=0,z=0){const m=new T.Mesh(new T.CylinderGeometry(rt,rb,h,32,1,false),mat);m.position.set(x,y,z);return m}
function garment(style){
 const g=new T.Group();const palette={dress:0x966675,bikini:0x477f95,shorts:0x496d91,skirt:0x55758c,casual:0x738474};
 const mat=fabric(palette[style]||0x55758c),top=fabric(style==='shorts'?0xf1e8df:style==='skirt'?0xf1e4d9:0x9c6468);
 const add=(geo,m,x,y,z=0)=>{const part=new T.Mesh(geo,m);part.position.set(x,y,z);g.add(part);return part};
 const tapered=(a,b,h,m,y)=>add(new T.CylinderGeometry(a,b,h,40,1,false),m,0,y);
 if(style==='skirt'||style==='dress'){tapered(.195,style==='skirt'?.285:.32,style==='skirt'?.30:.58,mat,style==='skirt'?.87:.83);}
 if(style==='dress'){tapered(.175,.20,.40,mat,1.30);}
 if(style==='skirt'||style==='shorts'||style==='casual'){tapered(.172,.194,.34,top,1.32);}
 if(style==='shorts'||style==='casual'){tapered(.20,.22,.13,mat,.98);for(const x of [-.11,.11])add(new T.CylinderGeometry(.107,.113,.16,32),mat,x,.85);}
 if(style==='bikini'){
  // Separate fabric cups, shoulder straps and brief; no painted-on textures.
  for(const x of [-.085,.085]){
   const cup=add(new T.SphereGeometry(.098,20,12,0,Math.PI*2,0,Math.PI),mat,x,1.42,.095);cup.scale.set(1,.68,.43);
   const strap=add(new T.CylinderGeometry(.011,.011,.19,10),mat,x*.8,1.56,.065);strap.rotation.z=x<0?-.23:.23;
  }
  tapered(.188,.204,.115,mat,.995);
 }
 return g;
}
window.outfit=(style)=>{const n=document.getElementById('note');if(n)n.textContent='Viewer initializing — '+style;};const loaderModule=await import('three/addons/loaders/GLTFLoader.js');

const status=document.getElementById('note');status.textContent='Loading SAV 4 real GLB…';
const wardrobe={
 dress:{label:'Plaid sundress',color:0x95626c},
 bikini:{label:'Bikini',color:0x547e90},
 shorts:{label:'Shirt & shorts',color:0xeeeeee},
 skirt:{label:'Skirt & tank',color:0xb67587},
 casual:{label:'Casual',color:0x738474},tankIvory:{label:'Ivory tank'},tankSage:{label:'Sage tank'},miniBlack:{label:'Black mini'},miniRose:{label:'Rose mini'},bikiniCoral:{label:'Coral bikini'}
};

let selectedOutfit='skirt';

skirtLoader.load('./assets/sav4_makehuman_mini_skirt_01.glb',g=>{realSkirt=g.scene;if(avatar&&selectedOutfit==='skirt')window.outfit('skirt');},undefined,()=>{console.warn('MakeHuman skirt GLB not yet published to site assets');});
function measureSkirtReady(){return !!avatar&&!!realSkirt;}

// Load real garment meshes only. A missing GLB is not a wearable outfit.
const garmentFiles={skirt:'sav4_makehuman_mini_skirt_01.glb'};
const fittedGarments=new Map();
function alignGarment(model,style){
 if(!avatar)return;
 model.position.set(0,0,0);model.rotation.set(0,0,0);model.scale.setScalar(1);
 avatar.updateMatrixWorld(true);model.updateMatrixWorld(true);
 const bodyBounds=new T.Box3().setFromObject(avatar),bodySize=bodyBounds.getSize(new T.Vector3());
 let garmentBounds=new T.Box3().setFromObject(model),dims=garmentBounds.getSize(new T.Vector3());
 if(dims.x<.001||dims.y<.001||dims.z<.001){status.textContent='Imported skirt mesh has invalid dimensions';return;}
 // Imported MakeHuman meshes can be Z-up; convert if their longest axis is vertical in Z.
 if(dims.z>dims.y*1.45 && dims.z>dims.x*1.45){
   model.rotation.x=-Math.PI/2;model.updateMatrixWorld(true);
   garmentBounds=new T.Box3().setFromObject(model);dims=garmentBounds.getSize(new T.Vector3());
 }
 // A mini should occupy the hip region, not the full avatar width or crotch.
 const sizeControl=document.getElementById('skirtSize');
 const heightControl=document.getElementById('skirtHeight');
 const desiredWidth=bodySize.y*.235*Number(sizeControl?.value||2.5);
 const scale=desiredWidth/Math.max(dims.x,dims.z);
 // Keep size independent of rotation, then refit the rotated bounds to the waist.
 const angle=id=>Number(document.getElementById(id)?.value||0)*Math.PI/180;
 const flipped=document.getElementById('skirtFlip')?.checked?Math.PI:0;
 const turn=new T.Quaternion().setFromEuler(new T.Euler(angle('skirtPitch')+flipped,angle('skirtYaw'),angle('skirtRoll'),'YXZ'));
 model.quaternion.premultiply(turn);
 model.scale.setScalar(scale);model.updateMatrixWorld(true);
 garmentBounds=new T.Box3().setFromObject(model);
 const center=garmentBounds.getCenter(new T.Vector3()),size=garmentBounds.getSize(new T.Vector3());
 const bodyCenter=bodyBounds.getCenter(new T.Vector3());
 // Position the skirt upper edge at natural waist, approximately 58% of height.
 const waistY=bodyBounds.min.y+bodySize.y*Number(heightControl?.value||.59);
 model.position.set(bodyCenter.x-center.x,waistY-garmentBounds.max.y,bodyCenter.z-center.z);
 model.updateMatrixWorld(true);
 status.textContent='Imported MakeHuman mini skirt loaded; width '+size.x.toFixed(2)+'m; inspect waist and hem';
 console.info('SAV4 imported skirt fit',dims,size,bodySize);
}
window.refitSkirt=()=>{
 for(const id of ['skirtYaw','skirtPitch','skirtRoll']){
  const output=document.getElementById(id+'Value');if(output)output.textContent=document.getElementById(id).value+'°';
 }
 const m=fittedGarments.get('skirt');if(m&&avatar){alignGarment(m,'skirt');}
};
window.resetSkirtOrientation=()=>{
 for(const id of ['skirtYaw','skirtPitch','skirtRoll'])document.getElementById(id).value='0';
 document.getElementById('skirtFlip').checked=false;
 window.refitSkirt();
};
const loadingGarments=new Set();
window.outfit=function(style){
 selectedOutfit=style;
 const item=wardrobe[style]||wardrobe.dress;
 clothes.clear();
 const ready=fittedGarments.get(style);
 if(ready){alignGarment(ready,style);clothes.add(ready);ready.visible=true;status.textContent='Real skirt loaded. Adjust size, height, flip and rotation to fit.';return;}
 status.textContent=item.label+' — loading garment file…';
 if(loadingGarments.has(style))return;
 loadingGarments.add(style);
 if(!garmentFiles[style]){status.textContent='No garment file registered for '+style;return;}
 loader.load('./assets/'+garmentFiles[style],g=>{
  loadingGarments.delete(style);
  const model=g.scene;
  model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
  fittedGarments.set(style,model);
  if(selectedOutfit===style)window.outfit(style);
 },undefined,e=>{loadingGarments.delete(style);console.warn('SAV4 garment unavailable',style,e);status.textContent=item.label+' — file failed to load: '+(e?.message||'network or format error');});
};

loader.load('./assets/sav4-realistic.glb?v=15e5b5928fea',g=>{
 avatar=g.scene;body.add(avatar);
 // SAV4 inspection material correction: target only named hair/eye geometry.
 const blonde=new T.Color(0xb9a27c), irisBlue=new T.Color(0x9fc4d8), scleraWhite=new T.Color(0xf0ede8);
 avatar.traverse(o=>{if(!o.isMesh)return;const name=o.name.toLowerCase();const mats=Array.isArray(o.material)?o.material:[o.material];mats.forEach((m,i)=>{if(!m)return;const mn=(m.name||'').toLowerCase();const isHair=/hair|scalp|strand|fringe|bang|ponytail/.test(name+' '+mn);const isEye=/eye|iris|sclera|cornea|pupil/.test(name+' '+mn);if(!isHair&&!isEye)return;const clone=m.clone();if(isHair){clone.color.copy(blonde);if(clone.map){clone.map=null;}clone.roughness=.88;}else if(/sclera|eyewhite|eye_white/.test(name+' '+mn)){clone.color.copy(scleraWhite);clone.emissive?.set(0x000000);}else if(/iris|eye/.test(name+' '+mn)&&!/lash|brow|socket|lid|pupil/.test(name+' '+mn)){clone.color.copy(irisBlue);clone.emissive?.set(0x000000);clone.emissiveIntensity=0;if(clone.map)clone.map=null;}else return;clone.needsUpdate=true;if(Array.isArray(o.material))o.material[i]=clone;else o.material=clone;});});
 // Temporary reversible eye-position trial: only actual eye geometry, never lids or face.
 const eyeMeshes=[];
 avatar.traverse(o=>{
  if(!o.isMesh)return;
  const tag=(o.name+' '+(Array.isArray(o.material)?o.material.map(m=>m?.name||'').join(' '):(o.material?.name||''))).toLowerCase();
  if(!/(eyeball|sclera|iris|cornea|pupil|eye[_ .-]?(left|right|l|r|white))/.test(tag))return;
  if(/eyelid|eyelash|brow|socket|skin|face|head/.test(tag))return;
  eyeMeshes.push({object:o,base:o.position.clone()});
 });
 const eyeUp=.012,eyeForward=.018;
 // Source MakeHuman models generally face +Z in this viewer; inspect before final bake.
 for(const e of eyeMeshes){e.object.position.y=e.base.y+eyeUp;e.object.position.z=e.base.z+eyeForward;}
 console.info('SAV4 eye-position trial',eyeMeshes.map(e=>e.object.name),eyeUp,eyeForward);
 window.resetEyeTrial=()=>{for(const e of eyeMeshes)e.object.position.copy(e.base);};
 // Highlight absent facial parts in diagnostics instead of pretending recoloring creates geometry.
 const faceParts=[];avatar.traverse(o=>{if(o.isMesh){const n=(o.name+' '+(Array.isArray(o.material)?o.material.map(m=>m?.name).join(' '):o.material?.name||'')).toLowerCase();if(/iris|sclera|eyeball|eye[_ .-]/.test(n))faceParts.push(o.name);}});
 console.info('SAV4 facial eye mesh candidates',faceParts);
 if(!faceParts.length)console.warn('SAV4: no identifiable eye meshes in imported GLB; geometry rebuild required');
 // Diagnostics expose mesh/material naming; GLB geometry repair remains necessary if eyes are missing.
 console.info('SAV4 eye/hair meshes',[]);avatar.traverse(o=>{if(o.isMesh&&/eye|iris|pupil|hair|scalp/i.test(o.name+' '+(o.material?.name||'')))console.info('SAV4 mesh',o.name,o.material?.name);});
 avatar.traverse(o=>{if(o.isMesh){o.frustumCulled=false;o.castShadow=true;const mats=Array.isArray(o.material)?o.material:[o.material];mats.forEach(m=>{if(m){m.side=T.DoubleSide;m.transparent=false;m.alphaTest=0;m.depthWrite=true;m.needsUpdate=true}})}});
 const bounds=new T.Box3().setFromObject(avatar),size=bounds.getSize(new T.Vector3()),center=bounds.getCenter(new T.Vector3());
 if(size.y<=0)throw Error('SAV 4 has invalid model bounds');
 const longest=Math.max(size.x,size.y,size.z);if(size.y<longest*.7){if(size.z>=size.x)avatar.rotation.x=-Math.PI/2;else avatar.rotation.z=Math.PI/2;avatar.updateMatrixWorld(true);}const upright=new T.Box3().setFromObject(avatar),uprightSize=upright.getSize(new T.Vector3());if(uprightSize.y>0){const factor=1.6764/uprightSize.y;avatar.scale.multiplyScalar(factor);avatar.updateMatrixWorld(true);}console.info('SAV4 bounds',size,'upright',uprightSize);
 const fitted=new T.Box3().setFromObject(avatar),fittedSize=fitted.getSize(new T.Vector3()),fittedCenter=fitted.getCenter(new T.Vector3());avatar.position.sub(fittedCenter);avatar.position.y+=fittedSize.y/2;
 // Removed misplaced procedural face overlay. Use source GLB eye/hair geometry only until properly rigged replacements are available.

 controls.target.set(0,fittedSize.y*.51,0);camera.position.set(0,fittedSize.y*.55,Math.max(5.8,fittedSize.y*3.4));controls.update();
 window.outfit(selectedOutfit);
},p=>{if(p.total)status.textContent='Loading SAV 4: '+Math.round(p.loaded/p.total*100)+'%';},e=>{console.error(e);status.textContent='SAV 4 GLB failed to load: '+e.message;});
function resize(){const el=document.getElementById('stage');renderer.setSize(el.clientWidth,el.clientHeight);camera.aspect=el.clientWidth/el.clientHeight;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)}loop();</script></body></html>
