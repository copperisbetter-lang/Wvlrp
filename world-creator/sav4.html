<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAV 4 | Character Studio</title><style>body{margin:0;background:#14221e;color:#eee;font:15px system-ui}header,footer{padding:12px;background:#233a32}main{height:74dvh}button{margin:4px;padding:9px;background:#496d60;color:white;border:0;border-radius:6px}button:focus{outline:2px solid gold}</style></head><body><header><b>SAV 4 — Real GLB Character Viewer</b><div>18 years · 5′6″ · dusty blonde · pale blue eyes · slender frame</div></header><main id="stage"></main><footer>Outfits: <button onclick="outfit('dress')">Plaid dress</button><button onclick="outfit('bikini')">Bikini</button><button onclick="outfit('shorts')">Shirt & shorts</button><button onclick="outfit('skirt')">Skirt & tank</button><button onclick="outfit('casual')">Casual</button><div id="note">Rotate with one finger; pinch to zoom. Loading SAV 4 real GLB; wardrobe fitting pending.</div></footer><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">import * as T from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';const scene=new T.Scene();scene.background=new T.Color(0x24352f);scene.add(new T.HemisphereLight(0xffffff,0x66746e,2));const sun=new T.DirectionalLight(0xffffff,2);sun.position.set(2,4,5);scene.add(sun);const camera=new T.PerspectiveCamera(38,1,.01,50);camera.position.set(0,1.25,3.8);const renderer=new T.WebGLRenderer({antialias:true});document.getElementById('stage').append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.9,0);controls.enableDamping=true;const skin=new T.MeshStandardMaterial({color:0xecc6b2,roughness:.84}),hair=new T.MeshStandardMaterial({color:0xbca481,roughness:.88}),eye=new T.MeshStandardMaterial({color:0x9dc6db}),dressMat=new T.MeshStandardMaterial({color:0x9c6468}),blue=new T.MeshStandardMaterial({color:0x53768c}),white=new T.MeshStandardMaterial({color:0xe2ddd3}),pink=new T.MeshStandardMaterial({color:0xb46c86});const body=new T.Group();scene.add(body);

loader.load('./assets/sav4-realistic.glb?v=cd482a2',g=>{

 const bounds=new T.Box3().setFromObject(avatar),size=bounds.getSize(new T.Vector3()),center=bounds.getCenter(new T.Vector3());

function resize(){const el=document.getElementById('stage');renderer.setSize(el.clientWidth,el.clientHeight);camera.aspect=el.clientWidth/el.clientHeight;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)}loop();</script></body></html>
