<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tank 1 — SAV4 V21 Clone, Summer Dress</title>
<style>body{margin:0;background:#22372f;color:#edf3ef;font:15px system-ui}header{padding:12px;background:#193027}h1{font-size:19px;margin:0 0 6px}#stage{height:72dvh;min-height:340px}canvas{display:block;touch-action:none}nav{padding:10px;display:flex;gap:8px;flex-wrap:wrap}button{background:#4a7664;color:white;border:0;border-radius:7px;padding:12px;font:inherit}button:disabled{opacity:.45}#status{margin:0;font-size:13px}#error{padding:12px;color:#ffddb1}</style>
</head><body><header><h1>Tank 1 — SAV4 V21 Clone</h1><p style="font-size:13px;margin:5px 0">Independent SAV4 V21 body copy · removable blue-green sundress preview · originals untouched</p><p id="status" role="status">Loading the fitted model…</p></header><main id="stage"></main>
<nav aria-label="Inspection views"><button data-view="Front" disabled>Front</button><button data-view="Rear" disabled>Rear</button><button data-view="Side" disabled>Side</button><button data-view="Underneath" disabled>Underneath</button><button data-view="Full body" disabled>Full body</button><button id="toggleDress" disabled>Dress: on</button><button id="isolate" disabled>Attachment only</button><button id="cutaway" disabled>Body cutaway</button></nav><div id="error"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const sav4AssetUrl='./assets/tank-1-v21.glb?v=tank1-v21-20261027';
const status=document.getElementById('status'),stage=document.getElementById('stage');
try{
 const scene=new THREE.Scene();scene.background=new THREE.Color(0x22372f);
 scene.add(new THREE.HemisphereLight(0xffffff,0x76867e,2.3));
 const key=new THREE.DirectionalLight(0xffffff,2.2);key.position.set(2,3,4);scene.add(key);
 const fill=new THREE.DirectionalLight(0xffffff,1.5);fill.position.set(-2,0,-3);scene.add(fill);
 const camera=new THREE.PerspectiveCamera(40,1,.001,100);camera.position.set(0,.85,2.5);
 const renderer=new THREE.WebGLRenderer({antialias:true});stage.append(renderer.domElement);
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.minDistance=.025;orbit.maxDistance=8;orbit.target.set(0,.85,0);
 function resize(){renderer.setSize(stage.clientWidth,stage.clientHeight,false);camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix();}
 new ResizeObserver(resize).observe(stage);resize();
 renderer.setAnimationLoop(()=>{orbit.update();renderer.render(scene,camera);});
 let model,attachment,meshes=[],only=false,cutaway=false,partBounds;
 function style(){
  for(const mesh of meshes){
   mesh.visible=!only||mesh===attachment;
   for(const material of (Array.isArray(mesh.material)?mesh.material:[mesh.material])){
    if(!material)continue;
    const original=material.userData.nativeInspectionStyle??={transparent:material.transparent,opacity:material.opacity,depthWrite:material.depthWrite};
    const faded=cutaway&&mesh!==attachment;
    material.transparent=faded||original.transparent;
    material.opacity=faded?original.opacity*.18:original.opacity;
    material.depthWrite=faded?false:original.depthWrite;
    material.needsUpdate=true;
   }
  }
  document.getElementById('isolate').textContent=only?'Show body':'Attachment only';
  document.getElementById('cutaway').textContent=cutaway?'Solid body':'Body cutaway';
 }
 function view(name){
  let box=partBounds;
  if(name==='Full body')box=new THREE.Box3().setFromObject(model,true);
  const center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());
  orbit.target.copy(center);
  let offset=name==='Full body'?new THREE.Vector3(0,.05,Math.max(2,size.y*1.5)):new THREE.Vector3(0,-.07,.40);
  if(name==='Rear')offset.set(0,-.06,-.40);
  if(name==='Side')offset.set(.40,-.02,0);
  if(name==='Underneath')offset.set(.03,-.36,.06);
  camera.position.copy(center).add(offset);orbit.update();
 }
 document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));
 document.getElementById('isolate').onclick=()=>{only=!only;style();};
 document.getElementById('cutaway').onclick=()=>{cutaway=!cutaway;style();};
 const gltf=await new GLTFLoader().loadAsync(sav4AssetUrl);
 model=gltf.scene;scene.add(model);model.updateMatrixWorld(true);
 model.traverse(o=>{if(o.isMesh){meshes.push(o);o.frustumCulled=false;if(o.skeleton)o.skeleton.update();const mats=Array.isArray(o.material)?o.material:[o.material];if(/vulva2.*mhx2/i.test(o.name)||mats.some(m=>/vulva2.*attachment/i.test(m?.name||'')))attachment=o;}});
 if(!attachment)throw Error('The downloaded model has no Vulva2 attachment.');
 // Approved V14 sample A appearance, applied to SAV4's fitted attachment
 // in-place. No second attachment mesh, no geometry changes.
 function applyNativeSkinV19(mesh){
   const body=meshes.filter(o=>o!==mesh)
     .filter(o=>(Array.isArray(o.material)?o.material:[o.material]).some(m=>m?.map))
     .sort((a,b)=>(b.geometry?.attributes?.position?.count||0)-(a.geometry?.attributes?.position?.count||0))[0];
   const bodyMat=(Array.isArray(body?.material)?body.material:[body?.material]).find(m=>m?.map);
   if(!bodyMat?.map)throw Error('V19 requires original body skin atlas');
   if(!mesh.geometry.getAttribute('uv'))throw Error('V19 requires native projected UVs');
   // V17 forced white and black on a clone, changing the source skin shader.
   // V19 keeps the exact body shader settings and native UVs intact.
   const mat=bodyMat.clone();
   mat.name='V19 exact native body material';
   mat.side=THREE.DoubleSide;
   mat.needsUpdate=true;
   mesh.material=Array.isArray(mesh.material)?mesh.material.map(()=>mat):mat;
   // V19: map each attachment UV toward its nearest body-surface UV.
   // Preserve the original geometry and use a local spatial index to avoid
   // the previous arbitrary full-atlas or abdomen-patch sampling.
   const bp=body.geometry.getAttribute('position'),bu=body.geometry.getAttribute('uv');
   const ap=mesh.geometry.getAttribute('position');
   if(!bp||!bu||!ap)throw Error('V19 missing source geometry attributes');
   const cell=.035,grid=new Map();
   const key=(x,y,z)=>x+','+y+','+z;
   for(let i=0;i<bp.count;i++){
     const x=Math.floor(bp.getX(i)/cell),y=Math.floor(bp.getY(i)/cell),z=Math.floor(bp.getZ(i)/cell);
     const k=key(x,y,z);if(!grid.has(k))grid.set(k,[]);grid.get(k).push(i);
   }
   const original=mesh.geometry.getAttribute('uv');
   const remapped=original.clone();let matched=0,largest=0;
   for(let i=0;i<ap.count;i++){
     const x=ap.getX(i),y=ap.getY(i),z=ap.getZ(i);
     const gx=Math.floor(x/cell),gy=Math.floor(y/cell),gz=Math.floor(z/cell);
     let best=-1,dist=Infinity;
     for(let radius=0;radius<=5&&best<0;radius++){
       for(let dx=-radius;dx<=radius;dx++)for(let dy=-radius;dy<=radius;dy++)for(let dz=-radius;dz<=radius;dz++){
         if(radius&&Math.max(Math.abs(dx),Math.abs(dy),Math.abs(dz))!==radius)continue;
         for(const j of grid.get(key(gx+dx,gy+dy,gz+dz))||[]){
           const d=(x-bp.getX(j))**2+(y-bp.getY(j))**2+(z-bp.getZ(j))**2;
           if(d<dist){dist=d;best=j;}
         }
       }
     }
     if(best>=0&&dist<.05**2){
       const u=bu.getX(best),v=bu.getY(best);
       // Keep mapping near its original island; reject atlas jumps.
       if(Math.hypot(u-original.getX(i),v-original.getY(i))<.12){
         remapped.setXY(i,original.getX(i)*.25+u*.75,original.getY(i)*.25+v*.75);
         matched++;largest=Math.max(largest,Math.sqrt(dist));
       }
     }
   }
   mesh.geometry=mesh.geometry.clone();mesh.geometry.setAttribute('uv',remapped);
   // V20: smoothly transfer nearby body's vertex normals to the fitted surface.
   // Keep every position, face, and UV unchanged; only the normal attribute
   // is adjusted to reduce a hard lighting discontinuity at the seam.
   const bn=body.geometry.getAttribute('normal'),an=mesh.geometry.getAttribute('normal');
   let normalMatched=0;
   if(bn&&an){
     const smooth=an.clone();
     for(let i=0;i<ap.count;i++){
       const x=ap.getX(i),y=ap.getY(i),z=ap.getZ(i);
       const gx=Math.floor(x/cell),gy=Math.floor(y/cell),gz=Math.floor(z/cell);
       let best=-1,dist=Infinity;
       for(let radius=0;radius<=3;radius++){
         for(let dx=-radius;dx<=radius;dx++)for(let dy=-radius;dy<=radius;dy++)for(let dz=-radius;dz<=radius;dz++){
           if(radius&&Math.max(Math.abs(dx),Math.abs(dy),Math.abs(dz))!==radius)continue;
           for(const j of grid.get(key(gx+dx,gy+dy,gz+dz))||[]){
             const d=(x-bp.getX(j))**2+(y-bp.getY(j))**2+(z-bp.getZ(j))**2;
             if(d<dist){dist=d;best=j;}
           }
         }
         if(best>=0&&dist<.018**2)break;
       }
       if(best>=0&&dist<.022**2){
         const local=new THREE.Vector3(an.getX(i),an.getY(i),an.getZ(i));
         const target=new THREE.Vector3(bn.getX(best),bn.getY(best),bn.getZ(best));
         // Body and attachment share the same exported model space.
         if(local.dot(target)>0){
           const distance=Math.sqrt(dist);
           const influence=.72*Math.max(0,1-distance/.022);
           local.lerp(target,influence).normalize();
           smooth.setXYZ(i,local.x,local.y,local.z);
           normalMatched++;
         }
       }
     }
     mesh.geometry.setAttribute('normal',smooth);
   }
   // V21 subtle edge color lift: derive the actual open boundary from
   // triangle incidence and taper a small brightness correction inward.
   const geo=mesh.geometry,idx=geo.getIndex(),edgeCount=new Map();
   const addEdge=(a,b)=>{const k=a<b?a+','+b:b+','+a;edgeCount.set(k,(edgeCount.get(k)||0)+1);};
   if(idx){
     for(let i=0;i<idx.count;i+=3){
       const a=idx.getX(i),b=idx.getX(i+1),c=idx.getX(i+2);
       addEdge(a,b);addEdge(b,c);addEdge(c,a);
     }
   }
   const boundary=new Set();
   for(const [key,count] of edgeCount)if(count===1){
     const [a,b]=key.split(',').map(Number);boundary.add(a);boundary.add(b);
   }
   const colorData=new Float32Array(ap.count*3);
   const edgeVertices=[...boundary];
   for(let i=0;i<ap.count;i++){
     let nearest=Infinity;
     for(const j of edgeVertices){
       const d=(ap.getX(i)-ap.getX(j))**2+(ap.getY(i)-ap.getY(j))**2+(ap.getZ(i)-ap.getZ(j))**2;
       if(d<nearest)nearest=d;
     }
     const t=edgeVertices.length?Math.max(0,1-Math.sqrt(nearest)/.045):0;
     const smooth=t*t*(3-2*t);
     // Gentle lift only: strongest near the upper/side seam, tapering
     // into the interior so the native skin mottling stays intact.
     const lift=1.018+.065*smooth;
     colorData[i*3]=lift;colorData[i*3+1]=lift;colorData[i*3+2]=lift;
   }
   geo.setAttribute('color',new THREE.BufferAttribute(colorData,3));
   mat.vertexColors=true;mat.needsUpdate=true;
   console.info('V21 edge color feather',{boundaryVertices:boundary.size,total:ap.count});
   console.info('V20 normals matched',{normalMatched,total:ap.count});
   console.info('V19 local body UV remap',{matched,total:ap.count,largest});
   // Inspect the resulting UV range.
   const uv=mesh.geometry.getAttribute('uv'),normal=mesh.geometry.getAttribute('normal');
   let invalid=0,minU=Infinity,maxU=-Infinity,minV=Infinity,maxV=-Infinity;
   for(let i=0;i<uv.count;i++){
     const u=uv.getX(i),v=uv.getY(i);
     if(!Number.isFinite(u)||!Number.isFinite(v))invalid++;
     minU=Math.min(minU,u);maxU=Math.max(maxU,u);
     minV=Math.min(minV,v);maxV=Math.max(maxV,v);
   }
   if(invalid)throw Error('V19 found '+invalid+' invalid UV coordinates');
   console.info('V19 native UV inspection',{vertices:uv.count,u:[minU,maxU],v:[minV,maxV],normals:normal?.count,bodyMaterial:bodyMat.name});
   return 'UV '+matched+'/'+ap.count+' · normals '+normalMatched+'/'+ap.count+' · edge '+boundary.size+' · UV '+minU.toFixed(3)+'–'+maxU.toFixed(3)+' / '+minV.toFixed(3)+'–'+maxV.toFixed(3);
 }
 const skinSource=applyNativeSkinV19(attachment);

 // Tank 1's optional garment is generated separately from the byte-identical
 // SAV4 V21 GLB. Nothing here modifies the original body, bones or skin weights.
 // Deliberately a preview garment: not a baked/rigged/exported cloth mesh.
 const bodyBounds=new THREE.Box3().setFromObject(model,true);
 const bodySize=bodyBounds.getSize(new THREE.Vector3());
 const h=Math.max(.1,bodySize.y);
 const cx=(bodyBounds.min.x+bodyBounds.max.x)/2;
 const cz=(bodyBounds.min.z+bodyBounds.max.z)/2;
 const y=f=>bodyBounds.min.y+h*f;
 const fabric=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.93,metalness:0,side:THREE.DoubleSide,vertexColors:true});
 const trimMaterial=new THREE.MeshStandardMaterial({color:0x87afb2,roughness:.87,metalness:0,side:THREE.DoubleSide});
 const dress=new THREE.Group();
 dress.name='Tank 1 removable teal knee-length sundress preview';
 const rings=[
  [.828,.092,.065],
  [.803,.120,.078],
  [.749,.122,.080],
  [.654,.104,.070],
  [.567,.103,.074],
  [.503,.134,.090],
  [.433,.161,.105],
  [.342,.190,.131]
 ];
 const segments=72;
 const verts=[],colors=[],uvs=[],faces=[];
 const base=new THREE.Color(0x447c85);
 for(let j=0;j<rings.length;j++){
  const [f,rx,rz]=rings[j];
  for(let i=0;i<=segments;i++){
   const a=i/segments*Math.PI*2;
   // Fold depth increases continuously toward the lower hem.
   const fold=Math.pow(Math.max(0,(.72-f)/.39),1.35);
   const ripple=Math.sin(a*10+j*.35)*.010*fold + Math.sin(a*15-j*.5)*.004*fold;
   const r=1+ripple;
   const scallop=j===rings.length-1?.004*Math.sin(a*10):0;
   const opening=(j===0&&Math.cos(a)>0)?-.014*Math.pow(Math.max(0,Math.cos(a)),3):0;
   verts.push(cx+Math.sin(a)*h*rx*r,y(f+scallop+opening),cz+Math.cos(a)*h*rz*r);
   const shade=1+.075*Math.cos(a*10+j*.18)*fold+.028*Math.cos(a*4);
   const col=base.clone().multiplyScalar(shade);
   colors.push(col.r,col.g,col.b);
   uvs.push(i/segments,j/(rings.length-1));
  }
 }
 for(let j=0;j<rings.length-1;j++){
  for(let i=0;i<segments;i++){
   const a=j*(segments+1)+i,b=a+segments+1;
   faces.push(a,b,a+1,b,b+1,a+1);
  }
 }
 const dressGeo=new THREE.BufferGeometry();
 dressGeo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
 dressGeo.setAttribute('normal',new THREE.Float32BufferAttribute(new Float32Array(verts.length),3));
 dressGeo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));
 dressGeo.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
 dressGeo.setIndex(faces);
 dressGeo.computeVertexNormals();
 const dressBody=new THREE.Mesh(dressGeo,fabric);
 dressBody.name='Tank 1 fitted bodice and flared knee skirt';dressBody.castShadow=true;
 dress.add(dressBody);
 // Sewn waist ribbon and fine hem binding are independent outfit pieces.
 for(const [f,rx,rz,tube] of [[.568,.104,.075,.005],[.342,.191,.132,.004]]){
  const points=[];for(let i=0;i<=segments;i++){const a=i/segments*Math.PI*2;points.push(new THREE.Vector3(cx+Math.sin(a)*h*rx,y(f),cz+Math.cos(a)*h*rz));}
  const curve=new THREE.CatmullRomCurve3(points,true);
  const edge=new THREE.Mesh(new THREE.TubeGeometry(curve,segments*2,h*tube,5,true),trimMaterial);
  edge.name=f>.5?'Waist ribbon':'Hem stitch';dress.add(edge);
 }
 // Narrow front/back shoulder straps; no model bones are changed.
 for(const sx of [-1,1])for(const side of [-1,1]){
  const strap=new THREE.Mesh(new THREE.BoxGeometry(h*.021,h*.064,h*.009),trimMaterial);
  strap.position.set(cx+sx*h*.069,y(.851),cz+side*h*.052);
  strap.rotation.z=sx*.09;strap.name='Sundress shoulder strap';dress.add(strap);
 }
 scene.add(dress);
 let dressOn=true;
 const toggleDress=document.getElementById('toggleDress');
 toggleDress.onclick=()=>{dressOn=!dressOn;dress.visible=dressOn;toggleDress.textContent=dressOn?'Dress: on':'Dress: off';};

 partBounds=new THREE.Box3().setFromObject(attachment,true);
 status.textContent='V21 UV + normals + soft edge color ('+skinSource+') · '+attachment.geometry.attributes.position.count+' attachment vertices · original exported pose';
 document.querySelectorAll('button').forEach(b=>b.disabled=false);view('Full body');
 // V21 source mesh is unchanged; Tank 1 dress is a separate removable viewer overlay.
 // Dress is not yet baked or skin-weighted into Tank 1's GLB.

}catch(error){status.textContent='Preview could not start: '+error.message;document.getElementById('error').textContent=error.message;}
</script></body></html>
