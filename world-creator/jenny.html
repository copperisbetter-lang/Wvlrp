<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jenny — The Wild 3D Character Viewer</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font:15px system-ui,-apple-system,sans-serif;background:#0e1c16;color:#f5f5e9}
main{display:flex;flex-direction:column;min-height:100dvh}
header{padding:12px 14px;background:#223b2b;display:flex;align-items:center;justify-content:space-between;gap:10px}
header a{color:#cbf4d1}h1{margin:0;font-size:19px}.tiny{font-size:12px;color:#d6ead6}
#view{position:relative;height:68dvh;min-height:420px;max-height:950px;flex:none;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#status{display:none}
#controls{padding:10px;display:flex;flex-wrap:wrap;gap:7px;justify-content:center;background:#1c3227}
button{border:1px solid #97b89e;border-radius:8px;background:#335b43;color:#fff6e4;font-size:14px;padding:10px 12px;min-height:44px;touch-action:manipulation}button:focus-visible{outline:3px solid #e0c786}
#wardrobe{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;padding:10px 12px;background:#263e30;border-top:1px solid #53795b}
#wardrobe label{font-weight:700;font-size:14px}
#outfit-select,#hair-select,#dress-size-select{background:#f4f2e7;color:#193324;border:1px solid #88a58d;border-radius:8px;padding:10px;font-size:14px;min-height:44px;max-width:100%}
#outfit-feedback,#pose-feedback{font-size:12px;color:#c5e7c7}
#measure-panel{padding:8px 14px;background:#142a1f;border-top:1px solid #496954}
#measure-panel summary{font-size:13px;cursor:pointer;font-weight:700}
#model-measurements{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:7px;font-size:12px}
#model-measurements strong{width:100%}#model-measurements small{width:100%;color:#bccdc0}
#caption{padding:9px 14px;font-size:12px;text-align:center;color:#d6dfcd}
</style></head>
<body><main>
<header><div><h1>Jenny · 3D model</h1><div class="tiny">Girl · about 7 · brown hair · green eyes · full-body olive complexion · short plaid sundress</div></div><a href="./">World Creator</a></header>
<div id="view"><canvas id="scene" aria-label="Rotate and zoom the actual 3D child character by dragging or pinching"></canvas><div id="status" role="status">Loading realistic full-body Jenny…</div></div>
<div id="controls" aria-label="3D model controls">
<button id="front">Front view</button><button id="back">Back view</button><button id="face">Face close-up</button>
<button id="full">Full body</button><button id="closer">Zoom +</button><button id="farther">Zoom −</button>
<button id="idle">Stand</button><button id="wave">Wave</button><button id="walk">Walk</button>
<button id="run">Run</button><button id="bend">Bend Over</button><button id="sit">Sit Down</button><button id="pickup">Pick Up</button><button id="hands-knees">Hands &amp; Knees</button><button id="elbows-knees">Elbows &amp; Knees</button>
</div>
<div id="caption">Temporary fully clothed Jenny preview. The detailed rigged model is hidden until its dress alignment is repaired.</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/babylonjs@9.27.0/babylon.js"></script>
<script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@9.27.0/babylonjs.loaders.min.js"></script>
<script src="./jenny-independent.js?v=clothed-safety-20261014"></script>
</body></html>
