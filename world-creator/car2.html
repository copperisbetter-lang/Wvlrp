<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAR 2 — Saved Character Inspection</title>
<style>body{margin:0;background:#22372f;color:#edf3ef;font:15px system-ui}header{padding:12px;background:#193027}h1{font-size:19px;margin:0 0 6px}#stage{height:52dvh;min-height:280px}canvas{display:block;touch-action:none}nav{padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}#motions{position:sticky;bottom:0;background:#193027;z-index:3;max-height:40dvh;overflow:auto;padding:10px;border-top:2px solid #76ae94}#motion-list{display:flex;gap:6px;flex-wrap:wrap}button{background:#4a7664;color:white;border:0;border-radius:7px;padding:12px;font:inherit}button:disabled{opacity:.45}#status{margin:0;font-size:13px}#error{padding:12px;color:#ffddb1}</style>
</head><body><header><h1>CAR 2 — Saved Character</h1><p id="status" role="status">Loading the fitted model…</p></header><nav id="motion-shortcuts" aria-label="Quick movement controls"><button type="button" onclick="document.getElementById('motions').scrollIntoView({block:'nearest'})">Movement controls ↓</button><span id="motion-count">Loading animations…</span></nav><main id="stage"></main>
<nav id="motions" aria-label="CAR 2 animation controls"><strong>CAR 2 Movements:</strong> <span id="motion-list">Loading movement library…</span></nav><nav id="inspection" aria-label="Inspection views"><button data-view="Front" disabled>Front</button><button data-view="Rear" disabled>Rear</button><button data-view="Side" disabled>Side</button><button data-view="Underneath" disabled>Underneath</button><button data-view="Full body" disabled>Full body</button><button id="isolate" disabled>Attachment only</button><button id="cutaway" disabled>Body cutaway</button></nav><div id="error"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const sav4AssetUrl='./assets/car2-completed.glb?v=car2-skin-material-20261019';
const status=document.getElementById('status'),stage=document.getElementById('stage');
try{
 const scene=new THREE.Scene();scene.background=new THREE.Color(0x22372f);
 scene.add(new THREE.HemisphereLight(0xffffff,0x76867e,2.3));
 const key=new THREE.DirectionalLight(0xffffff,2.2);key.position.set(2,3,4);scene.add(key);
 const fill=new THREE.DirectionalLight(0xffffff,1.5);fill.position.set(-2,0,-3);scene.add(fill);
 const camera=new THREE.PerspectiveCamera(45,1,.001,100);camera.position.set(0,.85,2.5);
 const renderer=new THREE.WebGLRenderer({antialias:true});stage.append(renderer.domElement);
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.minDistance=.025;orbit.maxDistance=8;orbit.target.set(0,.85,0);
 function resize(){renderer.setSize(stage.clientWidth,stage.clientHeight,false);camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix();}
 new ResizeObserver(resize).observe(stage);resize();
 renderer.setAnimationLoop(()=>{if(mixer)mixer.update(clock.getDelta());orbit.update();renderer.render(scene,camera);});
 let model,attachment,meshes=[],only=false,cutaway=false,partBounds;let mixer,activeAction;const clock=new THREE.Clock();
 function style(){
  for(const mesh of meshes){
   mesh.visible=!only||mesh===attachment;
   for(const material of (Array.isArray(mesh.material)?mesh.material:[mesh.material])){
    if(!material)continue;
    const original=material.userData.nativeInspectionStyle??={transparent:material.transparent,opacity:material.opacity,depthWrite:material.depthWrite};
    const faded=cutaway&&mesh!==attachment;
    material.transparent=faded||original.transparent;
    material.opacity=faded?original.opacity*.18:original.opacity;
    material.depthWrite=faded?false:original.depthWrite;
    material.needsUpdate=true;
   }
  }
  document.getElementById('isolate').textContent=only?'Show body':'Attachment only';
  document.getElementById('cutaway').textContent=cutaway?'Solid body':'Body cutaway';
 }
 function view(name){
  let box=partBounds;
  if(name==='Full body')box=new THREE.Box3().setFromObject(model,true);
  const center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());
  orbit.target.copy(center);
  let offset=name==='Full body'?new THREE.Vector3(0,.05,Math.max(3,size.y*2.5)):new THREE.Vector3(0,-.07,.40);
  if(name==='Rear')offset.set(0,-.06,-.40);
  if(name==='Side')offset.set(.40,-.02,0);
  if(name==='Underneath')offset.set(.03,-.36,.06);
  camera.position.copy(center).add(offset);orbit.update();
 }
 document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));
 document.getElementById('isolate').onclick=()=>{only=!only;style();};
 document.getElementById('cutaway').onclick=()=>{cutaway=!cutaway;style();};
 const gltf=await new GLTFLoader().loadAsync(sav4AssetUrl);
 model=gltf.scene;scene.add(model);model.updateMatrixWorld(true);
 model.traverse(o=>{if(o.isMesh){meshes.push(o);o.frustumCulled=false;if(o.skeleton)o.skeleton.update();const mats=Array.isArray(o.material)?o.material:[o.material];if(/vulva2.*mhx2/i.test(o.name)||mats.some(m=>/vulva2.*attachment/i.test(m?.name||'')))attachment=o;}});
 if(!attachment)throw Error('The downloaded model has no Vulva2 attachment.');

 // CAR 2 skin material correction: use the same PBR response as the body.
 // The attachment remains an independent mesh for rigging and inspection.
 const candidates=meshes.filter(m=>m!==attachment&&!/hair|eye|iris|lash|brow|cloth|skirt|blouse|teeth|tongue/i.test(m.name));
 const body=candidates.sort((a,b)=>(b.geometry?.attributes?.position?.count||0)-(a.geometry?.attributes?.position?.count||0))[0];
 const skin=body&&(Array.isArray(body.material)?body.material:[body.material])[0];
 if(body&&skin){
   // Sample a small skin-colored region of the body's actual diffuse map.
   // Avoid sampling arbitrary nearest 3D vertices, which can select unrelated
   // UV islands and create a gray or muddy polygon-shaped patch.
   const matched=skin.clone();
   matched.name='CAR2 body-matched skin';
   matched.map=null;
   matched.vertexColors=false;
   matched.color.copy(skin.color);
   matched.normalMap=null;
   matched.bumpMap=null;
   matched.roughnessMap=null;
   matched.metalnessMap=null;
   matched.aoMap=null;
   matched.emissiveMap=null;
   matched.side=THREE.DoubleSide;
   const tex=skin.map,uv=body.geometry.attributes.uv,pos=body.geometry.attributes.position;
   if(tex?.image&&uv&&pos){
     try{
       const img=tex.image,cv=document.createElement('canvas');
       cv.width=img.width||img.videoWidth;cv.height=img.height||img.videoHeight;
       const ctx=cv.getContext('2d',{willReadFrequently:true});
       ctx.drawImage(img,0,0,cv.width,cv.height);
       const pixels=ctx.getImageData(0,0,cv.width,cv.height).data;
       body.updateMatrixWorld(true);attachment.updateMatrixWorld(true);
       const targetCenter=new THREE.Box3().setFromObject(attachment,true).getCenter(new THREE.Vector3());
       const v=new THREE.Vector3(),samples=[];
       const stride=Math.max(1,Math.floor(pos.count/24000));
       for(let i=0;i<pos.count;i+=stride){
         v.fromBufferAttribute(pos,i).applyMatrix4(body.matrixWorld);
         const d=v.distanceToSquared(targetCenter);
         if(!Number.isFinite(d))continue;
         const u=((uv.getX(i)%1)+1)%1,w=((uv.getY(i)%1)+1)%1;
         const x=Math.min(cv.width-1,Math.floor(u*(cv.width-1)));
         const y=Math.min(cv.height-1,Math.floor((1-w)*(cv.height-1)));
         const j=(y*cv.width+x)*4;
         const r=pixels[j],g=pixels[j+1],b=pixels[j+2];
         // Reject very dark texture features, transparent areas and UV seams.
         if(pixels[j+3]<245||r<75||g<45||b<35)continue;
         samples.push({d,r,g,b});
       }
       samples.sort((a,b)=>a.d-b.d);
       const nearest=samples.slice(0,Math.min(128,samples.length));
       if(nearest.length){
         const channel=k=>nearest.map(s=>s[k]).sort((a,b)=>a-b)[Math.floor(nearest.length/2)]/255;
         const tint=new THREE.Color().setRGB(channel('r'),channel('g'),channel('b'),THREE.SRGBColorSpace);
         matched.color.multiply(tint);
         status.textContent='CAR 2 · body skin material matched; inspect transition';
       }else status.textContent='CAR 2 · body material matched (texture samples unavailable)';
     }catch(e){console.warn('Skin sample unavailable',e);status.textContent='CAR 2 · body material matched without texture sampling';}
   }else status.textContent='CAR 2 · shared body material settings';
   // Geometry stays intact; avoid vertex colors and custom shader grain,
   // which previously made the attachment look like a separate flat patch.
   attachment.material=matched;matched.needsUpdate=true;
 }else status.textContent='CAR 2 · body skin material unavailable';
 partBounds=new THREE.Box3().setFromObject(attachment,true);
 const motions=document.getElementById('motion-list'); const count=document.getElementById('motion-count');
 const requested=['Stand','Walk','Run','Wave','Sit','Sit — legs apart','Bend and pick up','Hands and knees','Elbows and knees','Crawl','Lie down'];
 // Show a movement panel immediately, even while the separate Carol asset downloads.
 motions.textContent='';for(const name of requested){const b=document.createElement('button');b.textContent=name+' (loading)';b.disabled=true;motions.append(b);}
 // Retarget Carol's authored clips by exact bone names when the rigs agree.
 let clips=gltf.animations;
 if(!clips.length){try{
  count.textContent='Loading Carol’s refined movements…';
  const source=await new GLTFLoader().loadAsync('./assets/caroline-inspection.glb');
  const targetBones=new Map();model.traverse(o=>{if(o.isBone)targetBones.set(o.name.toLowerCase().replace(/[^a-z0-9]/g,''),o.name);});
  const norm=n=>n.toLowerCase().replace(/[^a-z0-9]/g,'');
  clips=source.animations.map(clip=>{
   const tracks=clip.tracks.map(track=>{const dot=track.name.lastIndexOf('.');if(dot<0)return null;const bone=track.name.slice(0,dot);const target=targetBones.get(norm(bone));if(!target)return null;const copy=track.clone();copy.name=target+track.name.slice(dot);return copy;}).filter(Boolean);
   return tracks.length>=4?new THREE.AnimationClip(clip.name,clip.duration,tracks):null;
  }).filter(Boolean);
  if(!clips.length)throw Error('Carol’s rig does not match CAR 2’s rig; a Blender retarget/export is required.');
  status.textContent='CAR 2 loaded · Carol animation preview (retargeted by bone name; visual QA pending)';
 }catch(e){motions.textContent='Carol movement transfer unavailable: '+e.message;}}
 count.textContent=clips.length?`${clips.length} movements available`:'Movements unavailable — check rig';
 if(clips.length){mixer=new THREE.AnimationMixer(model);motions.textContent='';const stop=document.createElement('button');stop.textContent='Stop / Reset';stop.onclick=()=>{mixer.stopAllAction();activeAction=null;mixer.setTime(0);};motions.append(stop);for(const clip of clips){const b=document.createElement('button');b.textContent=clip.name.replace(/^Caroline\s*/i,'')||'Unnamed clip';b.onclick=()=>{if(activeAction)activeAction.fadeOut(.15);activeAction=mixer.clipAction(clip);activeAction.reset().fadeIn(.15);const looping=/walk|run/i.test(clip.name);activeAction.setLoop(looping?THREE.LoopRepeat:THREE.LoopOnce,looping?Infinity:1);activeAction.clampWhenFinished=!looping;activeAction.play();};motions.append(b);}}
 else {const explanation=motions.textContent;motions.textContent='';const note=document.createElement('p');note.textContent=explanation||'No compatible clips in model';motions.append(note);for(const name of requested){const b=document.createElement('button');b.textContent=name+' · unavailable';b.disabled=true;b.title='Requires exported skeletal animation';motions.append(b);}}
 if(!status.textContent.includes('body-tone')&&!status.textContent.includes('skin material unavailable'))status.textContent='CAR 2 · full-body movement viewer';
 document.querySelectorAll('#inspection button').forEach(b=>b.disabled=false);view('Full body');
 // Display the exported model directly: no eye replacements, body reshaping,
 // automatic posing, added garments, or per-frame geometry fitting.

}catch(error){status.textContent='Preview could not start: '+error.message;document.getElementById('error').textContent=error.message;}
</script></body></html>
