<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAV4 Skin Match Lab</title><style>body{margin:0;background:#1a2924;color:#f2f6f2;font:15px system-ui}header,footer{padding:12px}h1{font-size:20px;margin:0 0 6px}#stage{height:70dvh;min-height:380px}canvas{display:block;touch-action:none}nav{display:flex;gap:8px;flex-wrap:wrap;padding:10px}button{padding:12px;background:#426d5c;color:white;border:1px solid #769787;border-radius:8px;font:inherit}button:focus{outline:3px solid #e5cc85}#status{font-size:13px}#legend{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center;font-size:12px;padding:8px}#error{color:#ffceae;padding:10px}</style></head><body><header><h1>SAV4 — Four-Way Skin Match</h1><div id="status">Loading SAV4's fitted model…</div><small>Original plus three material-only samples. Geometry and original asset are unchanged.</small></header><div id="stage"></div><div id="legend"><span>Original</span><span>A · skin tone</span><span>B · warmer</span><span>C · cooler</span></div><nav><button data-view="front">Front</button><button data-view="side">Side</button><button data-view="rear">Rear</button><button data-view="full">Full body</button><button id="reset">Reset</button></nav><footer>Choose the closest skin match visually. These are live shader comparisons only; nothing is applied to SAV4.</footer><div id="error"></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {clone} from 'three/addons/utils/SkeletonUtils.js';
const stage=document.getElementById('stage'),status=document.getElementById('status');
try{
const scene=new THREE.Scene();scene.background=new THREE.Color(0x22372f);scene.add(new THREE.HemisphereLight(0xffffff,0x76867e,2.3));const key=new THREE.DirectionalLight(0xffffff,2.2);key.position.set(2,3,4);scene.add(key);const fill=new THREE.DirectionalLight(0xffffff,1.5);fill.position.set(-2,0,-3);scene.add(fill);
const camera=new THREE.PerspectiveCamera(38,1,.001,100);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));stage.append(renderer.domElement);const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.minDistance=.05;orbit.maxDistance=15;
new ResizeObserver(()=>{renderer.setSize(stage.clientWidth,stage.clientHeight,false);camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix()}).observe(stage);renderer.setAnimationLoop(()=>{orbit.update();renderer.render(scene,camera)});
const gltf=await new GLTFLoader().loadAsync('./assets/sav4-vulva2-native-fit.glb?v=skin-match-lab-1');const original=gltf.scene;original.updateMatrixWorld(true);
let sourcePart=null,body=null;original.traverse(o=>{if(!o.isMesh)return;const mats=Array.isArray(o.material)?o.material:[o.material];if(/vulva2.*mhx2/i.test(o.name)||mats.some(m=>/vulva2.*attachment/i.test(m?.name||'')))sourcePart=o;else if(!body&&mats.some(m=>m?.map||m?.color))body=o;});
if(!sourcePart)throw Error('Original fitted Vulva2 mesh not found — no comparisons generated.');
const box=new THREE.Box3().setFromObject(sourcePart,true),center=box.getCenter(new THREE.Vector3()),dims=box.getSize(new THREE.Vector3());const spacing=Math.max(.48,dims.x*2.5);
const bodyMat=body?(Array.isArray(body.material)?body.material[0]:body.material):null;const base=bodyMat?.color?.clone()||new THREE.Color(0xb88c78);
const variants=[null,base.clone(),base.clone().multiply(new THREE.Color(1.055,.98,.945)),base.clone().multiply(new THREE.Color(.96,1.005,1.05))];
for(let i=0;i<4;i++){const model=clone(original);model.position.x=(i-1.5)*spacing;model.traverse(o=>{if(!o.isMesh)return;o.frustumCulled=false;o.material=(Array.isArray(o.material)?o.material.map(m=>m.clone()):o.material.clone());const isPart=/vulva2.*mhx2/i.test(o.name)||(Array.isArray(o.material)?o.material:[o.material]).some(m=>/vulva2.*attachment/i.test(m?.name||''));if(isPart&&i>0){for(const m of (Array.isArray(o.material)?o.material:[o.material])){if(m.color)m.color.copy(variants[i]);m.needsUpdate=true;}}});scene.add(model);}
const target=new THREE.Vector3(0,center.y,center.z),width=spacing*4;
function view(which){orbit.target.copy(target);let dist=Math.max(1.5,width*1.75);if(which==='full'){const b=new THREE.Box3().setFromObject(original,true);orbit.target.y=b.getCenter(new THREE.Vector3()).y;dist=Math.max(dist,b.getSize(new THREE.Vector3()).y*2.2);}let v=new THREE.Vector3(0,0,dist);if(which==='side')v.set(dist,0,0);if(which==='rear')v.set(0,0,-dist);camera.position.copy(orbit.target).add(v);orbit.update();}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));document.getElementById('reset').onclick=()=>view('front');view('front');status.textContent='Loaded 4 copies of the same fitted geometry. Original is unchanged. Compare under identical lighting.';
}catch(e){status.textContent='Could not load comparison: '+e.message;document.getElementById('error').textContent=e.stack||e.message;}
</script></body></html>
