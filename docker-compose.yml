services:
  wvlrp-relay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wvlrp-relay
    restart: unless-stopped
    environment:
      WVLRP_RTSP_SOURCE: ${WVLRP_RTSP_SOURCE:-}
      WVLRP_ROOST_RTSP_SOURCE: ${WVLRP_ROOST_RTSP_SOURCE:-}
      MTX_PATHS_EASTBANK_SOURCE: ${MTX_PATHS_EASTBANK_SOURCE:-}
      MTX_PATHS_ROOST_SOURCE: ${MTX_PATHS_ROOST_SOURCE:-}
    ports:
      - "127.0.0.1:8888:8888"
      - "8189:8189/udp"
      - "8189:8189/tcp"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8888/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
