<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3948 Facial Controls | WVLRP</title><style>body{margin:0;background:#111e1c;color:#fff;font:16px system-ui}header,nav{padding:12px;background:#1b3932}button{padding:11px;margin:3px;border:0;border-radius:8px}#v{height:76dvh;touch-action:none}#s{padding:12px}</style></head><body><header><b>WVLRP · 3948 Facial Controls</b><br><small>Drag to rotate · pinch to zoom</small></header><nav><button id="orig">Original</button><button id="fix">Crown V3</button><button id="reset">Reset view</button></nav><section id="facepanel" style="padding:10px;background:#203b34;display:grid;grid-template-columns:1fr 1fr;gap:8px"><label>Jaw open <input id="jaw" type="range" min="0" max="100" value="0"></label><label>Smile <input id="smile" type="range" min="-100" max="100" value="0"></label><label>Lips round <input id="round" type="range" min="0" max="100" value="0"></label><label>Brows raise <input id="brows" type="range" min="-100" max="100" value="0"></label><button id="neutral">Neutral face</button><span id="facestatus">Experimental geometry controls</span></section><div id="v"></div><div id="s">Loading 3948…</div><script type="module">import * as T from 'https://esm.sh/three@0.169.0';import{OrbitControls}from'https://esm.sh/three@0.169.0/examples/jsm/controls/OrbitControls.js';import{GLTFLoader}from'https://esm.sh/three@0.169.0/examples/jsm/loaders/GLTFLoader.js';const host=document.querySelector('#v'),status=document.querySelector('#s'),scene=new T.Scene();scene.background=new T.Color(0x192321);const camera=new T.PerspectiveCamera(42,1,.001,100),renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));host.appendChild(renderer.domElement);scene.add(new T.HemisphereLight(0xffffff,0x333344,2.8));const light=new T.DirectionalLight(0xffffff,2);light.position.set(1,2,3);scene.add(light);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;function resize(){renderer.setSize(host.clientWidth,host.clientHeight);camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();function reset(){camera.position.set(0,.03,1.75);controls.target.set(0,0,0);controls.update()}reset();let meshes=[];function smooth(t){t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)}function setCrown(on){for(const [mesh,original] of meshes){const a=mesh.geometry.attributes.position,p=a.array;for(let i=0;i<p.length;i+=3){const x=original[i],y=original[i+1],z=original[i+2];p[i]=x;p[i+1]=y;p[i+2]=z;if(on){const h=smooth((y-.29)/.14),across=Math.max(0,1-Math.pow(x/.52,2)),depth=Math.max(0,1-Math.pow((z+.01)/.52,2));p[i+1]+=.155*h*Math.pow(across,.85)*Math.pow(depth,.45)}}a.needsUpdate=true;mesh.geometry.computeVertexNormals();mesh.geometry.computeBoundingSphere()}status.textContent=on?'Crown V3 — rounded skull, face preserved':'Original 3948'}document.querySelector('#orig').onclick=()=>setCrown(false);document.querySelector('#fix').onclick=()=>setCrown(true);document.querySelector('#reset').onclick=reset;new GLTFLoader().load('./3948-3d.glb',g=>{scene.add(g.scene);g.scene.traverse(o=>{if(o.isMesh){o.geometry=o.geometry.clone();const a=o.geometry.attributes.position;meshes.push([o,new Float32Array(a.array)]);o.material.side=T.DoubleSide}});setCrown(true);faceUpdate()},undefined,e=>status.textContent='Could not load head: '+e.message);function faceUpdate(){const jaw=+document.querySelector('#jaw').value/100,smile=+document.querySelector('#smile').value/100,round=+document.querySelector('#round').value/100,brows=+document.querySelector('#brows').value/100;for(const [mesh,original] of meshes){const a=mesh.geometry.attributes.position,p=a.array;for(let i=0;i<p.length;i+=3){let x=original[i],y=original[i+1],z=original[i+2];const lip=Math.exp(-Math.pow((y+.12)/.055,2))*Math.exp(-Math.pow(x/.17,4));const lower=Math.max(0,Math.min(1,(-y-.11)/.09))*Math.exp(-Math.pow(x/.23,4));const corner=Math.exp(-Math.pow((Math.abs(x)-.105)/.045,2))*Math.exp(-Math.pow((y+.12)/.06,2));const brow=Math.exp(-Math.pow((y-.085)/.04,2))*Math.exp(-Math.pow((Math.abs(x)-.105)/.09,2));p[i]=x*(1-.16*round*lip)+Math.sign(x)*.012*smile*corner;p[i+1]=y-.055*jaw*lower+.02*smile*corner+.023*brows*brow;p[i+2]=z+.008*round*lip}a.needsUpdate=true;mesh.geometry.computeVertexNormals()}}for(const id of ['jaw','smile','round','brows'])document.getElementById(id).addEventListener('input',faceUpdate);document.getElementById('neutral').onclick=()=>{for(const id of ['jaw','smile','round','brows'])document.getElementById(id).value=0;faceUpdate()};function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)}loop();</script></body></html>
