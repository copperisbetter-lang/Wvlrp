<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brooke | 3D Head Viewer</title>
<style>body{margin:0;background:#121820;color:#fff;font:16px system-ui}header{padding:12px 16px}h1{font-size:1.3rem;margin:0 0 6px}small{color:#b8c9d7}main{height:78vh;min-height:400px}model-viewer{width:100%;height:100%;background:#28313c}#status{padding:8px 16px;color:#d6e3ed}a{color:#aee4ff}</style>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script></head>
<body><header><h1>Brooke — 3D Head</h1><small>Photo-reconstructed head and neck. Drag to rotate; pinch to zoom. Facial likeness still requires visual review.</small></header>
<main><model-viewer id="viewer" camera-controls auto-rotate shadow-intensity="1" exposure="1.2" alt="Rotatable Brooke photo-reconstructed head and neck"></model-viewer></main>
<div id="status">Loading Brooke's model…</div>
<script>
const viewer=document.getElementById('viewer'),status=document.getElementById('status');
const sources=[
'https://cdn.jsdelivr.net/gh/copperisbetter-lang/Wvlrp@main/public-models/brooke-photo-head-neck.glb',
'https://raw.githubusercontent.com/copperisbetter-lang/Wvlrp/main/public-models/brooke-photo-head-neck.glb'
];let idx=0;
function load(){viewer.src=sources[idx];}
viewer.addEventListener('load',()=>{status.textContent='Model loaded. Drag to rotate; pinch to zoom.'});
viewer.addEventListener('error',()=>{if(++idx<sources.length)load();else status.textContent='Model could not load. Please report this message.'});
load();
</script></body></html>
