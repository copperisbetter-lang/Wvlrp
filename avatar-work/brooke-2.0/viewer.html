<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brooke 2.0 | Photo Head Inspection</title><style>body{margin:0;background:#1c2827;color:#f3f6f4;font:15px system-ui}header,nav{padding:12px;background:#263b37}#stage{height:74dvh;min-height:360px}select,button{font:inherit;padding:9px;margin:5px;background:#e9f2ed;color:#162d25;border-radius:6px}label{display:inline-block}small{color:#c3d4ca}</style></head><body><header><b>Brooke 2.0 — photo-derived face inspection</b><p id="status">Loading independent full-body GLB…</p><small>Photo-derived candidate is an independent head mesh; not yet fitted to the Sophie-cloned body.</small></header><div id="stage"></div><nav><label>View <select id="view"><option>Face</option><option>Full body</option><option>Front</option><option>Left</option><option>Right</option><option>Back</option></select></label><label>Movement <select id="motion"><option>None</option></select></label><button id="reset">Reset</button></nav><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const stage=document.getElementById('stage'),status=document.getElementById('status');const scene=new THREE.Scene();scene.background=new THREE.Color(0x263b37);scene.add(new THREE.HemisphereLight(0xffffff,0x7a8582,2.2));const light=new THREE.DirectionalLight(0xffffff,2.3);light.position.set(3,5,5);scene.add(light);const camera=new THREE.PerspectiveCamera(42,1,.001,1000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));stage.append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;const clock=new THREE.Clock();let mixer,actions=[],model,box;
function resize(){renderer.setSize(stage.clientWidth,stage.clientHeight,false);camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(stage);resize();
function view(){if(!box)return;const center=box.getCenter(new THREE.Vector3()),sz=box.getSize(new THREE.Vector3()),height=Math.max(sz.y,.1),choice=document.getElementById('view').value;let target=center.clone(),distance=Math.max(height*1.5,.4);if(choice==='Face'){target.y=box.max.y-height*.12;distance=Math.max(height*.30,.16)}let v=new THREE.Vector3(0,0,distance);if(choice==='Left')v.set(-distance,0,0);if(choice==='Right')v.set(distance,0,0);if(choice==='Back')v.set(0,0,-distance);controls.target.copy(target);camera.position.copy(target).add(v);controls.update()}
document.getElementById('view').onchange=view;document.getElementById('reset').onclick=view;document.getElementById('motion').onchange=e=>{actions.forEach(a=>a.stop());const i=e.target.selectedIndex-1;if(i>=0)actions[i].reset().play()};
try{const gltf=await new GLTFLoader().loadAsync('../../public-models/brooke-2.0-photo-head-candidate.glb');model=gltf.scene;scene.add(model);model.updateMatrixWorld(true);box=new THREE.Box3().setFromObject(model);if(box.isEmpty())throw Error('Model contains no visible geometry');if(gltf.animations.length){mixer=new THREE.AnimationMixer(model);gltf.animations.forEach(c=>{actions.push(mixer.clipAction(c));document.getElementById('motion').add(new Option(c.name))})}view();status.textContent='Photo-reconstructed head candidate loaded · '+gltf.animations.length+' animations · Sophie 1 untouched.'}catch(e){status.textContent='Photo head is still publishing, or viewer error: '+e.message}renderer.setAnimationLoop(()=>{const dt=clock.getDelta();if(mixer)mixer.update(dt);controls.update();renderer.render(scene,camera)});
</script></body></html>
