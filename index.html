<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020906"><title>West Virginia Live Research Project</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020906;color:#fff;font-family:Arial,sans-serif;overscroll-behavior:none}button,a{font:inherit}
#scene{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none;background:#06100b;user-select:none;-webkit-user-select:none}#scene.dragging{cursor:grabbing}
#pano{position:absolute;inset:0;background-image:url('assets/wvlrp-360-master.webp');background-size:auto 100%;background-repeat:repeat-x;background-position:center center;will-change:background-position}
header{position:fixed;z-index:20;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:13px 16px;background:linear-gradient(180deg,rgba(0,10,7,.88),rgba(0,10,7,.28),transparent)}
.brand{font-weight:900;letter-spacing:.09em;text-shadow:0 2px 8px #000}.brand small{display:block;font-size:8px;letter-spacing:.15em;color:#d9e6dd;margin-top:3px}.menu{border:1px solid rgba(255,255,255,.35);border-radius:999px;background:rgba(1,15,10,.55);color:#fff;padding:8px 12px}
.hint{position:fixed;z-index:15;top:76px;left:50%;transform:translateX(-50%);padding:8px 12px;border-radius:999px;background:rgba(0,10,7,.58);border:1px solid rgba(255,255,255,.18);font-size:11px;letter-spacing:.08em;white-space:nowrap;transition:opacity .8s;pointer-events:none}
.hotspot{position:absolute;z-index:8;left:0;top:67%;width:min(28vw,300px);aspect-ratio:16/9;border:1px solid rgba(225,255,235,.55);border-radius:2px;overflow:hidden;background:rgba(255,255,255,.006);box-shadow:none;text-decoration:none;color:#fff;transform:translate(-50%,-50%);touch-action:none}
.hotspot:hover,.hotspot:active{border-color:rgba(150,255,185,.94);box-shadow:0 0 9px rgba(100,255,150,.15)}.hotspot .glass{position:absolute;inset:0;background:rgba(255,255,255,.006);pointer-events:none}
.hotspot strong{position:absolute;left:10px;bottom:17px;font-size:clamp(10px,1.35vw,14px);font-weight:700;text-shadow:0 1px 3px #000}.hotspot small{position:absolute;left:10px;bottom:5px;font-size:7px;letter-spacing:.1em;color:#cce9d5;text-shadow:0 1px 2px #000}.live{position:absolute;right:8px;top:8px;background:rgba(0,18,10,.28);border:0;border-radius:2px;padding:2px 4px;font-size:7px;font-weight:900;letter-spacing:.08em}.live:before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#48ef7a;margin-right:5px;box-shadow:0 0 8px #48ef7a}
footer{position:fixed;z-index:20;left:0;right:0;bottom:0;padding:12px 14px 16px;background:linear-gradient(0deg,rgba(0,10,7,.92),rgba(0,10,7,.45),transparent);display:flex;justify-content:space-between;align-items:end;pointer-events:none}.tag{font-size:10px;letter-spacing:.12em;text-shadow:0 2px 6px #000}.tag b{display:block;font-size:13px;margin-bottom:3px}.controls{pointer-events:auto;display:flex;gap:7px}.controls a{color:#fff;text-decoration:none;background:rgba(0,15,9,.7);border:1px solid rgba(255,255,255,.24);padding:8px 10px;border-radius:999px;font-size:10px}
@media(max-width:650px){.hotspot{width:min(46vw,205px)}.brand{font-size:13px}.hint{top:68px}}
</style></head><body>
<div id="scene" aria-label="Interactive WVLRP property view">
  <div id="pano" aria-hidden="true"></div>
  <a class="hotspot" id="east" href="east-bank.html" aria-label="Open East Bank live camera"><div class="glass"></div><span class="live">LIVE</span><strong>East Bank</strong><small>OPEN CAMERA →</small></a>
</div>
<header><div class="brand">WVLRP<small>WEST VIRGINIA LIVE RESEARCH PROJECT</small></div><button class="menu" onclick="location.href='member-guide.html'">☰ EXPLORE</button></header>
<div class="hint" id="hint">DRAG TO LOOK AROUND • TAP EAST BANK TO GO LIVE</div>
<footer><div class="tag"><b>YOU'RE STANDING IN THE WOODS.</b>Real places • Real wildlife • We do it live.</div><div class="controls"><a href="lounge.html">Lounge</a><a href="gift-shop.html">Gift Shop</a></div></footer>
<script>
(()=>{
  const scene=document.getElementById('scene'),pano=document.getElementById('pano'),east=document.getElementById('east'),hint=document.getElementById('hint');
  const MASTER_ASPECT=2048/768,EAST_ANCHOR=.281,DRAG_GAIN=1.18;
  let offset=0,startX=0,startOffset=0,down=false,moved=false;

  function tileWidth(){return scene.clientHeight*MASTER_ASPECT}
  function wrap(v,w){return ((v+w/2)%w+w)%w-w/2}
  function draw(){
    const w=tileWidth();
    offset=wrap(offset,w);
    const tileLeft=scene.clientWidth/2-w/2+offset;
    pano.style.backgroundPosition=tileLeft+'px center';

    let x=tileLeft+w*EAST_ANCHOR;
    const margin=east.offsetWidth/2+8;
    while(x<-margin)x+=w;
    while(x>scene.clientWidth+margin)x-=w;
    east.style.left=x+'px';
  }
  function begin(e){
    if(e.button!==undefined&&e.button!==0)return;
    down=true;moved=false;startX=e.clientX;startOffset=offset;
    scene.classList.add('dragging');scene.setPointerCapture?.(e.pointerId);
  }
  function move(e){
    if(!down)return;
    const d=e.clientX-startX;
    if(Math.abs(d)>6)moved=true;
    offset=startOffset+d*DRAG_GAIN;
    draw();
  }
  function end(){down=false;scene.classList.remove('dragging')}
  scene.addEventListener('pointerdown',begin);
  scene.addEventListener('pointermove',move);
  scene.addEventListener('pointerup',end);
  scene.addEventListener('pointercancel',end);
  east.addEventListener('click',e=>{if(moved)e.preventDefault()});
  addEventListener('resize',draw);
  setTimeout(()=>hint.style.opacity='0',4500);
  draw();
})();
</script><script src="site-auth.js?v=20260916-menu2"></script><script src="site-analytics.js?v=20260916-1"></script></body></html>
