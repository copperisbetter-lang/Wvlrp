<script>
(()=>{
  const scene=document.getElementById('scene'),pano=document.getElementById('pano'),east=document.getElementById('east'),hint=document.getElementById('hint');
  const MASTER_ASPECT=2048/768,EAST_ANCHOR=.281,DRAG_GAIN=1.18;
  let offset=0,startX=0,startOffset=0,down=false,moved=false;

  function tileWidth(){return scene.clientHeight*MASTER_ASPECT}
  function wrap(v,w){return ((v+w/2)%w+w)%w-w/2}
  function draw(){
    const w=tileWidth();
    offset=wrap(offset,w);
    const tileLeft=scene.clientWidth/2-w/2+offset;
    pano.style.backgroundPosition=tileLeft+'px center';

    let x=tileLeft+w*EAST_ANCHOR;
    const margin=east.offsetWidth/2+8;
    while(x<-margin)x+=w;
    while(x>scene.clientWidth+margin)x-=w;
    east.style.left=x+'px';
  }
  function begin(e){
    if(e.button!==undefined&&e.button!==0)return;
    down=true;moved=false;startX=e.clientX;startOffset=offset;
    scene.classList.add('dragging');scene.setPointerCapture?.(e.pointerId);
  }
  function move(e){
    if(!down)return;
    const d=e.clientX-startX;
    if(Math.abs(d)>6)moved=true;
    offset=startOffset+d*DRAG_GAIN;
    draw();
  }
  function end(){down=false;scene.classList.remove('dragging')}
  scene.addEventListener('pointerdown',begin);
  scene.addEventListener('pointermove',move);
  scene.addEventListener('pointerup',end);
  scene.addEventListener('pointercancel',end);
  east.addEventListener('click',e=>{if(moved)e.preventDefault()});
  addEventListener('resize',draw);
  setTimeout(()=>hint.style.opacity='0',4500);
  draw();
})();
</script>
<script>
(()=>{
  const btn=document.getElementById('siteMenuButton'),menu=document.getElementById('siteMenu'),account=document.getElementById('wvHomeAccount');
  if(!btn||!menu)return;
  btn.addEventListener('click',e=>{e.stopPropagation();const open=menu.classList.toggle('open');btn.setAttribute('aria-expanded',String(open))});
  menu.addEventListener('click',e=>e.stopPropagation());
  document.addEventListener('click',()=>{menu.classList.remove('open');btn.setAttribute('aria-expanded','false')});
  account?.addEventListener('click',()=>{
    menu.classList.remove('open');btn.setAttribute('aria-expanded','false');
    const auth=document.querySelector('.wv-auth-pill'); if(auth) auth.click();
  });
})();
</script><script src="site-auth.js?v=20260916-menu2"></script>
