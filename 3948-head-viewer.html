<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>WVLRP 3948 Head Viewer</title><style>body{margin:0;background:#111e1c;color:white;font:16px sans-serif}header,nav{padding:12px;background:#1b3932}button{padding:12px;margin:3px;border:0;border-radius:7px}#v{height:75dvh}#s{padding:10px}</style></head><body><header>WVLRP · 3948 Head Viewer<br><small>Drag to rotate · pinch to zoom</small></header><nav><button id="a">Original</button><button id="b">Crown Repair</button><button id="c">Reset</button></nav><div id="v"></div><div id="s">Loading head...</div><script type="module">import * as T from 'https://esm.sh/three@0.169.0';import{OrbitControls}from'https://esm.sh/three@0.169.0/examples/jsm/controls/OrbitControls.js';import{GLTFLoader}from'https://esm.sh/three@0.169.0/examples/jsm/loaders/GLTFLoader.js';let v=document.querySelector('#v'),s=document.querySelector('#s'),scene=new T.Scene();scene.background=new T.Color(0x192321);let cam=new T.PerspectiveCamera(42,1,.001,100),r=new T.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));v.appendChild(r.domElement);scene.add(new T.HemisphereLight(0xffffff,0x333344,2.8));let l=new T.DirectionalLight(0xffffff,2);l.position.set(1,2,3);scene.add(l);let ctrl=new OrbitControls(cam,r.domElement);ctrl.enableDamping=true;function resize(){r.setSize(v.clientWidth,v.clientHeight);cam.aspect=v.clientWidth/v.clientHeight;cam.updateProjectionMatrix()}onresize=resize;resize();function reset(){cam.position.set(0,.03,1.75);ctrl.target.set(0,0,0);ctrl.update()}reset();let attrs=[];function toggle(on){for(let [a,b]of attrs){let p=a.array;for(let i=0;i<p.length;i+=3){p[i]=b[i];p[i+1]=b[i+1];p[i+2]=b[i+2];if(on){let t=Math.max(0,Math.min(1,(b[i+1]-.18)/.2910663));p[i+1]+=.043*t*t*(3-2*t)}}a.needsUpdate=true}scene.traverse(o=>{if(o.isMesh){o.geometry.computeVertexNormals();o.geometry.computeBoundingSphere()}});s.textContent=on?'Crown repair preview':'Original 3948'}document.querySelector('#a').onclick=()=>toggle(false);document.querySelector('#b').onclick=()=>toggle(true);document.querySelector('#c').onclick=reset;new GLTFLoader().load('./3948-3d.glb',g=>{scene.add(g.scene);g.scene.traverse(o=>{if(o.isMesh){let a=o.geometry.attributes.position;attrs.push([a,new Float32Array(a.array)]);o.material.side=T.DoubleSide}});s.textContent='Ready. Compare Original and Crown Repair.'},undefined,e=>s.textContent='Loading error: '+e.message);function loop(){requestAnimationFrame(loop);ctrl.update();r.render(scene,cam)}loop()</script></body></html>
