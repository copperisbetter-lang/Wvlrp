<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3948 Hat Edition | WVLRP</title><style>body{margin:0;background:#111e1c;color:#fff;font:16px system-ui}header,nav{padding:12px;background:#1b3932}button{padding:11px;margin:3px;border:0;border-radius:8px}#v{height:76dvh;touch-action:none}#s{padding:12px}</style></head><body><header><b>WVLRP · 3948 Hat Edition</b><br><small>Drag to rotate · pinch to zoom</small></header><nav><button id="orig">Original</button><button id="fix">Hat Edition</button><button id="reset">Reset view</button></nav><div id="v"></div><div id="s">Loading 3948…</div><script type="module">import * as T from 'https://esm.sh/three@0.169.0';import{OrbitControls}from'https://esm.sh/three@0.169.0/examples/jsm/controls/OrbitControls.js';import{GLTFLoader}from'https://esm.sh/three@0.169.0/examples/jsm/loaders/GLTFLoader.js';const host=document.querySelector('#v'),status=document.querySelector('#s'),scene=new T.Scene();scene.background=new T.Color(0x192321);const camera=new T.PerspectiveCamera(42,1,.001,100),renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));host.appendChild(renderer.domElement);scene.add(new T.HemisphereLight(0xffffff,0x333344,2.8));const light=new T.DirectionalLight(0xffffff,2);light.position.set(1,2,3);scene.add(light);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;function resize(){renderer.setSize(host.clientWidth,host.clientHeight);camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();function reset(){camera.position.set(0,.03,1.75);controls.target.set(0,0,0);controls.update()}reset();let meshes=[];function smooth(t){t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)}function setCrown(on){for(const [mesh,original] of meshes){const a=mesh.geometry.attributes.position,p=a.array;for(let i=0;i<p.length;i+=3){const x=original[i],y=original[i+1],z=original[i+2];p[i]=x;p[i+1]=y;p[i+2]=z;if(on){const h=smooth((y-.29)/.14),across=Math.max(0,1-Math.pow(x/.52,2)),depth=Math.max(0,1-Math.pow((z+.01)/.52,2));p[i+1]+=.155*h*Math.pow(across,.85)*Math.pow(depth,.45)}}a.needsUpdate=true;mesh.geometry.computeVertexNormals();mesh.geometry.computeBoundingSphere()}status.textContent=on?'Hat Edition — rounded skull, face preserved':'Original 3948'}document.querySelector('#orig').onclick=()=>setCrown(false);document.querySelector('#fix').onclick=()=>setCrown(true);document.querySelector('#reset').onclick=reset;new GLTFLoader().load('./3948-3d.glb',g=>{scene.add(g.scene);g.scene.traverse(o=>{if(o.isMesh){o.geometry=o.geometry.clone();const a=o.geometry.attributes.position;meshes.push([o,new Float32Array(a.array)]);o.material.side=T.DoubleSide}});setCrown(true)},undefined,e=>status.textContent='Could not load head: '+e.message);const hatGroup=new T.Group();scene.add(hatGroup);const fabric=new T.MeshStandardMaterial({color:0x998064,roughness:.94,side:T.DoubleSide}),meshFabric=new T.MeshStandardMaterial({color:0x4b382c,roughness:1,side:T.DoubleSide}),patchMat=new T.MeshStandardMaterial({color:0xd4b994,roughness:.95,side:T.DoubleSide});const cap=new T.Mesh(new T.SphereGeometry(1,36,20,0,Math.PI*2,0,Math.PI/2),fabric);cap.scale.set(.365,.235,.32);cap.position.set(0,.435,0);hatGroup.add(cap);const band=new T.Mesh(new T.CylinderGeometry(.345,.345,.07,48,1,true),meshFabric);band.scale.z=.93;band.position.y=.445;hatGroup.add(band);const brim=new T.Mesh(new T.SphereGeometry(1,36,10,0,Math.PI,0,Math.PI/2),fabric);brim.scale.set(.35,.045,.22);brim.rotation.y=Math.PI; brim.position.set(0,.432,.275);hatGroup.add(brim);const badge=new T.Mesh(new T.BoxGeometry(.135,.09,.012),patchMat);badge.position.set(0,.584,.262);badge.rotation.x=-.48;hatGroup.add(badge);const dotmat=new T.MeshStandardMaterial({color:0x30251d});for(const [x,y] of [[-.032,.59],[0,.606],[.032,.59],[0,.566]]){const dot=new T.Mesh(new T.SphereGeometry(.012,8,8),dotmat);dot.position.set(x,y,.273);hatGroup.add(dot)}const hatButton=document.createElement('button');hatButton.textContent='Hide hat';document.querySelector('nav').appendChild(hatButton);hatButton.onclick=()=>{hatGroup.visible=!hatGroup.visible;hatButton.textContent=hatGroup.visible?'Hide hat':'Show hat'};function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)}loop();</script></body></html>
