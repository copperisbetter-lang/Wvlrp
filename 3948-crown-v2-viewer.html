<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3948 Crown V2 | WVLRP</title><style>body{margin:0;background:#111e1c;color:#fff;font:16px system-ui}header,nav{padding:12px;background:#1b3932}button{padding:11px;margin:3px;border:0;border-radius:8px}#v{height:76dvh;touch-action:none}#s{padding:12px}</style></head><body><header><b>WVLRP · 3948 Crown V2</b><br><small>Drag to rotate · pinch to zoom</small></header><nav><button id="orig">Original</button><button id="fix">Crown V2</button><button id="reset">Reset view</button></nav><div id="v"></div><div id="s">Loading 3948…</div><script type="module">import * as T from 'https://esm.sh/three@0.169.0';import{OrbitControls}from'https://esm.sh/three@0.169.0/examples/jsm/controls/OrbitControls.js';import{GLTFLoader}from'https://esm.sh/three@0.169.0/examples/jsm/loaders/GLTFLoader.js';const host=document.querySelector('#v'),status=document.querySelector('#s'),scene=new T.Scene();scene.background=new T.Color(0x192321);const camera=new T.PerspectiveCamera(42,1,.001,100),renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));host.appendChild(renderer.domElement);scene.add(new T.HemisphereLight(0xffffff,0x333344,2.8));const light=new T.DirectionalLight(0xffffff,2);light.position.set(1,2,3);scene.add(light);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;function resize(){renderer.setSize(host.clientWidth,host.clientHeight);camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();function reset(){camera.position.set(0,.03,1.75);controls.target.set(0,0,0);controls.update()}reset();let meshes=[];function smooth(t){t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)}function setCrown(on){for(const [mesh,original] of meshes){const a=mesh.geometry.attributes.position,p=a.array;for(let i=0;i<p.length;i+=3){const x=original[i],y=original[i+1],z=original[i+2];p[i]=x;p[i+1]=y;p[i+2]=z;if(on){const h=smooth((y-.17)/.24),rad=Math.sqrt((x/.46)**2+((z+.045)/.42)**2),dome=Math.pow(Math.max(0,1-(rad/1.15)**2),1.5);p[i+1]+=.105*h*dome}}a.needsUpdate=true;mesh.geometry.computeVertexNormals();mesh.geometry.computeBoundingSphere()}status.textContent=on?'Crown V2 — rounded skull, face preserved':'Original 3948'}document.querySelector('#orig').onclick=()=>setCrown(false);document.querySelector('#fix').onclick=()=>setCrown(true);document.querySelector('#reset').onclick=reset;new GLTFLoader().load('./3948-3d.glb',g=>{scene.add(g.scene);g.scene.traverse(o=>{if(o.isMesh){o.geometry=o.geometry.clone();const a=o.geometry.attributes.position;meshes.push([o,new Float32Array(a.array)]);o.material.side=T.DoubleSide}});setCrown(true)},undefined,e=>status.textContent='Could not load head: '+e.message);function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)}loop();</script></body></html>
