<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brooke 3.0 Facial Rig Test</title><style>body{margin:0;background:#12231d;color:#f3f7f4;font:16px Arial}header{padding:14px}canvas{display:block;width:100%;height:55vh}main{padding:12px}label{display:block;padding:10px 0}input{width:100%}button{padding:12px;margin:5px;background:#367e65;color:white;border:0;border-radius:5px}small{color:#cbd8d0}</style></head><body><header><b>Brooke Head 3.0 — Facial Prototype</b><p id="status">Loading experimental model...</p><small>Experimental deformations; not visually approved. Original models unchanged.</small></header><div id="view"></div><main><button id="reset">Reset expressions</button><button id="front">Front</button><button id="side">Side</button><div id="controls"></div></main><script type="module">import * as THREE from 'https://esm.sh/three@0.160.1';import{GLTFLoader}from'https://esm.sh/three@0.160.1/examples/jsm/loaders/GLTFLoader.js';import{OrbitControls}from'https://esm.sh/three@0.160.1/examples/jsm/controls/OrbitControls.js';const box=document.getElementById('view'),status=document.getElementById('status');const scene=new THREE.Scene();scene.background=new THREE.Color('#12231d');const camera=new THREE.PerspectiveCamera(40,1,.01,100);camera.position.set(0,0,2.6);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));box.append(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x666666,2.5));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(2,3,4);scene.add(light);const orbit=new OrbitControls(camera,renderer.domElement);let meshes=[];const names=['Relaxed','Smile','Smile_Left','Smile_Right','Jaw_Open','Lips_Round_O','Lips_Part'];new GLTFLoader().load('https://media.githubusercontent.com/media/copperisbetter-lang/Wvlrp/main/avatar-work/brooke/second-chance/brooke-head-3-0-facial-prototype.glb',g=>{const root=g.scene;scene.add(root);const bounds=new THREE.Box3().setFromObject(root),size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3());root.position.sub(center);const scale=1.5/Math.max(size.x,size.y,size.z);root.scale.setScalar(scale);meshes=[];root.traverse(o=>{if(o.isMesh&&o.morphTargetDictionary)meshes.push(o)});camera.position.set(0,0,2.5);orbit.target.set(0,0,0);orbit.update();const controls=document.getElementById('controls');names.forEach(name=>{const row=document.createElement('label');const title=document.createElement('span');title.textContent=name.replaceAll('_',' ')+' — 0%';const slider=document.createElement('input');slider.type='range';slider.min=0;slider.max=100;slider.value=0;slider.oninput=()=>{title.textContent=name.replaceAll('_',' ')+' — '+slider.value+'%';for(const m of meshes){const i=m.morphTargetDictionary[name];if(i!==undefined){m.morphTargetInfluences[i]=Number(slider.value)/100;status.textContent='Applied '+name+' '+slider.value+'% to '+m.name+' (target '+i+')'}else{status.textContent='MISSING morph '+name+' on '+m.name+'; available: '+Object.keys(m.morphTargetDictionary).join(', ')}}};row.append(title,slider);controls.append(row)});document.getElementById('reset').onclick=()=>controls.querySelectorAll('input').forEach(el=>{el.value=0;el.oninput()});document.getElementById('front').onclick=()=>{camera.position.set(0,0,2.5);orbit.update()};document.getElementById('side').onclick=()=>{camera.position.set(2.5,0,0);orbit.update()};status.textContent='Loaded '+meshes.length+' morph-enabled mesh(es). Keys: '+meshes.map(m=>Object.keys(m.morphTargetDictionary).join(', ')).join(' / ');},err=>{},err=>{status.textContent='Model not published yet or failed to load: '+err.message});function resize(){const w=box.clientWidth,h=Math.max(300,innerHeight*.55);renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();function animate(){requestAnimationFrame(animate);orbit.update();renderer.render(scene,camera)}animate();</script></body></html>
