<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3948 Calibrated Face Test V7 | WVLRP</title><style>body{margin:0;background:#111e1c;color:#fff;font:16px system-ui}header,nav{padding:12px;background:#1b3932}button{padding:11px;margin:3px;border:0;border-radius:8px}#v{height:76dvh;touch-action:none}#s{padding:12px}</style></head><body><header><b>WVLRP · 3948 Calibrated Face Test V7</b><br><small>Drag to rotate · pinch to zoom</small></header><nav><button id="orig">Original</button><button id="fix">Crown V3</button><button id="reset">Reset view</button></nav><section id="facepanel" style="padding:10px;background:#203b34;display:grid;grid-template-columns:1fr 1fr;gap:8px"><label>Jaw open <input id="jaw" type="range" min="0" max="100" value="0"></label><label>Smile <input id="smile" type="range" min="-100" max="100" value="0"></label><label>Lips round <input id="round" type="range" min="0" max="100" value="0"></label><label>Brows raise <input id="brows" type="range" min="-100" max="100" value="0"></label><label>Smile left <input id="smileL" type="range" min="-100" max="100" value="0"></label><label>Smile right <input id="smileR" type="range" min="-100" max="100" value="0"></label><label>Blink left <input id="blinkL" type="range" min="0" max="100" value="0"></label><label>Blink right <input id="blinkR" type="range" min="0" max="100" value="0"></label><button id="neutral">Neutral face</button><span id="facestatus">V7: mouth separation test + protected eyeballs</span></section><div id="v"></div><div id="s">Loading 3948…</div><script type="module">import * as T from 'https://esm.sh/three@0.169.0';import{OrbitControls}from'https://esm.sh/three@0.169.0/examples/jsm/controls/OrbitControls.js';import{GLTFLoader}from'https://esm.sh/three@0.169.0/examples/jsm/loaders/GLTFLoader.js';const host=document.querySelector('#v'),status=document.querySelector('#s'),scene=new T.Scene();scene.background=new T.Color(0x192321);const camera=new T.PerspectiveCamera(42,1,.001,100),renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));host.appendChild(renderer.domElement);scene.add(new T.HemisphereLight(0xffffff,0x333344,2.8));const light=new T.DirectionalLight(0xffffff,2);light.position.set(1,2,3);scene.add(light);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;function resize(){renderer.setSize(host.clientWidth,host.clientHeight);camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();function reset(){camera.position.set(0,.03,1.75);controls.target.set(0,0,0);controls.update()}reset();let meshes=[];let crownOn=true;let mouthInterior=null;function smooth(t){t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)}function setCrown(on){crownOn=on;for(const [mesh,original] of meshes){const a=mesh.geometry.attributes.position,p=a.array;for(let i=0;i<p.length;i+=3){const x=original[i],y=original[i+1],z=original[i+2];p[i]=x;p[i+1]=y;p[i+2]=z;if(on){const h=smooth((y-.29)/.14),across=Math.max(0,1-Math.pow(x/.52,2)),depth=Math.max(0,1-Math.pow((z+.01)/.52,2));p[i+1]+=.155*h*Math.pow(across,.85)*Math.pow(depth,.45)}}a.needsUpdate=true;mesh.geometry.computeVertexNormals();mesh.geometry.computeBoundingSphere()}status.textContent=on?'Crown V3 — rounded skull, face preserved':'Original 3948';faceUpdate()}document.querySelector('#orig').onclick=()=>setCrown(false);document.querySelector('#fix').onclick=()=>setCrown(true);document.querySelector('#reset').onclick=reset;new GLTFLoader().load('./3948-3d.glb',g=>{scene.add(g.scene);g.scene.traverse(o=>{if(o.isMesh){o.geometry=o.geometry.clone();const a=o.geometry.attributes.position;meshes.push([o,new Float32Array(a.array)]);o.material.side=T.DoubleSide}});setCrown(true);const interiorGeometry=new T.SphereGeometry(1,32,16);const interiorMaterial=new T.MeshStandardMaterial({color:0x321511,roughness:1,side:T.DoubleSide,depthWrite:false});mouthInterior=new T.Mesh(interiorGeometry,interiorMaterial);mouthInterior.position.set(.002,-.055,.239);mouthInterior.scale.set(.068,.001,.018);scene.add(mouthInterior);faceUpdate()},undefined,e=>status.textContent='Could not load head: '+e.message);function faceUpdate(){const jaw=+document.querySelector('#jaw').value/100,smile=+document.querySelector('#smile').value/100,round=+document.querySelector('#round').value/100,brows=+document.querySelector('#brows').value/100;const smileL=+document.querySelector('#smileL').value/100,smileR=+document.querySelector('#smileR').value/100,blinkL=+document.querySelector('#blinkL').value/100,blinkR=+document.querySelector('#blinkR').value/100;const G=(v,c,w)=>Math.exp(-Math.pow((v-c)/w,2));const landmarks={upper:[.00537,-.03906,.26775],lower:[.00119,-.07099,.24967],chin:[.00723,-.13830,.21019],left:[-.07590,-.03924,.21135],right:[.07284,-.03673,.21560],browL:[.09758,.17919,.28559],browR:[-.09560,.17681,.28913]};const spot=(x,y,z,p,wx,wy,wz)=>G(x,p[0],wx)*G(y,p[1],wy)*G(z,p[2],wz);for(const [mesh,original] of meshes){const a=mesh.geometry.attributes.position,p=a.array;for(let i=0;i<p.length;i+=3){const x=original[i],y=original[i+1],z=original[i+2];const up=spot(x,y,z,landmarks.upper,.09,.024,.12),low=spot(x,y,z,landmarks.lower,.09,.028,.12),cl=spot(x,y,z,landmarks.left,.043,.05,.11),cr=spot(x,y,z,landmarks.right,.043,.05,.11),corners=cl+cr;const brow=spot(x,y,z,landmarks.browL,.07,.03,.08)+spot(x,y,z,landmarks.browR,.07,.03,.08);const chin=spot(x,y,z,landmarks.chin,.13,.055,.12);const mouthZone=Math.max(up,low,corners);const lowerJaw=spot(x,y,z,landmarks.lower,.13,.075,.13);const eyeGuard=Math.exp(-Math.pow((y-.116)/.046,2))*Math.exp(-Math.pow((Math.abs(x)-.097)/.075,2));let dx=0,dy=0,dz=0;const mouthFront=G(z,.26,.075)*G(x,0,.105);const upperMask=G(y,-.039,.012)*mouthFront;const lowerMask=G(y,-.071,.018)*mouthFront;dy+=jaw*(.003*upperMask-.025*lowerMask-.009*lowerJaw-.003*chin)*(1-up*.75);dz-=jaw*.003*lowerJaw;const cornerSmile=smile*corners+smileL*cl+smileR*cr;dy+=.017*cornerSmile;dx+=Math.sign(x)*.016*cornerSmile;dx-=Math.sign(x)*round*.014*mouthZone;dz+=round*.017*mouthZone;dy+=round*.004*(up-low);dy+=brows*.018*brow*(1-Math.min(1,eyeGuard));const eyeL=G(x,.097,.055)*G(z,.282,.09),eyeR=G(x,-.097,.055)*G(z,.282,.09);const lidSurface=G(z,.292,.028);const lidWeight=(blinkL*eyeL+blinkR*eyeR)*lidSurface;const upperLid=G(y,.133,.025),lowerLid=G(y,.100,.018);dy+=lidWeight*(-.027*upperLid+.008*lowerLid); if(crownOn){const h=smooth((y-.29)/.14),across=Math.max(0,1-Math.pow(x/.52,2)),depth=Math.max(0,1-Math.pow((z+.01)/.52,2));dy+=.155*h*Math.pow(across,.85)*Math.pow(depth,.45)}p[i]=x+dx;p[i+1]=y+dy;p[i+2]=z+dz}a.needsUpdate=true;mesh.geometry.computeVertexNormals()}if(mouthInterior){mouthInterior.visible=jaw>.025;mouthInterior.scale.y=Math.max(.001,jaw*.020);mouthInterior.position.y=-.055-jaw*.007;}}for(const id of ['jaw','smile','round','brows','smileL','smileR','blinkL','blinkR'])document.getElementById(id).addEventListener('input',faceUpdate);document.getElementById('neutral').onclick=()=>{for(const id of ['jaw','smile','round','brows','smileL','smileR','blinkL','blinkR'])document.getElementById(id).value=0;faceUpdate()};function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)}loop();</script></body></html>
