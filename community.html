<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15251b"><title>Community — WVLRP</title><link rel="stylesheet" href="ranger-station.css?v=5"><style>#hint{bottom:82px}.tools{gap:6px}header small{font-size:12px}@media(max-width:600px){header small{font-size:10px}#hint{bottom:120px}.tools{max-width:calc(100vw - 20px)}.tools button{padding:9px 11px}}#placeNotice{max-width:440px}</style></head>
<body><canvas id="scene" tabindex="0" aria-label="Explore the community clearing in 360 degrees. The ranger station is straight ahead, Laurel’s Kitchen is to the left and the mercantile and gift shop is to the right. Drag to look around; pinch to zoom."></canvas>
<header><div><strong>WVLRP</strong><small>West Virginia Live Research Project</small></div><button id="menuButton" type="button" aria-expanded="false" aria-controls="menu">☰ MENU</button><nav id="menu" class="menu" hidden aria-label="Community destinations"><a href="ranger-station.html">Ranger Station</a><a href="laurels-kitchen.html">Laurel’s Kitchen</a><a href="mercantile.html">Mercantile and Giftshop</a><a href="woodland-fork.html">Return to Woodland</a><a href="woodland-trail.html">Woodland Trail</a><a href="index.html">Base Camp</a></nav></header>
<div id="sceneMessage">Opening the community clearing…</div><div id="hint">Drag to look around · Tap the ranger station to enter</div><div class="tools" aria-label="Community view controls"><button id="back" type="button">Back to Woodland</button><button id="faceStation" type="button">Face the station</button><button id="zoomOut" type="button" aria-label="Zoom out">−</button><button id="zoomIn" type="button" aria-label="Zoom in">+</button><button id="zoomReset" type="button">Reset zoom</button></div>
<dialog id="placeNotice"><button class="close" type="button" aria-label="Close">×</button><h2 id="placeTitle"></h2><p id="placeText"></p><button id="keepExploring" type="button">Continue exploring</button></dialog>
<script src="trail-transitions.js?v=20261006-1"></script><script>
window.RANGER_SCENE={image:'assets/community-clearing-v1.webp?v=1',startU:.5,pitch:0,spots:[
{label:'Enter the Ranger Station',u:.502,v:.477,width:.047,height:.085,url:'ranger-station.html'},
{label:'Laurel’s Kitchen',u:.129,v:.468,width:.085,height:.09,url:'laurels-kitchen.html'},
{label:'Mercantile and Giftshop',u:.868,v:.485,width:.075,height:.09,url:'mercantile.html'},
{label:'Return along the woodland path',u:.002,v:.58,width:.04,height:.06,url:'woodland-fork.html'}]};
window.rangerOpen=id=>{const laurel=id==='laurel';document.getElementById('placeTitle').textContent=laurel?'Laurel’s Kitchen':'Mercantile and Giftshop';document.getElementById('placeText').textContent=laurel?'The coffee shop and bakery is here. Its interior will open later.':'The mercantile and gift shop is here. Its interior will open later.';document.getElementById('placeNotice').showModal()};
const menu=document.getElementById('menu'),menuButton=document.getElementById('menuButton');menuButton.onclick=()=>{menu.hidden=!menu.hidden;menuButton.setAttribute('aria-expanded',String(!menu.hidden))};
for(const b of document.querySelectorAll('[data-place]'))b.onclick=()=>{menu.hidden=true;menuButton.setAttribute('aria-expanded','false');window.rangerOpen(b.dataset.place)};
for(const b of document.querySelectorAll('#placeNotice button'))b.onclick=()=>document.getElementById('placeNotice').close();
document.getElementById('back').onclick=()=>window.rangerTravel('woodland-fork.html',.002,.55);
document.getElementById('faceStation').onclick=()=>window.rangerFace(.5,.5);
document.getElementById('zoomIn').onclick=()=>window.rangerZoom(-.13);
document.getElementById('zoomOut').onclick=()=>window.rangerZoom(.13);
document.getElementById('zoomReset').onclick=()=>window.rangerResetZoom();
setTimeout(()=>document.getElementById('hint').style.opacity=0,8500);
</script><script src="ranger-scene.js?v=20261007-approved-speed"></script><script src="site-auth.js?v=20260916-menu2"></script><script src="site-analytics.js?v=20260916-1"></script></body></html>
