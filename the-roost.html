nslateY(0)}18%{transform:translateY(-3px)}45%{transform:translateY(1px)}72%{transform:translateY(-4px)}100%{left:112%;transform:translateY(0)}}@keyframes walkL{0%{left:112%;transform:scaleX(-1)}35%{transform:translateY(-4px) scaleX(-1)}70%{transform:translateY(1px) scaleX(-1)}100%{left:-24%;transform:scaleX(-1)}}@keyframes peck{0%,20%,100%{transform:rotate(0) translateY(0)}30%{transform:rotate(4deg) translateY(8px)}37%{transform:rotate(1deg) translateY(2px)}44%{transform:rotate(5deg) translateY(9px)}55%{transform:rotate(0) translateY(0)}}@keyframes scratch{0%,30%,100%{transform:translateX(0) rotate(0)}38%{transform:translateX(-5px) rotate(-2deg)}46%{transform:translateX(5px) rotate(2deg)}54%{transform:translateX(-3px) rotate(-1deg)}}@keyframes look{0%,25%,100%{transform:rotate(0)}38%{transform:rotate(-3deg)}54%{transform:rotate(2deg)}70%{transform:rotate(-1deg)}}@keyframes flap{0%,65%,100%{transform:translateY(0) rotate(0) scale(1)}71%{transform:translateY(-9px) rotate(-3deg) scale(1.03)}77%{transform:translateY(-2px) rotate(2deg) scale(.99)}83%{transform:translateY(-7px) rotate(-2deg) scale(1.02)}}.bubble{position:absolute;z-index:40;max-width:210px;padding:10px 13px;border-radius:17px;background:#fff;color:#1b241e;font-weight:900;box-shadow:0 8px 22px #0008;opacity:0;transform:translateY(8px);transition:.35s}.bubble:after{content:"";position:absolute;left:24px;bottom:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}.bubble.show{opacity:1;transform:translateY(0)}.home{position:absolute;z-index:35;left:50%;bottom:18px;transform:translateX(-50%);display:inline-block;padding:11px 18px;border-radius:999px;background:#07130dcc;border:1px solid #ffffff38;color:#fff;text-decoration:none;font-weight:900;backdrop-filter:blur(6px)}@media(max-width:650px){.hero{min-height:760px}.copy{padding-top:20px}.scene{top:78px}.bird{width:112px}.coop{right:2%;top:31%;width:140px;height:100px}.coop:before{left:-18px;top:-45px;border-left-width:86px;border-right-width:86px;border-bottom-width:50px}.coop:after{width:40px;height:56px;left:46px}}</style></head><body><div class="page"><header><a href="index.html">← WVLRP Home</a><strong>WE DO IT LIVE</strong></header><section class="hero" id="hero"><div class="copy"><div class="badge">WVLRP • THE ROOST</div><h1>COMING SOON</h1><p>The flock is already wondering what all the attention is about.</p></div><div class="coop"></div><div class="scene"><div class="bird walkR" style="--dur:25s;bottom:17%;animation-delay:-6s"></div><div class="bird walkL" style="--dur:31s;bottom:9%;animation-delay:-14s"></div><div class="bird peck" style="left:12%;bottom:5%"></div><div class="bird look" style="left:63%;bottom:13%"></div><div class="bird scratch" style="left:42%;bottom:3%"></div><div class="bird flap" style="left:76%;bottom:26%"></div></div><a class="home" href="index.html">← Back to WVLRP</a></section></div><script>const hero=document.getElementById('hero'),sayings=['Why do I feel like we’re being watched?','Hey… is that camera for us?','Anybody else getting famous vibes?','Quit staring. I’m trying to scratch here.','Do I have feed on my beak?'];function bubble(){const old=hero.querySelector('.bubble');if(old)old.remove();const b=document.createElement('div');b.className='bubble';b.textContent=sayings[Math.floor(Math.random()*sayings.length)];b.style.left=(7+Math.random()*66)+'%';b.style.top=(42+Math.random()*27)+'%';hero.appendChild(b);requestAnimationFrame(()=>b.classList.add('show'));setTimeout(()=>{b.classList.remove('show');setTimeout(()=>b.remove(),400)},3200)}setTimeout(bubble,1800);setInterval(bubble,7600);</script></body></html>
