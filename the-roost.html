x:20;left:50%;top:18px;transform:translateX(-50%);font-weight:1000;letter-spacing:.12em;font-size:clamp(12px,2.5vw,18px);padding:9px 14px;border-radius:999px;background:#03111cba;border:1px solid #ffffff25}.chicken{position:absolute;z-index:5;width:128px;height:112px;transform-origin:50% 100%;filter:drop-shadow(0 9px 5px #0008)}.chicken svg{width:100%;height:100%;overflow:visible}.whole{transform-origin:62px 85px}.neckhead{transform-origin:88px 53px}.wing{transform-origin:59px 65px}.legA,.legB{transform-box:fill-box;transform-origin:top center}.feather-line{fill:none;stroke:#0004;stroke-width:1.6;stroke-linecap:round}.eye{fill:#090909}.eye-shine{fill:#fff}.comb,.wattle{fill:#c92f33}.beak{fill:#d99a28;stroke:#6b4a17;stroke-width:1.4}.legStroke{stroke:#b98427;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}.foot{stroke:#b98427;stroke-width:3.2;stroke-linecap:round;fill:none}.white .bodyFill{fill:url(#whiteGrad)}.brown .bodyFill{fill:url(#brownGrad)}.black .bodyFill{fill:url(#blackGrad)}.gold .bodyFill{fill:url(#goldGrad)}.speckle .bodyFill{fill:url(#speckleGrad)}.chicken.walk-right{animation:walkR var(--dur) linear infinite}.chicken.walk-left{animation:walkL var(--dur) linear infinite}.walk-left svg{transform:scaleX(-1)}@keyframes walkR{0%{left:-155px}100%{left:calc(100% + 155px)}}@keyframes walkL{0%{left:calc(100% + 155px)}100%{left:-155px}}.walker .whole{animation:bodyWalk .62s ease-in-out infinite alternate}.walker .neckhead{animation:headBob .62s ease-in-out infinite alternate}.walker .legA{animation:stepA .62s ease-in-out infinite alternate}.walker .legB{animation:stepB .62s ease-in-out infinite alternate}@keyframes bodyWalk{to{transform:translateY(-3px) rotate(.8deg)}}@keyframes headBob{0%{transform:translate(-1px,1px) rotate(-2deg)}100%{transform:translate(4px,-3px) rotate(3deg)}}@keyframes stepA{0%{transform:rotate(17deg) translateY(-1px)}100%{transform:rotate(-18deg) translateY(1px)}}@keyframes stepB{0%{transform:rotate(-18deg) translateY( after{content:"";position:absolute;left:26px;bottom:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}.bubble.show{opacity:1}.back{display:inline-block;margin-top:28px;padding:12px 20px;border:1px solid #718c95;border-radius:999px;color:#fff;text-decoration:none;font-weight:900}@media(max-width:600px){.yard{height:520px}.coop{width:145px;height:100px}.coop:before{left:-20px;top:-47px;border-left-width:89px;border-right-width:89px;border-bottom-width:53px}.coop:after{width:42px;height:58px;left:48px}.chicken{width:104px;height:92px}.bubble{font-size:13px;max-width:150px}}

<body>
<div class="page"><header><a href="index.html">← WVLRP Home</a><strong>WE DO IT LIVE</strong></header><main class="main"><div class="badge">WVLRP • THE ROOST</div><div class="soon">COMING SOON</div><p class="sub">The flock is already wondering what all the attention is about. The live Roost experience is being built now.</p><section class="yard" id="yard"><div class="ground-note">THE ROOST • LIVE FEED COMING SOON</div><div class="coop"></div></section><a class="back" href="index.html">← Back to WVLRP</a></main></div>

{type:'brown',behavior:'walker',move:'walk-right',bottom:67,dur:24,delay:-3},
