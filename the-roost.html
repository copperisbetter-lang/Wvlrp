<!DOCTYPE html>

<title>The Roost | WVLRP</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#03111c;color:#fff;font-family:Arial,sans-serif}.page{min-height:100vh;background:radial-gradient(circle at 50% 18%,#183a32 0,#071923 46%,#02090e 100%)}header{padding:17px 16px;border-bottom:1px solid #ffffff20;display:flex;justify-content:space-between;align-items:center;gap:12px}header a{color:#fff;text-decoration:none;font-weight:900}header strong{letter-spacing:.14em;font-size:14px}.main{max-width:1050px;margin:auto;padding:28px 14px 52px;text-align:center}.badge{display:inline-block;padding:8px 14px;border:1px solid #ffffff28;border-radius:999px;color:#ffd166;font-weight:900;letter-spacing:.14em;font-size:12px}.soon{font-size:clamp(38px,10vw,82px);font-weight:1000;letter-spacing:.06em;margin:15px 0 5px;text-shadow:0 5px 24px #000}.sub{font-size:clamp(16px,3.4vw,23px);color:#d6dfdf;max-width:700px;margin:0 auto 22px;line-height:1.45}.yard{position:relative;overflow:hidden;max-width:960px;height:clamp(430px,69vh,650px);margin:26px auto 0;border:2px solid #31525d;border-radius:24px;background:linear-gradient(#5b8592 0 35%,#91a56d 36% 49%,#4c653e 50% 100%);box-shadow:inset 0 0 65px #0007,0 18px 45px #000}.yard:before{content:"";position:absolute;left:0;right:0;top:34%;height:16%;background:repeating-linear-gradient(90deg,#6d4f2a 0 12px,#8a6839 12px 24px);opacity:.35}.yard:after{content:"";position:absolute;left:0;right:0;bottom:0;height:18%;background:linear-gradient(#3a4d2e,#25331f)}.coop{position:absolute;right:5%;top:16%;width:190px;height:130px;background:#7d3f25;border:7px solid #4a2517;border-radius:8px 8px 2px 2px;z-index:1;box-shadow:0 16px 25px #0006}.coop:before{content:"";position:absolute;left:-24px;top:-58px;border-left:112px solid transparent;border-right:112px solid transparent;border-bottom:65px solid #3d251d}.coop:after{content:"";position:absolute;width:52px;height:72px;left:69px;bottom:0;background:#1b120e;border:5px solid #4a2517}.ground-note{position:absolute;z-index:8;left:50%;top:18px;transform:translateX(-50%);font-weight:1000;letter-spacing:.12em;font-size:clamp(12px,2.5vw,18px);padding:9px 14px;border-radius:999px;background:#03111cba;border:1px solid #ffffff25}.chicken{position:absolute;z-index:5;width:94px;height:94px;transform-origin:50% 100%;filter:drop-shadow(0 7px 4px #0007)}.chicken svg{width:100%;height:100%;overflow:visible}.bird{transform-origin:50% 74%}.body{fill:#f2eadc;stroke:#3b2d28;stroke-width:3}.brown .body{fill:#a9663d}.black .body{fill:#333}.gold .body{fill:#d69a3b}.head{fill:#f1e2cb;stroke:#3b2d28;stroke-width:3}.brown .head{fill:#b9784f}.black .head{fill:#3a3a3a}.gold .head{fill:#e0a946}.comb,.wattle{fill:#c83232}.beak{fill:#e0a02c;stroke:#6d4b13;stroke-width:2}.eye{fill:#111}.wing{fill:#ddd0bf;stroke:#3b2d28;stroke-width:3;transform-origin:49px 54px}.brown .wing{fill:#8d4f31}.black .wing{fill:#222}.gold .wing{fill:#c18831}.leg{stroke:#c08a2f;stroke-width:5;stroke-linecap:round}.walk-right{animation:walkR var(--dur) linear infinite}.walk-left{animation:walkL var(--dur) linear infinite}.walk-left svg{transform:scaleX(-1)}@keyframes walkR{0%{left:-120px}100%{left:calc(100% + 120px)}}@keyframes walkL{0%{left:calc(100% + 120px)}100%{left:-120px}}.walker .bird{animation:bob .45s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px) rotate(1deg)}}.pecker .bird{animation:peck 2.3s ease-in-out infinite}@keyframes peck{0%,35%,100%{transform:rotate(0)}44%,49%,54%{transform:rotate(29deg) translate(12px,12px)}47%,52%{transform:rotate(34deg) translate(14px,15px)}}.flapper .wing{animation:flap .28s ease-in-out 0s 8 alternate}@keyframes flap{to{transform:rotate(-78deg) translate(-10px,-2px)}}.looker .bird{animation:look 3.6s ease-in-out infinite}@keyframes look{0%,28%,100%{transform:rotate(0)}38%,52%{transform:rotate(-8deg)}62%,76%{transform:rotate(8deg)}}.scratch .bird{animation:scratch 1.1s ease-in-out infinite}@keyframes scratch{0%,100%{transform:translateX(0)}45%{transform:translateX(-8px)}65%{transform:translateX(5px)}}.bubble{position:absolute;z-index:12;max-width:190px;padding:10px 13px;background:#fff;color:#15211d;border-radius:16px;font-weight:900;box-shadow:0 7px 18px #0008;opacity:0;transition:opacity .35s}.bubble:after{content:"";position:absolute;left:26px;bottom:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}.bubble.show{opacity:1}.back{display:inline-block;margin-top:28px;padding:12px 20px;border:1px solid #718c95;border-radius:999px;color:#fff;text-decoration:none;font-weight:900}@media(max-width:600px){.yard{height:520px}.coop{width:145px;height:100px}.coop:before{left:-20px;top:-47px;border-left-width:89px;border-right-width:89px;border-bottom-width:53px}.coop:after{width:42px;height:58px;left:48px}.chicken{width:78px;height:78px}.bubble{font-size:13px;max-width:150px}}
</style>
</head>
<body>
<div class="page"><header><a href="index.html">← WVLRP Home</a><strong>WE DO IT LIVE</strong></header><main class="main"><div class="badge">WVLRP • THE ROOST</div><div class="soon">COMING SOON</div><p class="sub">The flock is already wondering what all the attention is about. The live Roost experience is being built now.</p><section class="yard" id="yard"><div class="ground-note">THE ROOST • LIVE FEED COMING SOON</div><div class="coop"></div></section><a class="back" href="index.html">← Back to WVLRP</a></main></div>
<script>
const yard=document.getElementById('yard');
const colors=['','brown','black','gold'];
const behaviors=['walker','pecker','flapper','looker','scratch','pecker','walker','looker'];
const bubbles=['Why do I feel like we’re being watched?','Hey… is that camera for us?','Anybody else getting famous vibes?','Quit staring. I’m trying to scratch here.','Do I have feed on my beak?'];
function svgChicken(){return `<svg viewBox="0 0 100 100" aria-hidden="true"><g class="bird"><ellipse class="body" cx="48" cy="62" rx="31" ry="24"/><circle class="head" cx="72" cy="35" r="17"/><path class="comb" d="M62 20c1-10 8-9 9-2 3-9 10-7 9 1 6-7 11-1 6 6z"/><ellipse class="wattle" cx="77" cy="49" rx="6" ry="8"/><path class="beak" d="M87 34l12 5-12 6z"/><circle class="eye" cx="77" cy="32" r="2.5"/><ellipse class="wing" cx="45" cy="59" rx="19" ry="13" transform="rotate(-12 45 59)"/><path class="leg" d="M38 81v13m-7 0h14M57 82v12m-7 0h14"/></g></svg>`}
const rows=[62,68,73,78,82,66,75,86];
behaviors.forEach((b,i)=>{const d=document.createElement('div');const dir=i%3===0?'walk-left':'walk-right';d.className=`chicken ${colors[i%colors.length]} ${b} ${dir}`;d.style.bottom=rows[i]+'px';d.style.setProperty('--dur',(17+i*2.7)+'s');d.style.animationDelay=(-i*3.6)+'s';d.innerHTML=svgChicken();yard.appendChild(d)});
function bubble(){const old=yard.querySelector('.bubble');if(old)old.remove();const b=document.createElement('div');b.className='bubble';b.textContent=bubbles[Math.floor(Math.random()*bubbles.length)];b.style.left=(8+Math.random()*63)+'%';b.style.top=(38+Math.random()*34)+'%';yard.appendChild(b);requestAnimationFrame(()=>b.classList.add('show'));setTimeout(()=>{b.classList.remove('show');setTimeout(()=>b.remove(),400)},3200)}
setTimeout(bubble,1700);setInterval(bubble,6500);
</script>
</body></html>
