*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07130d;color:#fff;font-family:Arial,sans-serif}body{overflow-x:hidden}.page{min-height:100vh}.top{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#06100b;color:#fff;border-bottom:1px solid #ffffff24;position:relative;z-index:100}.top a{color:#fff;text-decoration:none;font-weight:900}.top strong{font-size:12px;letter-spacing:.17em}.hero{position:relative;min-height:calc(100vh - 52px);overflow:hidden;background:linear-gradient(180deg,#86a0a1 0 27%,#96a66f 28% 43%,#4c6537 44% 100%)}.mountains{position:absolute;left:0;right:0;top:30%;height:18%;background:linear-gradient(#6c7d48,#465c34);clip-path:polygon(0 68%,8% 53%,18% 62%,31% 38%,44% 60%,58% 33%,73% 56%,88% 29%,100% 47%,100% 100%,0 100%);opacity:.8;z-index:1}.ground{position:absolute;left:0;right:0;bottom:0;height:28%;background:radial-gradient(circle at 10% 20%,#3d542d 0 3px,transparent 4px),radial-gradient(circle at 66% 35%,#486436 0 3px,transparent 4px),linear-gradient(#405832,#253b25);background-size:24px 24px,31px 31px,auto;z-index:2}.copy{position:relative;z-index:30;text-align:center;padding:26px 14px 0;text-shadow:0 3px 14px #000}.badge{display:inline-block;padding:7px 13px;border-radius:999px;background:#06100bbd;border:1px solid #ffffff38;color:#ffd77d;font-weight:900;letter-spacing:.16em;font-size:12px}h1{margin:10px 0 0;font-size:clamp(44px,11vw,92px);line-height:.95;letter-spacing:.045em}.copy p{margin:8px auto 0;max-width:720px;color:#f2eee4;font-weight:700;font-size:clamp(15px,2.8vw,21px)}.coop{position:absolute;right:4%;top:29%;width:190px;height:135px;background:#714229;border:7px solid #43271a;z-index:4;box-shadow:0 15px 22px #0007}.coop:before{content:"";position:absolute;left:-25px;top:-59px;border-left:112px solid transparent;border-right:112px solid transparent;border-bottom:65px solid #3d2a20}.coop:after{content:"";position:absolute;width:52px;height:72px;left:69px;bottom:
