<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07130d"><title>The Roost | WVLRP</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07130d;color:#fff;font-family:Arial,sans-serif}body{overflow-x:hidden}.page{min-height:100vh}.top{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#06100b;border-bottom:1px solid #ffffff24;position:relative;z-index:100}.top a{color:#fff;text-decoration:none;font-weight:900}.top strong{font-size:12px;letter-spacing:.17em}.hero{position:relative;min-height:calc(100vh - 52px);overflow:hidden;background:linear-gradient(180deg,#86a0a1 0 27%,#96a66f 28% 43%,#4c6537 44% 100%)}.mountains{position:absolute;left:0;right:0;top:30%;height:18%;background:linear-gradient(#6c7d48,#465c34);clip-path:polygon(0 68%,8% 53%,18% 62%,31% 38%,44% 60%,58% 33%,73% 56%,88% 29%,100% 47%,100% 100%,0 100%);opacity:.8;z-index:1}.ground{position:absolute;left:0;right:0;bottom:0;height:28%;background:radial-gradient(circle at 10% 20%,#3d542d 0 3px,transparent 4px),radial-gradient(circle at 66% 35%,#486436 0 3px,transparent 4px),linear-gradient(#405832,#253b25);background-size:24px 24px,31px 31px,auto;z-index:2}.copy{position:relative;z-index:30;text-align:center;padding:26px 14px 0;text-shadow:0 3px 14px #000}.badge{display:inline-block;padding:7px 13px;border-radius:999px;background:#06100bbd;border:1px solid #ffffff38;color:#ffd77d;font-weight:900;letter-spacing:.16em;font-size:12px}h1{margin:10px 0 0;font-size:clamp(44px,11vw,92px);line-height:.95;letter-spacing:.045em}.copy p{margin:8px auto 0;max-width:720px;color:#f2eee4;font-weight:700;font-size:clamp(15px,2.8vw,21px)}.coop{position:absolute;right:4%;top:29%;width:190px;height:135px;background:#714229;border:7px solid #43271a;z-index:4;box-shadow:0 15px 22px #0007}.coop:before{content:"";position:absolute;left:-25px;top:-59px;border-left:112px solid transparent;border-right:112px solid transparent;border-bottom:65px solid #3d2a20}.coop:after{content:"";position:absolute;width:52px;height:72px;left:69px;bottom:0;background:#1b120e;border:5px solid #4a2517}.real-flock{position:absolute;inset:0;z-index:25;pointer-events:none}.real-bird{position:absolute;display:block;height:auto;object-fit:contain;filter:drop-shadow(0 8px 6px #0008);transform-origin:50% 92%;will-change:left,bottom,transform,opacity;transition:left 7s ease-in-out,bottom 2.6s ease-in-out,opacity .7s ease,transform .45s ease;opacity:0}.real-bird.visible{opacity:1}.bubble{position:absolute;z-index:60;max-width:230px;padding:12px 15px;border-radius:20px;background:#fff;color:#1b241e;font-weight:900;font-size:18px;box-shadow:0 8px 22px #0008;opacity:0;transform:translateY(8px);transition:.35s;pointer-events:none}.bubble:after{content:"";position:absolute;left:26px;bottom:-12px;border:12px solid transparent;border-top-color:#fff;border-bottom:0}.bubble.show{opacity:1;transform:translateY(0)}.home{position:absolute;z-index:70;left:50%;bottom:18px;transform:translateX(-50%);display:inline-block;padding:12px 24px;border-radius:999px;background:#07130de8;border:1px solid #ffffff38;color:#fff;text-decoration:none;font-weight:900;white-space:nowrap}@media(max-width:650px){.hero{min-height:760px}.copy{padding-top:20px}.coop{right:2%;top:31%;width:140px;height:100px}.coop:before{left:-18px;top:-45px;border-left-width:86px;border-right-width:86px;border-bottom-width:50px}.coop:after{width:40px;height:56px;left:46px}.bubble{font-size:16px;max-width:200px}.real-bird{max-width:38vw}}</style></head><body><div class="page"><div class="top"><a href="index.html">← WVLRP Home</a><strong>WE DO IT LIVE</strong></div><section class="hero" id="hero"><div class="mountains"></div><div class="ground"></div><div class="copy"><div class="badge">WVLRP • THE ROOST</div><h1>COMING SOON</h1><p>The flock is already wondering what all the attention is about.</p></div><div class="coop"></div><div class="real-flock" id="real-flock" aria-hidden="true"></div><div class="bubble" id="chicken-bubble"></div><a class="home" href="index.html">← Back to WVLRP</a></section></div><script>(()=>{const flock=document.getElementById('real-flock'),hero=document.getElementById('hero'),bubble=document.getElementById('chicken-bubble');const kinds={tan:['assets/roost/tan-0.webp','assets/roost/tan-1.webp'],black:['assets/roost/black-0.webp','assets/roost/black-1.webp']};const setups=[['tan',7,16,176,1],['black',27,13,188,-1],['tan',49,11,154,-1],['black',66,16,170,1],['tan',81,9,142,1]];const birds=[];setups.forEach((s,i)=>{const img=new Image();img.className='real-bird';img.src=kinds[s[0]][i%2];img.dataset.kind=s[0];img.dataset.frame=i%2;img.style.width=s[3]+'px';img.style.left=s[1]+'%';img.style.bottom=s[2]+'%';img.dataset.dir=s[4];img.style.transform='scaleX('+s[4]+')';flock.appendChild(img);birds.push(img);setTimeout(()=>img.classList.add('visible'),350+i*550);setInterval(()=>{if(!img.classList.contains('visible'))return;const f=img.dataset.frame==='0'?1:0;img.dataset.frame=f;img.src=kinds[img.dataset.kind][f];const dir=Number(img.dataset.dir);img.style.transform='scaleX('+dir+') translateY('+(Math.random()>.58?2:0)+'px)'},480+Math.random()*340);setTimeout(function roam(){const now=parseFloat(img.style.left)||50;let next=Math.max(-4,Math.min(91,now+(Math.random()*18-9)));if(Math.random()<.18){img.classList.remove('visible');setTimeout(()=>{next=Math.random()<.5?-3:88;img.style.left=next+'%';img.dataset.dir=next<45?1:-1;img.classList.add('visible')},1300+Math.random()*1800)}else{img.style.left=next+'%';img.dataset.dir=next>now?1:-1}img.style.bottom=(8+Math.random()*10)+'%';setTimeout(roam,5200+Math.random()*5200)},1600+i*900)});const sayings=['Why do I feel like we’re being watched?','Hey… is that camera for us?','Anybody else getting famous vibes?','Quit staring. I’m trying to eat here.','Do I have feed on my beak?','I swear somebody is watching us.'];function talk(){const visible=birds.filter(b=>b.classList.contains('visible'));if(!visible.length)return setTimeout(talk,3000);const bird=visible[Math.floor(Math.random()*visible.length)],r=bird.getBoundingClientRect(),h=hero.getBoundingClientRect();bubble.textContent=sayings[Math.floor(Math.random()*sayings.length)];bubble.style.left=Math.max(10,Math.min(h.width-220,r.left-h.left+r.width*.35))+'px';bubble.style.top=Math.max(210,r.top-h.top-62)+'px';bubble.classList.add('show');setTimeout(()=>bubble.classList.remove('show'),3300);setTimeout(talk,8200+Math.random()*5200)}setTimeout(talk,5200)})();</script></body></html>
