<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Dad Stage24 — 3D viewer</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0e1b2b;color:#f1f6fd;font:15px system-ui,-apple-system,Arial,sans-serif}
header{padding:12px 14px;background:#111f31;border-bottom:1px solid #34465e}
h1{margin:0;font-size:17px;font-weight:750}small{color:#aabfd1;display:block;margin-top:5px;font-size:12px}
#view{width:100%;height:calc(100dvh - 198px);min-height:270px;touch-action:none;position:relative}
#status{position:absolute;left:10px;right:10px;top:12px;background:#111d2ad9;color:#e5edf5;border-radius:8px;padding:9px;text-align:center;z-index:3;font-size:14px}
#view canvas{display:block;width:100%;height:100%}
.controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;padding:10px;background:#13253a}
button{background:#28415c;border:1px solid #58748e;border-radius:9px;color:#fff;min-height:42px;font:600 13px system-ui;touch-action:manipulation}
.foot{font-size:11px;color:#acc0d4;padding:3px 14px 8px;background:#13253a}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script>
</head><body>
<header><h1>Dad — Stage 24 original shoulder scan fit</h1><small>Touch to rotate · Pinch to zoom · Two fingers to pan · Private encrypted 3D model</small></header>
<div id="view"><div id="status" role="status">Opening Dad's 3D model…</div></div>
<div class="controls">
<button id="front">Front</button><button id="right">Dad's right</button><button id="back">Back</button><button id="left">Left</button>
<button id="face">Face</button><button id="shoulder">Shoulder</button><button id="full">Full body</button><button id="reset">Reset</button>
</div>
<div class="foot">Stage 24 cut-to-fit trial. Dad's scanned face and shoulders preserved; seam is not yet welded or approved.</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const root=document.querySelector('#view');
const status=document.querySelector('#status');
window.__DAD_VIEWER_READY=false;window.__DAD_VIEWER_ERROR='';
function show(s){status.style.display='block';status.textContent=s;}
try{
 const keyhex=location.hash.slice(1).trim();
 if(!/^[a-fA-F0-9]{64}$/.test(keyhex))throw new Error("Private access key missing. Open the complete viewer link.");
 const secret=new Uint8Array(keyhex.match(/../g).map(x=>parseInt(x,16)));
 show("Downloading private 3D model…");
 const response=await fetch('./manifest.json',{cache:'no-store'});
 if(!response.ok)throw new Error("Viewer manifest unavailable ("+response.status+").");
 const manifest=await response.json();
 if(!manifest.model_protected_with_AES_256_GCM||!Number.isInteger(manifest.count)||manifest.count<1||manifest.count>200)throw new Error("Invalid encrypted model manifest.");
 const encrypted=new Uint8Array(manifest.ciphertext_bytes);let write=0;
 for(let start=0;start<manifest.count;start+=5){
   const ids=Array.from({length:Math.min(5,manifest.count-start)},(_,j)=>start+j);
   const blocks=await Promise.all(ids.map(async i=>{const url='./chunk-'+String(i).padStart(3,'0')+'.txt';const r=await fetch(url);if(!r.ok)throw new Error("Missing model segment "+i);return r.text()}));
   for(let j=0;j<blocks.length;j++){
     const raw=atob(blocks[j]);const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));encrypted.set(bytes,write);write+=bytes.length;
   }
   show('Loading private Dad model… '+Math.min(manifest.count,start+ids.length)+'/'+manifest.count);
 }
 if(write!==encrypted.byteLength)throw new Error('Incomplete model bytes');
 const iv=encrypted.subarray(0,12);
 const aes=await crypto.subtle.importKey('raw',secret,{name:'AES-GCM'},false,['decrypt']);
 show("Decrypting and preparing 3D model…");
 const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv},aes,encrypted.subarray(12));
 const scene=new THREE.Scene();scene.background=new THREE.Color('#122136');
 const camera=new THREE.PerspectiveCamera(38,1,.005,100);
 const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
 renderer.setSize(root.clientWidth,root.clientHeight);
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;
 renderer.toneMappingExposure=1.3;
 root.appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xf5f8ff,0x52627e,2.2));
 const light=new THREE.DirectionalLight(0xffffff,2.4);light.position.set(2,5,4);scene.add(light);
 const fill=new THREE.DirectionalLight(0xe8f2ff,1);fill.position.set(-3,3,-3);scene.add(fill);
 const controls=new OrbitControls(camera,renderer.domElement);
 controls.enableDamping=true;controls.dampingFactor=.08;controls.minDistance=.10;controls.maxDistance=7;
 controls.screenSpacePanning=true;controls.touches.ONE=THREE.TOUCH.ROTATE;controls.touches.TWO=THREE.TOUCH.DOLLY_PAN;
 show('Rendering Dad…');
 const gltf=await new Promise((res,rej)=>new GLTFLoader().parse(raw,'',res,rej));
 scene.add(gltf.scene);
 const box=new THREE.Box3().setFromObject(gltf.scene);
 const mid=box.getCenter(new THREE.Vector3());
 const height=Math.max(.75,box.max.y-box.min.y);
 const focus=new THREE.Vector3(mid.x,Math.min(box.max.y-.18,box.min.y+height*.88),mid.z);
 function pose(dx,dy,dz,target=focus){
  controls.target.copy(target);camera.position.set(target.x+dx,target.y+dy,target.z+dz);camera.lookAt(target);controls.update();
 }
 function norm(){pose(0,.03,.80)}
 function orient(e){const k=e==='back'?[-.01,.03,-.85]:e==='right'?[.82,.03,0]:e==='left'?[-.82,.03,0]:[0,.03,.85];pose(...k)}
 document.querySelector('#front').onclick=()=>orient('front');
 document.querySelector('#right').onclick=()=>orient('right');
 document.querySelector('#back').onclick=()=>orient('back');
 document.querySelector('#left').onclick=()=>orient('left');
 document.querySelector('#face').onclick=()=>pose(0,.01,.47,new THREE.Vector3(mid.x,box.max.y-.21,mid.z));
 document.querySelector('#shoulder').onclick=()=>pose(-.20,.025,.43,new THREE.Vector3(mid.x-.09,box.max.y-.52,mid.z));
 document.querySelector('#full').onclick=()=>pose(0,0,Math.max(1.7,height*1.6),mid);
 document.querySelector('#reset').onclick=norm;
 norm();
 function resize(){let w=root.clientWidth,h=root.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}
 new ResizeObserver(resize).observe(root);resize();
 let bones=0;gltf.scene.traverse(o=>{if(o.isBone)bones++});
 window.__DAD_VIEWER_BONES=bones;window.__DAD_VIEWER_READY=true;
 status.style.display='none';
 const loop=()=>{requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)};loop();
}catch(err){window.__DAD_VIEWER_ERROR=String(err);show('Viewer error: '+String(err.message||err))}
</script></body></html>
