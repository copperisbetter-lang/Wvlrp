<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emma Sample — Build 11 Viewer</title><script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script><style>body{margin:0;background:#111820;color:white;font:16px system-ui}header,#status{padding:14px}model-viewer{display:block;width:100%;height:78dvh;background:#27323e}button{font:inherit;padding:8px;margin:4px}</style></head><body><header><b>Emma sample — Build 11</b><div>Drag to rotate · Pinch to zoom</div><button id="toggle">Plain material</button></header><model-viewer id="head" camera-controls auto-rotate shadow-intensity="1" exposure="1.2" alt="Isolated Emma sample head" src="world-creator/assets/3ddfa-build11-sample.glb"></model-viewer><div id="status">Loading Build 11 sample…</div><script>const m=document.querySelector('#head'),s=document.querySelector('#status');m.addEventListener('load',()=>s.textContent='Sample head loaded — drag to inspect');m.addEventListener('error',()=>s.textContent='Build 11 model not published yet');let plain=false;document.querySelector('#toggle').onclick=()=>{if(!m.model){s.textContent='Wait for the model to load';return}plain=!plain;for(const mat of m.model.materials){const p=mat.pbrMetallicRoughness;p.setBaseColorFactor(plain?[0.72,0.72,0.72,1]:[1,1,1,1]);}document.querySelector('#toggle').textContent=plain?'Original colors':'Plain material'};</script></body></html>
