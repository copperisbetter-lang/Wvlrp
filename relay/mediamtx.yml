# WVLRP multi-camera RTSP -> HLS relay
# Camera sources are ingested by ffmpeg and published locally to MediaMTX.

logLevel: info

# Internal RTSP listener used by the ffmpeg publishers.
rtsp: true
rtspAddress: :8554

# HLS stays internal; nginx exposes the public HTTP port and proxies here.
# Use standard MPEG-TS HLS instead of LL-HLS. It adds a little latency but is
# substantially more tolerant of mobile/browser reconnects and irregular
# camera timestamps, which is what the Roost feed needs for 24/7 stability.
hls: true
hlsAddress: :8891
hlsAllowOrigins: ['*']
hlsAlwaysRemux: true
hlsVariant: mpegts
hlsSegmentCount: 8
hlsSegmentDuration: 1s

# Keep WebRTC off for this deployment.
webrtc: false

pathDefaults:
  rtspTransport: tcp

paths:
  eastbank:
    source: publisher
  roost:
    source: publisher
