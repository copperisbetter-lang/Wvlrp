# WVLRP multi-camera RTSP -> HLS relay
# Camera sources are ingested by ffmpeg and published locally to MediaMTX.

logLevel: info

rtsp: true
rtspAddress: :8554

# Low-latency MPEG-TS HLS. Keep MPEG-TS for the mobile/reconnect stability
# we already proved, but keep only a small live window so PTZ stays near live.
hls: true
hlsAddress: :8891
hlsAllowOrigins: ['*']
hlsAlwaysRemux: true
hlsVariant: mpegts
hlsSegmentCount: 3
hlsSegmentDuration: 1s

webrtc: true
webrtcAddress: :8889
webrtcAllowOrigins: ['*']
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcAdditionalHosts: ['158.101.120.6', '158-101-120-6.sslip.io']

pathDefaults:
  rtspTransport: tcp

paths:
  eastbank:
    source: publisher
  roost:
    source: publisher
  mobile:
    source: publisher
