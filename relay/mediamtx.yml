# WVLRP multi-camera RTSP -> HLS relay
# Camera sources are ingested by ffmpeg and published locally to MediaMTX.

logLevel: info

# Internal RTSP listener used by the ffmpeg publishers.
rtsp: true
rtspAddress: :8554

# HLS stays internal; nginx exposes the public HTTP port and proxies here.
# MediaMTX requires at least 7 segments for low-latency HLS.
hls: true
hlsAddress: :8891
hlsAllowOrigins: ['*']
hlsAlwaysRemux: true
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 500ms
hlsPartDuration: 100ms

# Keep WebRTC off for this deployment.
webrtc: false

pathDefaults:
  rtspTransport: tcp

paths:
  eastbank:
    source: publisher
  roost:
    source: publisher
