# WVLRP multi-camera RTSP -> HLS/WebRTC relay
# Camera sources are ingested by ffmpeg and published locally to MediaMTX.

logLevel: info

# Internal RTSP listener used by the ffmpeg publishers.
rtsp: true
rtspAddress: :8554

# Public feeds remain LL-HLS.
hls: true
hlsAddress: :8891
hlsAllowOrigins: ['*']
hlsAlwaysRemux: true
hlsVariant: lowLatency
hlsSegmentCount: 3
hlsSegmentDuration: 500ms
hlsPartDuration: 100ms

# Ultra-low-latency preview for Lounge PTZ.
# Signaling is proxied by nginx under /webrtc/; TCP fallback keeps it usable
# through Railway's public HTTP endpoint without disturbing the HLS feeds.
webrtc: true
webrtcAddress: :8889
webrtcAllowOrigins: ['*']
webrtcLocalTCPAddress: :8189

pathDefaults:
  rtspTransport: tcp

paths:
  eastbank:
    source: publisher
  roost:
    source: publisher
