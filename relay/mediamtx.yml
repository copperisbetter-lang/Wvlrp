# WVLRP multi-camera RTSP -> HLS relay
# Camera sources are ingested by ffmpeg and published locally to MediaMTX.

logLevel: info

rtsp: true
rtspAddress: :8554

# Low-latency MPEG-TS HLS. Keep MPEG-TS for the mobile/reconnect stability
# we already proved, but keep only a small live window so PTZ stays near live.
hls: true
hlsAddress: :8891
hlsAllowOrigins: ['*']
hlsAlwaysRemux: true
hlsVariant: mpegts
hlsSegmentCount: 3
hlsSegmentDuration: 1s

webrtc: false

pathDefaults:
  rtspTransport: tcp

paths:
  eastbank:
    source: publisher
  roost:
    source: publisher
