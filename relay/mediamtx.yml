# WVLRP East Bank RTSP -> HLS relay
# Camera source is injected at runtime with MTX_PATHS_EASTBANK_SOURCE

logLevel: info

# Keep internal RTSP available to MediaMTX but do not publish this port in Docker.
rtsp: true
rtspAddress: :8554

# HLS stays internal; nginx exposes Back4App's public port 8888 and proxies here.
hls: true
hlsAddress: :8891
hlsAllowOrigins: ['*']
hlsAlwaysRemux: true
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms

# Back4App exposes a single HTTP port for this deployment, so keep WebRTC off for now.
webrtc: false

pathDefaults:
  # TCP is more reliable across the public internet and NAT for this camera.
  rtspTransport: tcp

paths:
  eastbank:
    # Runtime environment variable overrides this placeholder:
    # MTX_PATHS_EASTBANK_SOURCE=rtsp://.../0/av0
    source: publisher
