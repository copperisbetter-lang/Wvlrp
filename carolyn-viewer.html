<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carolyn 3D Inspection — WVLRP</title><style>body{margin:0;background:#10211b;color:#fff;font:16px system-ui}header{padding:12px 16px}model-viewer{display:block;width:100%;height:75vh;background:#b8c3be}a{color:#b8e6d4}#status{padding:12px 16px}.controls{display:flex;gap:8px;flex-wrap:wrap;padding:12px}button{padding:12px;border:1px solid #9ebdad;border-radius:8px;background:#254b3a;color:white}</style><script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script></head><body><header><strong>Carolyn — 3D inspection</strong></header><model-viewer id="viewer" src="/world-creator/assets/caroline-inspection.glb" camera-controls touch-action="pan-y" auto-rotate shadow-intensity="0.8" exposure="1" camera-orbit="0deg 80deg auto" camera-target="auto auto auto" alt="Carolyn's actual exported 3D model"></model-viewer><div id="status">Loading Carolyn's actual model…</div><div class="controls"><button onclick="v.cameraOrbit='0deg 80deg auto';v.fieldOfView='45deg'">Full body</button><button onclick="v.cameraOrbit='0deg 80deg auto';v.fieldOfView='20deg'">Zoom in</button><button onclick="v.cameraOrbit='90deg 80deg auto'">Side</button><button onclick="v.cameraOrbit='180deg 80deg auto'">Back</button><button onclick="v.cameraOrbit='0deg 80deg auto'">Front</button></div><script>const v=document.getElementById('viewer'),s=document.getElementById('status');v.addEventListener('load',()=>s.textContent='Carolyn loaded. Drag to rotate; pinch to zoom.');v.addEventListener('error',()=>{s.innerHTML='Carolyn’s model has not been published yet. The build artifact must finish and be copied to the website. <a href="https://github.com/copperisbetter-lang/Wvlrp/actions/workflows/build-caroline-mpfb.yml">Check Carolyn build</a>.'});</script></body></html>
